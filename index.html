 of the goto at statement 3; and statement 4 is a leader because it follows the conditional goto at statement 3. This gives four basic blocks: B1={1,2}, B2={3}, B3={4,5,6,7,8}, and B4={9}.\n\nThe flow graph has B1 leading into B2; B2 leading into B3 when the condition is false, or into B4 when the condition is true; and B3 leading back into B2 because of the goto at the end of the block, forming the loop.\n\n---", "quickRefMd": "**⭐ Definition (Basic Block):** A maximal sequence of statements where control enters only at the start and leaves only at the end (no jumps in/out except at the boundary).\n\n**Algorithm to find Leaders (write these 3 rules):**\n1. The first statement is always a leader.\n2. Any statement that is the TARGET of a goto (conditional or unconditional) is a leader.\n3. Any statement immediately AFTER a goto is a leader.\n\n**Worked example (factorial function):**\n```\n1) f = 1\n2) i = 2\n3) if (i > x) goto 9\n4) t1 = f * i\n5) f = t1\n6) t2 = i + 1\n7) i = t2\n8) goto (3)\n9) goto calling program\n```\nLeaders: 1 (first statement), 3 (target of goto 8), 4 (follows the conditional goto at 3), 9 (target of goto 3's jump).\nBasic Blocks: **B1**={1,2}, **B2**={3}, **B3**={4,5,6,7,8}, **B4**={9}.\n\n**Flow Graph:** draw each basic block as a box; draw an arrow from Bi to Bj if control can go directly from Bi to Bj (here: B1→B2, B2→B3, B2→B4, B3→B2 [loop back]).\n\n**✍️ MINIMUM FULL-MARK ANSWER:** state the 3 leader rules → number the given code → mark the leaders → list the basic blocks → draw the flow graph with arrows.\n\n**Common mistakes:** Forgetting rule 3 (statement right after a goto is ALSO a leader) — this is the rule students miss most.\n\n---", "understandGuMd": "Basic Block સમજવો હોય તો વિચારો — એક રસ્તાનો ટુકડો જ્યાં તમે ફક્ત શરૂઆતમાં જ enter કરી શકો ને ફક્ત છેલ્લે જ exit કરી શકો, વચ્ચે ક્યાંય ઘુસી ના શકો કે વચ્ચેથી નીકળી ના શકો. Program ના three-address code ને આવા basic blocks માં તોડવો એ પહેલું step છે flow graph બનાવવા માટે અને ઘણા optimizations કરવા માટે.\n\nLeader શોધવાના 3 rules યાદ રાખો (leader = નવા basic block ની શરૂઆત):\n1. Program નું પહેલું statement હંમેશા leader છે.\n2. જે statement કોઈ conditional કે unconditional goto નું target હોય એ leader છે.\n3. જે statement કોઈ goto ની તરત પછી આવે એ પણ leader છે.\n\nબધા leaders મળી ગયા પછી, દરેક leader થી માંડીને પછીના leader પહેલા સુધીના બધા statements મળીને એક basic block બને.\n\nહવે example લઈએ — factorial નો code:\n```\n1) f = 1\n2) i = 2\n3) if (i > x) goto 9\n4) t1 = f * i\n5) f = t1\n6) t2 = i + 1\n7) i = t2\n8) goto (3)\n9) goto calling program\n```\n\nStep 1: statement 1 leader છે (rule 1 — પહેલું statement).\nStep 2: statement 8 નું goto statement 3 તરફ જાય છે, એટલે statement 3 leader છે (rule 2); statement 3 નું goto statement 9 તરફ જાય છે, એટલે statement 9 પણ leader છે (rule 2).\nStep 3: statement 4, statement 3 ના conditional goto ની તરત પછી આવે છે, એટલે statement 4 leader છે (rule 3).\n\nઆમ leaders થયા: 1, 3, 4, 9. હવે blocks બનાવીએ:\n- B1 = {1, 2}\n- B2 = {3}\n- B3 = {4, 5, 6, 7, 8}\n- B4 = {9}\n\nહવે flow graph દોરીએ — દરેક basic block ને એક node ગણો, ને જ્યાં control સીધું જઈ શકે ત્યાં edge દોરો: B1 થી B2 (sequential), B2 થી B3 (જો condition false હોય) અથવા B2 થી B4 (જો condition true હોય), અને B3 થી પાછું B2 (કારણ કે block B3 ના છેલ્લે `goto(3)` છે) — આ loop-back edge બહુ important છે, exam માં ના ભૂલવું.", "finalVersionGuMd": "Basic block એ statements ની એવી sequence છે જ્યાં control ફક્ત પહેલા statement પર જ enter થઈ શકે અને ફક્ત છેલ્લા statement પછી જ exit થઈ શકે. Code ને basic blocks માં વહેંચવા માટે પહેલા leaders શોધવામાં આવે છે, ત્રણ rules વાપરીને: પહેલું statement હંમેશા leader હોય છે; જે statement કોઈ goto નું target હોય એ leader હોય છે; અને જે statement કોઈ goto ની તરત પછી આવે એ પણ leader હોય છે.\n\nFactorial ના code માટે, જેમાં statements 1 થી 9 છે, statement 1 leader છે કારણ કે એ પહેલું statement છે; statement 3 leader છે કારણ કે એ statement 8 ના goto નું target છે; statement 9 leader છે કારણ કે એ statement 3 ના goto નું target છે; અને statement 4 leader છે કારણ કે એ statement 3 ના conditional goto ની તરત પછી આવે છે. આના પરથી ચાર basic blocks મળે છે: B1={1,2}, B2={3}, B3={4,5,6,7,8}, અને B4={9}.\n\nFlow graph માં B1 થી B2 તરફ control જાય છે; B2 થી B3 તરફ જ્યારે condition false હોય, અથવા B2 થી B4 તરફ જ્યારે condition true હોય; અને B3 થી પાછું B2 તરફ, કારણ કે block ના છેલ્લે goto છે, જે loop બનાવે છે."}, {"id": "u5-vh-4", "globalIndex": 32, "unit": 5, "priority": "Very High", "question": "Construct a DAG (Directed Acyclic Graph) for the given Basic Block, and explain its uses.", "questionShort": "Construct a DAG for a Basic Block, and list its uses", "marks": "6–8", "marksNote": "", "repeated": "", "years": "", "inPPT": "Yes — the richest, most detailed diagram example in the whole unit (4 slides).", "type": "Algorithm + Diagram.", "typeTags": ["Diagram", "Algorithm"], "answerMd": "Just as a DAG can represent a single expression compactly, it can also be used to represent an entire **basic block** of three-address statements, which helps the compiler apply several optimizations to the block at once.\n\n**Algorithm to construct a DAG for a basic block:**\n1. If an operand used in a statement does not already have a node, create a leaf node for it.\n2. For a statement `x := y op z`, check whether a node labelled `op` already exists with node(y) and node(z) as its children; if so, reuse that node, since this identifies a common sub-expression; otherwise, create a new node.\n3. Attach the label x to the node found or created in step 2, and remove x from the label list of whatever node it was attached to previously.\n\n**Given:** the following basic block (a classic array-copy loop body):\n```\nt1 := 4 * i\nt2 := a[t1]\nt3 := 4 * i\nt4 := b[t3]\nt5 := t2 * t4\nt6 := prod + t5\nprod := t6\n```\n\n**Step 1:** create leaf nodes for `a`, `b`, `4`, and `i`.\n\n**Step 2:** for `t1 := 4*i`, create a `*` node with children `4` and `i`, and label it `t1`.\n\n**Step 3:** for `t3 := 4*i`, notice that a `*` node with children `4` and `i` already exists (from Step 2); this is exactly the same computation, so we reuse the SAME node instead of creating a new one, and simply attach the additional label `t3` to it. This single node now carries both labels `t1` and `t3`.\n\n**Step 4:** for `t2 := a[t1]`, create an array-access node with children `a` and the shared `4*i` node, labelled `t2`; similarly for `t4 := b[t3]`, create another array-access node with children `b` and the same shared `4*i` node, labelled `t4`.\n\n**Step 5:** for `t5 := t2*t4`, create a `*` node with children `t2` and `t4`.\n\n**Step 6:** for `t6 := prod+t5`, create a `+` node with children `prod` (the value of prod before this block) and `t5`; since `prod := t6` is a plain copy statement, no new node is created for it — the label `prod` is simply attached to this same `+` node, alongside `t6`.\n\n**Final Answer:** the DAG shows one shared multiplication node for `4*i`, used by both the `t1` and `t3` computations, proving this repeated computation is done only once.\n\n**Uses of a DAG for a basic block:**\n1. It automatically identifies common sub-expressions, since they are represented by shared nodes.\n2. It shows which names are used inside the block before being defined elsewhere, since these appear as leaf nodes.\n3. It shows which computed values might still be needed outside the block, which helps determine what must be kept (\"live on exit\").\n4. It helps simplify the final list of quadruples or triples, by removing common sub-expressions and unnecessary copy statements.", "diagramMd": "Draw the `4*i` node once, with two arrows pointing into it labelled `t1` and `t3`; show it feeding into two separate array-access nodes for `a[...]` (labelled t2) and `b[...]` (labelled t4); these feed into a `*` node (t5), which feeds into a `+` node along with `prod`, labelled with both `t6` and `prod`.", "mustWrite": ["The 3-step DAG-construction algorithm.", "Correct identification that `4*i` is computed twice and must be merged into one shared node.", "Correct handling of the copy statement `prod:=t6` (no new node, just an extra label).", "All 4 uses of a DAG listed clearly."], "keywords": ["DAG", "basic block", "common sub-expression", "shared node", "live on exit", "copy statement"], "finalVersionMd": "A DAG can represent a whole basic block by merging repeated computations into shared nodes. It is built by creating leaf nodes for undefined operands, reusing an existing node with the same operator and children whenever a computation repeats, and attaching new labels to existing nodes for plain copy statements instead of creating new nodes.\n\nFor the basic block `t1:=4*i; t2:=a[t1]; t3:=4*i; t4:=b[t3]; t5:=t2*t4; t6:=prod+t5; prod:=t6`, since `t1:=4*i` and `t3:=4*i` are identical computations, they share a single `*` node labelled with both t1 and t3. This shared node feeds into two array-access nodes for `a[...]` and `b[...]`, labelled t2 and t4, which feed into a `*` node for t5, which feeds into a `+` node along with `prod`, labelled with both t6 and prod, since `prod:=t6` is just a copy statement.\n\nA DAG for a basic block is useful for automatically identifying common sub-expressions, for finding names used in the block that were defined outside it, for finding values computed in the block that may be needed after it (live on exit), and for simplifying the final quadruple or triple list by removing unnecessary computations and copy statements.\n\n---", "quickRefMd": "**Algorithm (same idea as Unit 4's DAG, applied to a full basic block of statements):**\n1. If an operand is undefined, create a leaf node for it.\n2. For `x:=y op z`: reuse an existing `op` node with the same children if one exists (this catches common subexpressions); otherwise make a new node.\n3. Attach x to that node's label list; remove x from any OLD node's label list.\n\n**Worked example (classic array-copy loop body):**\n```\nt1 := 4*i\nt2 := a[t1]\nt3 := 4*i\nt4 := b[t3]\nt5 := t2*t4\nt6 := prod+t5\nprod := t6\n```\nResult: the `4*i` computation (t1 and t3) merges into ONE shared multiply node (since it's computed identically twice) — this single node gets BOTH labels t1 and t3.\n\n**Uses of a DAG (must-write list):**\n1. Finding common sub-expressions automatically.\n2. Finding which names are used inside the block but defined outside it.\n3. Finding which computed values are needed OUTSIDE the block (live-on-exit).\n4. Simplifying the list of quadruples/triples by removing unneeded copy statements.\n\n**✍️ MINIMUM FULL-MARK ANSWER:** the 3-step algorithm + the worked DAG diagram (clearly showing which node is shared) + the 4 uses.\n\n---", "understandGuMd": "DAG (Directed Acyclic Graph) ફક્ત એક expression ને compact રીતે બતાવવા માટે જ નહીં, પણ આખા basic block ને represent કરવા માટે પણ વાપરી શકાય. આનાથી compiler ને block પર એકસાથે ઘણા optimizations apply કરવામાં મદદ મળે છે.\n\nDAG બનાવવાનું algorithm (3 steps):\n1. જો કોઈ operand નું node હજુ સુધી ના બન્યું હોય, તો એના માટે leaf node બનાવો.\n2. Statement `x := y op z` માટે, ચેક કરો કે `op` label વાળું node, જેના children node(y) અને node(z) હોય, પહેલેથી exist કરે છે કે નહીં; જો હા, તો એ જ node reuse કરો (કારણ કે આ common sub-expression બતાવે છે); નહીં તો નવું node બનાવો.\n3. Step 2 માં જે node મળ્યું કે બનાવ્યું એના પર label x લગાવો, ને x ને એના પહેલાના node પરથી હટાવી લો.\n\nહવે classic example લઈએ — array-copy loop body:\n```\nt1 := 4 * i\nt2 := a[t1]\nt3 := 4 * i\nt4 := b[t3]\nt5 := t2 * t4\nt6 := prod + t5\nprod := t6\n```\n\nStep 1: `a`, `b`, `4`, `i` માટે leaf nodes બનાવો.\nStep 2: `t1 := 4*i` માટે, `4` ને `i` ને children તરીકે લઈને `*` node બનાવો, label `t1`.\nStep 3: `t3 := 4*i` માટે — જુઓ, બિલકુલ same computation છે! `4` અને `i` બંને children વાળું `*` node પહેલેથી જ છે (step 2 માંથી), એટલે નવું node ના બનાવો, એ જ node ને `t3` label પણ લગાવી દયો. હવે એક જ node પર બે labels છે: `t1` અને `t3`.\nStep 4: `t2 := a[t1]` માટે `a` ને shared `4*i` node ને children તરીકે લઈને array-access node બનાવો, label `t2`. એ જ રીતે `t4 := b[t3]` માટે `b` ને એ જ shared node ને children લઈને બીજું array-access node બનાવો, label `t4`.\nStep 5: `t5 := t2*t4` માટે `t2` ને `t4` ને children લઈને `*` node બનાવો.\nStep 6: `t6 := prod+t5` માટે `prod` (block પહેલાની value) ને `t5` ને children લઈને `+` node બનાવો; `prod := t6` તો ફક્ત copy statement છે, એટલે નવું node ના બનાવો — `prod` label ને એ જ `+` node પર લગાવી દયો, `t6` ની સાથે.\n\nFinal Answer: DAG માં `4*i` માટે એક જ shared multiplication node છે, જે `t1` અને `t3` બંને use કરે છે — આ proves કરે છે કે આ repeated computation ફક્ત એક જ વાર થાય છે.\n\nDAG ના uses (4):\n1. Common sub-expressions automatically ઓળખાય જાય છે, કારણ કે એ shared nodes થી represent થાય છે.\n2. Block ની બહાર define થયેલા names, જે block ની અંદર use થાય છે, એ leaf nodes તરીકે દેખાય છે.\n3. Block પછી જરૂર પડી શકે એવી computed values (\"live on exit\") ઓળખાય જાય છે.\n4. Common sub-expressions ને unnecessary copy statements ને હટાવીને final quadruples/triples ને simplify કરવામાં મદદ મળે છે.", "finalVersionGuMd": "DAG આખા basic block ને represent કરી શકે છે, repeated computations ને shared nodes માં merge કરીને. એ બનાવવા માટે undefined operands માટે leaf nodes બનાવવામાં આવે છે, જ્યારે કોઈ computation repeat થાય ત્યારે same operator અને same children વાળું existing node reuse કરવામાં આવે છે, અને plain copy statements માટે નવું node બનાવવાને બદલે existing node પર નવું label લગાવવામાં આવે છે.\n\nBasic block `t1:=4*i; t2:=a[t1]; t3:=4*i; t4:=b[t3]; t5:=t2*t4; t6:=prod+t5; prod:=t6` માટે, `t1:=4*i` અને `t3:=4*i` બંને identical computations છે, એટલે એ બંને એક જ `*` node share કરે છે જેના પર t1 અને t3 બંને labels છે. આ shared node બે array-access nodes ને feed કરે છે, `a[...]` અને `b[...]` માટે, labelled t2 અને t4, જે `t5` માટેના `*` node ને feed કરે છે, જે `prod` ની સાથે `+` node ને feed કરે છે, જેના પર t6 અને prod બંને labels છે, કારણ કે `prod:=t6` ફક્ત એક copy statement છે.\n\nBasic block માટેનું DAG common sub-expressions ને automatically ઓળખવા માટે, block ની બહાર define થયેલા names શોધવા માટે, block પછી જરૂર પડી શકે એવી computed values (live on exit) શોધવા માટે, અને unnecessary computations અને copy statements ને હટાવીને final quadruple કે triple list ને simplify કરવા માટે ઉપયોગી છે."}, {"id": "u5-vh-5", "globalIndex": 33, "unit": 5, "priority": "Very High", "question": "Explain the Issues in the Design of a Code Generator.", "questionShort": "Explain the Issues in Design of a Code Generator", "marks": "6–8", "marksNote": "", "repeated": "Assignment-2 Q8, PAC Q8, CD_3 Q6-OR(a) — 3 sources.", "years": "", "inPPT": "", "type": "Theory.", "typeTags": ["Theory"], "answerMd": "A code generator is the final phase of a compiler, and it converts the intermediate representation of a program into the actual target machine code. Designing a good code generator is difficult because it must handle several important issues at the same time.\n\n**1. Input to the code generator.** The code generator usually receives its input in one of a few standard forms, such as Quadruples, Syntax Trees or DAGs, or Postfix notation, and it is assumed that all semantic errors have already been detected and removed by earlier phases before the code generator runs.\n\n**2. Target program.** The output produced by the code generator can take different forms: it may be absolute machine language, which can be placed directly into a fixed memory location and executed immediately; relocatable machine language, which allows separate parts of a program to be compiled independently and then linked together afterward; or assembly language, which is easier for the code generator to produce and can take advantage of the assembler's own macro facilities.\n\n**3. Memory management.** Every name used in the intermediate code must be mapped to an actual run-time memory address. This mapping is done cooperatively by the front end, which assigns a relative address within a data area, and the code generator, which converts this into the final actual address.\n\n**4. Instruction selection.** The code generator must choose which target-machine instructions will be used to implement each intermediate statement. This choice directly affects both the speed and the size of the generated code; a naive translation may generate extra, unnecessary instructions, which is why instruction selection is closely tied to optimization.\n\n**5. Register allocation.** Since instructions that use registers are usually shorter and faster than instructions that use memory directly, the code generator must decide which values should be kept in registers at each point in the program, and which specific register each value should use.\n\n**6. Choice of evaluation order.** The order in which computations are carried out can affect how many registers are needed to hold intermediate results; choosing the truly optimal order is a very hard (NP-complete) problem in general, so compilers typically use good heuristics instead of finding the perfect order.", "diagramMd": "", "mustWrite": ["All 6 issues named, each explained in a complete sentence, not just as a single keyword.", "Correctly explain the 3 possible forms of target program output.", "Distinguish Register Allocation (which values go in registers) from Instruction Selection (which instructions are used)."], "keywords": ["Input form", "target program", "memory management", "instruction selection", "register allocation", "evaluation order"], "finalVersionMd": "Designing a code generator involves several important issues. The input to the code generator is usually in the form of Quadruples, Syntax Trees or DAGs, or Postfix notation, with semantic errors already removed. The target program produced can be absolute machine code, relocatable machine code, or assembly language, each with different trade-offs for ease of generation and execution. Memory management requires mapping every name in the intermediate code to an actual run-time address, done jointly by the front end and the code generator. Instruction selection means choosing which target-machine instructions implement each statement, which affects the speed and size of the generated code. Register allocation means deciding which values should be kept in registers, since register-based instructions are faster and shorter than memory-based ones. Finally, the choice of evaluation order affects how many registers are needed for a computation, and finding the truly optimal order is an NP-complete problem, so practical compilers rely on good heuristics instead.", "quickRefMd": "**Must-write points (the main issues, 1 line each):**\n1. **Input to the code generator** — usually Quadruples, Syntax Trees/DAGs, or Postfix notation (semantic errors must already be removed).\n2. **Target program** — output can be Absolute machine code, Relocatable machine code, or Assembly language.\n3. **Memory management** — mapping source-program names to run-time addresses (done together by front end + code generator).\n4. **Instruction selection** — choosing which target instructions implement each statement (affects code speed/size).\n5. **Register allocation** — deciding which values sit in registers (registers are faster than memory).\n6. **Choice of evaluation order** — order affects how many registers you need (this can even be an NP-complete problem to solve perfectly).\n\n**✍️ MINIMUM FULL-MARK ANSWER:** list all 6 issues in 1 line each (as above); add an example for \"instruction selection\" (`a:=b+c` → `MOV b,R0` `ADD c,R0` `MOV R0,a`) if more marks are needed.", "understandGuMd": "Code generator એ compiler નો છેલ્લો phase છે, જે intermediate representation ને actual target machine code માં convert કરે છે. સારો code generator design કરવો અઘરો છે કારણ કે એક સાથે ઘણા important issues handle કરવા પડે છે. ચાલો 6 issues એક-એક કરીને સમજીએ:\n\n1. **Input to the code generator** — Code generator ને સામાન્ય રીતે input ત્રણ standard forms માંથી કોઈ એક form માં મળે છે — Quadruples, Syntax Trees અથવા DAGs, અથવા Postfix notation. ને એ assume કરવામાં આવે છે કે semantic errors પહેલેથી earlier phases એ detect કરીને remove કરી લીધા છે.\n\n2. **Target program** — Output ત્રણ form માં હોઈ શકે: Absolute machine language (સીધું fixed memory location માં મૂકીને તરત run કરી શકાય), Relocatable machine language (program ના જુદા જુદા parts અલગ-અલગ compile કરીને પછી link કરી શકાય), અથવા Assembly language (code generator માટે produce કરવું સહેલું, ને assembler ની macro facilities નો ફાયદો પણ મળે).\n\n3. **Memory management** — Intermediate code માં દરેક name ને actual run-time memory address સાથે map કરવું પડે. આ mapping front end (જે data area માં relative address આપે) ને code generator (જે એને final actual address માં convert કરે) બંને મળીને કરે છે.\n\n4. **Instruction selection** — Code generator એ પસંદ કરવું પડે કે દરેક intermediate statement implement કરવા કયા target-machine instructions વાપરવા. આ choice code ની speed ને size બંને પર direct અસર કરે છે; naive translation extra, unnecessary instructions generate કરી શકે, એટલે instruction selection optimization સાથે closely related છે.\n\n5. **Register allocation** — Registers વાપરતા instructions memory directly વાપરતા instructions કરતાં ટૂંકા ને ઝડપી હોય છે, એટલે code generator એ decide કરવું પડે કે program ના દરેક point પર કઈ values registers માં રાખવી, ને દરેક value માટે કયું ચોક્કસ register વાપરવું.\n\n6. **Choice of evaluation order** — Computations કયા order માં કરવા, એની અસર પડે છે કે intermediate results રાખવા કેટલા registers જોઈએ. Truly optimal order શોધવો NP-complete જેવો hard problem છે, એટલે compilers સામાન્ય રીતે good heuristics વાપરે છે, perfect order શોધવાને બદલે.", "finalVersionGuMd": "Code generator design કરવામાં ઘણા important issues આવે છે. Code generator નું input સામાન્ય રીતે Quadruples, Syntax Trees અથવા DAGs, અથવા Postfix notation ના form માં હોય છે, જેમાં semantic errors પહેલેથી remove થયેલા હોય છે. Produce થતો target program Absolute machine code, Relocatable machine code, અથવા Assembly language હોઈ શકે, દરેક ના generation ની સહેલાઈ અને execution માટે અલગ-અલગ trade-offs છે. Memory management માટે intermediate code ના દરેક name ને actual run-time address સાથે map કરવું પડે છે, જે front end અને code generator બંને સાથે મળીને કરે છે. Instruction selection એટલે દરેક statement implement કરવા કયા target-machine instructions વાપરવા એ પસંદ કરવું, જે generated code ની speed અને size ને અસર કરે છે. Register allocation એટલે કઈ values registers માં રાખવી એ decide કરવું, કારણ કે register-based instructions memory-based instructions કરતાં ઝડપી ને ટૂંકા હોય છે. છેલ્લે, evaluation order ની choice, computation માટે કેટલા registers જોઈએ એની અસર કરે છે, ને truly optimal order શોધવો એ NP-complete problem છે, એટલે practical compilers good heuristics પર આધાર રાખે છે."}], "high": [{"id": "u5-high-1", "globalIndex": 34, "unit": 5, "priority": "High", "question": "Explain Register Allocation and Register Assignment strategies.", "questionShort": "Register Allocation and Register Assignment — Strategies", "marks": "4–8", "marksNote": "", "repeated": "CD_1 Q3(B)-OR, CD_2 Q4(b), CD_3 Q5(c) — 3 sources.", "years": "", "inPPT": "", "type": "Theory.", "typeTags": ["Theory"], "answerMd": "Using registers instead of memory for storing values makes instructions shorter and faster to execute, so a code generator must decide carefully how to use the limited number of registers available on the target machine. This involves two related but different decisions: **Register Allocation**, which decides which values will actually reside in a register at a given point in the program, and **Register Assignment**, which decides the exact, specific register that a chosen value will use. Finding the truly optimal register assignment is known to be an NP-complete problem, even when trying to assign just a single register optimally.\n\n**1. Global Register Allocation.** The compiler can keep the most frequently used variables inside fixed registers throughout an entire loop, since loop variables are accessed repeatedly. Many languages, such as C, also allow the programmer to directly request this using a declaration like `register int x;`.\n\n**2. Usage Count.** To decide which variable benefits most from being kept in a register, compilers can estimate the benefit using a formula: for a variable x in block B of loop L, the benefit is `use(x,B) + 2 × live(x,B)`, summed over every block in the loop, where `use(x,B)` counts how many times x is used in B before being redefined, and `live(x,B)` is 1 if x is still live when control leaves B, and 0 otherwise. Variables with a higher total benefit are given priority for register allocation.\n\n**3. Register Assignment for Nested Loops.** When a loop L2 is nested inside an outer loop L1, specific rules decide how a variable should be handled: if a variable is allocated a register inside L2, it should not also be separately allocated a register in the part of L1 outside L2; and if a variable is allocated in L1 but not in L2, its value must be stored before entering L2 and reloaded after leaving L2, since the inner loop might use that same register for something else.\n\n**4. Register Allocation by Graph Colouring.** This method works in two passes. First, a specific target-machine instruction is chosen for each operation, and every variable used is temporarily given its own \"symbolic\" register. Second, the compiler builds a \"register interference graph\", where each node represents a symbolic register, and an edge connects two nodes if their variables are both live at some point where one of them is being defined (meaning they cannot safely share the same physical register). The graph is then coloured using k colours, where k equals the number of real physical registers available, such that no two connected (interfering) nodes receive the same colour; each colour then corresponds to one actual physical register.", "diagramMd": "", "mustWrite": ["Clear distinction between Register Allocation (which values) and Register Assignment (which specific register).", "Mention that optimal register assignment is NP-complete.", "At least the Usage Count formula and the Graph Colouring idea explained in full sentences."], "keywords": ["Register Allocation", "Register Assignment", "Usage Count", "Graph Colouring", "interference graph", "NP-complete"], "finalVersionMd": "Register Allocation decides which values should reside in a register at a given point in the program, while Register Assignment decides the specific physical register a chosen value will use; finding the optimal assignment is an NP-complete problem. Global Register Allocation keeps the most frequently used loop variables in fixed registers throughout a loop, which languages like C allow programmers to request directly using a `register` declaration. The Usage Count method estimates the benefit of allocating a variable x to a register in loop L using the formula `use(x,B) + 2×live(x,B)` summed over the blocks of the loop, where use counts how many times x is used before being redefined, and live indicates whether x is still needed when the block ends. For nested loops, a variable allocated inside the inner loop should not also be separately allocated outside it in the outer loop, and a variable allocated only in the outer loop must be stored before entering the inner loop and reloaded after leaving it. Register Allocation by Graph Colouring builds an interference graph where each node is a symbolic register and an edge connects two registers that cannot share a physical register because they are both live at the same time; this graph is then coloured using as many colours as there are available physical registers, ensuring no two connected nodes share a colour.\n\n---", "quickRefMd": "**⭐ Definitions:**\n- **Register Allocation:** deciding WHICH values will reside in a register at a given point.\n- **Register Assignment:** deciding WHICH SPECIFIC register a value will use.\n- (Note: finding the perfect assignment is NP-complete, even for a single register.)\n\n**Must-write strategies (1 line each):**\n1. **Global Register Allocation** — keep the most-used loop variables in fixed registers for the whole loop (in C, `register int x;` requests this).\n2. **Usage Count formula** — estimates benefit of keeping x in a register: `Σ [use(x,B) + 2 × live(x,B)]` over blocks B in the loop.\n3. **Register assignment for nested loops (L1 outer, L2 inner)** — if a variable is allocated in L2, don't also allocate it outside L2 in L1.\n4. **Graph Colouring** — build an \"interference graph\" (nodes = variables, edge = they can't share a register); colour it with k colours (k = number of real registers) so no two connected nodes share a colour.\n\n**✍️ MINIMUM FULL-MARK ANSWER:** the 2 definitions + the graph-colouring idea (most commonly asked) in 2–3 lines.\n\n---", "understandGuMd": "Registers વાપરવાથી instructions memory વાપરવા કરતાં ટૂંકા ને ઝડપી બને છે, એટલે code generator એ ધ્યાનથી decide કરવું પડે કે target machine પર limited registers કેવી રીતે વાપરવા. આમાં બે અલગ પણ related decisions આવે છે: **Register Allocation** — કઈ values program ના કોઈ point પર ખરેખર register માં રહેશે એ decide કરવું, અને **Register Assignment** — પસંદ કરેલી value માટે ચોક્કસ, specific register કયું વાપરવું એ decide કરવું. Optimal register assignment શોધવો NP-complete problem છે, ભલે એક જ register optimally assign કરવાનો હોય તો પણ.\n\nહવે 4 points સમજીએ:\n\n1. **Global Register Allocation** — Compiler સૌથી વધુ use થતા variables ને આખા loop દરમિયાન fixed registers માં રાખી શકે, કારણ કે loop variables વારંવાર access થાય છે. C જેવી languages માં programmer પોતે `register int x;` જેવું declaration વાપરીને directly આ request કરી શકે.\n\n2. **Usage Count** — કયું variable register માં રાખવાથી સૌથી વધુ ફાયદો થાય એ decide કરવા compiler formula વાપરે છે: loop L ના block B માં variable x માટે benefit = `use(x,B) + 2 × live(x,B)`, loop ના બધા blocks પર sum કરીને. અહીં `use(x,B)` એટલે x, redefine થાય એ પહેલા B માં કેટલી વાર use થાય છે, ને `live(x,B)` એટલે જો x, B છોડતી વખતે પણ live હોય તો 1, નહીં તો 0. જે variables નો total benefit વધારે હોય એને register allocation માટે priority મળે.\n\n3. **Register Assignment for Nested Loops** — જ્યારે loop L2, બહારના loop L1 ની અંદર nested હોય, ત્યારે specific rules લાગુ પડે: જો કોઈ variable ને L2 ની અંદર register મળ્યું હોય, તો L1 ના L2 બહારના part માં એને અલગથી register ના આપવું; ને જો કોઈ variable L1 માં allocate થયું હોય પણ L2 માં ના હોય, તો L2 માં entry કરતાં પહેલા એની value store કરવી પડે અને L2 છોડ્યા પછી reload કરવી પડે, કારણ કે inner loop એ જ register બીજા કંઈક માટે વાપરી શકે.\n\n4. **Register Allocation by Graph Colouring** — આ method બે passes માં કામ કરે છે. પહેલા pass માં, દરેક operation માટે specific target-machine instruction પસંદ કરવામાં આવે છે, ને દરેક વપરાયેલા variable ને temporary પોતાનું \"symbolic\" register આપવામાં આવે છે. બીજા pass માં, compiler એક \"register interference graph\" બનાવે છે, જ્યાં દરેક node એક symbolic register represent કરે છે, અને બે nodes વચ્ચે edge હોય જો એમના variables બંને એવા point પર live હોય જ્યાં એમાંથી એક define થઈ રહ્યું હોય (એટલે એ બંને same physical register safely share ના કરી શકે). પછી આ graph ને k colours વાપરીને colour કરવામાં આવે છે, જ્યાં k એટલે available physical registers ની સંખ્યા, જેથી કોઈ પણ બે connected (interfering) nodes ને same colour ના મળે; દરેક colour પછી એક actual physical register ને represent કરે છે.", "finalVersionGuMd": "Register Allocation એ decide કરે છે કે program ના કોઈ point પર કઈ values register માં રહેશે, જ્યારે Register Assignment એ decide કરે છે કે પસંદ કરેલી value માટે ચોક્કસ કયું physical register વાપરવું; optimal assignment શોધવો NP-complete problem છે. Global Register Allocation સૌથી વધુ use થતા loop variables ને આખા loop દરમિયાન fixed registers માં રાખે છે, જે C જેવી languages માં programmers ને `register` declaration વાપરીને directly request કરવાની સગવડ આપે છે. Usage Count method loop L માં variable x ને register allocate કરવાના benefit ને formula `use(x,B) + 2×live(x,B)` વાપરીને estimate કરે છે, loop ના blocks પર sum કરીને, જ્યાં use એટલે x redefine થાય એ પહેલા કેટલી વાર use થાય, ને live એટલે block પૂરો થાય ત્યારે x હજુ જરૂરી છે કે નહીં. Nested loops માટે, inner loop ની અંદર allocate થયેલા variable ને outer loop માં અલગથી allocate ના કરવું જોઈએ, અને ફક્ત outer loop માં allocate થયેલા variable ને inner loop માં entry કરતાં પહેલા store કરવું પડે ને exit પછી reload કરવું પડે. Register Allocation by Graph Colouring એક interference graph બનાવે છે જેમાં દરેક node એક symbolic register છે અને બે registers વચ્ચે edge છે જો એ બંને same time પર live હોય ને physical register share ના કરી શકતા હોય; આ graph ને પછી જેટલા physical registers available હોય એટલા colours વાપરીને colour કરવામાં આવે છે, જેથી કોઈ પણ બે connected nodes એક જ colour ના share કરે."}, {"id": "u5-high-2", "globalIndex": 35, "unit": 5, "priority": "High", "question": "Explain Global Data Flow Analysis (Reaching Definitions and Live Variables) with an example.", "questionShort": "Global Data Flow Analysis (Reaching Definitions, Live Variables)", "marks": "6–8", "marksNote": "", "repeated": "", "years": "", "inPPT": "Yes, 6 conceptual slides — a classic short-answer/viva topic even without direct PYQ evidence in your files.", "type": "Theory.", "typeTags": ["Theory"], "answerMd": "To perform optimization across an entire program rather than within just one basic block, a compiler needs to collect information about how data flows between different basic blocks. This process is called **Global Data Flow Analysis**, and it works by solving data flow equations over the program's flow graph.\n\n**General data flow equation:** `Out[S] = gen[S] ∪ (in[S] – kill[S])`, which means that the information available at the end of a statement S is either generated fresh within S itself, or it was already available at the start of S and was not destroyed (\"killed\") as control passed through S.\n\n**Reaching Definitions.** A definition of a variable is said to \"reach\" a particular point in the program if there is some path in the flow graph from that definition to that point, along which the variable is not redefined again. If the variable IS redefined somewhere along the path before reaching that point, the earlier definition is said to be \"killed.\"\n\n**Example:**\n```\nB1: D1: y = 2\nB2: D2: y = y + 2\nB3: D3: x = y + 2\n```\nHere, definition D1 (in block B1) does reach block B2, since nothing redefines y between B1 and B2. However, D1 does **not** reach block B3, because D2 (in block B2) redefines y first, which kills D1's value before it can reach B3; instead, it is D2 that reaches B3.\n\n**Live Variables.** A variable is said to be **live** at a particular point in the program if there is some path from that point to the end of the program along which the variable's current value is used before it is redefined; if no such path exists, the variable is said to be **dead** at that point. This information is useful for register allocation, since a dead variable's register can safely be reused for something else.\n\n**Related definitions:**\n- A **definition point** is a point in the program where a variable is assigned a value.\n- A **reference point** is a point where a variable's value is read.\n- An expression is called an **available expression** at a given point if it has already been computed earlier on every path reaching that point, and none of its operands have changed since.", "diagramMd": "", "mustWrite": ["The general data flow equation `Out[S]=gen[S]∪(in[S]-kill[S])`.", "Correct definitions of Reaching Definition and Live Variable, including the idea of a definition being \"killed.\"", "A worked example clearly showing one definition reaching one block but not another, with the reason why."], "keywords": ["Data flow analysis", "gen", "kill", "Reaching Definition", "Live Variable", "Available Expression"], "finalVersionMd": "Global Data Flow Analysis collects information about how data flows across the whole program, using the equation `Out[S] = gen[S] ∪ (in[S] – kill[S])`, meaning the information leaving a statement is either generated within it or was already present and not destroyed as control passed through.\n\nA definition of a variable reaches a point in the program if there is a path from the definition to that point along which the variable is not redefined; if the variable is redefined somewhere along that path, the earlier definition is said to be killed. For example, in `B1: y=2, B2: y=y+2, B3: x=y+2`, the definition of y in B1 reaches B2, but does not reach B3, because the redefinition of y in B2 kills it first.\n\nA variable is live at a point in the program if there is a path from that point to the end of the program along which its current value is used before being redefined; otherwise it is dead at that point, and its register can be safely reused. An expression is called available at a point if it has already been computed on every path reaching that point and its operands have not changed since.\n\n---", "quickRefMd": "**⭐ Definitions:**\n- **Definition point:** a program point that defines (assigns) a variable.\n- **Reference point:** a point where a variable's value is read.\n- **Available Expression:** an expression is \"available\" at a point if it was already computed earlier and none of its operands changed since.\n- **Reaching Definition:** a definition D \"reaches\" a point P if there is a path from D to P with no other definition of the same variable in between (it gets \"killed\" if redefined).\n- **Live Variable:** a variable is \"live\" at point p if its current value will be used somewhere later before being overwritten; otherwise it is \"dead.\"\n\n**General data-flow equation (must write):** `Out[S] = gen[S] ∪ (in[S] – kill[S])`\n\n**Worked example (Reaching Definitions):**\n```\nB1: D1: y=2\nB2: D2: y=y+2\nB3: D3: x=y+2\n```\nD1 reaches B2, but D1 does NOT reach B3, because D2 (in B2) redefines y first, \"killing\" D1's value before it reaches B3.\n\n**✍️ MINIMUM FULL-MARK ANSWER:** the definitions of Reaching Definition and Live Variable + the `Out=gen∪(in-kill)` formula + the small worked example.", "understandGuMd": "આખા program પર (ફક્ત એક basic block પર નહીં) optimization કરવા માટે, compiler ને એ જાણવું પડે કે data જુદા જુદા basic blocks વચ્ચે કેવી રીતે flow થાય છે. આ process ને Global Data Flow Analysis કહેવાય, ને એ program ના flow graph પર data flow equations solve કરીને કામ કરે છે.\n\nGeneral data flow equation: `Out[S] = gen[S] ∪ (in[S] – kill[S])` — એટલે statement S ના અંતે available information કાં તો S ની અંદર જ freshly generate થાય છે, અથવા એ પહેલેથી S ની શરૂઆતમાં available હતી અને S માંથી control પસાર થતાં destroy (\"kill\") ના થઈ.\n\n**Reaching Definitions** — કોઈ variable ની definition program ના કોઈ point સુધી \"reach\" કરે છે એમ કહેવાય, જો flow graph માં એ definition થી એ point સુધી કોઈ path હોય જેમાં variable ફરીથી redefine ના થાય. જો એ variable path પર ક્યાંક redefine થાય, તો પહેલાની definition \"kill\" થઈ ગઈ કહેવાય.\n\nExample:\n```\nB1: D1: y = 2\nB2: D2: y = y + 2\nB3: D3: x = y + 2\n```\nઅહીં D1 (B1 માં) B2 સુધી reach કરે છે, કારણ કે B1 અને B2 વચ્ચે y ને કોઈ redefine નથી કરતું. પણ D1, B3 સુધી reach નથી કરતું, કારણ કે B2 માં D2 y ને ફરી redefine કરે છે, જે D1 ને B3 સુધી પહોંચતા પહેલા kill કરી નાખે છે; એની જગ્યાએ D2 જ B3 સુધી reach કરે છે.\n\n**Live Variables** — કોઈ variable program ના કોઈ point પર \"live\" કહેવાય, જો એ point થી program ના અંત સુધી કોઈ path હોય જેમાં variable ની current value redefine થાય એ પહેલા use થાય; જો આવો કોઈ path ના હોય તો variable એ point પર \"dead\" કહેવાય. આ information register allocation માટે useful છે, કારણ કે dead variable નું register બીજા કંઈક માટે safely reuse કરી શકાય.\n\nRelated definitions:\n- **Definition point** — program નો એ point જ્યાં variable ને value assign થાય.\n- **Reference point** — એ point જ્યાં variable ની value read થાય.\n- **Available expression** — કોઈ point પર expression \"available\" કહેવાય, જો એ expression એ point સુધી પહોંચતા દરેક path પર પહેલેથી calculate થઈ ચૂક્યું હોય, ને એના operands ત્યારથી બદલાયા ના હોય.", "finalVersionGuMd": "Global Data Flow Analysis આખા program પર data કેવી રીતે flow થાય છે એની information collect કરે છે, equation `Out[S] = gen[S] ∪ (in[S] – kill[S])` વાપરીને, જેનો મતલબ છે કે statement માંથી બહાર જતી information કાં તો એની અંદર generate થાય છે અથવા control પસાર થતાં destroy થયા વગર પહેલેથી present હતી.\n\nકોઈ variable ની definition, program ના કોઈ point સુધી reach કરે છે જો definition થી એ point સુધી કોઈ path હોય જેમાં variable redefine ના થાય; જો variable એ path પર ક્યાંક redefine થાય તો પહેલાની definition kill થઈ ગઈ કહેવાય. ઉદાહરણ તરીકે, `B1: y=2, B2: y=y+2, B3: x=y+2` માં, B1 માંની y ની definition B2 સુધી reach કરે છે, પણ B3 સુધી reach નથી કરતી, કારણ કે B2 માં y ની redefinition એને પહેલા જ kill કરી નાખે છે.\n\nકોઈ variable program ના કોઈ point પર live કહેવાય જો એ point થી program ના અંત સુધી કોઈ path હોય જેમાં એની current value redefine થાય એ પહેલા use થાય; નહીં તો એ point પર એ dead કહેવાય, ને એનું register safely reuse કરી શકાય. કોઈ expression કોઈ point પર available કહેવાય જો એ point સુધી પહોંચતા દરેક path પર એ પહેલેથી calculate થઈ ચૂક્યું હોય ને એના operands ત્યારથી બદલાયા ના હોય."}], "mediumMd": "(short prep points only)\n\n- **Choice of Evaluation Order:** the order you compute sub-expressions in can change how many registers you need; picking the best order is NP-complete in general, but reordering independent computations can save registers (example: `a+b-(c+d)*e` needs fewer registers if you compute `(c+d)*e` before `a+b`).\n- **Role of Code Generator (diagram):** Source program → Front end → Intermediate code → Code Optimizer → Intermediate code → Code Generator → Target program. 3 tasks: instruction selection, register allocation/assignment, instruction ordering.\n- **Target code properties wanted:** correctness, high quality, efficient use of resources, fast code generation.", "lowMd": "(question only)\n\n- Approaches to code generator design (main goal: correctness first, then ease of implementation/maintenance).\n- What is Static Single Assignment (SSA) form? (each variable assigned exactly once — mentioned only once in your papers, low priority).\n- What are the different forms of target program output (absolute code / relocatable code / assembly)?", "guRevisionBullets": ["Peephole optimization ના types: redundant instruction elimination, flow-of-control optimization, unreachable code removal, algebraic simplification, strength reduction, machine idioms.", "Optimization નું classification: Machine Dependent vs Machine Independent → (Function Preserving: CSE, folding, copy propagation, dead code elimination) + (Loop Optimization: code motion, strength reduction).", "Basic Block ના Leader rules: (1) પહેલું statement, (2) કોઈ પણ goto નું target, (3) goto પછી તરત નો statement.", "Basic block માટેનું DAG: Unit 4 ના DAG જેવો જ concept, આખા block પર apply થાય; uses = CSE શોધવું, live-on-exit values શોધવા, quadruples simplify કરવા.", "Register Allocation ≠ Register Assignment (કઈ value vs કયું ચોક્કસ register).", "Code Generator ના issues: input form, target program નો પ્રકાર, memory management, instruction selection, register allocation, evaluation order."], "enRevisionBullets": ["Peephole optimization types: redundant instruction elimination, flow-of-control optimization, unreachable code removal, algebraic simplification, strength reduction, machine idioms.", "Optimization classification: Machine Dependent vs Machine Independent → (Function Preserving: CSE, folding, copy propagation, dead code elimination) + (Loop Optimization: code motion, strength reduction).", "Basic Block Leader rules: (1) first statement, (2) target of any goto, (3) statement right after a goto.", "DAG for basic block: same idea as Unit 4's DAG, applied to a whole block; uses = find CSE, find live-on-exit values, simplify quadruples.", "Register Allocation ≠ Register Assignment (which value vs which specific register).", "Code Generator issues: input form, target program type, memory management, instruction selection, register allocation, evaluation order."]}], "supplementary": {"repeatedMd": "## 7. 🔥 Most Repeated Questions (across all your PYQs, PAC, and Assignments)\n\nRanked by how many of your 7 source files (2 assignments + PAC + 4 real papers) contained this concept. Where two questions test the same idea in different words, I have grouped them and told you clearly.\n\n| Rank | Topic / Question | Unit | Frequency (files it appeared in) | Typical Marks | Priority |\n|---|---|---|---|---|---|\n| 1 | **Activation Record** — define/explain/diagram/components | 4 | 7 | 4–8 | 🔴 |\n| 1 | **SLR(1)/CLR(1)/LALR(1)/LR(0) table construction** (\"check whether X or construct Y for grammar Z\") | 3 | 7 | 8 | 🔴 |\n| 3 | **TAC / Quadruple / Triple / Indirect Triple** for a given expression | 4 | 6 | 4–8 | 🔴 |\n| 3 | **Peephole Optimization** — explain with types/examples | 5 | 6 | 6–8 | 🔴 |\n| 3 | **RE → NFA → DFA conversion** (Thompson's + Subset Construction, or Syntax-tree/followpos method) | 2 | 6 | 8 | 🔴 |\n| 6 | **Parameter Passing Methods** (swap-variable example) | 4 | 5 | 6–8 | 🔴 |\n| 6 | **Code Optimization Techniques** (general, machine-independent) | 5 | 5 | 6–8 | 🔴 |\n| 6 | **LL(1) checking + FIRST/FOLLOW + Operator Precedence** on the standard grammar `E→E+T\\|T, T→T*F\\|F, F→(E)\\|id` | 3 | 5 | 6–8 | 🔴 |\n| 6 | **Types of Compiler / Compiler Construction Tools / Single-pass vs Multi-pass** | 1 | 5 | 4–8 | 🟠 |\n| 10 | **Left Recursion removal + Left Factoring** | 3 | 4 | 4–8 | 🔴 |\n| 10 | **Ambiguous Grammar** — check/prove | 3 | 4 | 4–6 | 🔴 |\n| 10 | **Phases of Compiler** (trace a given expression) | 1 | 4 | 8 | 🔴 |\n| 10 | **Compiler vs Interpreter vs Assembler** | 1 | 4 | 4–8 | 🔴 |\n| 10 | **DAG construction** for an expression | 4 | 4 | 6–8 | 🔴 |\n| 15 | **FIRST and FOLLOW computation** (standalone) | 3 | 3 | 4–8 | 🔴 |\n| 15 | **Static vs Dynamic Memory Allocation** | 4 | 3 | 4–6 | 🟠 |\n| 15 | **Register Allocation strategies** | 5 | 3 | 4–8 | 🟠 |\n| 15 | **Issues in Code Generator Design** | 5 | 3 | 6–8 | 🔴 |\n| 19 | **Basic Blocks / Flow Graph / Leader identification** | 5 | 2 | 6 | 🔴 |\n| 19 | **Shift-Reduce Parsing / Handle & Handle Pruning** | 3 | 2 | 6–8 | 🟠 |\n\n**Questions that LOOK different but are the SAME concept (grouped for you):**\n- \"Check whether grammar is LL(1)\" = \"Construct predictive parsing table\" = \"Parse the string using LL(1) table\" → **all one skill: FIRST/FOLLOW → Table → Trace.**\n- \"Construct SLR(1) table\" = \"Construct CLR(1) table\" = \"Construct LALR(1) table\" = \"Construct LR(0) parser\" → **all one skill (canonical items → table → trace); only the reduce-decision rule changes.**\n- \"Convert RE to DFA using Thompson's + Subset Construction\" = \"Draw NFA and convert to DFA\" → **same method, same steps.**\n- \"Write Quadruple for X\" = \"Write Triple for X\" = \"Write Indirect Triple for X\" = \"Write TAC for X\" → **do TAC first, then re-format into the other 3.**\n- \"Explain Call by Reference\" = \"Explain Call by Value-Result / Copy-Restore\" → **different mechanism, but usually the SAME final output** — don't confuse the two when explaining.\n- \"Remove Left Recursion\" ≠ \"Left Factoring\" → these LOOK similar (both are grammar-fixing questions) but solve two DIFFERENT problems — never mix up the formulas.\n\n---", "top30Md": "## 8. 🚨 TOP 30 QUESTIONS TO PREPARE\n\nIf you only have time for 30 questions, these give you the best coverage of your whole syllabus (chosen using frequency + PPT depth + explicit MU/exam signals).\n\n| # | Question | Unit | Priority | Why important | Marks | Repeated? | What you must write |\n|---|---|---|---|---|---|---|---|\n| 1 | Trace all 6 phases of a compiler for a given statement | 1 | 🔴 | Explicit MU Question, 4 sources | 8 | Yes (4x) | 6 phase outputs + diagram |\n| 2 | Differentiate Compiler, Interpreter, Assembler | 1 | 🔴 | Explicit MU Question, 4 sources | 4–8 | Yes (4x) | 3 tables |\n| 3 | Explain Cousins of Compiler with diagram | 1 | 🔴 | Explicit MU Question | 6–8 | Yes | LPS diagram + 3 cousins |\n| 4 | Explain Types of Compiler (any 2–4) | 1 | 🟠 | Explicit MU Question, 3 sources | 4–8 | Yes (5x) | 4–6 one-liners |\n| 5 | Convert RE to NFA (Thompson's) then to DFA (Subset Construction) | 2 | 🔴 | Most repeated numerical, 5 sources | 8 | Yes (6x) | Full trace + table |\n| 6 | Convert RE to DFA using firstpos/lastpos/followpos | 2 | 🔴 | Explicit MU Question, 4 sources | 8 | Yes (4x) | nullable/firstpos/lastpos/followpos table |\n| 7 | Minimize a DFA (partitioning algorithm) | 2 | 🔴 | Explicit MU Question | 8 | Yes (2x) | Partition steps + final table |\n| 8 | Write Regular Expressions / Regular Definitions for given languages | 2 | 🟠 | 3 sources, huge PPT depth | 4–6 | Yes (3x) | RE table |\n| 9 | Draw Transition diagram (relational operator / unsigned number) | 2 | 🟠 | Explicit MU Question | 6 | Yes (2x) | 2 diagrams |\n| 10 | Construct LL(1) parsing table and parse a string | 3 | 🔴 | 4 sources, richest worked example | 8 | Yes (4x) | 4-step method + trace |\n| 11 | Construct SLR(1)/CLR(1)/LALR(1)/LR(0) table and parse a string | 3 | 🔴 | MOST repeated question type, 7 sources | 8 | Yes (7x) | Item sets + table + trace |\n| 12 | Remove Left Recursion from a grammar | 3 | 🔴 | 3 sources, 4 worked PPT examples | 4–8 | Yes (4x) | Formula + solved grammar |\n| 13 | Perform Left Factoring on a grammar | 3 | 🔴 | Paired with Q12 in PPT | 4–8 | Yes (3x) | Formula + solved grammar |\n| 14 | Check/Prove a grammar is Ambiguous | 3 | 🔴 | 3 sources + 2 PPT practice Qs | 4–6 | Yes (4x) | 2 derivations for same string |\n| 15 | Compute FIRST and FOLLOW sets | 3 | 🔴 | 3 sources | 4–8 | Yes (3x) | Rule-based table |\n| 16 | Operator Precedence Parsing (table + parse) | 3 | 🟠 | 4 sources | 6–8 | Yes (5x incl. functions) | Precedence table + trace |\n| 17 | Shift-Reduce Parsing / Handle Pruning | 3 | 🟠 | 2 sources | 6–8 | Yes (2x) | 4 actions + trace |\n| 18 | Leftmost/Rightmost Derivation + Parse Tree | 3 | 🟠 | 2 sources | 4–6 | Yes | 2 derivations |\n| 19 | Generate TAC, Quadruple, Triple, Indirect Triple for an expression | 4 | 🔴 | 6 sources — most repeated numerical in Unit 4 | 4–8 | Yes (6x) | 4 tables |\n| 20 | Explain Activation Record with diagram | 4 | 🔴 | 7 sources — MOST repeated question overall | 6–8 | Yes (7x) | 7-field diagram |\n| 21 | Explain Parameter Passing Methods with swap(a,b) example | 4 | 🔴 | 5 sources | 6–8 | Yes (5x) | 4 methods + output table |\n| 22 | Construct a DAG for a given expression | 4 | 🔴 | 4 sources | 6–8 | Yes (4x) | 3-step algorithm + diagram |\n| 23 | SDD with Synthesized/Inherited Attributes (desk calculator example) | 4 | 🟠 | 2 sources, full PPT worked example | 8 | Yes (2x) | Semantic rules + annotated tree |\n| 24 | Static vs Dynamic Memory Allocation | 4 | 🟠 | 3 sources | 4–6 | Yes (3x) | Comparison table |\n| 25 | Explain Peephole Optimization with types & examples | 5 | 🔴 | 6 sources | 6–8 | Yes (6x) | 6 types + examples |\n| 26 | Explain Code Optimization Techniques (CSE, folding, propagation, dead code, motion, strength reduction) | 5 | 🔴 | 5 sources | 6–8 | Yes (5x) | Classification + 4-6 examples |\n| 27 | Identify Leaders and Basic Blocks; draw Flow Graph | 5 | 🔴 | 2 sources, full PPT worked example | 6 | Yes (2x) | 3 leader rules + partition |\n| 28 | Construct a DAG for a Basic Block; list its uses | 5 | 🔴 | Heaviest PPT diagram example | 6–8 | Not directly in PYQs but very high PPT depth | Algorithm + diagram + 4 uses |\n| 29 | Explain Issues in Design of a Code Generator | 5 | 🔴 | 3 sources | 6–8 | Yes (3x) | 6 issues |\n| 30 | Register Allocation and Assignment strategies | 5 | 🟠 | 3 sources | 4–8 | Yes (3x) | Definitions + graph colouring |\n\n**If you prepare only these 30, you will have covered the highest-value, most-repeated part of your syllabus** — but remember this is based on PATTERN, not a guarantee (see Section 12 for how confident to be).\n\n---", "diagramsMd": "## 9. 📊 Must-Draw Diagrams (full list)\n\n| Diagram | Unit | Why it matters |\n|---|---|---|\n| 6 phases of compiler + symbol table + error handler | 1 | Matches the #1 most-asked question |\n| Language Processing System (Preprocessor→Compiler→Assembler→Linker/Loader) | 1 | Explicit MU Question |\n| Transition diagram — relational operators | 2 | Explicit MU Question |\n| Transition diagram — unsigned numbers | 2 | Explicit MU Question |\n| NFA for `(a|b)*abb` via Thompson's construction | 2 | Standard textbook example, reused everywhere |\n| Final DFA (from subset construction and from syntax-tree method) | 2 | Core of the most-repeated numerical |\n| Buffer Pairs / Sentinel buffer diagram | 2 | Direct diagram-recall marks |\n| Parse tree vs Syntax tree (side-by-side) | 3 | Classic comparison question |\n| Canonical item-set diagrams for SLR/CLR/LALR | 3 | Needed for the most-repeated question type |\n| Activation Record — 7-field stack diagram | 4 | #1 most-repeated question overall |\n| Activation Tree (e.g. Quicksort recursion) | 4 | Common runtime-environment diagram |\n| DAG for `a:=b*-c+b*-c` (and for a basic block) | 4 / 5 | Shows subexpression sharing clearly |\n| Annotated parse tree (synthesized + inherited attribute examples) | 4 | Needed for SDD questions |\n| Classification of Optimization Techniques (tree diagram) | 5 | Foundational diagram for Unit 5 |\n| Control Flow Graph / Basic Block partition diagram | 5 | Needed for leader/basic-block questions |\n| Role of Code Generator (pipeline diagram) | 5 | Quick, safe diagram marks |\n\n---", "numericalsMd": "## 10. 🧮 Must-Practice Numericals (full list)\n\n| Numerical type | Unit |\n|---|---|\n| RE → NFA (Thompson's) | 2 |\n| NFA → DFA (Subset Construction) | 2 |\n| RE → DFA directly (firstpos/lastpos/followpos) | 2 |\n| DFA Minimization (partitioning algorithm) | 2 |\n| FIRST and FOLLOW set computation | 3 |\n| LL(1) parsing table construction + string parsing | 3 |\n| Left Recursion elimination (direct & indirect) | 3 |\n| Left Factoring | 3 |\n| Ambiguity check/proof (2 derivations for 1 string) | 3 |\n| Leftmost / Rightmost derivation | 3 |\n| Shift-Reduce parsing trace | 3 |\n| Operator Precedence table + parsing trace | 3 |\n| LR(0) / SLR(1) / CLR(1) / LALR(1) table construction + parsing trace | 3 |\n| Three Address Code / Quadruple / Triple / Indirect Triple generation | 4 |\n| DAG construction (for an expression, and for a basic block) | 4 / 5 |\n| Annotated parse tree value computation (SDD) | 4 |\n| Peephole optimization before/after code | 5 |\n| Constant folding / propagation, CSE, dead code, code motion, strength reduction (before/after code) | 5 |\n| Leader identification + basic block partition + flow graph | 5 |\n| Register usage-count / graph colouring (conceptual, rarely fully numeric) | 5 |", "revisionMd": "## 11. ⚡ ONE-DAY COMPILER DESIGN REVISION SHEET\n\n### UNIT 1 — MUST KNOW\n- 6 Phases (in order): Lexical → Syntax → Semantic → Intermediate Code → Optimization → Code Generation. Analysis = phases 1–3, Synthesis = phases 4–6.\n- Compiler = whole program at once; Interpreter = line by line; Assembler = assembly→machine code.\n- 3 Cousins: Preprocessor, Assembler, Linker & Loader. Order: Preprocessor→Compiler→Assembler→Linker/Loader.\n- Front End = source-dependent; Back End = target-machine-dependent.\n- 6 types of compiler: Native, Cross, Source-to-Source, JIT, Incremental, Parallelizing.\n- Pass ≠ Phase: 2 passes, 6 phases.\n\n### UNIT 2 — MUST KNOW\n- Token = category; Lexeme = actual text; Pattern = rule (regex).\n- RE rules: `*`=zero or more, `+`=one or more, `|`=or.\n- Thompson's Construction: base cases (ε, single symbol) + 3 rules (union, concat, star).\n- Subset Construction: `ε-closure(start)=A` → repeat Move+ε-closure for each symbol → build Dtran table.\n- firstpos/lastpos/followpos: build syntax tree with numbered leaves → nullable → firstpos/lastpos → followpos (2 rules: CAT and STAR) → build DFA from firstpos(root) and followpos.\n- DFA Minimization: split into final/non-final groups → keep splitting until stable → merge same-behaviour states.\n\n### UNIT 3 — MUST KNOW\n- Ambiguous grammar = 2 different parse trees / leftmost derivations for the same string.\n- Left Recursion formula: `A→Aα|β` ⟹ `A→βA'`, `A'→αA'|ε`.\n- Left Factoring formula: `A→αβ1|αβ2|γ` ⟹ `A→αA'|γ`, `A'→β1|β2`.\n- FIRST/FOLLOW rules (see Unit 3, Q5).\n- LL(1) steps: remove left recursion → FIRST/FOLLOW → parsing table → parse using stack.\n- LR family: LR(0) (no lookahead) < SLR(1) (uses FOLLOW) < LALR(1) (merged CLR states) < CLR(1) (most powerful, biggest table). Steps: augment grammar → closure/goto → canonical item sets → Action/Goto table → parse trace.\n- Operator precedence: relations `<·` `=·` `·>` between terminals; handle = between first `·>` and preceding `<·`.\n\n### UNIT 4 — MUST KNOW\n- TAC: `x:=y op z`, max 1 operator per line.\n- Quadruple = 4 fields (Op,Arg1,Arg2,Result). Triple = 3 fields, refers to OTHER triples by position number. Indirect Triple = Triple + a separate pointer list.\n- Activation Record 7 fields (top to bottom): Return value, Actual parameters, Control link, Access link, Saved machine status, Local variables, Temporaries.\n- 4 Parameter Passing methods: Value (copy, original unchanged), Reference (address, original changes), Copy-Restore (copy in, copy back out), Name (macro-style text substitution).\n- Synthesized attribute = from children (bottom-up); Inherited attribute = from parent/sibling (top-down).\n- DAG = tree but merges repeated subexpressions into ONE shared node.\n\n### UNIT 5 — MUST KNOW\n- Peephole optimization types: redundant instruction elimination, flow-of-control optimization, unreachable code removal, algebraic simplification, strength reduction, machine idioms.\n- Optimization classification: Machine Dependent vs Machine Independent → (Function Preserving: CSE, folding, copy propagation, dead code elimination) + (Loop Optimization: code motion, strength reduction).\n- Basic Block Leader rules: (1) first statement, (2) target of any goto, (3) statement right after a goto.\n- DAG for basic block: same idea as Unit 4's DAG, applied to a whole block; uses = find CSE, find live-on-exit values, simplify quadruples.\n- Register Allocation ≠ Register Assignment (which value vs which specific register).\n- Code Generator issues: input form, target program type, memory management, instruction selection, register allocation, evaluation order.\n\n### Formulas / Rules Quick List\n- Left Recursion: `A→Aα|β` → `A→βA', A'→αA'|ε`\n- Left Factoring: `A→αβ1|αβ2|γ` → `A→αA', A'→β1|β2`\n- `Out[S] = gen[S] ∪ (in[S] – kill[S])` (data flow equation)\n- Usage count: `Σ [use(x,B) + 2×live(x,B)]`\n\n### Most Repeated Questions (quick recall — see Section 7 for full table)\nActivation Record • SLR/CLR/LALR/LR(0) construction • TAC/Quadruple/Triple/Indirect Triple • Peephole Optimization • RE→NFA→DFA • Parameter Passing Methods • Code Optimization Techniques • LL(1)/FIRST-FOLLOW/Operator Precedence on `E→E+T|T` grammar family • Left Recursion + Left Factoring • Ambiguous Grammar • Phases of Compiler • Compiler vs Interpreter vs Assembler • DAG construction.\n\n---", "strategyMd": "## 12. 🎯 Final Exam Strategy\n\n**What to study first:** Start with Section 8 (Top 30 Questions) — it already blends frequency + depth across all 5 units. Inside that, do the 🔴 Very-High items in Sections 2–6 first, unit by unit, in this order: Unit 3 (heaviest, most numerical) → Unit 4 (2nd most repeated) → Unit 2 → Unit 5 → Unit 1 (lightest but very safe, high-certainty marks).\n\n**What NOT to skip:** Activation Record, SLR/CLR/LALR/LR(0) table construction, and TAC/Quadruple/Triple/Indirect-Triple — these three alone cover close to 20 marks worth of repeated question-types across your real papers. Do not leave any of Units 1–5 completely unread — even \"Low Priority\" topics show up as 1-mark MCQ/short-answer items in the 100-mark paper format.\n\n**What to memorize word-for-word:** the algorithm steps (Left Recursion formula, Left Factoring formula, LL(1) 4 steps, Subset Construction pseudocode, followpos rules, DFA minimization steps, Leader rules, Activation Record's 7 fields) — these are marking-point checklists, and examiners look for these exact steps.\n\n**What to practice by hand (don't just read):** RE→NFA→DFA conversion, SLR/CLR/LALR table construction, TAC/Quadruple/Triple generation, Left Recursion/Left Factoring, FIRST/FOLLOW computation, DAG construction. These are numerical/algorithm skills — reading about them is not the same as being able to do them under exam time pressure. Practice on the SAME grammars listed in Section 10, then try 1–2 unseen grammars from your textbook.\n\n**How to write answers for maximum marks:**\n- For theory questions: definition first (1 line), then bullet points of main ideas, then a diagram if one is expected — examiners scan for keywords and structure, not long paragraphs.\n- For numerical questions: always show your STEPS, not just the final answer — most marks are for the method, not the final table alone.\n- If asked \"check whether X\" and you find a conflict/problem (e.g., grammar not SLR, or ambiguous) — say so clearly and explain WHY, don't just leave it incomplete.\n\n**How to manage time in the exam:**\n- Attempt Q1 (MCQ + short answers, if it's the 100-mark format) FIRST and fast — these are guaranteed marks if you know your definitions.\n- For each main question (2 through 5/6), decide BEFORE writing which OR-side you know better — don't start one side and switch mid-way.\n- Numerical questions (SLR/CLR tables, NFA→DFA, TAC) take longer — budget roughly 12–15 minutes for an 8-mark numerical, 6–8 minutes for an 8-mark theory question.\n- Draw diagrams quickly and neatly — a correct-but-rough diagram earns full diagram marks; don't over-decorate.\n\n**How to maximize marks with limited time:** use the \"MINIMUM FULL-MARK ANSWER\" given for every Very-High/High question in Sections 2–6 — these are built to hit the maximum number of marking points in the shortest possible writing time. If you have extra time in the exam, add the \"➕ ADD THESE IF YOU HAVE TIME\" points for a safety margin.\n\n**Honest note on predictions:** Every priority/frequency label in this document (🔴🟠🟡⚪ and \"Very/High/Medium/Low Probability\") is based only on patterns found in YOUR uploaded PYQs, assignments, and PPTs — not a guarantee of what will appear in your exact upcoming exam. Treat \"Very High Priority\" as **Very High Probability**, not certainty, and never skip an entire unit just because it scored lower in this analysis.\n\n**Good luck for your exam — you now have a complete, prioritized map of your syllabus. Study Sections 8 and 11 first if you are extremely short on time.**", "revisionTailMd": "### Formulas / Rules Quick List\n- Left Recursion: `A→Aα|β` → `A→βA', A'→αA'|ε`\n- Left Factoring: `A→αβ1|αβ2|γ` → `A→αA', A'→β1|β2`\n- `Out[S] = gen[S] ∪ (in[S] – kill[S])` (data flow equation)\n- Usage count: `Σ [use(x,B) + 2×live(x,B)]`\n\n### Most Repeated Questions (quick recall — see Section 7 for full table)\nActivation Record • SLR/CLR/LALR/LR(0) construction • TAC/Quadruple/Triple/Indirect Triple • Peephole Optimization • RE→NFA→DFA • Parameter Passing Methods • Code Optimization Techniques • LL(1)/FIRST-FOLLOW/Operator Precedence on `E→E+T|T` grammar family • Left Recursion + Left Factoring • Ambiguous Grammar • Phases of Compiler • Compiler vs Interpreter vs Assembler • DAG construction.\n\n---"}};
</script>

<script type="text/babel" data-presets="react">
/* ============================================================
   Compiler Design — Final Exam Preparation
   Single-file React app (React 18 UMD + Babel Standalone).
   All exam content lives in window.CD_DATA (see data.js) and is
   rendered verbatim through Markdown() — this file only adds
   presentation, navigation, search, filters and local persistence.
   ============================================================ */

const { useState, useEffect, useMemo, useRef, useCallback, createContext, useContext } = React;

/* ------------------------------------------------------------
   Fixed CD terminology list — wording is NEVER changed, we only
   wrap existing text in <mark class="cd-term"> for emphasis.
   ------------------------------------------------------------ */
const CD_TERMS = [
  'Lexical Analysis', 'Syntax Analysis', 'Semantic Analysis', 'Parse Tree',
  'NFA', 'DFA', 'ε-closure', 'FIRST', 'FOLLOW', 'LL(1)', 'LR', 'SLR', 'CLR', 'LALR',
  'Three Address Code', 'DAG', 'Code Optimization', 'Symbol Table', 'Code Generation',
];
const CD_TERMS_SORTED = [...CD_TERMS].sort((a, b) => b.length - a.length);
const TERM_REGEXES = CD_TERMS_SORTED.map((t) => ({
  term: t,
  re: new RegExp('(?<![A-Za-z0-9_])' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(?![A-Za-z0-9_])', 'g'),
}));

function highlightTerms(root) {
  if (!root) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode(node) {
      let p = node.parentElement;
      while (p && p !== root) {
        const tag = p.tagName;
        if (tag === 'CODE' || tag === 'PRE' || tag === 'MARK' || (p.classList && p.classList.contains('no-highlight'))) {
          return NodeFilter.FILTER_REJECT;
        }
        p = p.parentElement;
      }
      return node.nodeValue.trim() ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
    },
  });
  const nodes = [];
  let n;
  while ((n = walker.nextNode())) nodes.push(n);
  nodes.forEach((node) => {
    const text = node.nodeValue;
    let spans = [];
    TERM_REGEXES.forEach(({ re }) => {
      re.lastIndex = 0;
      let m;
      while ((m = re.exec(text))) spans.push([m.index, m.index + m[0].length]);
    });
    if (spans.length === 0) return;
    spans.sort((a, b) => a[0] - b[0] || b[1] - b[0] - (a[1] - a[0]));
    const merged = [];
    spans.forEach((s) => {
      if (merged.length && s[0] < merged[merged.length - 1][1]) return;
      merged.push(s);
    });
    if (merged.length === 0) return;
    const frag = document.createDocumentFragment();
    let last = 0;
    merged.forEach(([start, end]) => {
      if (start > last) frag.appendChild(document.createTextNode(text.slice(last, start)));
      const mark = document.createElement('mark');
      mark.className = 'cd-term';
      mark.textContent = text.slice(start, end);
      frag.appendChild(mark);
      last = end;
    });
    if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
    node.parentNode.replaceChild(frag, node);
  });
}

function parseMd(md) {
  if (!md) return '';
  try {
    return window.marked.parse ? window.marked.parse(md, { gfm: true }) : window.marked(md);
  } catch (e) {
    return '<p>' + String(md) + '</p>';
  }
}

/* ------------------------------------------------------------
   Generic markdown renderer: tables get a scroll wrapper, code
   blocks get a copy button, and CD terminology gets highlighted.
   Never alters the underlying text — presentation only.
   ------------------------------------------------------------ */
function Markdown({ md, className, highlight = true, gu = false }) {
  const ref = useRef(null);
  const html = useMemo(() => parseMd(md), [md]);
  const doHighlight = highlight && !gu;

  useEffect(() => {
    const root = ref.current;
    if (!root) return;

    root.querySelectorAll('table').forEach((table) => {
      if (table.parentElement.classList.contains('table-wrap')) return;
      const wrap = document.createElement('div');
      wrap.className = 'table-wrap';
      table.parentNode.insertBefore(wrap, table);
      wrap.appendChild(table);
    });

    root.querySelectorAll('pre').forEach((pre) => {
      if (pre.parentElement.classList.contains('code-block-wrap')) return;
      const code = pre.querySelector('code');
      let lang = '';
      if (code) {
        const m = (code.className || '').match(/language-(\w+)/);
        if (m) lang = m[1];
      }
      const wrap = document.createElement('div');
      wrap.className = 'code-block-wrap';
      pre.parentNode.insertBefore(wrap, pre);
      wrap.appendChild(pre);
      if (lang) {
        const bar = document.createElement('div');
        bar.className = 'code-lang-bar';
        bar.textContent = lang;
        wrap.insertBefore(bar, pre);
      }
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'code-copy-btn';
      btn.textContent = 'Copy';
      btn.addEventListener('click', () => {
        const text = code ? code.textContent : pre.textContent;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).catch(() => {});
        }
        btn.textContent = 'Copied!';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = 'Copy';
          btn.classList.remove('copied');
        }, 1400);
      });
      wrap.appendChild(btn);
    });

    if (doHighlight) highlightTerms(root);
  }, [html, doHighlight]);

  return <div ref={ref} className={'md-content' + (gu ? ' gu-text' : '') + (className ? ' ' + className : '')} dangerouslySetInnerHTML={{ __html: html }} />;
}

/* Diagram block: same content, distinct "must-draw" visual treatment. */
function DiagramBlock({ md }) {
  const ref = useRef(null);
  const html = useMemo(() => parseMd(md), [md]);
  useEffect(() => {
    const root = ref.current;
    if (!root) return;
    root.querySelectorAll('pre').forEach((pre) => {
      if (pre.parentElement.classList.contains('diagram-inner')) return;
      const wrap = document.createElement('div');
      wrap.className = 'diagram-inner';
      pre.parentNode.insertBefore(wrap, pre);
      wrap.appendChild(pre);
    });
  }, [html]);
  if (!md) return null;
  return (
    <div className="diagram-box anim-fade-in">
      <div className="diagram-box-header">📌 Diagram — Must Draw in Exam</div>
      <div ref={ref} className="md-content no-highlight" dangerouslySetInnerHTML={{ __html: html }} />
    </div>
  );
}

/* ------------------------------------------------------------
   Persistence (localStorage) — prepared / bookmarked / theme
   ------------------------------------------------------------ */
function loadIdSet(key) {
  try {
    const raw = localStorage.getItem(key);
    if (!raw) return new Set();
    return new Set(JSON.parse(raw));
  } catch (e) {
    return new Set();
  }
}
function saveIdSet(key, set) {
  try {
    localStorage.setItem(key, JSON.stringify(Array.from(set)));
  } catch (e) {}
}

const AppCtx = createContext(null);
function useApp() {
  return useContext(AppCtx);
}

/* ------------------------------------------------------------

   ------------------------------------------------------------ */
const PRIORITY_CLASS = {
  'Very High': 'priority-veryhigh',
  High: 'priority-high',
  Medium: 'priority-medium',
  Low: 'priority-low',
};
const PRIORITY_DOT = {
  'Very High': '🔴',
  High: '🟠',
  Medium: '🟡',
  Low: '⚪',
};

function PriorityChip({ priority }) {
  return (
    <span className={'priority-chip ' + (PRIORITY_CLASS[priority] || 'priority-low') + ' inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-bold whitespace-nowrap'}>
      <span>{PRIORITY_DOT[priority] || '⚪'}</span>
      <span>{priority} Priority</span>
    </span>
  );
}
function MarksChip({ marks }) {
  if (!marks) return null;
  return (
    <span className="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-bold bg-indigo-50 text-indigo-700 border border-indigo-200 dark:bg-indigo-500/10 dark:text-indigo-300 dark:border-indigo-500/40 whitespace-nowrap">
      ✏️ {marks} Marks
    </span>
  );
}
function RepeatedChip({ q }) {
  if (!isRepeated(q)) return null;
  return (
    <span className="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-bold bg-rose-50 text-rose-700 border border-rose-200 dark:bg-rose-500/10 dark:text-rose-300 dark:border-rose-500/40 whitespace-nowrap">
      🔁 Repeated PYQ
    </span>
  );
}
function TypeTags({ tags }) {
  if (!tags || !tags.length) return null;
  const emoji = { Theory: '📖', Numerical: '🧮', Diagram: '📊', Algorithm: '🧩' };
  return (
    <>
      {tags.map((t) => (
        <span key={t} className="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-semibold bg-slate-100 text-slate-600 border border-slate-200 dark:bg-slate-700/50 dark:text-slate-300 dark:border-slate-600 whitespace-nowrap">
          {emoji[t] || ''} {t}
        </span>
      ))}
    </>
  );
}

function isRepeated(q) {
  const s = q.repeated || '';
  const m = s.match(/(\d+)\s*(different sources|occurrences|sources|times|different papers)/i);
  if (m) return parseInt(m[1], 10) >= 2;
  const head = s.split('—')[0];
  const parts = head.split(',').map((x) => x.trim()).filter(Boolean);
  return parts.length >= 2;
}

function KeywordPills({ keywords }) {
  if (!keywords || !keywords.length) return null;
  return (
    <div className="flex flex-wrap gap-2">
      {keywords.map((k, i) => (
        <span key={i} className="kw-pill anim-pop" style={{ animationDelay: (i * 0.03) + 's' }}>
          {k}
        </span>
      ))}
    </div>
  );
}

function MustWriteBox({ items }) {
  if (!items || !items.length) return null;
  return (
    <div className="mustwrite-box">
      <div className="font-extrabold text-emerald-800 dark:text-emerald-300 text-sm uppercase tracking-wide mb-2 flex items-center gap-2">
        <span>⭐</span> Must Write for Full Marks

const FILTERS = [
  { id: 'all', label: 'All' },
  { id: 'veryhigh', label: 'Very High Priority' },
  { id: 'high', label: 'High Priority' },
  { id: 'medium', label: 'Medium Priority' },
  { id: 'theory', label: 'Theory' },
  { id: 'numerical', label: 'Numerical' },
  { id: 'diagram', label: 'Diagram' },
  { id: 'algorithm', label: 'Algorithm' },
  { id: 'repeated', label: 'Repeated Questions' },
];

function matchesFilter(q, filter) {
  switch (filter) {
    case 'all': return true;
    case 'veryhigh': return q.priority === 'Very High';
    case 'high': return q.priority === 'High';
    case 'theory': return q.typeTags.includes('Theory');
    case 'numerical': return q.typeTags.includes('Numerical');
    case 'diagram': return q.typeTags.includes('Diagram');
    case 'algorithm': return q.typeTags.includes('Algorithm');
    case 'repeated': return isRepeated(q);
    default: return true;
  }
}

function FilterBar({ active, onChange }) {
  return (
    <div className="flex gap-2 overflow-x-auto no-scrollbar pb-1 -mx-1 px-1">
      {FILTERS.map((f) => (
        <button
          key={f.id}
          onClick={() => onChange(f.id)}
          className={
            'flex-none px-3.5 py-1.5 rounded-full text-sm font-semibold border transition-all ' +
            (active === f.id
              ? 'bg-indigo-600 text-white border-indigo-600 shadow-sm'
              : 'bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-700 hover:border-indigo-300 dark:hover:border-indigo-500')
          }

        </button>
      ))}
    </div>
  );
}

function SearchView({ query, allQuestions }) {
  const q = query.trim().toLowerCase();
  const results = useMemo(() => {
    if (!q) return [];
    return allQuestions.filter((item) => {
      const hay = [item.question, item.answerMd, item.finalVersionMd, item.quickRefMd, item.understandGuMd, item.finalVersionGuMd, (item.keywords || []).join(' '), (item.mustWrite || []).join(' ')]
        .join(' \n ')
        .toLowerCase();
      return hay.includes(q);
    });
  }, [q, allQuestions]);

  return (
    <div className="space-y-5">
      <div className="rounded-2xl p-6 sm:p-7 bg-gradient-to-br from-slate-700 to-slate-900 text-white anim-fade-in">
        <h1 className="text-xl sm:text-2xl font-extrabold">🔎 Search Results for "{query}"</h1>
        <p className="text-slate-300 mt-1 text-sm">{results.length} question{results.length === 1 ? '' : 's'} found across all units</p>

      {results.length === 0 ? (
        <div className="text-center py-16 text-slate-400 dark:text-slate-500 font-medium">No matches. Try a different keyword (e.g. "LL(1)", "DFA", "Activation Record").</div>
      ) : (
        <div className="space-y-5">
          {results.map((item) => (
            <QuestionCard key={item.id} q={item} defaultOpen />
          ))}
        </div>
      )}
    </div>
  );
}
