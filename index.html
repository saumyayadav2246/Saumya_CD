 generate કરવું પણ સહેલું હોય અને આગળ machine code માં translate કરવું પણ સહેલું હોય. આ વચ્ચેના form ને Intermediate Code કહે છે.\n\nMost common Intermediate representation છે Three Address Code (TAC). એમાં rule એકદમ simple છે: દરેક statement નું ફોર્મ `x := y op z` જેવું હોય, અને એક statement માં એક જ operator વાપરવાનો — બે operator ભેગા ના લખવાના. Actual compiler માં TAC ને records તરીકે store કરવામાં આવે છે, અને એ કરવાની ત્રણ common રીત છે — Quadruple, Triple, અને Indirect Triple.\n\nહવે example લઈએ: `a := b * -c + b * -c`. જુઓ, આ expression માં `-c` અને `b*(-c)` બંને બે-બે વાર repeat થાય છે. પણ TAC લખતી વખતે આપણે એ વાત નું ધ્યાન નથી રાખતા કે કંઈ repeat થાય છે કે નહીં (એ તો optimization નું કામ છે) — સાદી (non-optimizing) translation માં દરેક operation માટે નવું temporary variable (t1, t2, ...) બનાવીને સીધું લખી નાખવાનું:\n```\nt1 := uminus c\nt2 := b * t1\nt3 := uminus c\nt4 := b * t3\nt5 := t2 + t4\na  := t5\n```\n\nહવે આ જ TAC ને store કરવાની 3 રીત જોઈએ — content same જ છે, ફક્ત store કરવાની રીત અલગ છે.\n\n**Quadruple** માં દરેક statement ને 4 fields માં લખો: Op, Arg1, Arg2, Result. એકદમ સીધું — TAC માં જે t1, t2 નામ હતા એ Result column માં લખી દેવાના.\n\n| # | Op | Arg1 | Arg2 | Result |\n|---|---|---|---|---|\n| 0 | uminus | c | | t1 |\n| 1 | * | b | t1 | t2 |\n| 2 | uminus | c | | t3 |\n| 3 | * | b | t3 | t4 |\n| 4 | + | t2 | t4 | t5 |\n| 5 | := | t5 | | a |\n\n**Triple** માં Result field જ કાઢી નાખો — ફક્ત 3 fields રહે: Op, Arg1, Arg2. હવે t1 જેવું નામ ક્યાંય store નથી કરવાનું, એની જગ્યાએ એ statement નો પોતાનો position number (0,1,2...) વાપરવાનો. મતલબ statement (1) જો statement (0) નું result વાપરે, તો Arg2 માં \"t1\" ના બદલે \"(0)\" લખવાનું. આનાથી symbol table માં temporary નામ store કરવાની જરૂર જ નથી પડતી — memory બચે છે.\n\n| # | Op | Arg1 | Arg2 |\n|---|---|---|---|\n| (0) | uminus | c | |\n| (1) | * | b | (0) |\n| (2) | uminus | c | |\n| (3) | * | b | (2) |\n| (4) | + | (1) | (3) |\n| (5) | := | a | (4) |\n\n**Indirect Triple** માં Triple table તો એ જ રહે છે, બસ ઉપર એક extra pointer list ઉમેરી દેવાની જે કહે કે statements ક્યા order માં actually execute થવાના છે. આનાથી પછી optimization વખતે statements નો order બદલવો હોય તો ફક્ત pointer list બદલવી પડે, આખા triple table ને ફરીથી number નથી કરવું પડતું.\n\nCommon mistake: Triple માં ભૂલથી t1 જેવું temporary નામ લખી દેવું — ના, Triple માં position number જ લખવાનો, નહીં તો Triple બનાવવાનો આખો point જ મરી જાય.", "finalVersionGuMd": "Three Address Code (TAC) એ એક intermediate representation છે જેમાં દરેક statement નું ફોર્મ `x := y op z` હોય છે, અને એક statement માં વધુમાં વધુ એક જ operator હોય છે. `a := b * -c + b * -c` માટે TAC આ પ્રમાણે છે:\n```\nt1 := uminus c\nt2 := b * t1\nt3 := uminus c\nt4 := b * t3\nt5 := t2 + t4\na  := t5\n```\n\nQuadruple દરેક TAC statement ને ચાર fields વાળા record તરીકે store કરે છે — Op, Arg1, Arg2, Result:\n\n| # | Op | Arg1 | Arg2 | Result |\n|---|---|---|---|---|\n| 0 | uminus | c | | t1 |\n| 1 | * | b | t1 | t2 |\n| 2 | uminus | c | | t3 |\n| 3 | * | b | t3 | t4 |\n| 4 | + | t2 | t4 | t5 |\n| 5 | := | t5 | | a |\n\nTriple ફક્ત ત્રણ fields વાપરે છે — Op, Arg1, Arg2 — અને પહેલાના results ને temporary નામને બદલે તે statement ના position number થી refer કરે છે:\n\n| # | Op | Arg1 | Arg2 |\n|---|---|---|---|\n| (0) | uminus | c | |\n| (1) | * | b | (0) |\n| (2) | uminus | c | |\n| (3) | * | b | (2) |\n| (4) | + | (1) | (3) |\n| (5) | := | a | (4) |\n\nIndirect Triple એ જ Triple table રાખે છે પણ સાથે execution order આપતી એક અલગ pointer list ઉમેરે છે, જેનાથી optimization દરમિયાન statements નો order બદલવો સહેલો પડે છે, અને triples ને ફરી number કરવાની જરૂર પડતી નથી."}, {"id": "u4-vh-2", "globalIndex": 23, "unit": 4, "priority": "Very High", "question": "What do you mean by an Activation Record? Explain all its fields with a neat diagram.", "questionShort": "Explain Activation Record with a neat diagram (all fields)", "marks": "6–8", "marksNote": "", "repeated": "Assignment-2 Q5, PAC Q6, CD_1 Q1(B)/Q5(B)-OR, CD_2 Q3-OR(c)/Q5(c), CD_3 Q5-OR(a), CD.pdf Q2(A)-OR — **7 occurrences, the single MOST REPEATED theory question in your entire syllabus.**", "years": "", "inPPT": "", "type": "Theory + Diagram.", "typeTags": ["Theory", "Diagram"], "answerMd": "An **Activation Record** is a block of memory used to manage all the information required for a single execution, called an activation, of a procedure. Every time a procedure is called, a new activation record is created for that particular call, and it is destroyed once the procedure finishes executing. In languages like Pascal and C, activation records are placed on a stack, since procedure calls and returns naturally follow a last-in-first-out order; in older languages like Fortran, they are placed in static memory instead.\n\nAn activation record typically has the following seven fields:\n\n**1. Return value.** This field is used to store the result of the function call, so that the calling procedure can use it after the call finishes.\n\n**2. Actual parameters.** This field holds the values (or addresses) of the parameters that were passed to the called procedure.\n\n**3. Control link.** Also called the **dynamic link**, this field points to the activation record of the procedure that called this one, so that control can return correctly after this call finishes.\n\n**4. Access link.** Also called the **static link**, this field points to the activation record that holds any non-local data needed by this procedure, which is useful in languages that allow nested procedure definitions.\n\n**5. Saved machine status.** This field stores the values of the machine registers and the program counter exactly as they were just before this call began, so the calling procedure's state can be correctly restored after the call finishes.\n\n**6. Local variables.** This field holds the data that is local to the current execution of the procedure.\n\n**7. Temporaries.** This field holds temporary values that are needed during the evaluation of expressions inside the procedure.", "diagramMd": "```\n ┌───────────────────────────┐\n │        Return Value          │\n ├───────────────────────────┤\n │      Actual Parameters       │\n ├───────────────────────────┤\n │   Control Link (dynamic link)  │\n ├───────────────────────────┤\n │   Access Link (static link)    │\n ├───────────────────────────┤\n │   Saved Machine Status        │\n ├───────────────────────────┤\n │      Local Variables          │\n ├───────────────────────────┤\n │        Temporaries            │\n └───────────────────────────┘\n```\nThis diagram must be drawn and each of the seven fields must be labelled clearly, since this is explicitly a \"diagram\" question in almost every one of your previous papers.", "mustWrite": ["Correct definition of Activation Record as a block of memory for one procedure execution.", "All seven fields named and each explained in one full sentence, not just a single word.", "Control Link correctly explained as pointing to the CALLING procedure.", "Access Link correctly explained as pointing to NON-LOCAL DATA.", "The diagram, clearly labelled."], "keywords": ["Activation Record", "Return value", "Actual parameters", "Control link", "dynamic link", "Access link", "static link", "Saved machine status", "Local variables", "Temporaries"], "finalVersionMd": "An Activation Record is a block of memory that holds all the information needed for a single execution (activation) of a procedure; a new activation record is created every time the procedure is called, and it is destroyed once that call finishes. In languages such as C and Pascal, activation records are placed on a stack.\n\nAn activation record has seven fields. The Return Value field stores the result of the function call for use by the caller. The Actual Parameters field holds the values passed into the procedure. The Control Link, or dynamic link, points to the activation record of the calling procedure, so control can correctly return to it. The Access Link, or static link, points to the activation record holding any non-local data the procedure needs. The Saved Machine Status field stores the register values and program counter as they were just before the call, so they can be restored afterward. The Local Variables field holds data local to this call, and the Temporaries field holds temporary values needed while evaluating expressions.\n\n```\nReturn Value\nActual Parameters\nControl Link (dynamic link)\nAccess Link (static link)\nSaved Machine Status\nLocal Variables\nTemporaries\n```\n\n---", "quickRefMd": "**⭐ Definition:** A block of memory that holds all the information needed for ONE execution (activation) of a procedure.\n\n**📊 DIAGRAM: MUST DRAW** (top to bottom, like a stack frame)\n```\n ┌─────────────────────┐\n │   Return Value        │\n ├─────────────────────┤\n │   Actual Parameters    │\n ├─────────────────────┤\n │   Control Link (dynamic link) │\n ├─────────────────────┤\n │   Access Link (static link)   │\n ├─────────────────────┤\n │   Saved Machine Status  │\n ├─────────────────────┤\n │   Local Variables      │\n ├─────────────────────┤\n │   Temporaries          │\n └─────────────────────┘\n```\n\n**Must-write points (all 7 fields, 1 line each):**\n1. **Temporaries** — needed during expression evaluation.\n2. **Local variables** — data local to this call.\n3. **Saved machine status** — register values & program counter before the call.\n4. **Control link (dynamic link)** — points to the activation record of the CALLING procedure.\n5. **Access link (static link)** — points to the activation record holding non-local data.\n6. **Actual parameters** — parameters passed to the called procedure.\n7. **Return value** — stores the function's result.\n\n**➕ ADD THESE IF YOU HAVE TIME:** Fortran uses static memory for activation records; Pascal and C use a stack.\n\n**Common mistakes:** Mixing up Control Link and Access Link (Control link = who CALLED me; Access link = where is my non-local DATA); drawing the diagram upside down (Return value usually goes at the top/bottom depending on the convention used in your class notes — just be consistent, and label each part clearly).\n\n**✍️ MINIMUM FULL-MARK ANSWER:** the diagram + the 7 one-line field descriptions.\n\n---", "understandGuMd": "ભાઈ, જ્યારે પણ કોઈ procedure/function ને call કરીએ, ત્યારે એ run થવા માટે જે information જોઈએ (parameters, local variables, return address, વગેરે) એ બધું ક્યાંક તો store કરવું પડે ને! એ માટે memory નો જે block use થાય છે એને **Activation Record** કહે છે. દર વખતે જ્યારે procedure ને call કરો, નવો Activation Record બને, અને procedure પૂરું થાય એટલે destroy થઈ જાય.\n\nC, Pascal જેવી languages માં Activation Records ને stack ઉપર મૂકવામાં આવે છે, કારણ કે function calls અને returns એકદમ LIFO (last-in-first-out) order માં થાય છે — જે છેલ્લે call થયું એ પહેલા return થાય. જૂની languages જેવી કે Fortran માં Activation Record ને static memory માં જ ફિક્સ રાખતા.\n\nહવે Activation Record માં total 7 fields હોય છે, ઉપરથી નીચે ના order માં (આ diagram exam માં દોરવો ફરજિયાત છે):\n\n1. **Return value** – Function નું જે result છે એ અહીં store થાય, જેથી calling procedure આગળ વાપરી શકે.\n2. **Actual parameters** – Call કરતી વખતે જે values (કે addresses) મોકલ્યા હોય એ અહીં હોય.\n3. **Control link** (dynamic link) – આ field બતાવે કે \"મને કોણે call કર્યો\" — calling procedure ના Activation Record તરફ pointer રાખે, જેથી return પછી control પાછું ત્યાં જઈ શકે.\n4. **Access link** (static link) – આ field non-local data ને access કરવા માટે વપરાય, ખાસ કરીને જ્યારે nested procedures હોય (એક procedure ની અંદર બીજું procedure define કરેલું હોય).\n5. **Saved machine status** – Call શરૂ થયા પહેલા registers અને program counter ની જે value હતી એ અહીં save કરી રાખવાની, જેથી call પૂરો થાય પછી પાછું એ જ સ્થિતિમાં આવી શકાય.\n6. **Local variables** – એ procedure ની અંદર declare કરેલા variables અહીં હોય.\n7. **Temporaries** – Expression evaluate કરતી વખતે જે temporary values જોઈએ એ અહીં store થાય.\n\nધ્યાન રાખજો: Control link એટલે \"કોણે call કર્યું\" (calling procedure તરફ), અને Access link એટલે \"non-local data ક્યાં છે\" — બંને ને ગૂંચવવા નહીં, exam માં આ સૌથી common mistake છે.", "finalVersionGuMd": "Activation Record એ memory નો એક block છે જેમાં procedure ના એક execution (activation) માટે જરૂરી બધી information store થાય છે; procedure ને call કરો ત્યારે નવો Activation Record બને છે, અને એ call પૂરો થાય એટલે destroy થઈ જાય છે. C અને Pascal જેવી languages માં Activation Records ને stack ઉપર મૂકવામાં આવે છે.\n\nActivation Record માં સાત fields હોય છે. Return Value field માં function call નું result store થાય છે જેથી caller એને વાપરી શકે. Actual Parameters field માં procedure ને pass કરેલી values હોય છે. Control Link, અથવા dynamic link, calling procedure ના Activation Record તરફ point કરે છે, જેથી control બરાબર ત્યાં પાછું જઈ શકે. Access Link, અથવા static link, procedure ને જોઈતા non-local data ધરાવતા Activation Record તરફ point કરે છે. Saved Machine Status field માં call પહેલાના register values અને program counter store થાય છે, જેથી call પછી એ પાછા restore કરી શકાય. Local Variables field માં આ call માટે local data હોય છે, અને Temporaries field માં expressions evaluate કરતી વખતે જોઈતી temporary values હોય છે.\n\n```\nReturn Value\nActual Parameters\nControl Link (dynamic link)\nAccess Link (static link)\nSaved Machine Status\nLocal Variables\nTemporaries\n```"}, {"id": "u4-vh-3", "globalIndex": 24, "unit": 4, "priority": "Very High", "question": "Discuss Parameter Passing Methods in detail, using the Swap Variable example.", "questionShort": "Explain Parameter Passing Methods using the Swap(a,b) example (Call by Value, Reference, Copy-Restore, Name)", "marks": "6–8", "marksNote": "", "repeated": "Assignment-2 Q6, PAC Q7, CD_2 Q6-OR(a), CD_3 Q6(c) & Q6-OR(c), CD.pdf Q2(A) — **5 occurrences.**", "years": "", "inPPT": "", "type": "Theory (with a numeric trace).", "typeTags": ["Theory"], "answerMd": "When a procedure is called with some parameters, there are several different ways in which the actual parameters used at the call site can be connected to the formal parameters used inside the procedure's own body. The four common methods are Call by Value, Call by Reference, Call by Copy-Restore, and Call by Name. These methods are best understood using the classic example of a `swap` function, called as `swap(a,b)` with `a=10` and `b=20`, and defined with formal parameters c and d that exchange their values.\n\n**1. Call by Value.** In this method, the value of each actual parameter is copied into the corresponding formal parameter's own separate storage location. Since c and d are completely independent copies, any change made to c and d inside the function has no effect at all on a and b. This method is sometimes described as making a \"xerox copy\" of the original values. For `swap(a,b)` with `a=10, b=20`, the values of a and b remain **unchanged (10, 20)** after the call, since only the copies c and d were swapped.\n\n**2. Call by Reference.** In this method, also called call-by-address, the address of each actual parameter is passed, and the formal parameter is used as a pointer to that address. Any change made to the formal parameter is therefore actually made to the original variable itself. For `swap(a,b)`, since c and d hold the addresses of a and b, swapping the values through c and d also swaps a and b, so the final result is **a=20, b=10 — genuinely swapped.**\n\n**3. Call by Copy-Restore.** This method is a hybrid of the previous two, and is also called copy-in-copy-out or value-result. During the call, the values of a and b are copied into c and d, just like Call by Value; but when the procedure returns, the final values of c and d are copied back into a and b. For `swap(a,b)`, this also gives the final result **a=20, b=10**, but the mechanism used to reach this result is different — the actual memory location of a and b was never touched during execution, only at the very end.\n\n**4. Call by Name.** This is the least commonly used method, in which the procedure is treated much like a macro: the procedure's body is textually substituted at the point of call, with every occurrence of the formal parameter replaced directly by the actual parameter's name. For `swap(a,b)`, the body of swap is expanded with c replaced by a and d replaced by b everywhere, which also produces the swapped result **a=20, b=10**, but achieved purely through text substitution rather than through addresses or copying.\n\n**Summary Table:**\n\n| Method | Mechanism | Result for swap(a=10,b=20) |\n|---|---|---|\n| Call by Value | Copies values in; changes to copy do not affect original | a=10, b=20 (unchanged) |\n| Call by Reference | Passes address; changes affect the original directly | a=20, b=10 (swapped) |\n| Call by Copy-Restore | Copies value in, then copies final value back out at return | a=20, b=10 (swapped) |\n| Call by Name | Substitutes the procedure body textually, like a macro | a=20, b=10 (swapped) |\n\n**Common mistakes:** Assuming Call by Reference and Call by Copy-Restore always give different final results — in most simple cases they give the SAME final result, and the actual exam point is to explain the DIFFERENCE IN MECHANISM, not the difference in outcome.", "diagramMd": "", "mustWrite": ["Correct definition of all four methods.", "Clearly explain why Call by Value leaves the original unchanged, and why Call by Reference changes it.", "The `swap(a,b)` trace and final output for each method.", "Note that Copy-Restore and Call by Reference are mechanically different even when the output looks the same."], "keywords": ["Call by Value", "Call by Reference", "Call by Copy-Restore", "value-result", "Call by Name", "actual parameter", "formal parameter"], "finalVersionMd": "There are four common methods of passing parameters to a procedure. In Call by Value, the value of each actual parameter is copied into the formal parameter's own storage, so changes made inside the procedure never affect the original variable; for `swap(a,b)` with a=10, b=20, the values remain unchanged after the call. In Call by Reference, the address of each actual parameter is passed instead, so the formal parameter acts as a pointer to the original variable, and changes made inside the procedure directly change the original; here, swap(a,b) genuinely exchanges the values, giving a=20, b=10.\n\nCall by Copy-Restore is a hybrid method, also called value-result: the actual parameter's value is copied in at the start of the call, like Call by Value, but the final value of the formal parameter is copied back into the actual parameter when the procedure returns; this also gives a=20, b=10, but through a different mechanism than Call by Reference, since the original variable is untouched during execution and only updated at the end. Call by Name treats the procedure like a macro, textually substituting the procedure's body at the call site with the formal parameters replaced by the actual parameter names; this too gives a=20, b=10, achieved purely through text substitution.\n\n---", "quickRefMd": "**Simple explanation:** When you call a function like `swap(a,b)`, there are 4 different ways the actual values a,b can be connected to the function's own variables c,d.\n\n**Memorise this table using `a=10, b=20` and `swap(a,b)` (this exact example is what the PPT and papers use):**\n\n| Method | What happens | Output after swap(a,b) |\n|---|---|---|\n| **Call by Value** | A COPY of a,b's values is given to c,d. Changing c,d does NOT change a,b. | a=10, b=20 (unchanged) |\n| **Call by Reference** | The ADDRESS of a,b is given to c,d. Changing c,d (via the address) DOES change a,b. | a=20, b=10 (swapped) |\n| **Call by Copy-Restore** | Like Call by Value during the call, but the final values of c,d are COPIED BACK into a,b when the function returns. | a=20, b=10 (swapped — same result as reference, different method) |\n| **Call by Name** | The function body is treated like a macro — textually substituted at the call site, with c replaced by a, d replaced by b, everywhere. | a=20, b=10 (swapped, but by text substitution not memory) |\n\n**⭐ One-line definitions:**\n- Call by Value = \"xerox copy\" — original never changes.\n- Call by Reference = pass the address, changes DO affect the original.\n- Copy-Restore = value going in, copy coming back out (also called \"value-result\").\n- Call by Name = replace the call with the function's actual code, like a macro.\n\n**✍️ MINIMUM FULL-MARK ANSWER:** the 4 one-line definitions + the swap(a,b) output table.\n\n**Common mistakes:** Saying Call by Reference and Copy-Restore always give different final results — they usually give the SAME final answer, but by a DIFFERENT mechanism (this difference in mechanism, not outcome, is the actual exam point).\n\n---", "understandGuMd": "જ્યારે આપણે કોઈ function ને call કરીએ ને parameters આપીએ, ત્યારે એ actual parameters (call ઉપર જે values છે) અને formal parameters (function ની અંદર જે નામ વપરાય છે) ને જોડવાની જુદી જુદી રીતો હોય છે. Total 4 methods છે: Call by Value, Call by Reference, Call by Copy-Restore, અને Call by Name. આ સમજવા માટે સૌથી સારું example છે `swap` function નું — `swap(a,b)` ને call કરો જ્યાં a=10, b=20 છે, અને અંદર formal parameters c, d છે જે એકબીજા સાથે swap થાય છે.\n\n**1. Call by Value:** આમાં actual parameter ની value ની ફક્ત copy formal parameter ના પોતાના અલગ storage માં મૂકવામાં આવે છે. c અને d સાવ independent copies છે, એટલે function ની અંદર c, d ને ગમે તેટલા બદલો, a અને b ઉપર કંઈ અસર જ ના થાય. આને \"xerox copy\" કરવા જેવું કહી શકાય. `swap(a,b)` call કરો તો a, b **10, 20 જ રહે છે (unchanged)** — કારણ કે ફક્ત copies c, d swap થયા.\n\n**2. Call by Reference (call-by-address):** આમાં actual parameter ની value નહીં, પણ address મોકલવામાં આવે છે, અને formal parameter એ address તરફ pointer તરીકે કામ કરે છે. એટલે formal parameter માં જે પણ change કરો, એ સીધું original variable માં જ થાય છે. `swap(a,b)` માં c, d પાસે a, b ના addresses છે, એટલે c, d swap કરવાથી a, b પણ ખરેખર swap થાય — final result **a=20, b=10 — સાચે જ swap થયું.**\n\n**3. Call by Copy-Restore (copy-in-copy-out / value-result):** આ પહેલી બે નું mixture છે. Call શરૂ થાય ત્યારે a, b ની values c, d માં copy થાય (Call by Value જેવું જ), પણ procedure return થાય ત્યારે c, d ની final values પાછી a, b માં copy કરવામાં આવે છે. `swap(a,b)` માટે result તો એ જ આવે **a=20, b=10**, પણ mechanism અલગ છે — execution દરમિયાન a, b ના actual memory location ને touch જ નથી કરાયું, ફક્ત છેલ્લે update થાય છે.\n\n**4. Call by Name:** આ સૌથી ઓછું વપરાતું method છે, જેમાં procedure ને macro જેમ treat કરવામાં આવે — call ની જગ્યાએ procedure નું આખું body textually substitute કરી દેવામાં આવે, અને formal parameter ની દરેક જગ્યાએ actual parameter નું નામ મૂકી દેવાય. `swap(a,b)` માટે swap ના body માં c ની જગ્યાએ a અને d ની જગ્યાએ b મૂકી દેવાય, જેનાથી પણ result **a=20, b=10** આવે, પણ આ કેવળ text substitution થી, address કે copy થી નહીં.\n\n**Summary Table:**\n\n| Method | Mechanism | Result for swap(a=10,b=20) |\n|---|---|---|\n| Call by Value | Copies values in; changes to copy do not affect original | a=10, b=20 (unchanged) |\n| Call by Reference | Passes address; changes affect the original directly | a=20, b=10 (swapped) |\n| Call by Copy-Restore | Copies value in, then copies final value back out at return | a=20, b=10 (swapped) |\n| Call by Name | Substitutes the procedure body textually, like a macro | a=20, b=10 (swapped) |\n\nCommon mistake: લોકો સમજે છે કે Call by Reference અને Copy-Restore ના results હંમેશા અલગ આવે — ના, મોટાભાગના simple cases માં result SAME જ આવે છે; exam નો point mechanism ના DIFFERENCE ને સમજાવવાનો છે, result ના difference ને નહીં.", "finalVersionGuMd": "Parameter ને procedure માં pass કરવાની ચાર common methods છે. Call by Value માં દરેક actual parameter ની value formal parameter ના પોતાના storage માં copy થાય છે, એટલે procedure ની અંદર કરેલા changes ક્યારેય original variable ને અસર નથી કરતા; `swap(a,b)` માટે a=10, b=20 હોય તો call પછી values unchanged રહે છે. Call by Reference માં દરેક actual parameter નું address મોકલવામાં આવે છે, એટલે formal parameter original variable તરફ pointer તરીકે કામ કરે છે, અને procedure ની અંદર કરેલા changes સીધા original ને બદલે છે; અહીં swap(a,b) ખરેખર values ને exchange કરે છે, જેનાથી a=20, b=10 મળે છે.\n\nCall by Copy-Restore એ hybrid method છે, જેને value-result પણ કહેવાય: call શરૂ થાય ત્યારે actual parameter ની value copy થાય છે, Call by Value ની જેમ, પણ procedure return થાય ત્યારે formal parameter ની final value પાછી actual parameter માં copy કરવામાં આવે છે; આનાથી પણ a=20, b=10 મળે છે, પણ Call by Reference કરતાં અલગ mechanism થી, કારણ કે execution દરમિયાન original variable ને touch જ કરાતું નથી, ફક્ત છેલ્લે update થાય છે. Call by Name procedure ને macro જેમ treat કરે છે, call ની જગ્યાએ procedure નું body textually substitute કરીને formal parameters ની જગ્યાએ actual parameter ના નામ મૂકે છે; આનાથી પણ a=20, b=10 મળે છે, જે કેવળ text substitution થી પ્રાપ્ત થાય છે."}, {"id": "u4-vh-4", "globalIndex": 25, "unit": 4, "priority": "Very High", "question": "Construct a DAG (Directed Acyclic Graph) for the given expression. (`(a+b) * (a+b+c)`)", "questionShort": "Construct a DAG (Directed Acyclic Graph) for a given expression", "marks": "6–8", "marksNote": "", "repeated": "Assignment-2 Q4, CD_1 Q2(A)/Q3(A)-OR, CD_3 Q1(b)-4 — **3 sources.**", "years": "", "inPPT": "Yes, heavy detail in both Unit 4 and Unit 5.", "type": "Algorithm + Diagram.", "typeTags": ["Diagram", "Algorithm"], "answerMd": "A **DAG (Directed Acyclic Graph)** is used to represent the structure of an expression or a basic block, in a way that is more compact than a plain syntax tree, because it identifies and merges any sub-expression that is computed more than once, instead of drawing it twice.\n\n**Algorithm to construct a DAG** (assuming statements of the form `x:=y op z`, `x:=op y`, or `x:=y`):\n1. If y (or z) does not already have a node, create a leaf node for it.\n2. For a statement `x := y op z`, check whether a node labelled `op` already exists with left child node(y) and right child node(z); if such a node already exists, reuse it instead of creating a new one — this is exactly what identifies a common subexpression. If no such node exists, create a new one.\n3. Attach the label x to the node found or created in step 2, and remove x from the label list of any node it was previously attached to; for a plain copy statement `x:=y`, do not create a new node at all — just attach x to node(y).\n\n**Given:** the expression `(a + b) * (a + b + c)`.\n\n**Step 1:** create leaf nodes for `a`, `b`, and `c`.\n\n**Step 2:** for the sub-expression `a + b`, create one `+` node with children `a` and `b`.\n\n**Step 3:** for `a + b + c`, this is `(a+b) + c`; since the `+` node for `a+b` already exists from Step 2, we reuse it directly as the left child of a NEW `+` node, whose right child is `c`.\n\n**Step 4:** for the final `*`, the left operand is `(a+b)`, which is exactly the same node built in Step 2, so it is reused again; the right operand is the `+` node built in Step 3 for `(a+b+c)`. The final `*` node has these two nodes as its children.\n\n**Final Answer:** the DAG has one shared `+` node for `a+b`, which is used TWICE — once directly as an input to the top-level `*`, and once as the left child of the second `+` node computing `a+b+c`. This clearly shows that `a+b` is computed only **once**, not twice, which is the entire benefit of using a DAG instead of a plain syntax tree.\n\n**Common mistakes:** Drawing two separate `+` nodes for `a+b` (once for each place it is used) — this turns the DAG back into an ordinary tree and defeats the purpose of the question.", "diagramMd": "```\n              *\n            /   \\\n          +       +\n         / \\     / \\\n        a   b   (same + node as above)   c\n```\nDraw only ONE `+` node for `a+b`, and draw two arrows going INTO it — one from the top `*` node, and one from the second `+` node (the one computing `a+b+c`) — to show clearly that this single node is shared/reused.", "mustWrite": ["Correct 3-step DAG-construction algorithm stated first.", "Correctly identify that `a+b` is a common sub-expression appearing in both parts of the formula.", "The diagram must show ONE shared node for `a+b`, not two separate ones.", "A concluding sentence stating that the DAG shows `a+b` is computed only once."], "keywords": ["DAG", "common sub-expression", "shared node", "leaf node"], "finalVersionMd": "A DAG represents an expression compactly by merging any sub-expression that is computed more than once into a single shared node, instead of duplicating it as a plain syntax tree would. It is built by creating leaf nodes for undefined operands, and for each operation, reusing an existing node with the same operator and the same children if one already exists, or creating a new node otherwise.\n\nFor `(a+b) * (a+b+c)`, we first create a `+` node with children a and b for the sub-expression `a+b`. Since `a+b` also appears inside `a+b+c`, we reuse this same `+` node as the left child of a new `+` node whose right child is c, representing `a+b+c`. Finally, the top-level `*` node takes the original `a+b` node as its left child and the `a+b+c` node as its right child. This DAG has only one node for `a+b`, shared between the top multiplication and the second addition, correctly showing that `a+b` is computed only once instead of twice.", "quickRefMd": "**⭐ Definition:** A DAG shows the structure of a basic block, but reuses (merges) any subexpression that is computed more than once — this is different from a syntax tree, which draws the SAME subexpression twice.\n\n**Algorithm to build a DAG (for statements `x:=y op z`, `x:=op y`, `x:=y`):**\n1. If y (or z) has no node yet, create node(y) (leaf).\n2. For `x:=y op z`: check if a node labelled `op` with children node(y), node(z) already exists — if yes, REUSE it (this is the common-subexpression check); if no, create a new node.\n3. Attach x as a new label to the node found in step 2 (don't create a separate node for a plain copy `x:=y`).\n\n**Worked example:** `(a+b) * (a+b+c)` → build one shared `+` node for `a+b`; reuse it for BOTH the top `*` and the second `+` (which computes `a+b+c`) — this proves `a+b` is only computed ONCE.\n\n**✍️ MINIMUM FULL-MARK ANSWER:** the algorithm (3 steps) + the DAG diagram showing which node(s) got reused/shared, clearly labelled.\n\n**Common mistakes:** Drawing a DAG that looks exactly like a tree (i.e., forgetting to actually merge the repeated subexpression) — that defeats the purpose of the question.\n\n---", "understandGuMd": "DAG (Directed Acyclic Graph) નો ઉપયોગ કોઈ expression અથવા basic block ના structure ને represent કરવા માટે થાય છે, અને એ સાદા syntax tree કરતાં વધારે compact હોય છે, કારણ કે જે sub-expression એક કરતાં વધારે વાર compute થતું હોય એને DAG બે વાર દોરવાને બદલે એક જ shared node માં ભેગું કરી દે છે.\n\n**DAG બનાવવાનું algorithm** (statements `x:=y op z`, `x:=op y`, અથવા `x:=y` ધારીને):\n1. જો y (કે z) નું node પહેલેથી ના હોય, તો એના માટે leaf node બનાવો.\n2. Statement `x := y op z` માટે, ચેક કરો કે `op` label વાળું કોઈ node પહેલેથી છે જેના left child node(y) અને right child node(z) હોય; જો એવું node પહેલેથી હોય તો નવું ના બનાવો, જૂનું જ reuse કરો — આ જ common subexpression ને ઓળખવાની રીત છે. જો ના હોય તો નવું node બનાવો.\n3. Step 2 માં જે node મળ્યું કે બનાવ્યું, એના ઉપર label x લગાવો, અને x ને જ્યાં પહેલા attach હતું ત્યાંથી હટાવી લો; સાદા copy statement `x:=y` માટે નવું node જ ના બનાવો — ફક્ત node(y) ઉપર x attach કરી દો.\n\nExample લઈએ: `(a + b) * (a + b + c)`.\n\n**Step 1:** a, b, c માટે leaf nodes બનાવો.\n\n**Step 2:** `a + b` માટે એક `+` node બનાવો જેના children a અને b છે.\n\n**Step 3:** `a + b + c` એટલે `(a+b) + c`; અહીં `a+b` નું `+` node તો Step 2 માં જ બની ગયું છે, એટલે એને જ reuse કરી લો નવા `+` node ના left child તરીકે, જેનું right child c છે.\n\n**Step 4:** છેલ્લે `*` માટે, left operand `(a+b)` એ Step 2 વાળું જ node છે એટલે ફરી reuse થાય; right operand Step 3 વાળું `+` node છે (`a+b+c` માટે). Top `*` node ના children આ બે node બને છે.\n\n**Final answer:** DAG માં `a+b` માટે એક જ shared `+` node છે, જે બે વાર વપરાય છે — એક વાર સીધું top-level `*` નું input તરીકે, અને એક વાર `a+b+c` compute કરતા બીજા `+` node ના left child તરીકે. આનાથી ચોખ્ખું દેખાય કે `a+b` ફક્ત **એક જ વાર** compute થાય છે, બે વાર નહીં — અને આ જ DAG નો સાદા tree કરતાં ફાયદો છે.\n\nCommon mistake: `a+b` માટે બે અલગ `+` node દોરી નાખવા (દરેક જગ્યાએ એક-એક) — આમ કરવાથી DAG પાછું સાદું tree બની જાય અને આખા question નો point જ ખતમ થઈ જાય.\n\nDiagram સમજી લો: top ઉપર `*` node, એના બે children — એક `+` node (a, b) અને બીજું `+` node (એ જ પહેલા `+` node, અને c). પહેલા `+` node ઉપર બે arrows આવવા જોઈએ — એક top `*` તરફથી, અને એક બીજા `+` node તરફથી — જેથી ખબર પડે કે એ node shared છે.", "finalVersionGuMd": "DAG કોઈ expression ને compact રીતે represent કરે છે, જેમાં એક કરતાં વધારે વાર compute થતા sub-expression ને, સાદા syntax tree ની જેમ duplicate કરવાને બદલે, એક જ shared node માં ભેગું કરવામાં આવે છે. એ બનાવવા માટે undefined operands માટે leaf nodes બનાવવામાં આવે છે, અને દરેક operation માટે, જો same operator અને same children વાળું node પહેલેથી હોય તો એને reuse કરવામાં આવે છે, નહીં તો નવું node બનાવવામાં આવે છે.\n\n`(a+b) * (a+b+c)` માટે, પહેલા `a+b` sub-expression માટે a અને b children વાળું `+` node બનાવીએ છીએ. `a+b` એ `a+b+c` ની અંદર પણ આવે છે, એટલે આ જ `+` node ને એક નવા `+` node ના left child તરીકે reuse કરીએ છીએ, જેનું right child c છે, જે `a+b+c` ને represent કરે છે. છેલ્લે, top-level `*` node પોતાના left child તરીકે original `a+b` node લે છે અને right child તરીકે `a+b+c` node લે છે. આ DAG માં `a+b` માટે ફક્ત એક જ node છે, જે top ના multiplication અને બીજા addition વચ્ચે shared છે, જે સાચી રીતે બતાવે છે કે `a+b` બે વારને બદલે ફક્ત એક જ વાર compute થાય છે."}], "high": [{"id": "u4-high-1", "globalIndex": 26, "unit": 4, "priority": "High", "question": "Explain Synthesized and Inherited Attributes with a Syntax Directed Definition (SDD) example, and show the annotated parse tree.", "questionShort": "Synthesized and Inherited Attributes — SDD with annotated parse tree (e.g. desk calculator `3*5+4`)", "marks": "8", "marksNote": "", "repeated": "Assignment-2 Q10, CD_2 Q6(b) — 2 sources, but the PPT gives this a full 6-slide worked example.", "years": "", "inPPT": "", "type": "Algorithm + Diagram (Numerical).", "typeTags": ["Numerical", "Diagram", "Algorithm"], "answerMd": "A Syntax Directed Definition (SDD) is a context-free grammar in which every grammar symbol is associated with a set of attributes, and every production is associated with semantic rules that describe how to compute those attributes. The two kinds of attributes are Synthesized and Inherited.\n\nA **synthesized attribute** at a node is computed using the attribute values of that node's own children, so information flows upward from the leaves toward the root of the parse tree. An SDD that uses only synthesized attributes is called an **S-attributed definition**.\n\nAn **inherited attribute** at a node is computed using the attribute values of that node's parent and/or its siblings, so information flows downward from the root, or sideways between siblings.\n\n**Comparison Table:**\n\n| Basis | Synthesized Attribute | Inherited Attribute |\n|---|---|---|\n| Direction of flow | Computed from the children, flowing bottom to top. | Computed from the parent or siblings, flowing top to bottom or left to right. |\n| Where used | Used in both S-attributed and L-attributed definitions. | Used only in L-attributed definitions. |\n\n**Worked example — a simple desk calculator, computing the value of `3*5+4`:**\n\n| Production | Semantic Rule |\n|---|---|\n| L → E n | print(E.val) |\n| E → E1 + T | E.val = E1.val + T.val |\n| E → T | E.val = T.val |\n| T → T1 * F | T.val = T1.val * F.val |\n| T → F | T.val = F.val |\n| F → digit | F.val = digit.lexval |\n\nAll the attributes here (`val`) are synthesized, since each rule computes a node's value purely from its children's values.\n\n**Building the annotated parse tree for `3*5+4`:** at the leaves, digit.lexval gives 3, 5, and 4 respectively. Moving up: F.val=3, then T.val=3 (from T→F); F.val=5, and combining with the previous T using T→T1*F gives T.val = 3*5 = 15. Separately, F.val=4 gives T.val=4. Then E.val = T.val = 15 (from E→T), and finally combining with the last T using E→E1+T gives E.val = 15+4 = **19**. This final value is printed at the root L.\n\n**Final Answer:** the value of the expression `3*5+4` is **19**, and the annotated parse tree shows this value being built up correctly at each node from its children.\n\n**Common mistakes:** Forgetting that multiplication must be combined before addition, according to how the grammar itself is structured (T handles `*`, E handles `+`), rather than simply computing left to right.", "diagramMd": "Draw the parse tree for `3*5+4n` and write the computed `.val` value next to every node, ending with `E.val=19` just below the root L.", "mustWrite": ["Correct definitions of Synthesized and Inherited attributes, with the direction of information flow clearly stated.", "The comparison table.", "The full semantic-rule table for the desk-calculator grammar.", "The annotated parse tree showing the value computed at every single node, ending with the correct final answer."], "keywords": ["Synthesized attribute", "Inherited attribute", "S-attributed", "L-attributed", "annotated parse tree", "semantic rule"], "finalVersionMd": "A synthesized attribute is computed from the attribute values of a node's children, so information flows bottom to top in the parse tree; an SDD using only synthesized attributes is called S-attributed. An inherited attribute is computed from the attribute values of a node's parent or siblings, so information flows top to bottom or sideways; this is used only in L-attributed definitions.\n\nFor the desk-calculator grammar `L→En, E→E1+T, E→T, T→T1*F, T→F, F→digit`, with semantic rules E.val=E1.val+T.val, T.val=T1.val*F.val, T.val=F.val, and F.val=digit.lexval, all attributes are synthesized. For the input `3*5+4`, the leaves give digit.lexval values 3, 5, 4; going upward, F.val=3 and T.val=3, then combining with F.val=5 through T→T1*F gives T.val=3*5=15; separately F.val=4 gives T.val=4; then E.val=15 through E→T, and combining with the last T through E→E1+T gives the final E.val = 15+4 = **19**, which is printed at the root.\n\n---", "quickRefMd": "**⭐ Definitions:**\n- **Synthesized attribute:** value computed from the CHILDREN's attributes (flows bottom → top).\n- **Inherited attribute:** value computed from the PARENT's or SIBLING's attributes (flows top → bottom, or left sibling → right sibling).\n\n**Comparison table:**\n| Synthesized | Inherited |\n|---|---|\n| From children, bottom to top | From parent/siblings, top to bottom |\n| Used in both S-attributed and L-attributed SDT | Used only in L-attributed SDT |\n\n**Worked example — Desk Calculator grammar:**\n| Production | Semantic Rule |\n|---|---|\n| L → E n | print(E.val) |\n| E → E1 + T | E.val = E1.val + T.val |\n| E → T | E.val = T.val |\n| T → T1 * F | T.val = T1.val * F.val |\n| T → F | T.val = F.val |\n| F → digit | F.val = digit.lexval |\n\nFor input `3*5+4`: F.val=3→T.val=3; F.val=5→T.val=3*5=15; F.val=4→T.val=4; E.val=15+4=**19** → printed.\n\n**✍️ MINIMUM FULL-MARK ANSWER:** the semantic-rule table + the annotated parse tree with values written at every node, ending in the final printed value.\n\n---", "understandGuMd": "Syntax Directed Definition (SDD) એટલે એક context-free grammar, જેમાં દરેક grammar symbol ને કેટલાક attributes આપેલા હોય છે, અને દરેક production સાથે semantic rules હોય છે જે કહે છે કે એ attributes કેવી રીતે compute કરવા. Attributes બે પ્રકારના હોય છે — Synthesized અને Inherited.\n\n**Synthesized attribute** કોઈ node ના પોતાના children ના attribute values માંથી compute થાય છે, એટલે information leaves માંથી root તરફ, નીચેથી ઉપર (bottom-up) જાય છે. જે SDD માં ફક્ત synthesized attributes જ વપરાય એને **S-attributed definition** કહે છે.\n\n**Inherited attribute** કોઈ node ના parent અથવા siblings ના attribute values માંથી compute થાય છે, એટલે information root માંથી નીચે તરફ, અથવા sideways (siblings વચ્ચે) જાય છે.\n\n**Comparison Table:**\n\n| Basis | Synthesized Attribute | Inherited Attribute |\n|---|---|---|\n| Direction of flow | Computed from the children, flowing bottom to top. | Computed from the parent or siblings, flowing top to bottom or left to right. |\n| Where used | Used in both S-attributed and L-attributed definitions. | Used only in L-attributed definitions. |\n\n**Example:** સાદું desk calculator લઈએ, જે `3*5+4` ની કિંમત કાઢે છે. Grammar અને rules આ પ્રમાણે:\n\n| Production | Semantic Rule |\n|---|---|\n| L → E n | print(E.val) |\n| E → E1 + T | E.val = E1.val + T.val |\n| E → T | E.val = T.val |\n| T → T1 * F | T.val = T1.val * F.val |\n| T → F | T.val = F.val |\n| F → digit | F.val = digit.lexval |\n\nઅહીં બધા attributes (`val`) synthesized જ છે, કારણ કે દરેક rule node ની value ફક્ત એના children ની values માંથી જ compute કરે છે.\n\n**Annotated parse tree બનાવવું:** leaves ઉપર digit.lexval આપે 3, 5, 4. ઉપર જતાં: F.val=3, પછી T→F થી T.val=3; F.val=5, અને પહેલાના T સાથે T→T1*F વાપરીને T.val = 3*5 = 15 મળે. અલગથી F.val=4 થી T.val=4 મળે. પછી E→T થી E.val = T.val = 15, અને છેલ્લે E→E1+T વાપરીને E.val = 15+4 = **19** મળે. આ final value root L ઉપર print થાય છે.\n\n**Final answer:** `3*5+4` ની કિંમત **19** છે, અને annotated parse tree બતાવે છે કે આ value દરેક node ઉપર એના children માંથી બરાબર બિલ્ડ થાય છે.\n\nCommon mistake: Grammar structure પ્રમાણે ના જોતાં સીધું ડાબેથી જમણે calculate કરી નાખવું — ના, multiplication (T handle કરે છે) પહેલા combine થવું જોઈએ, addition (E handle કરે છે) પછી, ડાબે-જમણે order પ્રમાણે નહીં.", "finalVersionGuMd": "Synthesized attribute એ node ના children ના attribute values માંથી compute થાય છે, એટલે parse tree માં information નીચેથી ઉપર (bottom to top) જાય છે; ફક્ત synthesized attributes વાપરતી SDD ને S-attributed કહેવાય છે. Inherited attribute એ node ના parent અથવા siblings ના attribute values માંથી compute થાય છે, એટલે information ઉપરથી નીચે અથવા sideways જાય છે; આ ફક્ત L-attributed definitions માં જ વપરાય છે.\n\nDesk-calculator grammar `L→En, E→E1+T, E→T, T→T1*F, T→F, F→digit` માટે, semantic rules E.val=E1.val+T.val, T.val=T1.val*F.val, T.val=F.val, અને F.val=digit.lexval છે, અને બધા attributes synthesized છે. Input `3*5+4` માટે, leaves digit.lexval ની values 3, 5, 4 આપે છે; ઉપર જતાં, F.val=3 અને T.val=3, પછી F.val=5 સાથે T→T1*F વાપરીને T.val=3*5=15 મળે; અલગથી F.val=4 થી T.val=4 મળે; પછી E→T થી E.val=15, અને છેલ્લા T સાથે E→E1+T વાપરીને final E.val = 15+4 = **19** મળે, જે root ઉપર print થાય છે."}, {"id": "u4-high-2", "globalIndex": 27, "unit": 4, "priority": "High", "question": "Differentiate between Static and Dynamic Memory Allocation.", "questionShort": "Static vs Dynamic Memory Allocation", "marks": "4–6", "marksNote": "", "repeated": "CD_1 Q1(A), CD_2 Q4-OR(b), CD_3 Q6-OR(c) — 3 sources.", "years": "", "inPPT": "", "type": "Theory (Comparison table).", "typeTags": ["Theory"], "answerMd": "Memory for variables and data structures used by a program can be allocated in two different ways, depending on when the memory is actually assigned.\n\n**Static memory allocation** means that the memory required by a variable is decided and reserved before the program starts running, at compile time itself, and this memory stays reserved for the entire lifetime of the program.\n\n**Dynamic memory allocation** means that memory is reserved only while the program is actually running, at the exact moment it is needed, and it can be released again once it is no longer required.\n\n**Comparison Table:**\n\n| Basis | Static Allocation | Dynamic Allocation |\n|---|---|---|\n| Time of allocation | Memory is allocated before the program starts executing. | Memory is allocated while the program is executing. |\n| Speed | Execution is generally faster, since no allocation decisions are needed at run time. | Execution is generally slower, due to allocation/deallocation happening during the run. |\n| Access | Variables can often be accessed directly, without needing a pointer. | Variables usually need to be accessed through a pointer. |\n| Duration | The allocated memory remains reserved for the entire run of the program. | Memory is reserved only while that particular part of the program is active. |\n| Memory usage | Can use more memory overall, since space is reserved upfront whether or not it is needed. | Generally uses memory more efficiently, since space is reserved only when actually needed. |", "diagramMd": "", "mustWrite": ["Correct one-line definition of both static and dynamic allocation.", "At least 4 rows of the comparison table, in complete sentences."], "keywords": ["Static allocation", "dynamic allocation", "compile time", "run time", "pointer"], "finalVersionMd": "Static memory allocation reserves memory for a variable before the program starts running, at compile time, and this memory remains reserved for the program's entire execution. Dynamic memory allocation reserves memory only while the program is running, exactly when it is needed, and this memory can be released once it is no longer required.\n\n| Basis | Static Allocation | Dynamic Allocation |\n|---|---|---|\n| Time of allocation | Before execution begins | During execution |\n| Speed | Faster execution | Slower execution |\n| Access | Direct, no pointer needed | Usually needs a pointer |\n| Duration | Reserved for the whole program run | Reserved only while active |\n| Memory usage | More memory used upfront | More efficient use of memory |\n\n---", "quickRefMd": "| Static | Dynamic |\n|---|---|\n| Memory allocated BEFORE execution starts | Memory allocated DURING execution |\n| Faster execution | Slower execution |\n| No pointer needed to access variable | Needs a pointer to access |\n| Variable stays allocated permanently | Allocated only while the unit is active |\n| More memory used upfront | Less memory (only what's needed, when needed) |\n\n**✍️ MINIMUM FULL-MARK ANSWER:** just this table, 4–5 rows depending on marks.\n\n---", "understandGuMd": "Program ના variables અને data structures માટે memory allocate કરવાની બે રીત છે, અને ફરક એ છે કે memory ક્યારે assign થાય છે.\n\n**Static memory allocation** માં, કોઈ variable ને કેટલી memory જોઈએ એ program run થાય એ પહેલા જ, compile time એ જ નક્કી અને reserve થઈ જાય છે, અને એ memory આખા program ના જીવનકાળ દરમિયાન reserved જ રહે છે.\n\n**Dynamic memory allocation** માં, memory program actually run થતું હોય ત્યારે જ, જ્યારે ખરેખર જરૂર પડે એ જ ક્ષણે reserve થાય છે, અને જરૂર ના રહે ત્યારે એને પાછી release પણ કરી શકાય છે.\n\n**Comparison Table સમજી લો:**\n- Time of allocation: Static — execution પહેલા; Dynamic — execution દરમિયાન.\n- Speed: Static ઝડપી (run time માં કંઈ decide નથી કરવું પડતું); Dynamic ધીમું (allocate/deallocate run time માં થાય).\n- Access: Static માં variable ને સીધું access કરી શકાય, pointer ની જરૂર નહીં; Dynamic માં સામાન્ય રીતે pointer થી જ access કરવું પડે.\n- Duration: Static memory આખા program run દરમિયાન reserved રહે; Dynamic memory ફક્ત જ્યાં સુધી એ part active હોય ત્યાં સુધી જ.\n- Memory usage: Static વધારે memory વાપરી શકે (જરૂર હોય કે ના હોય, પહેલેથી reserve થાય); Dynamic વધારે efficient રીતે memory વાપરે (જરૂર પડે ત્યારે જ reserve થાય).", "finalVersionGuMd": "Static memory allocation માં, program run થવાનું શરૂ થાય એ પહેલા, compile time એ જ variable માટે memory reserve થઈ જાય છે, અને એ memory program ના આખા execution દરમિયાન reserved રહે છે. Dynamic memory allocation માં, memory ફક્ત program run થતું હોય ત્યારે, બરાબર જ્યારે જરૂર પડે ત્યારે reserve થાય છે, અને જરૂર ના રહે પછી એને release કરી શકાય છે.\n\n| Basis | Static Allocation | Dynamic Allocation |\n|---|---|---|\n| Time of allocation | Before execution begins | During execution |\n| Speed | Faster execution | Slower execution |\n| Access | Direct, no pointer needed | Usually needs a pointer |\n| Duration | Reserved for the whole program run | Reserved only while active |\n| Memory usage | More memory used upfront | More efficient use of memory |"}, {"id": "u4-high-3", "globalIndex": 28, "unit": 4, "priority": "High", "question": "Explain Postfix Notation with a suitable example.", "questionShort": "Postfix Notation and Syntax Tree/DAG representation", "marks": "4", "marksNote": "", "repeated": "", "years": "", "inPPT": "Yes, always taught alongside TAC.", "type": "Theory + short example.", "typeTags": ["Theory"], "answerMd": "Postfix notation is a way of writing an expression in which every operator appears immediately after all of its operands, instead of between them as in normal (infix) notation. Postfix notation is very useful as an intermediate representation because it does not need any parentheses to show the order of operations, and it can be evaluated easily using a simple stack.\n\n**Example:** the infix expression `a + b * c` is written in postfix notation by first converting the higher-precedence part: `b*c` becomes `bc*`, and then combining with the addition: `a+(bc*)` becomes **`abc*+`**.\n\nFor a more complex expression, `a := b * -c + b * -c` becomes, in postfix notation: **`a b c uminus * b c uminus * + =`**.", "diagramMd": "", "mustWrite": ["Correct definition: operator comes right after its operands.", "Correct conversion example, shown step by step (not just the final answer)."], "keywords": ["Postfix notation", "infix notation", "operator", "operand"], "finalVersionMd": "Postfix notation writes an expression so that every operator appears immediately after its operands, rather than between them, which removes the need for parentheses and allows easy evaluation using a stack. For example, the infix expression `a+b*c` is converted by first writing the higher-precedence multiplication as `bc*`, and then placing the addition after both its operands to get the postfix form `abc*+`.\n\n---", "quickRefMd": "**⭐ Definition:** Postfix is a \"flattened\" form where an operator comes right after its operands (no parentheses needed).\n\n**Worked example:** `a + b * c` → postfix: `a b c * +`. `a := b * -c + b * -c` → postfix: `a b c uminus * b c uminus * + =`.\n\n**✍️ MINIMUM FULL-MARK ANSWER:** the definition + converting one given expression to postfix, step by step.", "understandGuMd": "Postfix notation એટલે expression લખવાની એવી રીત જેમાં દરેક operator પોતાના operands ની બરાબર પછી (after) આવે છે, normal infix notation ની જેમ વચ્ચે નહીં. Postfix notation intermediate representation તરીકે બહુ ઉપયોગી છે કારણ કે operations નો order બતાવવા parentheses ની જરૂર જ નથી પડતી, અને એને સાદા stack વાપરીને સહેલાઈથી evaluate પણ કરી શકાય છે.\n\n**Example:** infix expression `a + b * c` ને postfix માં લખવા માટે પહેલા higher-precedence ભાગ convert કરો: `b*c` બને `bc*`, પછી addition સાથે ભેગું કરો: `a+(bc*)` બને **`abc*+`**.\n\nથોડું complex expression લઈએ, `a := b * -c + b * -c` postfix notation માં બને: **`a b c uminus * b c uminus * + =`**.", "finalVersionGuMd": "Postfix notation માં expression એવી રીતે લખાય છે કે દરેક operator પોતાના operands ની બરાબર પછી આવે, વચ્ચે નહીં, જેનાથી parentheses ની જરૂર નથી રહેતી અને stack વાપરીને સહેલાઈથી evaluate કરી શકાય છે. ઉદાહરણ તરીકે, infix expression `a+b*c` ને convert કરવા માટે પહેલા higher-precedence multiplication ને `bc*` તરીકે લખો, અને પછી addition ને બંને operands પછી મૂકીને postfix form `abc*+` મેળવો."}], "mediumMd": "(short prep points only)\n\n- **Activation Tree:** shows how procedure calls nest during execution — root = main program; a node is a child of another if control flowed from parent to child during execution.\n- **Control Stack:** tracks currently LIVE (active) procedure calls — push when a call starts, pop when it ends; if you are at node n, the stack holds the path from n up to the root.\n- **Scope and Binding of Names:** Scope = the part of the program where a declaration applies. Binding = connecting a name to a storage location (\"environment\" maps name→storage, \"state\" maps storage→value).\n- **Role of Intermediate Code Generator (diagram):** Parser → Static Checker → Intermediate Code Generator → Code Generator. Benefits: easy retargeting (new machine = new back end only), machine-independent optimization possible.", "lowMd": "(question only)\n\n- What is the role of the Dependency Graph in SDT?\n- Explain the two intermediate forms: Abstract Syntax Tree vs Postfix Notation.\n- Explain \"Symbol Table\" fields/organisation briefly (name, type, scope, address).", "guRevisionBullets": ["TAC માં દરેક statement `x:=y op z` ફોર્મમાં હોય, એક line માં વધુમાં વધુ 1 operator આવે.", "Quadruple = 4 fields (Op,Arg1,Arg2,Result). Triple = 3 fields, position number થી બીજા triples ને refer કરે. Indirect Triple = Triple + અલગ pointer list.", "Activation Record ના 7 fields (ઉપરથી નીચે): Return value, Actual parameters, Control link, Access link, Saved machine status, Local variables, Temporaries.", "Parameter Passing ની 4 methods: Value (copy જાય, original એવું જ રહે), Reference (address જાય, original બદલાય), Copy-Restore (copy અંદર જાય, પાછું copy બહાર આવે), Name (macro જેવું text substitution).", "Synthesized attribute એટલે children માંથી આવે (bottom-up); Inherited attribute એટલે parent/sibling માંથી આવે (top-down).", "DAG એટલે tree જ, પણ repeat થતા subexpressions ને ભેગા કરી ONE shared node બનાવે."], "enRevisionBullets": ["TAC: `x:=y op z`, max 1 operator per line.", "Quadruple = 4 fields (Op,Arg1,Arg2,Result). Triple = 3 fields, refers to OTHER triples by position number. Indirect Triple = Triple + a separate pointer list.", "Activation Record 7 fields (top to bottom): Return value, Actual parameters, Control link, Access link, Saved machine status, Local variables, Temporaries.", "4 Parameter Passing methods: Value (copy, original unchanged), Reference (address, original changes), Copy-Restore (copy in, copy back out), Name (macro-style text substitution).", "Synthesized attribute = from children (bottom-up); Inherited attribute = from parent/sibling (top-down).", "DAG = tree but merges repeated subexpressions into ONE shared node."]}, {"number": 5, "title": "UNIT 5 — Code Optimization & Code Generation", "intro": "**What this unit is about (simple words):** Making the intermediate code faster/smaller (optimization), then turning it into real machine code (code generation).", "veryHigh": [{"id": "u5-vh-1", "globalIndex": 29, "unit": 5, "priority": "Very High", "question": "Explain Peephole Optimization with its types, giving an example for each.", "questionShort": "Explain Peephole Optimization with its types and examples", "marks": "6–8", "marksNote": "", "repeated": "PAC Q9, CD_1 Q4(B)-OR, CD_2 Q3(c), CD_3 Q5(a), CD.pdf Q5(A) & Q5(A)-OR — **6 occurrences, one of the most repeated theory questions overall.**", "years": "", "inPPT": "Yes, heaviest topic in the unit (7 slides, 6 mini-examples).", "type": "Theory (with examples).", "typeTags": ["Theory"], "answerMd": "Peephole optimization is a simple and effective optimization technique that is applied directly to the target code, by examining only a small moving \"window\", or peephole, of a few instructions at a time, and replacing that short sequence with a shorter or faster equivalent sequence whenever possible. Because it works on the final target code, it is a machine-dependent optimization technique, and its main goals are to improve execution performance and to reduce the size of the generated code.\n\n**1. Redundant Instruction Elimination.** If an instruction stores a value and the very next instruction loads that same value back from the same place, the second instruction is unnecessary and can be removed. For example, `MOV R0,x` followed by `MOV x,R0` — the second line simply undoes nothing new and can be deleted.\n\n**2. Flow-of-Control Optimization.** Unnecessary jumps to other jumps can be shortened by making the first jump point directly to the final target. For example, `goto L1 ... L1: goto L2` can be rewritten directly as `goto L2`, skipping the redundant intermediate jump, provided there is no other jump into L1.\n\n**3. Removing Unreachable Code.** Any code that can never actually be executed, for example because it lies inside a condition that is always false, can be safely deleted. For example, if `debug` is defined as `0`, the code inside `if(debug) { print debugging information }` can never run and can be removed entirely.\n\n**4. Algebraic Simplification.** Statements that perform an operation with no real effect can be simplified or removed, such as `x = x + 0` or `x = x * 1`, both of which can simply be deleted since they do not change the value of x.\n\n**5. Reduction in Strength.** An expensive machine operation can sometimes be replaced by a cheaper one that produces the same result; for example, computing `x*x` is usually cheaper than calling a general exponentiation function to compute `x²`.\n\n**6. Use of Machine Idioms.** Many target machines provide special, efficient instructions for common operations, such as auto-increment or auto-decrement addressing modes; a statement like `i = i + 1` can be directly replaced by a single such machine instruction instead of a general add-and-store sequence.\n\n**Final summary:** peephole optimization improves code quality with very little compilation cost, by looking for these small, local, easily-detectable patterns in the target code.", "diagramMd": "", "mustWrite": ["Correct definition: examines a small window of instructions and replaces it with a shorter/faster equivalent.", "All 6 types named, each with its own one-line explanation and a small example.", "Mention it is a machine-dependent, local optimization technique."], "keywords": ["Peephole optimization", "redundant instruction", "flow-of-control", "unreachable code", "algebraic simplification", "strength reduction", "machine idioms"], "finalVersionMd": "Peephole optimization is a machine-dependent optimization technique that examines a small window of target-code instructions at a time and replaces them with a shorter or faster equivalent, aiming to improve execution speed and reduce code size. Its main types are: Redundant Instruction Elimination, which removes an instruction that undoes the effect of the one before it, such as `MOV R0,x` followed by `MOV x,R0`; Flow-of-Control Optimization, which shortens a jump to another jump, such as replacing `goto L1 ... L1: goto L2` directly with `goto L2`; Removing Unreachable Code, which deletes code that can never execute, such as a debug block guarded by a condition that is always false; Algebraic Simplification, which removes statements like `x=x+0` or `x=x*1` that have no real effect; Reduction in Strength, which replaces an expensive operation with a cheaper equivalent, such as computing `x*x` instead of using a power function; and Use of Machine Idioms, which replaces a general instruction sequence with a single efficient machine instruction, such as using an auto-increment instruction for `i=i+1`.\n\n---", "quickRefMd": "**⭐ Definition:** A machine-dependent, local optimization technique that looks at a small \"peephole\" (a few instructions at a time) in the target code and replaces them with a shorter/faster equivalent.\n\n**Must-write points (types, each with a 1-line example):**\n1. **Redundant instruction elimination** — `MOV R0,x` then `MOV x,R0` → the 2nd line is useless, delete it.\n2. **Flow-of-control optimization** — `goto L1 ... L1: goto L2` → change directly to `goto L2` (skip the middle jump).\n3. **Removing unreachable code** — code after `#define debug 0 ... if(debug){...}` can never run → delete it.\n4. **Algebraic simplification** — `x = x + 0` or `x = x * 1` → delete these statements.\n5. **Reduction in strength** — replace an expensive operation with a cheaper one, e.g. `x*x` instead of using `x²`(power function).\n6. **Use of machine idioms** — replace `i = i + 1` with a single auto-increment machine instruction, if the target machine has one.\n\n**✍️ MINIMUM FULL-MARK ANSWER:** the definition + list all 6 types, each with its 1-line example (as above).\n\n**Common mistakes:** Giving only the definition without any of the 6 types — the types WITH examples are where most marks are.\n\n---", "understandGuMd": "ભાઈ, Peephole optimization ને સમજવા માટે વિચારો કે તમે ટ્રેનની બારીમાંથી (peephole = નાનું કાણું) બહાર જુઓ છો — એક વખતે થોડું જ દેખાય, આખું નહીં. એવી જ રીતે compiler પણ final target code માં એક સાથે થોડાં જ (3-4) instructions નું નાનું window જુએ છે, અને એ window માં કંઈ waste કે nonsense હોય તો એને ટૂંકા અથવા ઝડપી equivalent code થી replace કરી નાખે છે. આ machine-dependent optimization technique છે, કારણ કે એ સીધું final generated target code પર જ કામ કરે છે, source code પર નહીં, અને એનો હેતુ execution speed વધારવો ને code size ઘટાડવો છે.\n\nહવે એના 6 types સમજીએ, દરેકને ટૂંકા example સાથે:\n\n1. **Redundant Instruction Elimination** — ધારો કે તમે કોઈને પૈસા આપ્યા ને પાછા એ જ પૈસા તમારી પાસેથી પાછા લઈ લીધા — કંઈ ફાયદો ના થયો. Code માં પણ એવું જ — `MOV R0,x` પછી તરત `MOV x,R0` હોય તો બીજી line નકામી છે, delete કરી શકાય.\n\n2. **Flow-of-Control Optimization** — ધારો L1 પર જવાનું કહ્યું ને L1 પર પહોંચીને ખબર પડે કે ત્યાંથી પણ L2 પર જ જવાનું છે — તો શું કામ વચ્ચે રોકાવું? સીધું જ L2 પર મોકલી દયો. `goto L1 ... L1: goto L2` ને directly `goto L2` બનાવી શકાય (જો L1 માં બીજેથી કોઈ jump ના આવતું હોય તો).\n\n3. **Removing Unreachable Code** — જે code ક્યારેય execute જ નહીં થાય (દા.ત. `if(debug)` જ્યાં debug=0 fixed છે) એ code ને delete કરી નાખો, કારણ કે એ કદી run જ નહીં થાય.\n\n4. **Algebraic Simplification** — `x = x + 0` કે `x = x * 1` લખો કે ના લખો, result same જ રહેશે, તો આવા useless statements ને હટાવી દયો.\n\n5. **Reduction in Strength** — `x*x` કરવું, general power function call કરવા કરતાં cheaper પડે, એટલે expensive operation ને cheaper operation થી replace કરો.\n\n6. **Use of Machine Idioms** — ઘણી machines પાસે ready-made special instructions હોય છે, જેમ કે auto-increment/auto-decrement addressing modes. `i = i + 1` માટે general add-and-store ની જગ્યાએ સીધું એક જ auto-increment જેવું machine instruction વાપરી શકાય.\n\nટૂંકમાં — peephole optimization બહુ ઓછા compilation cost માં code ને better બનાવે છે, કારણ કે એ target code માં નાના, local, સહેલાઈથી પકડાય એવા patterns જ શોધે છે.", "finalVersionGuMd": "Peephole optimization એ એક machine-dependent optimization technique છે, જે target-code ના instructions ને એક સમયે નાના window માં તપાસે છે અને એને ટૂંકા અથવા ઝડપી equivalent instructions થી replace કરે છે, જેનો હેતુ execution speed વધારવો અને code size ઘટાડવો છે. એના મુખ્ય types આ પ્રમાણે છે: Redundant Instruction Elimination, જેમાં અગાઉના instruction ની અસરને undo કરતું instruction દૂર કરવામાં આવે છે, જેમ કે `MOV R0,x` પછી `MOV x,R0`; Flow-of-Control Optimization, જેમાં એક jump બીજા jump તરફ જતું હોય તો એને ટૂંકું કરવામાં આવે છે, જેમ કે `goto L1 ... L1: goto L2` ને સીધું `goto L2` બનાવવું; Removing Unreachable Code, જેમાં ક્યારેય execute ન થાય એવો code delete કરવામાં આવે છે, જેમ કે હંમેશા false રહેતી condition વાળો debug block; Algebraic Simplification, જેમાં `x=x+0` કે `x=x*1` જેવા કોઈ real effect ન ધરાવતા statements હટાવવામાં આવે છે; Reduction in Strength, જેમાં costly operation ને cheaper equivalent થી replace કરવામાં આવે છે, જેમ કે power function ની જગ્યાએ `x*x` વાપરવું; અને Use of Machine Idioms, જેમાં general instruction sequence ની જગ્યાએ એક જ efficient machine instruction વાપરવામાં આવે છે, જેમ કે `i=i+1` માટે auto-increment instruction વાપરવું."}, {"id": "u5-vh-2", "globalIndex": 30, "unit": 5, "priority": "Very High", "question": "Discuss Code Optimization Techniques with proper examples.", "questionShort": "Explain Code Optimization Techniques with examples (constant folding, CSE, copy propagation, dead code elimination, code motion, strength reduction)", "marks": "6–8", "marksNote": "", "repeated": "Assignment-2 Q7, CD_1 Q3(B) (constant folding/propagation), CD_2 Q5(b), CD_3 Q6(a), CD.pdf Q5(A)-OR — **5 occurrences.**", "years": "", "inPPT": "", "type": "Theory (with examples).", "typeTags": ["Theory", "Diagram"], "answerMd": "Code optimization is the process of transforming the intermediate or target code of a program so that it becomes faster to execute or requires less memory, without changing the actual output the program produces. Optimization techniques are broadly classified as **Machine Dependent**, which rely on the details of the target machine, and **Machine Independent**, which can be applied regardless of the target machine. Machine independent techniques are further divided into **Function Preserving** transformations, which keep the exact meaning of the code, and **Loop Optimization**, which specifically targets code inside loops, since loops are usually executed many times and therefore give the biggest performance benefit when optimized.\n\n**1. Compile Time Evaluation.** This includes two related methods. **Constant Folding** computes a constant expression once, during compilation, instead of recomputing it every time the program runs; for example, `length = (22/7) * d` has its constant part `22/7` calculated once at compile time. **Constant Propagation** replaces a variable with a constant value that is already known to the compiler, and then evaluates the resulting expression; for example, if `pi=3.14` and `r=2`, then `Area = pi*r*r` becomes `Area = 3.14*2*2`, which can then be evaluated immediately.\n\n**2. Common Sub-expression Elimination.** If the exact same expression is computed more than once, and none of its operands have changed in between, the second computation is unnecessary and its earlier result can be reused instead. For example, in `t1=4*i; t2=a[t1]; t3=4*j; t4=4*i; t5=b[t4]+1`, the computation `t4=4*i` is identical to `t1=4*i`, so `t4` can simply be replaced by `t1`, removing one multiplication.\n\n**3. Copy Propagation.** If a variable is simply assigned the value of another variable, later uses of the first variable can be replaced directly by the second, allowing the copy statement itself to eventually be removed. For example, `A = PI; Area = A * r * r` becomes `Area = PI * r * r`.\n\n**4. Dead Code Elimination.** Any statement whose result is never actually used anywhere in the program can be deleted, since removing it does not change the program's output. For example, if `i` is always `0` and never changed, the block `if(i==1){x=x+i;}` can never execute and can be removed entirely.\n\n**5. Code Motion (Loop-Invariant Code Motion).** If a computation inside a loop always produces the same result on every iteration, it can be moved outside the loop and computed only once. For example, `while(i<=limit-2){...}` can be rewritten as `n=limit-2; while(i<=n){...}`, so that `limit-2` is computed only once instead of on every iteration.\n\n**6. Strength Reduction.** An expensive operation inside a loop, such as multiplication, can sometimes be replaced by a cheaper operation, such as repeated addition, that produces the same result. For example, `for(i=1;i<=50;i++){count=i*7;}` can be rewritten using a running total: `temp=7; for(i=1;i<=50;i++){count=temp; temp=temp+7;}`.", "diagramMd": "```\n                Code Optimization\n                 /              \\\n      Machine Dependent      Machine Independent\n                                /            \\\n                    Function Preserving   Loop Optimization\n              (CSE, Constant Folding,      (Code Motion,\n               Constant Propagation,        Strength\n               Dead Code Elimination)        Reduction)\n```", "mustWrite": ["Correct classification diagram: Machine Dependent vs Machine Independent, and Function Preserving vs Loop Optimization.", "At least 4 techniques explained (as required by the marks), each with a full sentence definition and a before/after example.", "Correctly distinguish Constant Folding (computing a fixed expression) from Copy Propagation (replacing a variable with another variable/value it was copied from)."], "keywords": ["Constant Folding", "Constant Propagation", "Common Sub-expression Elimination", "Copy Propagation", "Dead Code Elimination", "Code Motion", "Strength Reduction"], "finalVersionMd": "Code optimization improves the intermediate or target code to make it faster or smaller, without changing what the program computes. It is classified as Machine Dependent or Machine Independent, and machine-independent techniques are further divided into Function Preserving transformations and Loop Optimization.\n\nConstant Folding computes a constant expression once at compile time instead of at run time, such as pre-computing `22/7` in `length=(22/7)*d`. Constant Propagation replaces a variable with its already-known constant value before evaluating an expression, such as replacing `pi` with `3.14` in `Area=pi*r*r`. Common Sub-expression Elimination reuses the result of an expression that has already been computed, instead of computing it again, such as reusing `t1=4*i` instead of recomputing `t4=4*i`. Copy Propagation replaces a variable with the value it was directly copied from, such as replacing `A` with `PI` in `Area=A*r*r` after `A=PI`. Dead Code Elimination removes statements whose results are never used, such as a condition block that can never become true. Code Motion moves a loop-invariant computation, one that never changes across iterations, outside the loop so it is computed only once. Strength Reduction replaces an expensive operation inside a loop, such as multiplication, with a cheaper one, such as repeated addition, that produces the same final result.\n\n---", "quickRefMd": "**📊 DIAGRAM: MUST DRAW (classification)**\n```\n                Code Optimization\n                 /              \\\n      Machine Dependent      Machine Independent\n                                /            \\\n                    Function Preserving   Loop Optimization\n                    (CSE, Compile-time      (Code Motion,\n                     eval, Copy Prop.,       Strength\n                     Dead Code Elim.)         Reduction)\n```\n\n**Must-write points (each technique, 1-line + tiny example):**\n1. **Compile Time Evaluation** — **Folding**: compute a constant expression at compile time, e.g. `length = (22/7)*d` → computed once, not every run. **Constant Propagation**: replace a variable with its known constant value before computing, e.g. `pi=3.14; Area=pi*r*r` → `Area=3.14*r*r`.\n2. **Common Sub-expression Elimination (CSE)** — if the same expression is computed twice with no change in between, reuse the first result. E.g. `t1=4*i; t4=4*i` → reuse t1 instead of recomputing t4.\n3. **Copy Propagation** — `A=PI; Area=A*r*r` → replace A directly with PI: `Area=PI*r*r`.\n4. **Dead Code Elimination** — remove code whose result is NEVER used, e.g. `if(i==1){x=x+i;}` when i is always 0.\n5. **Code Motion (loop-invariant)** — move a computation that doesn't change inside a loop to OUTSIDE the loop. E.g. `while(i<=limit-2){...}` → compute `n=limit-2` once before the loop.\n6. **Strength Reduction** — replace an expensive operator with a cheaper one inside a loop, e.g. replacing `count=i*7` (multiplication) with repeated addition `temp=temp+7`.\n\n**✍️ MINIMUM FULL-MARK ANSWER:** the classification diagram + pick 4 techniques (as marks require) with a 1-line definition + tiny before/after example each.\n\n**Common mistakes:** Confusing Copy Propagation (replacing a variable by another variable/constant it was copied from) with Constant Folding (computing a fixed numeric expression at compile time) — these are different techniques.\n\n---", "understandGuMd": "જુઓ, Code optimization નો સીધો મતલબ છે — program નું output બિલકુલ same રહે, પણ code ઝડપી ચાલે અથવા ઓછી memory વાપરે. હવે આ optimization ને આપણે બે મોટા ભાગમાં વહેંચીએ: **Machine Dependent** (જે particular target machine ની details પર depend કરે) અને **Machine Independent** (જે કોઈ પણ machine પર લાગુ પડે). Machine Independent ને પાછું બે ભાગમાં વહેંચીએ: **Function Preserving** (જે code નો meaning બિલકુલ same રાખે) અને **Loop Optimization** (જે ખાસ loops ની અંદરના code પર focus કરે, કારણ કે loop વારંવાર run થાય એટલે ત્યાં optimization કરવાથી સૌથી વધુ ફાયદો થાય).\n\nહવે 6 techniques એક-એક કરીને સમજીએ, English source માંથી જ example લઈને:\n\n1. **Compile Time Evaluation** — આમાં બે related methods છે. **Constant Folding** એટલે કોઈ constant expression ને program run થાય ત્યારે વારંવાર calculate ના કરવું, પણ compile time એ જ એક વાર calculate કરી લેવું. દા.ત. `length = (22/7) * d` માં `22/7` compile time એ જ calculate થઈ જાય. **Constant Propagation** એટલે જે variable ની value already ખબર છે (compiler ને constant તરીકે ખબર છે), એને directly એ constant value થી replace કરીને expression evaluate કરી નાખવું. દા.ત. `pi=3.14, r=2` હોય તો `Area = pi*r*r` બની જાય `Area = 3.14*2*2`, જે તરત જ evaluate થઈ શકે.\n\n2. **Common Sub-expression Elimination (CSE)** — જો એક જ expression બે વાર calculate થતું હોય, ને વચ્ચે operands બદલાયા ના હોય, તો બીજી વાર ફરી calculate કરવાની જરૂર નથી — પહેલાનું result જ reuse કરી લેવાય. દા.ત. `t1=4*i; t2=a[t1]; t3=4*j; t4=4*i; t5=b[t4]+1` માં `t4=4*i` બિલકુલ `t1=4*i` જેવું જ છે, એટલે `t4` ને `t1` થી replace કરી શકાય, એક multiplication ઓછું થાય.\n\n3. **Copy Propagation** — જો કોઈ variable ને simply બીજા variable ની value assign કરી હોય, તો પછીના uses માં પહેલા variable ની જગ્યાએ સીધું બીજું variable વાપરી શકાય, ને પછી copy statement પોતે હટાવી શકાય. દા.ત. `A = PI; Area = A*r*r` બની જાય `Area = PI*r*r`.\n\n4. **Dead Code Elimination** — જે statement નું result ક્યાંય use જ નથી થતું, એને હટાવી નાખો, output પર કંઈ ફરક નહીં પડે. દા.ત. `i` હંમેશા `0` જ રહે અને ક્યારેય change ના થાય, તો `if(i==1){x=x+i;}` બ્લોક ક્યારેય execute જ નહીં થાય, એટલે એને પુરેપુરો હટાવી શકાય.\n\n5. **Code Motion (Loop-Invariant Code Motion)** — loop ની અંદર જે computation દરેક iteration માં same જ result આપે છે, એને loop ની બહાર કાઢી ને એક જ વાર calculate કરી લેવું. દા.ત. `while(i<=limit-2){...}` ને `n=limit-2; while(i<=n){...}` બનાવી દેવાય, જેથી `limit-2` દર iteration એ ના ગણાય, ફક્ત એક જ વાર ગણાય.\n\n6. **Strength Reduction** — loop ની અંદર costly operation (જેમ કે multiplication) ને cheaper operation (જેમ કે repeated addition) થી replace કરવું, જે same result આપે. દા.ત. `for(i=1;i<=50;i++){count=i*7;}` ને running total વાપરીને `temp=7; for(i=1;i<=50;i++){count=temp; temp=temp+7;}` બનાવી શકાય.\n\nDiagram તરીકે ટોચ પર Code Optimization, એની નીચે Machine Dependent vs Machine Independent, ને Machine Independent ની નીચે Function Preserving (CSE, Constant Folding, Constant Propagation, Dead Code Elimination) અને Loop Optimization (Code Motion, Strength Reduction) — આ classification tree exam માં જરૂર દોરવું.", "finalVersionGuMd": "Code optimization intermediate અથવા target code ને એવી રીતે સુધારે છે કે program ઝડપી ચાલે અથવા ઓછી memory વાપરે, પણ program શું compute કરે છે એ બિલકુલ બદલાતું નથી. એનું classification Machine Dependent અને Machine Independent માં થાય છે, અને Machine Independent techniques ને આગળ Function Preserving transformations અને Loop Optimization માં વહેંચવામાં આવે છે.\n\nConstant Folding compile time પર જ એક constant expression ને calculate કરી લે છે, run time પર નહીં, જેમ કે `length=(22/7)*d` માં `22/7` ને pre-compute કરવું. Constant Propagation કોઈ variable ને એની already-known constant value થી replace કરે છે અને પછી expression evaluate કરે છે, જેમ કે `Area=pi*r*r` માં `pi` ને `3.14` થી replace કરવું. Common Sub-expression Elimination પહેલેથી calculate થયેલા expression ના result ને ફરીથી use કરે છે, ફરી calculate નથી કરતું, જેમ કે `t4=4*i` ફરી ગણવાને બદલે `t1=4*i` ને reuse કરવું. Copy Propagation કોઈ variable ને એ જે variable માંથી directly copy થયું હોય એની value થી replace કરે છે, જેમ કે `A=PI` પછી `Area=A*r*r` માં `A` ને `PI` થી replace કરવું. Dead Code Elimination એવા statements હટાવે છે જેમના results ક્યારેય use જ નથી થતા, જેમ કે એવો condition block જે ક્યારેય true થઈ જ ના શકે. Code Motion loop-invariant computation ને, જે iterations માં ક્યારેય બદલાતું નથી, loop ની બહાર ખસેડે છે જેથી એ ફક્ત એક જ વાર calculate થાય. Strength Reduction loop ની અંદરના costly operation ને, જેમ કે multiplication ને, cheaper operation થી, જેમ કે repeated addition થી replace કરે છે, જે same final result આપે છે."}, {"id": "u5-vh-3", "globalIndex": 31, "unit": 5, "priority": "Very High", "question": "How do you identify Basic Blocks in a program? Explain with an example and draw the Flow Graph.", "questionShort": "Basic Blocks — identify leaders and partition code; draw the Flow Graph", "marks": "6", "marksNote": "", "repeated": "CD_2 Q5-OR(a), CD_3 Q5-OR(c) — 2 sources, but the PPT gives a complete, self-contained worked example (very safe question to prepare).", "years": "", "inPPT": "", "type": "Algorithm (Numerical) + Diagram.", "typeTags": ["Numerical", "Diagram", "Algorithm"], "answerMd": "A **basic block** is a sequence of three-address statements in which control can only enter at the first statement and can only leave after the last statement, with no possibility of a jump into the middle of the block or a jump out of the block except at its very end. Dividing a program's intermediate code into basic blocks is the first step toward building a flow graph and toward doing many kinds of code optimization.\n\n**Algorithm to find the Leaders of a program (a leader marks the start of a new basic block):**\n1. The first statement of the program is always a leader.\n2. Any statement that is the target of a conditional or unconditional goto statement is a leader.\n3. Any statement that comes immediately after a conditional or unconditional goto statement is also a leader.\n\nOnce every leader has been identified, each basic block consists of a leader together with all the statements up to, but not including, the next leader.\n\n**Given:** the three-address code for a factorial function:\n```\n1) f = 1\n2) i = 2\n3) if (i > x) goto 9\n4) t1 = f * i\n5) f = t1\n6) t2 = i + 1\n7) i = t2\n8) goto (3)\n9) goto calling program\n```\n\n**Step 1:** statement 1 is a leader (rule 1, the first statement).\n\n**Step 2:** statement 3 is the target of the goto at statement 8, so it is a leader (rule 2); statement 9 is the target of the goto at statement 3, so it is also a leader (rule 2).\n\n**Step 3:** statement 4 comes immediately after the conditional goto at statement 3, so it is a leader (rule 3).\n\n**Step 4: forming the basic blocks** using these four leaders (1, 3, 4, 9):\n- **B1** = {1, 2} (statement 1 up to, but not including, the next leader 3)\n- **B2** = {3}\n- **B3** = {4, 5, 6, 7, 8}\n- **B4** = {9}\n\n**Final Answer:** the program divides into four basic blocks, B1, B2, B3, and B4, as listed above.\n\n**Step 5: draw the flow graph**, with each basic block as a node, and an edge from Bi to Bj whenever control can pass directly from Bi to Bj: B1 leads into B2; B2 leads into either B3 (if the condition is false) or B4 (if the condition is true); and B3 leads back into B2 because of the `goto(3)` at the end of the block.", "diagramMd": "```\n   B1 (statements 1-2)\n        ↓\n   B2 (statement 3)  ←────────┐\n     ↓         ↓               │\n   B3 (4-8)   B4 (9)          │\n     └─────────────────────────┘\n```", "mustWrite": ["All 3 leader-identification rules stated correctly.", "Correctly apply all 3 rules to the given code and identify every leader.", "Correct grouping of statements into basic blocks.", "The flow graph, with correctly directed edges, including the loop-back edge."], "keywords": ["Basic block", "leader", "flow graph", "control flow", "target of goto"], "finalVersionMd": "A basic block is a sequence of statements where control can only enter at the first statement and leave only after the last statement. To divide code into basic blocks, we first identify leaders using three rules: the first statement is always a leader; any statement that is the target of a goto is a leader; and any statement immediately following a goto is a leader.\n\nFor the factorial code with statements 1 to 9, statement 1 is a leader as the first statement; statement 3 is a leader as the target of the goto at statement 8; statement 9 is a leader as the target
