", "gen", "kill", "Reaching Definition", "Live Variable", "Available Expression"], "finalVersionMd": "Global Data Flow Analysis collects information about how data flows across the whole program, using the equation `Out[S] = gen[S] ∪ (in[S] – kill[S])`, meaning the information leaving a statement is either generated within it or was already present and not destroyed as control passed through.\n\nA definition of a variable reaches a point in the program if there is a path from the definition to that point along which the variable is not redefined; if the variable is redefined somewhere along that path, the earlier definition is said to be killed. For example, in `B1: y=2, B2: y=y+2, B3: x=y+2`, the definition of y in B1 reaches B2, but does not reach B3, because the redefinition of y in B2 kills it first.\n\nA variable is live at a point in the program if there is a path from that point to the end of the program along which its current value is used before being redefined; otherwise it is dead at that point, and its register can be safely reused. An expression is called available at a point if it has already been computed on every path reaching that point and its operands have not changed since.\n\n---", "quickRefMd": "**⭐ Definitions:**\n- **Definition point:** a program point that defines (assigns) a variable.\n- **Reference point:** a point where a variable's value is read.\n- **Available Expression:** an expression is \"available\" at a point if it was already computed earlier and none of its operands changed since.\n- **Reaching Definition:** a definition D \"reaches\" a point P if there is a path from D to P with no other definition of the same variable in between (it gets \"killed\" if redefined).\n- **Live Variable:** a variable is \"live\" at point p if its current value will be used somewhere later before being overwritten; otherwise it is \"dead.\"\n\n**General data-flow equation (must write):** `Out[S] = gen[S] ∪ (in[S] – kill[S])`\n\n**Worked example (Reaching Definitions):**\n```\nB1: D1: y=2\nB2: D2: y=y+2\nB3: D3: x=y+2\n```\nD1 reaches B2, but D1 does NOT reach B3, because D2 (in B2) redefines y first, \"killing\" D1's value before it reaches B3.\n\n**✍️ MINIMUM FULL-MARK ANSWER:** the definitions of Reaching Definition and Live Variable + the `Out=gen∪(in-kill)` formula + the small worked example."}], "mediumMd": "(short prep points only)\n\n- **Choice of Evaluation Order:** the order you compute sub-expressions in can change how many registers you need; picking the best order is NP-complete in general, but reordering independent computations can save registers (example: `a+b-(c+d)*e` needs fewer registers if you compute `(c+d)*e` before `a+b`).\n- **Role of Code Generator (diagram):** Source program → Front end → Intermediate code → Code Optimizer → Intermediate code → Code Generator → Target program. 3 tasks: instruction selection, register allocation/assignment, instruction ordering.\n- **Target code properties wanted:** correctness, high quality, efficient use of resources, fast code generation.", "lowMd": "(question only)\n\n- Approaches to code generator design (main goal: correctness first, then ease of implementation/maintenance).\n- What is Static Single Assignment (SSA) form? (each variable assigned exactly once — mentioned only once in your papers, low priority).\n- What are the different forms of target program output (absolute code / relocatable code / assembly)?"}], "supplementary": {"repeatedMd": "## 7. 🔥 Most Repeated Questions (across all your PYQs, PAC, and Assignments)\n\nRanked by how many of your 7 source files (2 assignments + PAC + 4 real papers) contained this concept. Where two questions test the same idea in different words, I have grouped them and told you clearly.\n\n| Rank | Topic / Question | Unit | Frequency (files it appeared in) | Typical Marks | Priority |\n|---|---|---|---|---|---|\n| 1 | **Activation Record** — define/explain/diagram/components | 4 | 7 | 4–8 | 🔴 |\n| 1 | **SLR(1)/CLR(1)/LALR(1)/LR(0) table construction** (\"check whether X or construct Y for grammar Z\") | 3 | 7 | 8 | 🔴 |\n| 3 | **TAC / Quadruple / Triple / Indirect Triple** for a given expression | 4 | 6 | 4–8 | 🔴 |\n| 3 | **Peephole Optimization** — explain with types/examples | 5 | 6 | 6–8 | 🔴 |\n| 3 | **RE → NFA → DFA conversion** (Thompson's + Subset Construction, or Syntax-tree/followpos method) | 2 | 6 | 8 | 🔴 |\n| 6 | **Parameter Passing Methods** (swap-variable example) | 4 | 5 | 6–8 | 🔴 |\n| 6 | **Code Optimization Techniques** (general, machine-independent) | 5 | 5 | 6–8 | 🔴 |\n| 6 | **LL(1) checking + FIRST/FOLLOW + Operator Precedence** on the standard grammar `E→E+T\\|T, T→T*F\\|F, F→(E)\\|id` | 3 | 5 | 6–8 | 🔴 |\n| 6 | **Types of Compiler / Compiler Construction Tools / Single-pass vs Multi-pass** | 1 | 5 | 4–8 | 🟠 |\n| 10 | **Left Recursion removal + Left Factoring** | 3 | 4 | 4–8 | 🔴 |\n| 10 | **Ambiguous Grammar** — check/prove | 3 | 4 | 4–6 | 🔴 |\n| 10 | **Phases of Compiler** (trace a given expression) | 1 | 4 | 8 | 🔴 |\n| 10 | **Compiler vs Interpreter vs Assembler** | 1 | 4 | 4–8 | 🔴 |\n| 10 | **DAG construction** for an expression | 4 | 4 | 6–8 | 🔴 |\n| 15 | **FIRST and FOLLOW computation** (standalone) | 3 | 3 | 4–8 | 🔴 |\n| 15 | **Static vs Dynamic Memory Allocation** | 4 | 3 | 4–6 | 🟠 |\n| 15 | **Register Allocation strategies** | 5 | 3 | 4–8 | 🟠 |\n| 15 | **Issues in Code Generator Design** | 5 | 3 | 6–8 | 🔴 |\n| 19 | **Basic Blocks / Flow Graph / Leader identification** | 5 | 2 | 6 | 🔴 |\n| 19 | **Shift-Reduce Parsing / Handle & Handle Pruning** | 3 | 2 | 6–8 | 🟠 |\n\n**Questions that LOOK different but are the SAME concept (grouped for you):**\n- \"Check whether grammar is LL(1)\" = \"Construct predictive parsing table\" = \"Parse the string using LL(1) table\" → **all one skill: FIRST/FOLLOW → Table → Trace.**\n- \"Construct SLR(1) table\" = \"Construct CLR(1) table\" = \"Construct LALR(1) table\" = \"Construct LR(0) parser\" → **all one skill (canonical items → table → trace); only the reduce-decision rule changes.**\n- \"Convert RE to DFA using Thompson's + Subset Construction\" = \"Draw NFA and convert to DFA\" → **same method, same steps.**\n- \"Write Quadruple for X\" = \"Write Triple for X\" = \"Write Indirect Triple for X\" = \"Write TAC for X\" → **do TAC first, then re-format into the other 3.**\n- \"Explain Call by Reference\" = \"Explain Call by Value-Result / Copy-Restore\" → **different mechanism, but usually the SAME final output** — don't confuse the two when explaining.\n- \"Remove Left Recursion\" ≠ \"Left Factoring\" → these LOOK similar (both are grammar-fixing questions) but solve two DIFFERENT problems — never mix up the formulas.\n\n---", "top30Md": "## 8. 🚨 TOP 30 QUESTIONS TO PREPARE\n\nIf you only have time for 30 questions, these give you the best coverage of your whole syllabus (chosen using frequency + PPT depth + explicit MU/exam signals).\n\n| # | Question | Unit | Priority | Why important | Marks | Repeated? | What you must write |\n|---|---|---|---|---|---|---|---|\n| 1 | Trace all 6 phases of a compiler for a given statement | 1 | 🔴 | Explicit MU Question, 4 sources | 8 | Yes (4x) | 6 phase outputs + diagram |\n| 2 | Differentiate Compiler, Interpreter, Assembler | 1 | 🔴 | Explicit MU Question, 4 sources | 4–8 | Yes (4x) | 3 tables |\n| 3 | Explain Cousins of Compiler with diagram | 1 | 🔴 | Explicit MU Question | 6–8 | Yes | LPS diagram + 3 cousins |\n| 4 | Explain Types of Compiler (any 2–4) | 1 | 🟠 | Explicit MU Question, 3 sources | 4–8 | Yes (5x) | 4–6 one-liners |\n| 5 | Convert RE to NFA (Thompson's) then to DFA (Subset Construction) | 2 | 🔴 | Most repeated numerical, 5 sources | 8 | Yes (6x) | Full trace + table |\n| 6 | Convert RE to DFA using firstpos/lastpos/followpos | 2 | 🔴 | Explicit MU Question, 4 sources | 8 | Yes (4x) | nullable/firstpos/lastpos/followpos table |\n| 7 | Minimize a DFA (partitioning algorithm) | 2 | 🔴 | Explicit MU Question | 8 | Yes (2x) | Partition steps + final table |\n| 8 | Write Regular Expressions / Regular Definitions for given languages | 2 | 🟠 | 3 sources, huge PPT depth | 4–6 | Yes (3x) | RE table |\n| 9 | Draw Transition diagram (relational operator / unsigned number) | 2 | 🟠 | Explicit MU Question | 6 | Yes (2x) | 2 diagrams |\n| 10 | Construct LL(1) parsing table and parse a string | 3 | 🔴 | 4 sources, richest worked example | 8 | Yes (4x) | 4-step method + trace |\n| 11 | Construct SLR(1)/CLR(1)/LALR(1)/LR(0) table and parse a string | 3 | 🔴 | MOST repeated question type, 7 sources | 8 | Yes (7x) | Item sets + table + trace |\n| 12 | Remove Left Recursion from a grammar | 3 | 🔴 | 3 sources, 4 worked PPT examples | 4–8 | Yes (4x) | Formula + solved grammar |\n| 13 | Perform Left Factoring on a grammar | 3 | 🔴 | Paired with Q12 in PPT | 4–8 | Yes (3x) | Formula + solved grammar |\n| 14 | Check/Prove a grammar is Ambiguous | 3 | 🔴 | 3 sources + 2 PPT practice Qs | 4–6 | Yes (4x) | 2 derivations for same string |\n| 15 | Compute FIRST and FOLLOW sets | 3 | 🔴 | 3 sources | 4–8 | Yes (3x) | Rule-based table |\n| 16 | Operator Precedence Parsing (table + parse) | 3 | 🟠 | 4 sources | 6–8 | Yes (5x incl. functions) | Precedence table + trace |\n| 17 | Shift-Reduce Parsing / Handle Pruning | 3 | 🟠 | 2 sources | 6–8 | Yes (2x) | 4 actions + trace |\n| 18 | Leftmost/Rightmost Derivation + Parse Tree | 3 | 🟠 | 2 sources | 4–6 | Yes | 2 derivations |\n| 19 | Generate TAC, Quadruple, Triple, Indirect Triple for an expression | 4 | 🔴 | 6 sources — most repeated numerical in Unit 4 | 4–8 | Yes (6x) | 4 tables |\n| 20 | Explain Activation Record with diagram | 4 | 🔴 | 7 sources — MOST repeated question overall | 6–8 | Yes (7x) | 7-field diagram |\n| 21 | Explain Parameter Passing Methods with swap(a,b) example | 4 | 🔴 | 5 sources | 6–8 | Yes (5x) | 4 methods + output table |\n| 22 | Construct a DAG for a given expression | 4 | 🔴 | 4 sources | 6–8 | Yes (4x) | 3-step algorithm + diagram |\n| 23 | SDD with Synthesized/Inherited Attributes (desk calculator example) | 4 | 🟠 | 2 sources, full PPT worked example | 8 | Yes (2x) | Semantic rules + annotated tree |\n| 24 | Static vs Dynamic Memory Allocation | 4 | 🟠 | 3 sources | 4–6 | Yes (3x) | Comparison table |\n| 25 | Explain Peephole Optimization with types & examples | 5 | 🔴 | 6 sources | 6–8 | Yes (6x) | 6 types + examples |\n| 26 | Explain Code Optimization Techniques (CSE, folding, propagation, dead code, motion, strength reduction) | 5 | 🔴 | 5 sources | 6–8 | Yes (5x) | Classification + 4-6 examples |\n| 27 | Identify Leaders and Basic Blocks; draw Flow Graph | 5 | 🔴 | 2 sources, full PPT worked example | 6 | Yes (2x) | 3 leader rules + partition |\n| 28 | Construct a DAG for a Basic Block; list its uses | 5 | 🔴 | Heaviest PPT diagram example | 6–8 | Not directly in PYQs but very high PPT depth | Algorithm + diagram + 4 uses |\n| 29 | Explain Issues in Design of a Code Generator | 5 | 🔴 | 3 sources | 6–8 | Yes (3x) | 6 issues |\n| 30 | Register Allocation and Assignment strategies | 5 | 🟠 | 3 sources | 4–8 | Yes (3x) | Definitions + graph colouring |\n\n**If you prepare only these 30, you will have covered the highest-value, most-repeated part of your syllabus** — but remember this is based on PATTERN, not a guarantee (see Section 12 for how confident to be).\n\n---", "diagramsMd": "## 9. 📊 Must-Draw Diagrams (full list)\n\n| Diagram | Unit | Why it matters |\n|---|---|---|\n| 6 phases of compiler + symbol table + error handler | 1 | Matches the #1 most-asked question |\n| Language Processing System (Preprocessor→Compiler→Assembler→Linker/Loader) | 1 | Explicit MU Question |\n| Transition diagram — relational operators | 2 | Explicit MU Question |\n| Transition diagram — unsigned numbers | 2 | Explicit MU Question |\n| NFA for `(a|b)*abb` via Thompson's construction | 2 | Standard textbook example, reused everywhere |\n| Final DFA (from subset construction and from syntax-tree method) | 2 | Core of the most-repeated numerical |\n| Buffer Pairs / Sentinel buffer diagram | 2 | Direct diagram-recall marks |\n| Parse tree vs Syntax tree (side-by-side) | 3 | Classic comparison question |\n| Canonical item-set diagrams for SLR/CLR/LALR | 3 | Needed for the most-repeated question type |\n| Activation Record — 7-field stack diagram | 4 | #1 most-repeated question overall |\n| Activation Tree (e.g. Quicksort recursion) | 4 | Common runtime-environment diagram |\n| DAG for `a:=b*-c+b*-c` (and for a basic block) | 4 / 5 | Shows subexpression sharing clearly |\n| Annotated parse tree (synthesized + inherited attribute examples) | 4 | Needed for SDD questions |\n| Classification of Optimization Techniques (tree diagram) | 5 | Foundational diagram for Unit 5 |\n| Control Flow Graph / Basic Block partition diagram | 5 | Needed for leader/basic-block questions |\n| Role of Code Generator (pipeline diagram) | 5 | Quick, safe diagram marks |\n\n---", "numericalsMd": "## 10. 🧮 Must-Practice Numericals (full list)\n\n| Numerical type | Unit |\n|---|---|\n| RE → NFA (Thompson's) | 2 |\n| NFA → DFA (Subset Construction) | 2 |\n| RE → DFA directly (firstpos/lastpos/followpos) | 2 |\n| DFA Minimization (partitioning algorithm) | 2 |\n| FIRST and FOLLOW set computation | 3 |\n| LL(1) parsing table construction + string parsing | 3 |\n| Left Recursion elimination (direct & indirect) | 3 |\n| Left Factoring | 3 |\n| Ambiguity check/proof (2 derivations for 1 string) | 3 |\n| Leftmost / Rightmost derivation | 3 |\n| Shift-Reduce parsing trace | 3 |\n| Operator Precedence table + parsing trace | 3 |\n| LR(0) / SLR(1) / CLR(1) / LALR(1) table construction + parsing trace | 3 |\n| Three Address Code / Quadruple / Triple / Indirect Triple generation | 4 |\n| DAG construction (for an expression, and for a basic block) | 4 / 5 |\n| Annotated parse tree value computation (SDD) | 4 |\n| Peephole optimization before/after code | 5 |\n| Constant folding / propagation, CSE, dead code, code motion, strength reduction (before/after code) | 5 |\n| Leader identification + basic block partition + flow graph | 5 |\n| Register usage-count / graph colouring (conceptual, rarely fully numeric) | 5 |", "revisionMd": "## 11. ⚡ ONE-DAY COMPILER DESIGN REVISION SHEET\n\n### UNIT 1 — MUST KNOW\n- 6 Phases (in order): Lexical → Syntax → Semantic → Intermediate Code → Optimization → Code Generation. Analysis = phases 1–3, Synthesis = phases 4–6.\n- Compiler = whole program at once; Interpreter = line by line; Assembler = assembly→machine code.\n- 3 Cousins: Preprocessor, Assembler, Linker & Loader. Order: Preprocessor→Compiler→Assembler→Linker/Loader.\n- Front End = source-dependent; Back End = target-machine-dependent.\n- 6 types of compiler: Native, Cross, Source-to-Source, JIT, Incremental, Parallelizing.\n- Pass ≠ Phase: 2 passes, 6 phases.\n\n### UNIT 2 — MUST KNOW\n- Token = category; Lexeme = actual text; Pattern = rule (regex).\n- RE rules: `*`=zero or more, `+`=one or more, `|`=or.\n- Thompson's Construction: base cases (ε, single symbol) + 3 rules (union, concat, star).\n- Subset Construction: `ε-closure(start)=A` → repeat Move+ε-closure for each symbol → build Dtran table.\n- firstpos/lastpos/followpos: build syntax tree with numbered leaves → nullable → firstpos/lastpos → followpos (2 rules: CAT and STAR) → build DFA from firstpos(root) and followpos.\n- DFA Minimization: split into final/non-final groups → keep splitting until stable → merge same-behaviour states.\n\n### UNIT 3 — MUST KNOW\n- Ambiguous grammar = 2 different parse trees / leftmost derivations for the same string.\n- Left Recursion formula: `A→Aα|β` ⟹ `A→βA'`, `A'→αA'|ε`.\n- Left Factoring formula: `A→αβ1|αβ2|γ` ⟹ `A→αA'|γ`, `A'→β1|β2`.\n- FIRST/FOLLOW rules (see Unit 3, Q5).\n- LL(1) steps: remove left recursion → FIRST/FOLLOW → parsing table → parse using stack.\n- LR family: LR(0) (no lookahead) < SLR(1) (uses FOLLOW) < LALR(1) (merged CLR states) < CLR(1) (most powerful, biggest table). Steps: augment grammar → closure/goto → canonical item sets → Action/Goto table → parse trace.\n- Operator precedence: relations `<·` `=·` `·>` between terminals; handle = between first `·>` and preceding `<·`.\n\n### UNIT 4 — MUST KNOW\n- TAC: `x:=y op z`, max 1 operator per line.\n- Quadruple = 4 fields (Op,Arg1,Arg2,Result). Triple = 3 fields, refers to OTHER triples by position number. Indirect Triple = Triple + a separate pointer list.\n- Activation Record 7 fields (top to bottom): Return value, Actual parameters, Control link, Access link, Saved machine status, Local variables, Temporaries.\n- 4 Parameter Passing methods: Value (copy, original unchanged), Reference (address, original changes), Copy-Restore (copy in, copy back out), Name (macro-style text substitution).\n- Synthesized attribute = from children (bottom-up); Inherited attribute = from parent/sibling (top-down).\n- DAG = tree but merges repeated subexpressions into ONE shared node.\n\n### UNIT 5 — MUST KNOW\n- Peephole optimization types: redundant instruction elimination, flow-of-control optimization, unreachable code removal, algebraic simplification, strength reduction, machine idioms.\n- Optimization classification: Machine Dependent vs Machine Independent → (Function Preserving: CSE, folding, copy propagation, dead code elimination) + (Loop Optimization: code motion, strength reduction).\n- Basic Block Leader rules: (1) first statement, (2) target of any goto, (3) statement right after a goto.\n- DAG for basic block: same idea as Unit 4's DAG, applied to a whole block; uses = find CSE, find live-on-exit values, simplify quadruples.\n- Register Allocation ≠ Register Assignment (which value vs which specific register).\n- Code Generator issues: input form, target program type, memory management, instruction selection, register allocation, evaluation order.\n\n### Formulas / Rules Quick List\n- Left Recursion: `A→Aα|β` → `A→βA', A'→αA'|ε`\n- Left Factoring: `A→αβ1|αβ2|γ` → `A→αA', A'→β1|β2`\n- `Out[S] = gen[S] ∪ (in[S] – kill[S])` (data flow equation)\n- Usage count: `Σ [use(x,B) + 2×live(x,B)]`\n\n### Most Repeated Questions (quick recall — see Section 7 for full table)\nActivation Record • SLR/CLR/LALR/LR(0) construction • TAC/Quadruple/Triple/Indirect Triple • Peephole Optimization • RE→NFA→DFA • Parameter Passing Methods • Code Optimization Techniques • LL(1)/FIRST-FOLLOW/Operator Precedence on `E→E+T|T` grammar family • Left Recursion + Left Factoring • Ambiguous Grammar • Phases of Compiler • Compiler vs Interpreter vs Assembler • DAG construction.\n\n---", "strategyMd": "## 12. 🎯 Final Exam Strategy\n\n**What to study first:** Start with Section 8 (Top 30 Questions) — it already blends frequency + depth across all 5 units. Inside that, do the 🔴 Very-High items in Sections 2–6 first, unit by unit, in this order: Unit 3 (heaviest, most numerical) → Unit 4 (2nd most repeated) → Unit 2 → Unit 5 → Unit 1 (lightest but very safe, high-certainty marks).\n\n**What NOT to skip:** Activation Record, SLR/CLR/LALR/LR(0) table construction, and TAC/Quadruple/Triple/Indirect-Triple — these three alone cover close to 20 marks worth of repeated question-types across your real papers. Do not leave any of Units 1–5 completely unread — even \"Low Priority\" topics show up as 1-mark MCQ/short-answer items in the 100-mark paper format.\n\n**What to memorize word-for-word:** the algorithm steps (Left Recursion formula, Left Factoring formula, LL(1) 4 steps, Subset Construction pseudocode, followpos rules, DFA minimization steps, Leader rules, Activation Record's 7 fields) — these are marking-point checklists, and examiners look for these exact steps.\n\n**What to practice by hand (don't just read):** RE→NFA→DFA conversion, SLR/CLR/LALR table construction, TAC/Quadruple/Triple generation, Left Recursion/Left Factoring, FIRST/FOLLOW computation, DAG construction. These are numerical/algorithm skills — reading about them is not the same as being able to do them under exam time pressure. Practice on the SAME grammars listed in Section 10, then try 1–2 unseen grammars from your textbook.\n\n**How to write answers for maximum marks:**\n- For theory questions: definition first (1 line), then bullet points of main ideas, then a diagram if one is expected — examiners scan for keywords and structure, not long paragraphs.\n- For numerical questions: always show your STEPS, not just the final answer — most marks are for the method, not the final table alone.\n- If asked \"check whether X\" and you find a conflict/problem (e.g., grammar not SLR, or ambiguous) — say so clearly and explain WHY, don't just leave it incomplete.\n\n**How to manage time in the exam:**\n- Attempt Q1 (MCQ + short answers, if it's the 100-mark format) FIRST and fast — these are guaranteed marks if you know your definitions.\n- For each main question (2 through 5/6), decide BEFORE writing which OR-side you know better — don't start one side and switch mid-way.\n- Numerical questions (SLR/CLR tables, NFA→DFA, TAC) take longer — budget roughly 12–15 minutes for an 8-mark numerical, 6–8 minutes for an 8-mark theory question.\n- Draw diagrams quickly and neatly — a correct-but-rough diagram earns full diagram marks; don't over-decorate.\n\n**How to maximize marks with limited time:** use the \"MINIMUM FULL-MARK ANSWER\" given for every Very-High/High question in Sections 2–6 — these are built to hit the maximum number of marking points in the shortest possible writing time. If you have extra time in the exam, add the \"➕ ADD THESE IF YOU HAVE TIME\" points for a safety margin.\n\n**Honest note on predictions:** Every priority/frequency label in this document (🔴🟠🟡⚪ and \"Very/High/Medium/Low Probability\") is based only on patterns found in YOUR uploaded PYQs, assignments, and PPTs — not a guarantee of what will appear in your exact upcoming exam. Treat \"Very High Priority\" as **Very High Probability**, not certainty, and never skip an entire unit just because it scored lower in this analysis.\n\n**Good luck for your exam — you now have a complete, prioritized map of your syllabus. Study Sections 8 and 11 first if you are extremely short on time.**"}};

<script type="text/babel" data-presets="react">
/* ============================================================
   Compiler Design — Final Exam Preparation
   Single-file React app (React 18 UMD + Babel Standalone).
   All exam content lives in window.CD_DATA (see data.js) and is
   rendered verbatim through Markdown() — this file only adds
   presentation, navigation, search, filters and local persistence.
   ============================================================ */

const { useState, useEffect, useMemo, useRef, useCallback, createContext, useContext } = React;

/* ------------------------------------------------------------
   Fixed CD terminology list — wording is NEVER changed, we only
   wrap existing text in <mark class="cd-term"> for emphasis.
   ------------------------------------------------------------ */
const CD_TERMS = [
  'Lexical Analysis', 'Syntax Analysis', 'Semantic Analysis', 'Parse Tree',
  'NFA', 'DFA', 'ε-closure', 'FIRST', 'FOLLOW', 'LL(1)', 'LR', 'SLR', 'CLR', 'LALR',
  'Three Address Code', 'DAG', 'Code Optimization', 'Symbol Table', 'Code Generation',
];
const CD_TERMS_SORTED = [...CD_TERMS].sort((a, b) => b.length - a.length);
const TERM_REGEXES = CD_TERMS_SORTED.map((t) => ({
  term: t,
  re: new RegExp('(?<![A-Za-z0-9_])' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(?![A-Za-z0-9_])', 'g'),
}));

function highlightTerms(root) {
  if (!root) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode(node) {
      let p = node.parentElement;
      while (p && p !== root) {
        const tag = p.tagName;
        if (tag === 'CODE' || tag === 'PRE' || tag === 'MARK' || (p.classList && p.classList.contains('no-highlight'))) {
          return NodeFilter.FILTER_REJECT;
        }
        p = p.parentElement;
      }
      return node.nodeValue.trim() ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
    },
  });
  const nodes = [];
  let n;
  while ((n = walker.nextNode())) nodes.push(n);
  nodes.forEach((node) => {
    const text = node.nodeValue;
    let spans = [];
    TERM_REGEXES.forEach(({ re }) => {
      re.lastIndex = 0;
      let m;
      while ((m = re.exec(text))) spans.push([m.index, m.index + m[0].length]);
    });
    if (spans.length === 0) return;
    spans.sort((a, b) => a[0] - b[0] || b[1] - b[0] - (a[1] - a[0]));
    const merged = [];
    spans.forEach((s) => {
      if (merged.length && s[0] < merged[merged.length - 1][1]) return;
      merged.push(s);
    });
    if (merged.length === 0) return;
    const frag = document.createDocumentFragment();
    let last = 0;
    merged.forEach(([start, end]) => {
      if (start > last) frag.appendChild(document.createTextNode(text.slice(last, start)));
      const mark = document.createElement('mark');
      mark.className = 'cd-term';
      mark.textContent = text.slice(start, end);
      frag.appendChild(mark);
      last = end;
    });
    if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
    node.parentNode.replaceChild(frag, node);
  });
}

function parseMd(md) {
  if (!md) return '';
  try {
    return window.marked.parse ? window.marked.parse(md, { gfm: true }) : window.marked(md);
  } catch (e) {
    return '<p>' + String(md) + '</p>';
  }
}

/* ------------------------------------------------------------
   Generic markdown renderer: tables get a scroll wrapper, code
   blocks get a copy button, and CD terminology gets highlighted.
   Never alters the underlying text — presentation only.
   ------------------------------------------------------------ */
function Markdown({ md, className, highlight = true }) {
  const ref = useRef(null);
  const html = useMemo(() => parseMd(md), [md]);

  useEffect(() => {
    const root = ref.current;
    if (!root) return;

    root.querySelectorAll('table').forEach((table) => {
      if (table.parentElement.classList.contains('table-wrap')) return;
      const wrap = document.createElement('div');
      wrap.className = 'table-wrap';
      table.parentNode.insertBefore(wrap, table);
      wrap.appendChild(table);
    });

    root.querySelectorAll('pre').forEach((pre) => {
      if (pre.parentElement.classList.contains('code-block-wrap')) return;
      const code = pre.querySelector('code');
      let lang = '';
      if (code) {
        const m = (code.className || '').match(/language-(\w+)/);
        if (m) lang = m[1];
      }
      const wrap = document.createElement('div');
      wrap.className = 'code-block-wrap';
      pre.parentNode.insertBefore(wrap, pre);
      wrap.appendChild(pre);
      if (lang) {
        const bar = document.createElement('div');
        bar.className = 'code-lang-bar';
        bar.textContent = lang;
        wrap.insertBefore(bar, pre);
      }
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'code-copy-btn';
      btn.textContent = 'Copy';
      btn.addEventListener('click', () => {
        const text = code ? code.textContent : pre.textContent;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).catch(() => {});
        }
        btn.textContent = 'Copied!';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = 'Copy';
          btn.classList.remove('copied');
        }, 1400);
      });
      wrap.appendChild(btn);
    });

    if (highlight) highlightTerms(root);
  }, [html, highlight]);

  return <div ref={ref} className={'md-content' + (className ? ' ' + className : '')} dangerouslySetInnerHTML={{ __html: html }} />;
}

/* Diagram block: same content, distinct "must-draw" visual treatment. */
function DiagramBlock({ md }) {
  const ref = useRef(null);
  const html = useMemo(() => parseMd(md), [md]);
  useEffect(() => {
    const root = ref.current;
    if (!root) return;
    root.querySelectorAll('pre').forEach((pre) => {
      if (pre.parentElement.classList.contains('diagram-inner')) return;
      const wrap = document.createElement('div');
      wrap.className = 'diagram-inner';
      pre.parentNode.insertBefore(wrap, pre);
      wrap.appendChild(pre);
    });
  }, [html]);
  if (!md) return null;
  return (
    <div className="diagram-box anim-fade-in">
      <div className="diagram-box-header">📌 Diagram — Must Draw in Exam</div>
      <div ref={ref} className="md-content no-highlight" dangerouslySetInnerHTML={{ __html: html }} />
    </div>
  );
}

/* ------------------------------------------------------------
   Persistence (localStorage) — prepared / bookmarked / theme
   ------------------------------------------------------------ */
function loadIdSet(key) {
  try {
    const raw = localStorage.getItem(key);
    if (!raw) return new Set();
    return new Set(JSON.parse(raw));
  } catch (e) {
    return new Set();
  }
}
function saveIdSet(key, set) {
  try {
    localStorage.setItem(key, JSON.stringify(Array.from(set)));
  } catch (e) {}
}

const AppCtx = createContext(null);
function useApp() {
  return useContext(AppCtx);
}

/* ------------------------------------------------------------
   Small presentational helpers
   ------------------------------------------------------------ */
const PRIORITY_CLASS = {
  'Very High': 'priority-veryhigh',
  High: 'priority-high',
  Medium: 'priority-medium',
  Low: 'priority-low',
};
const PRIORITY_DOT = {
  'Very High': '🔴',
  High: '🟠',
  Medium: '🟡',
  Low: '⚪',
};

function PriorityChip({ priority }) {
  return (
    <span className={'priority-chip ' + (PRIORITY_CLASS[priority] || 'priority-low') + ' inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-bold whitespace-nowrap'}>
      <span>{PRIORITY_DOT[priority] || '⚪'}</span>
      <span>{priority} Priority</span>
    </span>
  );
}
function MarksChip({ marks }) {
  if (!marks) return null;
  return (
    <span className="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-bold bg-indigo-50 text-indigo-700 border border-indigo-200 dark:bg-indigo-500/10 dark:text-indigo-300 dark:border-indigo-500/40 whitespace-nowrap">
      ✏️ {marks} Marks
    </span>
  );
}
function RepeatedChip({ q }) {
  if (!isRepeated(q)) return null;
  return (
    <span className="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-bold bg-rose-50 text-rose-700 border border-rose-200 dark:bg-rose-500/10 dark:text-rose-300 dark:border-rose-500/40 whitespace-nowrap">
      🔁 Repeated PYQ
    </span>
  );
}
function TypeTags({ tags }) {
  if (!tags || !tags.length) return null;
  const emoji = { Theory: '📖', Numerical: '🧮', Diagram: '📊', Algorithm: '🧩' };
  return (
    <>
      {tags.map((t) => (
        <span key={t} className="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-semibold bg-slate-100 text-slate-600 border border-slate-200 dark:bg-slate-700/50 dark:text-slate-300 dark:border-slate-600 whitespace-nowrap">
          {emoji[t] || ''} {t}
        </span>
      ))}
    </>
  );
}

function isRepeated(q) {
  const s = q.repeated || '';
  const m = s.match(/(\d+)\s*(different sources|occurrences|sources|times|different papers)/i);
  if (m) return parseInt(m[1], 10) >= 2;
  const head = s.split('—')[0];
  const parts = head.split(',').map((x) => x.trim()).filter(Boolean);
  return parts.length >= 2;
}

function KeywordPills({ keywords }) {
  if (!keywords || !keywords.length) return null;
  return (
    <div className="flex flex-wrap gap-2">
      {keywords.map((k, i) => (
        <span key={i} className="kw-pill anim-pop" style={{ animationDelay: (i * 0.03) + 's' }}>
          {k}
        </span>
      ))}
    </div>
  );
}

function MustWriteBox({ items }) {
  if (!items || !items.length) return null;
  return (
    <div className="mustwrite-box">
      <div className="font-extrabold text-emerald-800 dark:text-emerald-300 text-sm uppercase tracking-wide mb-2 flex items-center gap-2">
        <span>⭐</span> Must Write for Full Marks
      </div>
      {items.map((it, i) => (
        <div className="mustwrite-item" key={i}>
          <span className="mustwrite-check">✓</span>
          <span>{it}</span>
        </div>
      ))}
    </div>
  );
}

/* ------------------------------------------------------------
   Question card
   ------------------------------------------------------------ */
function QuestionCard({ q, defaultOpen = false, highlightMatch }) {
  const { prepared, togglePrepared, bookmarks, toggleBookmark } = useApp();
  const [open, setOpen] = useState(defaultOpen);
  const [showQuickRef, setShowQuickRef] = useState(false);
  const isPrepared = prepared.has(q.id);
  const isBookmarked = bookmarks.has(q.id);

  return (
    <div id={q.id} className={'q-card scroll-mt-24 rounded-2xl border bg-white dark:bg-slate-800/60 border-slate-200 dark:border-slate-700 overflow-hidden ' + PRIORITY_CLASS[q.priority]}>
      <div className="priority-bar h-1.5 w-full" />
      <div className="p-4 sm:p-5">
        <div className="flex flex-wrap items-center gap-2 mb-3">
          <span className="text-xs font-bold text-slate-400 dark:text-slate-500">Q{q.globalIndex}</span>
          <PriorityChip priority={q.priority} />
          <MarksChip marks={q.marks} />
          <RepeatedChip q={q} />
          <TypeTags tags={q.typeTags} />
          <div className="ml-auto flex items-center gap-2">
            <button
              type="button"
              title={isPrepared ? 'Marked as prepared' : 'Mark as prepared'}
              onClick={() => togglePrepared(q.id)}
              className={'prep-checkbox ' + (isPrepared ? 'checked' : '')}
            >
              {isPrepared ? '✓' : ''}
            </button>
            <button
              type="button"
              title={isBookmarked ? 'Bookmarked' : 'Bookmark this question'}
              onClick={() => toggleBookmark(q.id)}
              className={'star-btn text-xl leading-none ' + (isBookmarked ? 'active' : '')}
            >
              {isBookmarked ? '★' : '☆'}
            </button>
          </div>
        </div>

        <button type="button" onClick={() => setOpen((o) => !o)} className="w-full text-left group">
          <h3 className="text-base sm:text-lg font-bold text-slate-800 dark:text-slate-100 leading-snug pr-2">
            {q.question}
          </h3>
          <div className="mt-2 inline-flex items-center gap-1.5 text-sm font-semibold text-indigo-600 dark:text-indigo-400">
            <span>{open ? 'Hide Answer' : 'Show Answer'}</span>
            <span className={'transition-transform duration-200 inline-block ' + (open ? 'rotate-180' : '')}>▾</span>
          </div>
        </button>

        {open && (
          <div className="anim-expand mt-4 space-y-5 border-t border-dashed border-slate-200 dark:border-slate-700 pt-4">
            <section>
              <h4 className="text-xs font-extrabold uppercase tracking-wide text-slate-500 dark:text-slate-400 mb-1.5">Answer</h4>
              <Markdown md={q.answerMd} />
            </section>

            {q.diagramMd && <DiagramBlock md={q.diagramMd} />}

            <MustWriteBox items={q.mustWrite} />

            {q.keywords && q.keywords.length > 0 && (
              <section>
                <h4 className="text-xs font-extrabold uppercase tracking-wide text-slate-500 dark:text-slate-400 mb-2 flex items-center gap-1.5">
                  <span>🔑</span> Keywords to Remember
                </h4>
                <KeywordPills keywords={q.keywords} />
              </section>
            )}

            {q.finalVersionMd && (
              <section>
                <h4 className="text-xs font-extrabold uppercase tracking-wide text-amber-700 dark:text-amber-400 mb-1.5 flex items-center gap-1.5">
                  <span>✍️</span> Final Exam Version — write this in your answer sheet
                </h4>
                <div className="final-version-box">
                  <Markdown md={q.finalVersionMd} />
                </div>
              </section>
            )}

            {q.quickRefMd && (
              <section>
                <button
                  type="button"
                  onClick={() => setShowQuickRef((s) => !s)}
                  className="text-xs font-bold text-slate-500 dark:text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400 inline-flex items-center gap-1.5 border border-slate-200 dark:border-slate-600 rounded-full px-3 py-1.5 transition-colors"
                >
                  📎 {showQuickRef ? 'Hide' : 'Show'} Quick Reference Card (original prep notes)
                </button>
                {showQuickRef && (
                  <div className="anim-expand mt-3 rounded-xl bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 p-4">
                    <Markdown md={q.quickRefMd} />
                  </div>
                )}
              </section>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

/* ------------------------------------------------------------
   Filter bar
   ------------------------------------------------------------ */
const FILTERS = [
  { id: 'all', label: 'All' },
  { id: 'veryhigh', label: 'Very High Priority' },
  { id: 'high', label: 'High Priority' },
  { id: 'medium', label: 'Medium Priority' },
  { id: 'theory', label: 'Theory' },
  { id: 'numerical', label: 'Numerical' },
  { id: 'diagram', label: 'Diagram' },
  { id: 'algorithm', label: 'Algorithm' },
  { id: 'repeated', label: 'Repeated Questions' },
];

function matchesFilter(q, filter) {
  switch (filter) {
    case 'all': return true;
    case 'veryhigh': return q.priority === 'Very High';
    case 'high': return q.priority === 'High';
    case 'theory': return q.typeTags.includes('Theory');
    case 'numerical': return q.typeTags.includes('Numerical');
    case 'diagram': return q.typeTags.includes('Diagram');
    case 'algorithm': return q.typeTags.includes('Algorithm');
    case 'repeated': return isRepeated(q);
    default: return true;
  }
}

function FilterBar({ active, onChange }) {
  return (
    <div className="flex gap-2 overflow-x-auto no-scrollbar pb-1 -mx-1 px-1">
      {FILTERS.map((f) => (
        <button
          key={f.id}
          onClick={() => onChange(f.id)}
          className={
            'flex-none px-3.5 py-1.5 rounded-full text-sm font-semibold border transition-all ' +
            (active === f.id
              ? 'bg-indigo-600 text-white border-indigo-600 shadow-sm'
              : 'bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-700 hover:border-indigo-300 dark:hover:border-indigo-500')
          }
        >
          {f.label}
        </button>
      ))}
    </div>
  );
}

/* ------------------------------------------------------------
   Sticky desktop Table of Contents
   ------------------------------------------------------------ */
function UnitTOC({ unit }) {
  const scrollTo = (id) => {
    const el = document.getElementById(id);

  };

    <aside className="hidden xl:block w-64 flex-none">

        {unit.veryHigh.length > 0 && (
          <div className="mb-3">
            <div className="text-xs font-bold text-red-600 dark:text-red-400 mb-1">🔴 Very High Priority</div>
            <ul className="space-y-1">
              {unit.veryHigh.map((q) => (
                <li key={q.id}>

              {unit.high.map((q) => (
                <li key={q.id}>
                  <button onClick={() => scrollTo(q.id)} className="text-left text-sm text-slate-500 dark:text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400 line-clamp-2">
                    {q.questionShort}
                  </button>
                </li>
              ))}
            </ul>
          </div>
        )}

}

/* ------------------------------------------------------------
   Unit page
   ------------------------------------------------------------ */
function UnitPage({ unit }) {
  const [filter, setFilter] = useState('all');
  const allQ = [...unit.veryHigh, ...unit.high];
  const visible = filter === 'medium' ? [] : allQ.filter((q) => matchesFilter(q, filter));

  useEffect(() => {
    if (filter === 'medium') {
      const el = document.getElementById('unit-' + unit.number + '-medium');
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  }, [filter]);

  return (
    <div className="flex gap-8 items-start">
      <div className="flex-1 min-w-0 space-y-6">
        <div className="rounded-2xl p-6 sm:p-7 bg-gradient-to-br from-indigo-600 via-indigo-600 to-violet-700 text-white anim-fade-in">
          <div className="text-xs font-bold uppercase tracking-widest text-indigo-200 mb-1">Unit {unit.number}</div>
          <h1 className="text-2xl sm:text-3xl font-extrabold mb-3">{unit.title}</h1>
          <div className="text-indigo-100 text-sm sm:text-base leading-relaxed max-w-3xl no-highlight">
            <Markdown md={unit.intro} highlight={false} className="text-indigo-100" />
          </div>
          <div className="flex flex-wrap gap-2 mt-4">
            <span className="px-3 py-1 rounded-full bg-white/15 text-xs font-bold">🔴 {unit.veryHigh.length} Very High</span>
            <span className="px-3 py-1 rounded-full bg-white/15 text-xs font-bold">🟠 {unit.high.length} High</span>
          </div>
        </div>

        <FilterBar active={filter} onChange={setFilter} />

        {filter === 'medium' && (
          <div className="rounded-xl bg-amber-50 dark:bg-amber-500/10 border border-amber-200 dark:border-amber-500/30 text-amber-800 dark:text-amber-300 text-sm font-semibold px-4 py-3">
            Jumping to Medium Priority quick-prep points below ↓
          </div>
        )}

        <div className="space-y-5">
          {visible.map((q) => (
            <QuestionCard key={q.id} q={q} />
          ))}
          {visible.length === 0 && filter !== 'medium' && (
            <div className="text-center py-10 text-slate-400 dark:text-slate-500 font-medium">No questions match this filter in this unit.</div>
          )}
        </div>

        {unit.mediumMd && (
          <div id={'unit-' + unit.number + '-medium'} className="scroll-mt-24 rounded-2xl border border-amber-200 dark:border-amber-500/30 bg-amber-50/60 dark:bg-amber-500/5 p-5 sm:p-6">
            <h3 className="text-sm font-extrabold uppercase tracking-wide text-amber-700 dark:text-amber-400 mb-2 flex items-center gap-2">
              <span>🟡</span> Medium Priority — Quick Prep Points
            </h3>
            <Markdown md={unit.mediumMd} />
          </div>
        )}

        {unit.lowMd && (
          <div className="rounded-2xl border border-slate-200 dark:border-slate-700 bg-slate-50/60 dark:bg-slate-800/40 p-5 sm:p-6">
            <h3 className="text-sm font-extrabold uppercase tracking-wide text-slate-500 dark:text-slate-400 mb-2 flex items-center gap-2">
              <span>⚪</span> Low Priority — Optional / Time-Permitting
            </h3>
            <Markdown md={unit.lowMd} />
          </div>
        )}
      </div>
      <UnitTOC unit={unit} />
    </div>
  );
}

/* ------------------------------------------------------------
   Dashboard
   ------------------------------------------------------------ */

    <div className="rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 p-5 anim-fade-in">
      <div className={'text-3xl mb-2 ' + accent}>{icon}</div>
      <div className="text-3xl font-extrabold text-slate-800 dark:text-slate-100">{value}</div>
      <div className="text-sm text-slate-500 dark:text-slate-400 font-medium mt-0.5">{label}</div>
    </div>
  );
}

  return (

      <div className="rounded-3xl p-7 sm:p-10 bg-gradient-to-br from-indigo-600 via-violet-600 to-fuchsia-600 text-white anim-fade-in relative overflow-hidden">
        <div className="relative z-10">
          <div className="text-xs font-bold uppercase tracking-[0.2em] text-indigo-200 mb-2">Compiler Design</div>
          <h1 className="text-3xl sm:text-4xl font-extrabold mb-3">Final Exam Master Preparation</h1>
          <p className="text-indigo-100 max-w-2xl text-base leading-relaxed">

          </p>
          <div className="flex flex-wrap gap-3 mt-6">
            <button onClick={() => goTo('unit-1')} className="px-5 py-2.5 rounded-xl bg-white text-indigo-700 font-bold text-sm hover:bg-indigo-50 transition-colors shadow-sm">
              Start with Unit 1 →
            </button>
            <button onClick={() => goTo('top')} className="px-5 py-2.5 rounded-xl bg-white/15 text-white font-bold text-sm hover:bg-white/25 transition-colors border border-white/30">

          </div>
        </div>
      </div>

      <div className="grid grid-cols-2 md:grid-cols-5 gap-4">

        <StatCard icon="🟠" value={s.high} label="High Priority" accent="text-orange-500" />
        <StatCard icon="✍️" value={s.examReadyAnswers} label="Exam-Ready Answers" accent="text-emerald-500" />

      </div>

            >
              <div className="flex items-center justify-between mb-2">
                <span className="text-xs font-bold uppercase tracking-wide text-indigo-500">Unit {n}</span>
                <span className="text-indigo-400 group-hover:translate-x-1 transition-transform">→</span>
              </div>
              <h3 className="font-bold text-slate-800 dark:text-slate-100 mb-1">{u.title.replace(/^UNIT \d+ — /, '')}</h3>
              <div className="flex gap-2 text-xs font-semibold text-slate-400 dark:text-slate-500">
                <span>🔴 {u.veryHigh.length} Very High</span>
                <span>🟠 {u.high.length} High</span>
              </div>
            </button>
          );
        })}
      </div>

      <div className="rounded-2xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 p-6 sm:p-7">
        <h2 className="text-lg font-extrabold text-slate-800 dark:text-slate-100 mb-3">⚠️ How Your Units Are Organised</h2>
        <Markdown md={data.meta.unitMappingIntro} />
      </div>

      <div className="rounded-2xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 p-6 sm:p-7">
        <h2 className="text-lg font-extrabold text-slate-800 dark:text-slate-100 mb-3">1. Exam Pattern Analysis</h2>
        <Markdown md={data.meta.examPatternMd} />

/* ------------------------------------------------------------
   Simple markdown-only pages (sections 7–12)
   ------------------------------------------------------------ */
function SimplePage({ title, icon, md }) {
  return (
    <div className="space-y-5">
      <div className="rounded-2xl p-6 sm:p-7 bg-gradient-to-br from-indigo-600 to-violet-700 text-white anim-fade-in">
        <h1 className="text-2xl sm:text-3xl font-extrabold flex items-center gap-3">
          <span>{icon}</span> {title}
        </h1>
      </div>
      <div className="rounded-2xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 p-5 sm:p-7">
        <Markdown md={md} />
      </div>
    </div>
  );
}

/* ------------------------------------------------------------
   Bookmarks view
   ------------------------------------------------------------ */
function BookmarksView({ allQuestions }) {
  const { bookmarks } = useApp();
  const list = allQuestions.filter((q) => bookmarks.has(q.id));
  return (
    <div className="space-y-5">
      <div className="rounded-2xl p-6 sm:p-7 bg-gradient-to-br from-amber-500 to-orange-600 text-white anim-fade-in">
        <h1 className="text-2xl sm:text-3xl font-extrabold flex items-center gap-3">
          <span>⭐</span> My Bookmarks
        </h1>
        <p className="text-amber-100 mt-1 text-sm">{list.length} question{list.length === 1 ? '' : 's'} bookmarked</p>
      </div>
      {list.length === 0 ? (
        <div className="text-center py-16 text-slate-400 dark:text-slate-500 font-medium">
          No bookmarks yet — tap ☆ on any question to save it here.
        </div>
      ) : (
        <div className="space-y-5">
          {list.map((q) => (
            <QuestionCard key={q.id} q={q} />
          ))}
        </div>
      )}
    </div>
  );
}

/* ------------------------------------------------------------
   Search results view
   ------------------------------------------------------------ */
function SearchView({ query, allQuestions }) {
  const q = query.trim().toLowerCase();
  const results = useMemo(() => {
    if (!q) return [];
    return allQuestions.filter((item) => {
      const hay = [item.question, item.answerMd, item.finalVersionMd, item.quickRefMd, (item.keywords || []).join(' '), (item.mustWrite || []).join(' ')]
        .join(' \n ')
        .toLowerCase();
      return hay.includes(q);
    });
  }, [q, allQuestions]);

  return (
    <div className="space-y-5">
      <div className="rounded-2xl p-6 sm:p-7 bg-gradient-to-br from-slate-700 to-slate-900 text-white anim-fade-in">
        <h1 className="text-xl sm:text-2xl font-extrabold">🔎 Search Results for "{query}"</h1>
        <p className="text-slate-300 mt-1 text-sm">{results.length} question{results.length === 1 ? '' : 's'} found across all units</p>
      </div>
      {results.length === 0 ? (
        <div className="text-center py-16 text-slate-400 dark:text-slate-500 font-medium">No matches. Try a different keyword (e.g. "LL(1)", "DFA", "Activation Record").</div>
      ) : (
        <div className="space-y-5">
          {results.map((item) => (
            <QuestionCard key={item.id} q={item} defaultOpen />
          ))}
        </div>
      )}
    </div>
  );
}

/* ------------------------------------------------------------
   Sidebar
   ------------------------------------------------------------ */
const NAV_ITEMS = [
  { id: 'dashboard', label: 'Dashboard', icon: '🏠' },
  { id: 'unit-1', label: 'Unit 1', icon: '📚' },
  { id: 'unit-2', label: 'Unit 2', icon: '🔤' },
  { id: 'unit-3', label: 'Unit 3', icon: '🌳' },
  { id: 'unit-4', label: 'Unit 4', icon: '⚙️' },
  { id: 'unit-5', label: 'Unit 5', icon: '🚀' },
  { id: 'repeated', label: 'Most Repeated Questions', icon: '🔥' },
  { id: 'top', label: 'Top Questions', icon: '🚨' },
  { id: 'diagrams', label: 'Must-Draw Diagrams', icon: '📊' },
  { id: 'numericals', label: 'Must-Practice Numericals', icon: '🧮' },
  { id: 'revision', label: 'One-Day Revision', icon: '⚡' },
  { id: 'strategy', label: 'Exam Strategy', icon: '🎯' },
  { id: 'bookmarks', label: 'My Bookmarks', icon: '⭐' },
];

function Sidebar({ route, goTo, mobileOpen, closeMobile }) {
  const { preparedCount, total } = useApp();
  const pct = total ? Math.round((preparedCount / total) * 100) : 0;
  return (
    <>
      {mobileOpen && <div className="fixed inset-0 bg-black/40 z-40 md:hidden" onClick={closeMobile} />}
      <aside
        className={
          'fixed md:sticky top-0 md:top-0 h-screen z-50 md:z-0 w-72 flex-none bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 flex flex-col transition-transform duration-300 ' +
          (mobileOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0')
        }
      >
        <div className="px-5 py-5 border-b border-slate-100 dark:border-slate-800">
          <div className="text-xs font-extrabold tracking-[0.2em] text-indigo-500">COMPILER DESIGN</div>
          <div className="text-sm font-semibold text-slate-500 dark:text-slate-400 mt-0.5">Final Exam Preparation</div>
        </div>
        <nav className="flex-1 overflow-y-auto py-3">
          {NAV_ITEMS.map((item) => (
            <button
              key={item.id}
              onClick={() => {
                goTo(item.id);
                closeMobile();
              }}
              className={'nav-item w-full flex items-center gap-3 px-5 py-2.5 text-sm text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800/60 text-left ' + (route === item.id ? 'active' : 'border-l-[3px] border-transparent')}
            >
              <span className="text-base">{item.icon}</span>
              <span className="truncate">{item.label}</span>
            </button>
          ))}
        </nav>
        <div className="px-5 py-4 border-t border-slate-100 dark:border-slate-800">
          <div className="flex items-center justify-between text-xs font-bold text-slate-500 dark:text-slate-400 mb-1.5">
            <span>Study Progress</span>
            <span>{preparedCount}/{total}</span>
          </div>
          <div className="progress-track">
            <div className="progress-fill" style={{ width: pct + '%' }} />
          </div>
        </div>
      </aside>
    </>
  );
}

/* ------------------------------------------------------------
   Top bar
   ------------------------------------------------------------ */
function TopBar({ onMenu, searchQuery, setSearchQuery, dark, setDark }) {
  return (
    <div className="sticky top-0 z-30 backdrop-blur bg-white/85 dark:bg-slate-900/85 border-b border-slate-200 dark:border-slate-800">
      <div className="flex items-center gap-3 px-4 sm:px-6 py-3">
        <button onClick={onMenu} className="md:hidden text-2xl leading-none text-slate-600 dark:text-slate-300" aria-label="Open menu">
          ☰
        </button>
        <div className="relative flex-1 max-w-xl">
          <span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">🔎</span>
          <input
            value={searchQuery}
            onChange={(e) => setSearchQuery(e.target.value)}
            placeholder='Search everything… try "LL(1)" or "DFA"'
            className="w-full pl-9 pr-8 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-sm text-slate-700 dark:text-slate-200 placeholder-slate-400 dark:placeholder-slate-500 border border-transparent focus:border-indigo-400 focus:bg-white dark:focus:bg-slate-800 outline-none transition-colors"
          />
          {searchQuery && (
            <button onClick={() => setSearchQuery('')} className="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
              ✕
            </button>
          )}
        </div>
        <button
          onClick={() => setDark((d) => !d)}
          title="Toggle dark mode"
          className="flex-none w-9 h-9 rounded-full flex items-center justify-center bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors"
        >
          {dark ? '🌙' : '☀️'}
        </button>
      </div>
    </div>
  );
}

/* ------------------------------------------------------------
   App root
   ------------------------------------------------------------ */
function App() {
  const data = window.CD_DATA;

  const allQuestions = useMemo(() => {
    const out = [];
    data.units.forEach((u) => {
      u.veryHigh.forEach((q) => out.push(q));
      u.high.forEach((q) => out.push(q));
    });
    return out.sort((a, b) => a.globalIndex - b.globalIndex);
  }, [data]);

  const [route, setRoute] = useState((location.hash || '#dashboard').slice(1));
  const [mobileOpen, setMobileOpen] = useState(false);
  const [searchQuery, setSearchQuery] = useState('');
  const [prepared, setPrepared] = useState(() => loadIdSet('cd_prepared'));
  const [bookmarks, setBookmarks] = useState(() => loadIdSet('cd_bookmarks'));
  const [dark, setDark] = useState(() => {
    try {
      const saved = localStorage.getItem('cd_theme');
      if (saved) return saved === 'dark';
    } catch (e) {}
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  });

  useEffect(() => {
    const onHash = () => setRoute((location.hash || '#dashboard').slice(1));
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);

  useEffect(() => {
    document.documentElement.classList.toggle('dark', dark);
    try {
      localStorage.setItem('cd_theme', dark ? 'dark' : 'light');
    } catch (e) {}
  }, [dark]);

  useEffect(() => {
    window.scrollTo({ top: 0 });
  }, [route]);

  const togglePrepared = useCallback((id) => {
    setPrepared((prev) => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id);
      else next.add(id);
      saveIdSet('cd_prepared', next);
      return next;
    });
  }, []);

  const toggleBookmark = useCallback((id) => {
    setBookmarks((prev) => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id);
      else next.add(id);
      saveIdSet('cd_bookmarks', next);
      return next;
    });
  }, []);

  const goTo = (id) => {
    location.hash = id;
    setRoute(id);
  };

  const ctxValue = {
    prepared,
    togglePrepared,
    bookmarks,
    toggleBookmark,
    preparedCount: prepared.size,
    total: allQuestions.length,
  };

  let content;
  if (searchQuery.trim()) {
    content = <SearchView query={searchQuery} allQuestions={allQuestions} />;
  } else if (route === 'dashboard') {
    content = <Dashboard data={data} goTo={goTo} />;
  } else if (route.startsWith('unit-')) {
    const n = parseInt(route.split('-')[1], 10);
    const unit = data.units[n - 1];
    content = unit ? <UnitPage unit={unit} /> : <Dashboard data={data} goTo={goTo} />;
  } else if (route === 'repeated') {
    content = <SimplePage title="Most Repeated Questions" icon="🔥" md={data.supplementary.repeatedMd} />;
  } else if (route === 'top') {
    content = <SimplePage title="Top Questions to Prepare" icon="🚨" md={data.supplementary.top30Md} />;
  } else if (route === 'diagrams') {
    content = <SimplePage title="Must-Draw Diagrams" icon="📊" md={data.supplementary.diagramsMd} />;
  } else if (route === 'numericals') {
    content = <SimplePage title="Must-Practice Numericals" icon="🧮" md={data.supplementary.numericalsMd} />;
  } else if (route === 'revision') {
    content = <SimplePage title="One-Day Revision Sheet" icon="⚡" md={data.supplementary.revisionMd} />;
  } else if (route === 'strategy') {
    content = <SimplePage title="Final Exam Strategy" icon="🎯" md={data.supplementary.strategyMd} />;
  } else if (route === 'bookmarks') {
    content = <BookmarksView allQuestions={allQuestions} />;
  } else {
    content = <Dashboard data={data} goTo={goTo} />;
  }

  return (
    <AppCtx.Provider value={ctxValue}>
      <div className="min-h-screen flex bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100">
        <Sidebar route={searchQuery.trim() ? '' : route} goTo={goTo} mobileOpen={mobileOpen} closeMobile={() => setMobileOpen(false)} />
        <div className="flex-1 min-w-0 flex flex-col">
          <TopBar onMenu={() => setMobileOpen(true)} searchQuery={searchQuery} setSearchQuery={setSearchQuery} dark={dark} setDark={setDark} />
          <main className="flex-1 px-4 sm:px-6 lg:px-8 py-6 max-w-6xl w-full mx-auto">{content}</main>
          <footer className="text-center text-xs text-slate-400 dark:text-slate-600 py-6">
            Built for exam prep, not for browsing. Good luck! 🎓
          </footer>
        </div>
      </div>
    </AppCtx.Provider>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

</script>
</body>
</html>
