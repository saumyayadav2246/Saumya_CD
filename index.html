  ↓\n     Absolute (executable) Machine Code\n```", "mustWrite": ["Correct order: Preprocessor → Compiler → Assembler → Linker & Loader.", "One line on the responsibility of each module.", "Mention that Linker & Loader also takes in library files and other object files.", "The full block diagram."], "keywords": ["Preprocessor", "pure HLL", "Compiler", "assembly language", "Assembler", "relocatable machine code", "Linker", "Loader", "absolute machine code"], "finalVersionMd": "The Language Processing System is the complete chain of programs that converts a high-level source program into an executable file. First, the Preprocessor expands macros and includes header files, producing pure high-level language code. This is passed to the Compiler, which translates it into assembly language code through its own six phases. The Assembler then converts this assembly language code into relocatable machine code. Finally, the Linker combines this relocatable code with other object files and library routines, and the Loader fixes the memory addresses and loads the final absolute machine code into memory, ready for execution.\n\n```\nSource Program → Preprocessor → Compiler → Assembler → Linker & Loader → Executable Program\n```\n\n---", "quickRefMd": "**✍️ MINIMUM FULL-MARK ANSWER:** Same diagram as Q3, but explain the flow in words too: HLL source → Preprocessor (removes macros/comments) → Compiler (makes assembly code) → Assembler (makes relocatable machine code) → Linker/Loader (combines with libraries, loads into memory) → Absolute machine code (ready to run).\n\n**Common mistakes:** Same as Q3 — do not skip the diagram.\n\n---", "understandGuMd": "High-level માં લખેલો source program એક જ step માં executable નથી બની જતો. એ ઘણા programs ની એક chain માંથી પસાર થાય છે, જેને સાથે મળીને Language Processing System કહેવાય છે.\n\nસૌથી પહેલા Preprocessor કામ કરે — raw source program લે, code માં વપરાયેલા macros ને expand કરે, header files નું content ઉમેરે, અને output તરીકે 'pure' high-level language code આપે.\n\nઆ pure HLL code પછી Compiler ને અપાય, જે પોતાના 6 internal phases દ્વારા આખા code ને analyse કરીને, એના સમકક્ષ assembly language નો program બનાવે.\n\nઆ assembly language code પછી Assembler ને અપાય, જે mnemonic assembly instructions ને relocatable machine code માં ફેરવે — એટલે એવો machine code જેના memory addresses હજુ fix નથી થયેલા.\n\nછેલ્લે, Linker અને Loader આ relocatable machine code ને લે, બીજા relocatable object files અને જરૂરી library routines સાથે ભેગું કરે, બધા memory addresses ને fix (relocate) કરે, અને પરિણામી absolute machine code ને main memory માં load કરે, જેથી CPU એને execute કરવા માટે તૈયાર હોય.\n\nઆ chain માં દરેક module ની જવાબદારી clear અને અલગ છે: Preprocessor સાફ source code તૈયાર કરે, Compiler એને assembly માં ફેરવવાનું ભારે કામ કરે, Assembler assembly ને machine-understandable form માં ફેરવે, અને Linker & Loader બધું ભેગું કરીને memory માં એક final, run થઈ શકે એવો program બનાવે.", "finalVersionGuMd": "Language Processing System એ programs ની એ પૂરી chain છે જે high-level source program ને executable file માં ફેરવે છે. સૌથી પહેલા, Preprocessor macros ને expand કરે છે અને header files નો content ઉમેરે છે, જેનાથી pure high-level language code બને છે. આ code Compiler ને અપાય છે, જે પોતાના 6 phases દ્વારા એને assembly language code માં ફેરવે છે. પછી Assembler આ assembly language code ને relocatable machine code માં ફેરવે છે. છેલ્લે, Linker આ relocatable code ને બીજા object files અને library routines સાથે ભેગું કરે છે, અને Loader memory addresses ને fix કરીને final absolute machine code ને memory માં load કરે છે, execution માટે તૈયાર.\n\n```\nSource Program → Preprocessor → Compiler → Assembler → Linker & Loader → Executable Program\n```"}], "mediumMd": "(short prep points only)\n\n- **Pass vs Phase:** *Phase* = one step of compilation (6 phases total). *Pass* = one complete scan/reading of the whole source program (compilers here use 2 passes). Table: Pass needs less memory & is faster; Phase needs more memory & is slower. \"Forward reference\" (using a name before declaring it) is why multi-pass compilers exist.\n- **Symbol Table:** a data structure that stores information (type, scope, address) about identifiers, functions, constants used in the program. Works with all 6 phases.\n- **Error Detection per phase:** Lexical → bad/unmatched token; Syntax → grammar (structure) broken; Semantic → right structure but wrong meaning (e.g. type mismatch).\n- **Compiler Construction Tools:** Scanner generators (e.g. LEX — take regex as input), Parser generators (take grammar as input), Syntax-directed translation engines, Automatic code generators, Data-flow analysis engines.\n- **Qualities of a good compiler:** bug-free, generates correct & fast code, compiles quickly, portable, gives good error messages, works with debuggers.", "lowMd": "(question only)\n\n- Give the full form / define: Translator, Compiler, Interpreter, Assembler (basic definitions — Very-High-Priority Q2 already covers the detail needed).\n- What does \"retargeting\" mean?\n- Practice question from the notes: \"What will be the output of each phase for `x = a + b * c`?\" (same method as Q1 — good for self-practice, not likely a separate exam question by itself).", "guRevisionBullets": ["6 Phases (ક્રમમાં): Lexical → Syntax → Semantic → Intermediate Code → Optimization → Code Generation. પહેલા 3 phases = Analysis Phase, છેલ્લા 3 phases = Synthesis Phase.", "Compiler આખો program એકસાથે compile કરે; Interpreter line by line ચલાવે; Assembler assembly code ને machine code માં ફેરવે.", "3 Cousins: Preprocessor, Assembler, Linker & Loader. ક્રમ: Preprocessor→Compiler→Assembler→Linker/Loader.", "Front End source language પર depend કરે; Back End target machine પર depend કરે.", "Compiler ના 6 types: Native, Cross, Source-to-Source, JIT, Incremental, Parallelizing.", "Pass અને Phase અલગ વસ્તુ છે: સામાન્ય રીતે 2 passes માં 6 phases પૂરા થાય."], "enRevisionBullets": ["6 Phases (in order): Lexical → Syntax → Semantic → Intermediate Code → Optimization → Code Generation. Analysis = phases 1–3, Synthesis = phases 4–6.", "Compiler = whole program at once; Interpreter = line by line; Assembler = assembly→machine code.", "3 Cousins: Preprocessor, Assembler, Linker & Loader. Order: Preprocessor→Compiler→Assembler→Linker/Loader.", "Front End = source-dependent; Back End = target-machine-dependent.", "6 types of compiler: Native, Cross, Source-to-Source, JIT, Incremental, Parallelizing.", "Pass ≠ Phase: 2 passes, 6 phases."]}, {"number": 2, "title": "UNIT 2 — Lexical Analysis", "intro": "**What this unit is about (simple words):** How the compiler reads raw text and breaks it into tokens, using Regular Expressions, NFA, and DFA.", "veryHigh": [{"id": "u2-vh-1", "globalIndex": 7, "unit": 2, "priority": "Very High", "question": "Draw the NFA using Thompson's rule for the regular expression `(a|b)*abb`, and convert it into a DFA using the Subset Construction method.", "questionShort": "Convert a Regular Expression to NFA (Thompson's Construction) and then NFA to DFA (Subset Construction) — e.g. `(a|b)*abb`", "marks": "8", "marksNote": "", "repeated": "MU Question (explicit: \"Draw NFA using Thompson's rule and convert into DFA\"), Assignment-1 Q3, CD_3 Q2(b), CD.pdf Q1(A), CD_2 Q4(a)/Q4-OR(a) — appears in **5 sources**, the single most repeated numerical question type in your whole syllabus.", "years": "CD_3 (Dec-2024), CD_2 (Dec-2024), CD.pdf (Sep-2025).", "inPPT": "Yes — heaviest topic in the unit (20+ slides just on this example).", "type": "Algorithm + Diagram (Numerical).", "typeTags": ["Numerical", "Diagram", "Algorithm"], "answerMd": "To build a recognizer for a regular expression, we first construct a Non-deterministic Finite Automaton (NFA) using **Thompson's Construction**, and then convert this NFA into an equivalent Deterministic Finite Automaton (DFA) using the **Subset Construction** method, because a DFA is faster and simpler to actually run in a lexical analyzer.\n\n**Step 1: Build the NFA using Thompson's Rules.**\n\nThompson's construction builds an NFA for a regular expression recursively, using a few basic rules:\n- For a single symbol `a`, draw a start state with an edge labelled `a` going to a final state.\n- For the union `s|t`, create a new start state with two ε-edges going to the start states of N(s) and N(t); the final states of both N(s) and N(t) are joined by ε-edges to one new common final state.\n- For concatenation `st`, connect the final state of N(s) to the start state of N(t) using an ε-edge.\n- For the Kleene star `s*`, create a new start state with an ε-edge into N(s) and a second ε-edge that bypasses N(s) directly to a new final state; also add an ε-edge from the final state of N(s) back to its own start state, to allow repetition.\n\nApplying these rules to `(a|b)*abb` gives an NFA with eleven states (numbered 0 to 10), where states 0 to 7 form the `(a|b)*` portion using a union inside a star, and states 7 to 10 form the literal concatenation of `a`, `b`, and `b` leading to the final accepting state 10.\n\n**Step 2: Convert this NFA into a DFA using Subset Construction.**\n\nThe subset construction algorithm builds each DFA state out of a *set* of NFA states, using two operations:\n- **ε-closure(S)**: the set of all NFA states reachable from the states in S using only ε-transitions.\n- **Move(S, a)**: the set of all NFA states reachable from the states in S on the input symbol `a`.\n\n```\nAlgorithm:\n   Start state of DFA = ε-closure(start state of NFA)\n   While there is an unmarked DFA state T:\n        mark T\n        for each input symbol c:\n             U = ε-closure(Move(T, c))\n             if U is a new set of states, add it as a new unmarked DFA state\n             Dtran[T, c] = U\n```\n\n**Working out the states for `(a|b)*abb`:**\n\n- ε-closure(0) = {0,1,2,4,7} → call this state **A** (this is the DFA start state).\n- Move(A, a) = {3,8}; ε-closure({3,8}) = {1,2,3,4,6,7,8} → call this state **B**.\n- Move(A, b) = {5}; ε-closure({5}) = {1,2,4,5,6,7} → call this state **C**.\n- Move(B, a) = {3,8}; ε-closure = same set as B → so B loops back to itself on `a`.\n- Move(B, b) = {5,9}; ε-closure = {1,2,4,5,6,7,9} → call this state **D**.\n- Move(C, a) = {3,8}; ε-closure = B.\n- Move(C, b) = {5}; ε-closure = C (loops on itself).\n- Move(D, a) = {3,8}; ε-closure = B.\n- Move(D, b) = {5,10}; ε-closure = {1,2,4,5,6,7,10} → call this state **E**. Since state 10 (the NFA's final state) is inside this set, **E is an accepting state**.\n- Move(E, a) = {3,8}; ε-closure = B.\n- Move(E, b) = {5}; ε-closure = C.\n\n**Final DFA transition table:**\n\n| DFA State | on `a` | on `b` |\n|---|---|---|\n| → A | B | C |\n| B | B | D |\n| C | B | C |\n| D | B | E |\n| *E (accepting) | B | C |\n\n**Final Answer:** The DFA has five states, A is the start state, E is the only accepting state, and the table above gives the complete transition function.\n\n**Why each step is done:** ε-closure finds every state we are secretly already inside, because ε-moves do not consume any input; Move finds where a real input symbol takes us next. We keep repeating this pair of steps until no brand-new set of NFA states appears, which guarantees the resulting DFA is complete and correct.\n\n**Common mistakes:** Forgetting to check whether a newly formed state is exactly equal to one you already have (this is why B, C, D, E do not multiply endlessly); forgetting to mark a state accepting if its NFA-state-set contains the NFA's final state, even if it also contains other states.", "diagramMd": "Draw the 5-state DFA using the table above: A (start, with an arrow pointing into it) going to B on `a` and to C on `b`; B looping to itself on `a` and going to D on `b`; C looping to itself on `b` and going to B on `a`; D going to B on `a` and to E on `b`; E (double circle, accepting) going to B on `a` and to C on `b`.", "mustWrite": ["State Thompson's three construction rules (union, concatenation, star) before drawing the NFA.", "Give the correct NFA diagram for `(a|b)*abb`.", "State the subset construction algorithm using ε-closure and Move.", "Show the working for every new DFA state, not just the final table.", "Correctly mark the accepting state (the one whose NFA-state-set contains the NFA's own final state)."], "keywords": ["Thompson's Construction", "ε-closure", "Move", "Subset Construction", "Dtran", "accepting state"], "finalVersionMd": "To convert a regular expression into a DFA, we first build an NFA using Thompson's Construction, and then convert this NFA into a DFA using the Subset Construction method.\n\nThompson's Construction builds the NFA recursively: a single symbol `a` becomes a start state with an `a`-edge to a final state; for `s|t`, a new start state has ε-edges to the starts of N(s) and N(t), whose final states join by ε-edges into one new final state; for concatenation `st`, N(s)'s final state connects by an ε-edge to N(t)'s start state; for `s*`, a new start state has an ε-edge into N(s) and a bypass ε-edge directly to a new final state, and N(s)'s final state has an ε-edge back to its own start state. Applying these rules to `(a|b)*abb` gives an 11-state NFA (states 0 to 10).\n\nThe Subset Construction algorithm converts this NFA to a DFA using ε-closure(S), the set of states reachable from S using only ε-transitions, and Move(S,a), the set of states reachable from S on input `a`. Starting from ε-closure(0) = {0,1,2,4,7} = state A, we repeatedly compute ε-closure(Move(T,c)) for every existing state T and symbol c, adding a new DFA state whenever a new set appears, until no new sets are found.\n\nFor `(a|b)*abb`, this gives the following DFA:\n\n| DFA State | on a | on b |\n|---|---|---|\n| → A | B | C |\n| B | B | D |\n| C | B | C |\n| D | B | E |\n| *E | B | C |\n\nHere A is the start state and E, which contains the NFA's final state 10, is the only accepting state.\n\n---", "quickRefMd": "**What is given:** A regular expression, e.g. `(a|b)*abb`.\n**What to find:** An NFA (using Thompson's rule), then a DFA (using subset construction) that accept the same language.\n\n**Step-by-step solution:**\n\n**Step 1 — Build the NFA using Thompson's rules:**\n- Base case: for symbol `a`, draw `start --a--> final`.\n- For `s|t`: new start state has ε-edges to start of N(s) and N(t); both ends join via ε-edges to one new final state.\n- For `st` (concatenation): join N(s)'s final state to N(t)'s start state (usually with ε).\n- For `s*` (star): new start has an ε-edge into N(s) AND a direct ε-edge (bypass) to a new final state; N(s)'s final state has an ε-edge back to N(s)'s start (loop) and ε-edge forward to the final state.\n\n**Step 2 — Apply Subset Construction (NFA→DFA):**\n```\nAlgorithm:\n  ε-closure(start state) = first DFA state, call it \"A\", mark unmarked\n  While there is an unmarked DFA state T:\n      mark T\n      for each input symbol c:\n          U = ε-closure( Move(T, c) )\n          if U is a new set, add it as a new DFA state (unmarked)\n          Dtran[T, c] = U\n```\n- **ε-closure(S)** = all states you can reach from set S using ONLY ε-edges.\n- **Move(T, a)** = all states you reach from set T on input symbol `a`.\n\n**Full worked example for `(a|b)*abb`:**\n\n| DFA State | NFA states it contains | on `a` | on `b` |\n|---|---|---|---|\n| → A | {0,1,2,4,7} | B | C |\n| B | {1,2,3,4,6,7,8} | B | D |\n| C | {1,2,4,5,6,7} | B | C |\n| D | {1,2,4,5,6,7,9} | B | E |\n| *E (final) | {1,2,4,5,6,7,10} | B | C |\n\n**Final answer:** A 5-state DFA (A=start, E=only accepting state) as shown in the table above; A→B→D→E on input \"abb\" accepts the string.\n\n**Why each step is done:** ε-closure finds \"which states are we secretly already in\" (because ε moves are free); Move finds where a real input symbol takes us. Combining both keeps the DFA correct and deterministic (exactly one path per symbol).\n\n**Common mistakes:** Forgetting to include the start state itself inside its own ε-closure; forgetting that a DFA state is \"accepting\" if its NFA-state-set contains ANY NFA final state; drawing extra states that never actually get produced by the table.\n\n**Exam shortcut:** Always compute ε-closure(start) first and call it \"A\" — then just keep applying Move + ε-closure for `a` and `b` columns until no new sets appear. Never invent a 6th state without deriving it from a Move step.\n\n**✍️ MINIMUM FULL-MARK ANSWER:** Draw the Thompson NFA (or state it has been built) → show ε-closure/Move working for each new state → final Dtran table → final DFA diagram (states + start arrow + double circle on final state).\n\n**➕ ADD THESE IF YOU HAVE TIME:** Also minimize the DFA at the end (see Q3 below) if the question says \"and minimize\".\n\n---", "understandGuMd": "જુઓ ભાઈ, આ પ્રશ્નમાં આપણે એક regular expression `(a|b)*abb` ને પહેલા NFA માં convert કરવાનું છે અને પછી એ NFA ને DFA માં convert કરવાનું છે. કેમ આમ કરવું પડે? કારણ કે NFA બનાવવું algorithm પ્રમાણે સહેલું છે, પણ actually ચલાવવા (execute કરવા) માટે DFA વધારે ઝડપી અને simple છે — એટલે real lexical analyzer માં છેલ્લે DFA જ વપરાય છે.\n\n**Step 1 – Thompson's Construction:**\nઆમાં ચાર basic rules યાદ રાખવાના:\n- એક symbol `a` માટે: એક start state થી એક edge `a` લેબલ સાથે final state માં જાય.\n- Union `s|t` માટે: નવો start state બનાવો જ્યાંથી બે ε-edges N(s) અને N(t) ના start states તરફ જાય, અને બંનેના final states એક નવા common final state માં ε-edge થી ભેગા થાય.\n- Concatenation `st` માટે: N(s) ના final state થી N(t) ના start state સુધી એક ε-edge જોડી દો.\n- Star `s*` માટે: નવો start state બનાવો જેમાંથી એક ε-edge N(s) અંદર જાય અને બીજું ε-edge સીધું N(s) ને bypass કરીને નવા final state માં જાય; અને N(s) ના final state થી પાછું પોતાના start state તરફ ε-edge મૂકો જેથી repetition થઈ શકે.\n\nઆ rules `(a|b)*abb` પર apply કરીએ તો કુલ 11 states (0 થી 10) વાળું NFA બને છે. States 0 થી 7 એ `(a|b)*` ભાગ છે (union, star ની અંદર), અને states 7 થી 10 એ છેલ્લે `a`, `b`, `b` ની concatenation છે જે final accepting state 10 સુધી લઈ જાય છે.\n\n**Step 2 – Subset Construction:**\nહવે આ NFA ને DFA માં convert કરવા બે operations વાપરવાના:\n- ε-closure(S) = S માંથી ફક્ત ε-transitions વાપરીને પહોંચી શકાય એવા બધા states નો set.\n- Move(S, a) = S માંથી input symbol `a` વાપરીને પહોંચી શકાય એવા states નો set.\n\nAlgorithm સાવ સીધું છે: DFA નો start state = ε-closure(NFA નો start state). પછી જ્યાં સુધી કોઈ unmarked DFA state T બાકી હોય, T ને mark કરો અને દરેક symbol c માટે U = ε-closure(Move(T,c)) કાઢો; જો U નવો set હોય તો નવો DFA state ઉમેરો, અને Dtran[T,c] = U લખો.\n\nહવે actual working જોઈએ:\n- ε-closure(0) = {0,1,2,4,7} → આને state **A** કહીએ (DFA નો start state).\n- A પર `a` નાખો: Move(A,a) = {3,8}, અને એનું ε-closure = {1,2,3,4,6,7,8} → state **B**.\n- A પર `b` નાખો: Move(A,b) = {5}, ε-closure = {1,2,4,5,6,7} → state **C**.\n- B પર `a`: Move(B,a) = {3,8}, ε-closure = B પોતે જ (એટલે B પર loop થાય).\n- B પર `b`: Move(B,b) = {5,9}, ε-closure = {1,2,4,5,6,7,9} → state **D**.\n- C પર `a` → B જ મળે (same calculation). C પર `b` → C પોતે (loop).\n- D પર `a` → B. D પર `b`: Move(D,b) = {5,10}, ε-closure = {1,2,4,5,6,7,10} → state **E**. અહીં state 10 (NFA નું final state) આ set માં છે, એટલે E accepting state બને છે.\n- E પર `a` → B, E પર `b` → C.\n\nએટલે final DFA આ પ્રમાણે 5 states નું બને છે: A (start), B, C, D, E (accepting), અને Move+ε-closure repeat કરવાનું બંધ થાય છે કારણ કે હવે કોઈ નવો set નથી બનતો.\n\nધ્યાન રાખવાનું: દર વખતે નવો set બન્યો કે નહિ એ check કરવાનું છે, નહિ તો states endlessly વધ્યા કરે. અને state ને accepting ત્યારે જ કહેવાય જ્યારે એના set માં NFA નું final state (અહીં 10) હોય, પછી ભલે set માં બીજા states પણ હોય.", "finalVersionGuMd": "Regular expression ને DFA માં convert કરવા માટે, પહેલા Thompson's Construction વાપરીને NFA બનાવવામાં આવે છે, અને પછી આ NFA ને Subset Construction method વાપરીને DFA માં convert કરવામાં આવે છે.\n\nThompson's Construction recursively NFA બનાવે છે: એક single symbol `a` એ start state થી `a`-edge વાળા final state માં જાય છે; `s|t` માટે નવો start state N(s) અને N(t) ના start states માં ε-edges થી જોડાય છે, અને એમના final states એક નવા final state માં ε-edges થી ભેગા થાય છે; concatenation `st` માટે N(s) નું final state ε-edge થી N(t) ના start state સાથે જોડાય છે; `s*` માટે નવો start state N(s) માં ε-edge થી જાય છે અને એક bypass ε-edge સીધું નવા final state માં જાય છે, અને N(s) નું final state પોતાના start state તરફ પાછું ε-edge થી જોડાય છે. આ rules ને `(a|b)*abb` પર apply કરતાં 11-state (0 થી 10) NFA મળે છે.\n\nSubset Construction algorithm આ NFA ને DFA માં convert કરે છે, જેમાં ε-closure(S) એટલે S માંથી માત્ર ε-transitions વાપરીને પહોંચી શકાય એવા states નો set, અને Move(S,a) એટલે S માંથી input `a` વાપરીને પહોંચી શકાય એવા states નો set. ε-closure(0) = {0,1,2,4,7} = state A થી શરૂ કરીને, દરેક existing state T અને દરેક symbol c માટે ε-closure(Move(T,c)) repeatedly calculate કરવામાં આવે છે, અને જ્યારે પણ નવો set મળે ત્યારે નવો DFA state ઉમેરવામાં આવે છે, જ્યાં સુધી કોઈ નવો set ના મળે.\n\n`(a|b)*abb` માટે, આ પ્રમાણે DFA મળે છે:\n\n| DFA State | on a | on b |\n|---|---|---|\n| → A | B | C |\n| B | B | D |\n| C | B | C |\n| D | B | E |\n| *E | B | C |\n\nઅહીં A start state છે અને E, જેમાં NFA નું final state 10 છે, એ એકમાત્ર accepting state છે.\n\n---"}, {"id": "u2-vh-2", "globalIndex": 8, "unit": 2, "priority": "Very High", "question": "For a given regular expression, construct the DFA directly using the Syntax Tree method (nullable, firstpos, lastpos, followpos) — for example `(a|b)*abb#`.", "questionShort": "Construct DFA directly from Regular Expression using Syntax Tree Method (nullable, firstpos, lastpos, followpos) — e.g. `(a|b)*abb#`", "marks": "8", "marksNote": "", "repeated": "MU Question (explicit: \"Draw DFA from given expression using firstpos, lastpos and followpos\"), Assignment-1 Q4, PAC Q2, CD_3 Q2-OR(b) — **4 sources**.", "years": "", "inPPT": "Yes, ~14 slides, full worked trace.", "type": "Algorithm (Numerical).", "typeTags": ["Numerical", "Diagram", "Algorithm"], "answerMd": "Instead of first building an NFA and then converting it to a DFA, it is possible to construct the minimal DFA directly from a regular expression using its syntax tree. This method computes four functions on the tree: **nullable**, **firstpos**, **lastpos**, and **followpos**.\n\n**Given:** the regular expression `(a|b)*abb`, with an end-marker `#` appended, so we work with `(a|b)*abb#`.\n\n**Step 1: Build the syntax tree and number every leaf (each occurrence of a symbol) with a unique position.**\nFor `(a|b)*abb#`, the positions are: `a`=1, `b`=2 (both inside the star), `a`=3, `b`=4, `b`=5, `#`=6.\n\n**Step 2: Compute nullable(n) for every node.** A node is nullable only if it is a `*` (star) node or the leaf `ε`; every other node here is not nullable.\n\n**Step 3: Compute firstpos(n) and lastpos(n) bottom-up, using these rules:**\n\n| Node type | nullable | firstpos | lastpos |\n|---|---|---|---|\n| leaf, position i | false | {i} | {i} |\n| OR node (c1\\|c2) | nullable(c1) or nullable(c2) | firstpos(c1) ∪ firstpos(c2) | lastpos(c1) ∪ lastpos(c2) |\n| CAT node (c1.c2) | nullable(c1) and nullable(c2) | firstpos(c1)∪firstpos(c2) if c1 nullable, else firstpos(c1) | lastpos(c1)∪lastpos(c2) if c2 nullable, else lastpos(c2) |\n| STAR node (c1*) | true | firstpos(c1) | lastpos(c1) |\n\nWorking from the leaves upward: firstpos/lastpos of the OR node (a1|b2) = {1,2}; the star node above it also has firstpos = lastpos = {1,2}; the concatenation with `a`(3) gives firstpos={1,2,3}, lastpos={3}; concatenating with `b`(4) gives firstpos={1,2,3}, lastpos={4}; concatenating with `b`(5) gives firstpos={1,2,3}, lastpos={5}; concatenating with `#`(6) at the root gives firstpos={1,2,3}, lastpos={6}.\n\n**Step 4: Compute followpos(i) using two rules:**\n- If n is a concatenation node with left child c1 and right child c2, then for every position i in lastpos(c1), add all positions in firstpos(c2) to followpos(i).\n- If n is a star node, then for every position i in lastpos(n), add firstpos(n) to followpos(i).\n\nThis gives: followpos(1) = {1,2,3}, followpos(2) = {1,2,3}, followpos(3) = {4}, followpos(4) = {5}, followpos(5) = {6}.\n\n**Step 5: Build the DFA directly.** The start state is firstpos(root) = {1,2,3}, call it state A. For a state S and symbol `x`, the next state is the union of followpos(i) for every position i in S that is labelled `x`. A state is accepting if it contains position 6 (the position of `#`).\n\n- State A = {1,2,3}: on `a` (positions 1,3 are `a`) → followpos(1)∪followpos(3) = {1,2,3}∪{4} = {1,2,3,4} = state **B**. On `b` (position 2 is `b`) → followpos(2) = {1,2,3} = A itself.\n- State B = {1,2,3,4}: on `a` → followpos(1)∪followpos(3) = {1,2,3,4} = B itself. On `b` → followpos(2)∪followpos(4) = {1,2,3}∪{5} = {1,2,3,5} = state **C**.\n- State C = {1,2,3,5}: on `a` → {1,2,3,4} = B. On `b` → followpos(2)∪followpos(5) = {1,2,3}∪{6} = {1,2,3,6} = state **D**.\n- State D = {1,2,3,6}: contains position 6, so **D is accepting**. On `a` → {1,2,3,4} = B. On `b` → followpos(2) = {1,2,3} = A.\n\n**Final Answer:**\n\n| State | on a | on b |\n|---|---|---|\n| → A | B | A |\n| B | B | C |\n| C | B | D |\n| *D | B | A |\n\nThis is a 4-state DFA, which has fewer states than the 5-state DFA obtained earlier using subset construction on the Thompson NFA for the same language — this method gives the minimal DFA directly, without a separate minimization step.\n\n**Common mistakes:** Forgetting to attach the end-marker `#` before starting; missing the star-node rule when computing followpos (this is the rule students most often forget); mixing up firstpos with lastpos.", "diagramMd": "Draw the syntax tree with all six numbered leaf positions, writing nullable/firstpos/lastpos values beside each node; then draw the final 4-state DFA table above as a state diagram (A start, D double-circled as accepting).", "mustWrite": ["Add the end-marker `#` to the regular expression first.", "Correct nullable/firstpos/lastpos table with the general rules.", "Correct followpos computation using both the concatenation rule and the star rule.", "Final DFA table, with the accepting state correctly identified as the one containing the position of `#`."], "keywords": ["Syntax tree", "nullable", "firstpos", "lastpos", "followpos", "end-marker", "minimal DFA"], "finalVersionMd": "The direct method builds the minimal DFA from a regular expression's syntax tree, without first building an NFA. First, an end-marker `#` is appended to the expression, and the syntax tree is drawn with every leaf position numbered. Then nullable(n), firstpos(n), and lastpos(n) are computed bottom-up: a node is nullable only if it is a star node or the leaf ε; for an OR node, firstpos and lastpos are the union of the children's values; for a concatenation node, firstpos includes the right child's firstpos only if the left child is nullable, and similarly for lastpos with the left child; for a star node, firstpos and lastpos equal those of its single child.\n\nNext, followpos(i) is computed using two rules: for a concatenation node, every position in lastpos of the left child gets firstpos of the right child added to its followpos; for a star node, every position in its own lastpos gets its own firstpos added to its followpos.\n\nFinally, the DFA is built starting from firstpos(root) as the start state; for each state and each input symbol, the next state is the union of followpos of every position in the current state that carries that symbol; a state is accepting if it contains the position of the end-marker `#`.\n\nFor `(a|b)*abb#`, this produces the 4-state DFA:\n\n| State | on a | on b |\n|---|---|---|\n| → A | B | A |\n| B | B | C |\n| C | B | D |\n| *D | B | A |\n\n---", "quickRefMd": "**What is given:** A regular expression (add an end-marker `#` to it first), e.g. `(a|b)*abb#`.\n**What to find:** The minimal DFA directly, without building an NFA first.\n\n**Step-by-step solution:**\n1. Draw the **syntax tree** for the regex; number every LEAF (symbol) with a unique position (1,2,3,...).\n2. Compute **nullable(n)** for every node: true only for `*` nodes and the `ε` leaf.\n3. Compute **firstpos(n)** and **lastpos(n)** bottom-up using this table:\n\n| Node type | nullable | firstpos | lastpos |\n|---|---|---|---|\n| leaf ε | true | ∅ | ∅ |\n| leaf, position i | false | {i} | {i} |\n| OR node (c1\\|c2) | nullable(c1) or nullable(c2) | firstpos(c1) ∪ firstpos(c2) | lastpos(c1) ∪ lastpos(c2) |\n| CAT node (c1.c2) | nullable(c1) and nullable(c2) | if nullable(c1): firstpos(c1)∪firstpos(c2) else firstpos(c1) | if nullable(c2): lastpos(c1)∪lastpos(c2) else lastpos(c2) |\n| STAR node (c1*) | true | firstpos(c1) | lastpos(c1) |\n\n4. Compute **followpos(i)** with 2 rules:\n   - If n is a CAT node with children c1, c2: for every position i in lastpos(c1), add all of firstpos(c2) to followpos(i).\n   - If n is a STAR node: for every position i in lastpos(n), add firstpos(n) to followpos(i).\n5. Build the DFA: start state = firstpos(root). For each DFA state S and symbol `a`, new state = union of followpos(i) for every position i in S that is labelled `a`. A state is accepting if it contains the position of `#`.\n\n**Worked example for `(a|b)*abb#`** (positions: a=1, b=2, a=3, b=4, b=5, #=6):\n\nfollowpos table: followpos(1)={1,2,3}, followpos(2)={1,2,3}, followpos(3)={4}, followpos(4)={5}, followpos(5)={6}.\n\nResulting DFA:\n| State | positions | a | b |\n|---|---|---|---|\n| → A | {1,2,3} | B | A |\n| B | {1,2,3,4} | B | C |\n| C | {1,2,3,5} | B | D |\n| *D (final) | {1,2,3,6} | B | A |\n\n**Final answer:** 4-state minimal DFA (A start, D accepting) — notice this has FEWER states than the subset-construction DFA in Q1 for the same language, because this method gives the minimal DFA directly.\n\n**Common mistakes:** Forgetting to add `#` to the end of the regex before starting; mixing up firstpos and lastpos; forgetting the STAR-node followpos rule (this is the one students most often skip).\n\n**Exam shortcut:** Do nullable/firstpos/lastpos in ONE pass bottom-up (write all 3 values next to each tree node as you go up); then do followpos as a separate, second pass.\n\n**✍️ MINIMUM FULL-MARK ANSWER:** Syntax tree with position numbers → nullable/firstpos/lastpos table → followpos table → final DFA table + diagram.\n\n---", "understandGuMd": "આ method માં આપણે NFA બનાવ્યા વગર, સીધું regular expression ના syntax tree પરથી minimal DFA બનાવીએ છીએ. આ માટે ચાર functions કાઢવા પડે: nullable, firstpos, lastpos, અને followpos.\n\nGiven expression `(a|b)*abb` છે, પણ આપણે એના છેડે end-marker `#` ઉમેરીને `(a|b)*abb#` લઈએ છીએ.\n\n**Step 1:** Syntax tree બનાવો અને દરેક leaf (symbol નું દરેક occurrence) ને એક unique position number આપો. અહીં: પહેલો `a`=1, પહેલો `b`=2 (બંને star ની અંદર), પછી `a`=3, `b`=4, `b`=5, અને `#`=6.\n\n**Step 2:** દરેક node માટે nullable(n) કાઢો. કોઈ node nullable ત્યારે જ કહેવાય જ્યારે એ `*` (star) node હોય અથવા leaf `ε` હોય. બાકી બધા nodes અહીં nullable નથી.\n\n**Step 3:** firstpos(n) અને lastpos(n) bottom-up કાઢો, rules પ્રમાણે:\n- leaf position i: firstpos = lastpos = {i}.\n- OR node (c1|c2): firstpos = firstpos(c1)∪firstpos(c2), lastpos = lastpos(c1)∪lastpos(c2).\n- CAT node (c1.c2): જો c1 nullable હોય તો firstpos = firstpos(c1)∪firstpos(c2), નહિતર ફક્ત firstpos(c1); એ જ રીતે c2 nullable હોય તો lastpos = lastpos(c1)∪lastpos(c2), નહિતર ફક્ત lastpos(c2).\n- STAR node: firstpos = lastpos = firstpos(child).\n\nનીચેથી ઉપર જઈએ: (a1|b2) OR node નું firstpos=lastpos={1,2}; એની ઉપરનું star node પણ firstpos=lastpos={1,2} રાખે; પછી `a`(3) સાથે concatenation કરતાં firstpos={1,2,3}, lastpos={3}; પછી `b`(4) સાથે concatenation કરતાં firstpos={1,2,3}, lastpos={4}; પછી `b`(5) સાથે concatenation કરતાં firstpos={1,2,3}, lastpos={5}; છેલ્લે root પર `#`(6) સાથે concatenation કરતાં firstpos={1,2,3}, lastpos={6}.\n\n**Step 4:** followpos(i) બે rules થી કાઢો:\n- concatenation node માટે: c1 ના lastpos માંના દરેક position i માટે, c2 ના firstpos ને followpos(i) માં ઉમેરો.\n- star node માટે: node ના પોતાના lastpos માંના દરેક position i માટે, node ના પોતાના firstpos ને followpos(i) માં ઉમેરો.\n\nઆનાથી મળે: followpos(1)={1,2,3}, followpos(2)={1,2,3}, followpos(3)={4}, followpos(4)={5}, followpos(5)={6}.\n\n**Step 5:** હવે સીધો DFA બનાવો. Start state = firstpos(root) = {1,2,3}, એને state A કહો. કોઈ state S અને symbol x માટે, next state = S માંના x લેબલવાળા બધા positions ના followpos નું union. જે state માં position 6 (એટલે કે `#` ની position) હોય એ accepting state ગણાય.\n\n- A={1,2,3}: `a` પર (positions 1,3 એ `a` છે) → followpos(1)∪followpos(3) = {1,2,3,4} = state **B**. `b` પર (position 2) → followpos(2) = {1,2,3} = A પોતે.\n- B={1,2,3,4}: `a` પર → {1,2,3,4} = B પોતે. `b` પર → followpos(2)∪followpos(4) = {1,2,3,5} = state **C**.\n- C={1,2,3,5}: `a` પર → B. `b` પર → followpos(2)∪followpos(5) = {1,2,3,6} = state **D**.\n- D={1,2,3,6}: આમાં position 6 છે એટલે **D accepting**. `a` પર → B. `b` પર → followpos(2) = {1,2,3} = A.\n\nઆ રીતે 4-state DFA સીધો મળી જાય છે — subset construction વાળા 5-state DFA કરતાં ઓછા states, કારણ કે આ method સીધો minimal DFA આપે છે, અલગથી minimization કરવાની જરૂર નથી પડતી.\n\nધ્યાન રાખવાનું: end-marker `#` ઉમેરવાનું ભૂલવું નહિ, followpos કાઢતી વખતે star-node નો rule ભૂલવો નહિ (વિદ્યાર્થીઓ મોટે ભાગે આ rule ભૂલી જાય છે), અને firstpos-lastpos ને ગૂંચવવા નહિ.", "finalVersionGuMd": "Direct method regular expression ના syntax tree પરથી સીધો minimal DFA બનાવે છે, પહેલા NFA બનાવ્યા વગર. પહેલા expression ના છેડે end-marker `#` ઉમેરવામાં આવે છે, અને દરેક leaf position ને number આપીને syntax tree દોરવામાં આવે છે. પછી nullable(n), firstpos(n), અને lastpos(n) bottom-up કાઢવામાં આવે છે: કોઈ node nullable ત્યારે જ હોય જ્યારે એ star node હોય અથવા leaf ε હોય; OR node માટે firstpos અને lastpos એ children ના values નું union હોય છે; concatenation node માટે, left child nullable હોય તો જ firstpos માં right child નું firstpos ઉમેરાય છે, અને એ જ રીતે lastpos માં, right child nullable હોય તો જ left child નું lastpos ઉમેરાય છે; star node માટે firstpos અને lastpos એના એકમાત્ર child ના બરાબર હોય છે.\n\nપછી, followpos(i) બે rules વાપરીને કાઢવામાં આવે છે: concatenation node માટે, left child ના lastpos માંના દરેક position ના followpos માં right child નું firstpos ઉમેરાય છે; star node માટે, પોતાના lastpos માંના દરેક position ના followpos માં પોતાનું firstpos ઉમેરાય છે.\n\nછેલ્લે, DFA નો start state firstpos(root) લઈને બનાવવામાં આવે છે; દરેક state અને દરેક input symbol માટે, next state એ current state માંના તે symbol વાળા બધા positions ના followpos નું union હોય છે; જે state માં end-marker `#` ની position હોય એ state accepting ગણાય છે.\n\n`(a|b)*abb#` માટે, આ પ્રમાણે 4-state DFA મળે છે:\n\n| State | on a | on b |\n|---|---|---|\n| → A | B | A |\n| B | B | C |\n| C | B | D |\n| *D | B | A |\n\n---"}, {"id": "u2-vh-3", "globalIndex": 9, "unit": 2, "priority": "Very High", "question": "Explain DFA Minimization (Optimization of DFA) using the Partitioning Algorithm, with an example.", "questionShort": "DFA Minimization (Optimization) using the Partitioning Algorithm", "marks": "8", "marksNote": "", "repeated": "MU Question (explicit, combined with Q1), CD_2 Q4-OR(a) (\"Minimize following DFA\") — 2 direct sources, but it is very often the 2nd half of Q1.", "years": "", "inPPT": "Yes, full algorithm + 1 worked example.", "type": "Algorithm (Numerical).", "typeTags": ["Numerical", "Diagram", "Algorithm"], "answerMd": "A DFA obtained from subset construction may contain more states than necessary. **Minimizing a DFA** means finding the smallest possible DFA that accepts exactly the same language. States can be removed if they are unreachable from the start state, if they are dead states that can never lead to acceptance, or if two states are indistinguishable, meaning they behave in exactly the same way for every possible input.\n\n**Algorithm (Partitioning Algorithm):**\n1. Remove all states that cannot be reached from the start state through any sequence of transitions.\n2. Divide the remaining states into two groups: T1 containing all the final (accepting) states, and T2 containing all the non-final states.\n3. Within each group, check whether every state goes to a state in the same group for every input symbol. If some states in a group behave differently from others, split that group further into smaller sub-groups.\n4. Repeat step 3 for every group until no group can be split any further.\n5. Choose one representative state from each final group, and rewrite the transition table using only these representative states — this gives the minimized DFA.\n\n**Given:** the 5-state DFA obtained earlier for `(a|b)*abb`:\n\n| State | a | b |\n|---|---|---|\n| A | B | C |\n| B | B | D |\n| C | B | C |\n| D | B | E |\n| E (final) | B | C |\n\n**Step 1:** All 5 states are reachable from A, so none are removed.\n\n**Step 2:** Split into T1 = {E} (final) and T2 = {A,B,C,D} (non-final).\n\n**Step 3:** Inside T2, check each state's behaviour: A goes to (B,C); B goes to (B,D); C goes to (B,C); D goes to (B,E). A and C behave the same (both go to B on `a` and stay in the group on `b`), so {A,C} can stay together, while B and D each go to a different group (D leads to the final group E) and so must be separated out. This gives three sub-groups: {A,C}, {B}, {D}.\n\n**Step 4:** No group can be split further, so the final groups are {A,C}, {B}, {D}, {E}.\n\n**Step 5:** Choosing A as the representative of {A,C}, the minimized transition table becomes:\n\n| State | a | b |\n|---|---|---|\n| A | B | A |\n| B | B | D |\n| D | B | E |\n| E (final) | B | A |\n\n**Final Answer:** The minimized DFA has 4 states instead of 5, because state C was found to be equivalent to state A and merged into it.\n\n**Common mistakes:** Merging two states just because they \"look similar\" without actually checking both input columns; forgetting to remove unreachable states before starting the partitioning.", "diagramMd": "Draw a partition tree showing the splits: {A,B,C,D,E} splits into {A,B,C,D} and {E}; {A,B,C,D} splits into {A,B,C} and {D}; {A,B,C} splits into {A,C} and {B}. Then draw the final 4-state minimized DFA diagram.", "mustWrite": ["All 5 steps of the partitioning algorithm, in the correct order.", "Correctly split states into final and non-final groups first.", "Show the actual checking of each state's transitions before merging (not just claiming two states are equal).", "Correct final minimized table with fewer states than the original."], "keywords": ["Minimization", "unreachable states", "dead states", "indistinguishable states", "partitioning algorithm"], "finalVersionMd": "DFA minimization finds the smallest DFA equivalent to a given DFA by removing unreachable states, dead states, and states that behave identically to one another. The partitioning algorithm does this in five steps: first remove unreachable states; then split all remaining states into a group of final states and a group of non-final states; then, within each group, check whether every state transitions to the same group on every input symbol, splitting the group further wherever a state behaves differently; repeat this splitting until no group can be split any further; finally, pick one representative state from each resulting group and rewrite the transition table using only these representatives.\n\nApplying this to the DFA with states A, B, C, D, E (E final), we first separate {A,B,C,D} from {E}. Checking transitions within {A,B,C,D} shows that A and C behave identically, so they merge, while B and D must remain separate because D leads into the final state group. This gives the minimized 4-state DFA:\n\n| State | a | b |\n|---|---|---|\n| A | B | A |\n| B | B | D |\n| D | B | E |\n| E (final) | B | A |", "quickRefMd": "**What is given:** A DFA (possibly with extra/repeated states).\n**What to find:** The smallest equivalent DFA.\n\n**Algorithm (write these steps in the exam):**\n1. Remove all states that are unreachable from the start state.\n2. Split all states into two groups: **T1 = final (accepting) states**, **T2 = non-final states**.\n3. Within each group, check: do two states go to the SAME group on every input symbol? If yes, they can be merged. If a state in the group behaves differently, split it into a new sub-group.\n4. Repeat step 3 until no group can be split further.\n5. Pick one representative state per final group; redraw the transition table using only these representatives — this is your minimized DFA.\n\n**Worked example (minimizing the 5-state DFA A,B,C,D,E from Q1):**\n\nStart: {A,B,C,D} (non-final) and {E} (final) → split {A,B,C,D} further → {A,C} behave the same, {B} and {D} are each different → final groups: {A,C}, {B}, {D}, {E}.\n\n**Minimized table (4 states instead of 5, C merged into A):**\n| State | a | b |\n|---|---|---|\n| A | B | A |\n| B | B | D |\n| D | B | E |\n| E | B | A |\n\n**Common mistakes:** Merging two states just because they look similar without checking BOTH input columns; forgetting to remove unreachable states first.\n\n**✍️ MINIMUM FULL-MARK ANSWER:** Starting transition table → partition into final/non-final → show the split steps (a small tree diagram of splits is a bonus) → final minimized table.\n\n---", "understandGuMd": "Subset construction થી મળેલ DFA માં ક્યારેક જરૂર કરતાં વધારે states હોય છે. DFA ને minimize કરવું એટલે એ જ language accept કરતું સૌથી નાનું DFA શોધવું. States ને remove કરી શકાય જો: (1) એ start state થી પહોંચી જ ના શકાય (unreachable), (2) એ dead state હોય જે ક્યારેય accept તરફ ના લઈ જાય, અથવા (3) બે states indistinguishable હોય, એટલે કે દરેક possible input માટે બંને બરાબર same રીતે behave કરે.\n\n**Partitioning Algorithm ના 5 steps:**\n1. Start state થી કોઈ પણ sequence of transitions વડે ના પહોંચી શકાય એવા states remove કરો.\n2. બાકીના states ને બે groups માં split કરો: T1 = બધા final (accepting) states, T2 = બધા non-final states.\n3. દરેક group ની અંદર check કરો કે દરેક state દરેક input symbol પર same group માં જ જાય છે કે નહિ. જો કોઈ states અલગ રીતે behave કરે તો એ group ને વધુ નાના sub-groups માં split કરો.\n4. Step 3 ને દરેક group પર repeat કરો જ્યાં સુધી કોઈ પણ group વધુ split ના થાય.\n5. દરેક final group માંથી એક representative state પસંદ કરો, અને ફક્ત આ representatives વાપરીને transition table ફરીથી લખો — આ જ minimized DFA છે.\n\nહવે example જોઈએ. પહેલા પ્રશ્નમાં મળેલું 5-state DFA `(a|b)*abb` માટે લઈએ:\n\n| State | a | b |\n|---|---|---|\n| A | B | C |\n| B | B | D |\n| C | B | C |\n| D | B | E |\n| E (final) | B | C |\n\n**Step 1:** A થી બધા 5 states પહોંચી શકાય છે, એટલે કોઈ state remove નહિ થાય.\n\n**Step 2:** T1 = {E} (final), T2 = {A,B,C,D} (non-final).\n\n**Step 3:** T2 ની અંદર દરેક state નું behaviour check કરીએ: A જાય છે (B,C) માં; B જાય છે (B,D) માં; C જાય છે (B,C) માં; D જાય છે (B,E) માં. A અને C બંને same રીતે behave કરે છે (બંને `a` પર B માં જાય છે અને `b` પર પોતાના group માં જ રહે છે), એટલે {A,C} સાથે રહી શકે. પણ B અને D અલગ groups તરફ જાય છે (D તો final group E તરફ લઈ જાય છે), એટલે એમને અલગ કરવા પડે. આમ ત્રણ sub-groups મળે: {A,C}, {B}, {D}.\n\n**Step 4:** હવે કોઈ group વધુ split નહિ થાય, એટલે final groups છે: {A,C}, {B}, {D}, {E}.\n\n**Step 5:** {A,C} નું representative A લઈએ, તો minimized transition table આ પ્રમાણે બને:\n\n| State | a | b |\n|---|---|---|\n| A | B | A |\n| B | B | D |\n| D | B | E |\n| E (final) | B | A |\n\nએટલે minimized DFA માં 5 ને બદલે 4 states રહ્યા, કારણ કે state C, state A ની બરાબર જ નીકળ્યું અને એમાં merge થઈ ગયું.\n\nધ્યાન રાખવાનું: બે states ને ફક્ત \"સરખા દેખાય છે\" એ કારણથી merge ના કરવા, બંને input columns actually check કરવા; અને partitioning શરૂ કરતાં પહેલા unreachable states remove કરવાનું ભૂલવું નહિ.", "finalVersionGuMd": "DFA minimization એ આપેલ DFA ની બરાબર જ language accept કરતું સૌથી નાનું DFA શોધવાની પ્રક્રિયા છે, જેમાં unreachable states, dead states, અને એકબીજા જેવું જ behave કરતા states remove કરવામાં આવે છે. Partitioning algorithm આ કામ પાંચ steps માં કરે છે: પહેલા unreachable states remove કરો; પછી બાકીના બધા states ને final states ના group અને non-final states ના group માં split કરો; પછી, દરેક group ની અંદર, check કરો કે દરેક state દરેક input symbol પર same group તરફ જ જાય છે કે નહિ, અને જ્યાં કોઈ state અલગ રીતે behave કરે ત્યાં group ને વધુ split કરો; આ splitting ને ત્યાં સુધી repeat કરો જ્યાં સુધી કોઈ group વધુ split ના થાય; છેલ્લે, દરેક resulting group માંથી એક representative state પસંદ કરો અને ફક્ત આ representatives વાપરીને transition table ફરીથી લખો.\n\nઆને states A, B, C, D, E (E final) વાળા DFA પર apply કરતાં, પહેલા {A,B,C,D} ને {E} થી અલગ કરીએ છીએ. {A,B,C,D} ની અંદર transitions check કરતાં ખબર પડે છે કે A અને C બરાબર સરખું behave કરે છે, એટલે એ merge થાય છે, જ્યારે B અને D અલગ જ રહેવા જોઈએ કારણ કે D final state group તરફ લઈ જાય છે. આનાથી minimized 4-state DFA મળે છે:\n\n| State | a | b |\n|---|---|---|\n| A | B | A |\n| B | B | D |\n| D | B | E |\n| E (final) | B | A |"}], "high": [{"id": "u2-high-1", "globalIndex": 10, "unit": 2, "priority": "High", "question": "Write Regular Expressions for given languages, and write Regular Definitions for an identifier and for an unsigned number.", "questionShort": "Write Regular Expressions for given languages / Regular Definitions for identifiers and numbers", "marks": "4–6", "marksNote": "", "repeated": "Assignment-1 Q5 (5 languages), CD_3 Q1(b)-2, CD.pdf Q1(B) — **3 sources**.", "years": "", "inPPT": "Yes, ~15 worked micro-examples — the single most example-dense topic in the unit.", "type": "Theory/Derivation.", "typeTags": ["Theory"], "answerMd": "A **regular expression** is a formula built from symbols of an alphabet, using union (`|`), concatenation, and the Kleene star (`*`), that describes exactly the set of strings belonging to a language. A **regular definition** is a sequence of named regular expressions, where each name can be used inside the definition of the next one, which makes it easier to build up complicated patterns step by step.\n\n**Regular expressions for common languages (Σ = {0,1} unless stated otherwise):**\n\n| Language | Regular Expression |\n|---|---|\n| A single 0 or a single 1 | `0\\|1` |\n| One or more 0's | `0+` |\n| All binary strings of 0's and 1's | `(0\\|1)*` |\n| A binary string that ends with 0 | `(0\\|1)*0` |\n| A binary string that starts with 1 | `1(0\\|1)*` |\n| A binary string that ends with 01 | `(0\\|1)*01` |\n| A string with exactly two 0's | `1*01*01*` |\n| A string of a's, then b's, then c's | `a*b*c*` |\n\n**Regular Definition for an identifier:**\n```\nletter  →  A | B | ... | Z | a | b | ... | z\ndigit   →  0 | 1 | ... | 9\nid      →  letter (letter | digit)*\n```\nThis says an identifier must start with a letter, and can be followed by any number of letters or digits.\n\n**Regular Definition for an unsigned number:**\n```\ndigit   →  0 | 1 | ... | 9\ndigits  →  digit digit*\nnumber  →  digits ( . digits )? ( E (+|-)? digits )?\n```\nThis says a number is made of one or more digits, optionally followed by a decimal point and more digits, and optionally followed by an exponent part starting with `E`, an optional sign, and more digits — this correctly matches numbers like `5280`, `39.37`, and `1.894E-4`.", "diagramMd": "", "mustWrite": ["Correct definitions of regular expression and regular definition.", "Correctly formed regular expression for whichever language is asked, tested mentally against 2–3 sample strings.", "The identifier and unsigned-number regular definitions built step by step using named rules, not written as one giant expression."], "keywords": ["Regular expression", "regular definition", "alphabet", "Kleene star", "union", "concatenation"], "finalVersionMd": "A regular expression is a formula, built using union, concatenation, and the Kleene star operators over an alphabet, that describes exactly the set of strings forming a language. A regular definition is a sequence of named regular expressions, where a later definition may use the names defined earlier, making it easier to describe complex patterns step by step.\n\nFor example, over Σ={0,1}, the regular expression for all binary strings is `(0|1)*`, for a binary string ending in 0 is `(0|1)*0`, and for a string with exactly two 0's is `1*01*01*`.\n\nThe regular definition for an identifier is:\n```\nletter → A|B|...|Z|a|b|...|z\ndigit  → 0|1|...|9\nid     → letter (letter | digit)*\n```\nThe regular definition for an unsigned number is:\n```\ndigit  → 0|1|...|9\ndigits → digit digit*\nnumber → digits (.digits)? (E(+|-)? digits)?\n```\n\n---", "quickRefMd": "**Must-know ready-made REs (memorise this table, Σ={0,1} unless stated):**\n\n| Language | Regular Expression |\n|---|---|\n| 0 or 1 | `0\\|1` |\n| One or more 0's | `0+` |\n| All binary strings | `(0\\|1)*` |\n| Binary string ending in 0 | `(0\\|1)*0` |\n| Binary string starting with 1 | `1(0\\|1)*` |\n| String ending with 01 | `(0\\|1)*01` |\n| Exactly two 0's | `1*01*01*` |\n| a*'s then b*'s then c*'s | `a*b*c*` |\n\n**Regular Definition — Identifier:**\n```\nletter → A|B|...|Z|a|b|...|z\ndigit  → 0|1|...|9\nid     → letter (letter | digit)*\n```\n\n**Regular Definition — Even number:**\n```\nSign      → + | - | ε\nDigit     → 0|1|...|9\nEvenDigit → 0|2|4|6|8\nEvenNumber → Sign Digit* EvenDigit\n```\n\n**Regular Definition — Unsigned number:**\n```\ndigit  → [0-9]\ndigits → digit+\nnumber → digits (.digits)? (E[+-]? digits)?\n```\n\n**✍️ MINIMUM FULL-MARK ANSWER:** For \"write RE\" questions — give the RE directly using the table style above, and test it mentally on 2–3 sample strings. For \"regular definition\" questions — write named rules building up step by step (as shown).\n\n**Common mistakes:** Forgetting `ε` (empty string) as an option when \"zero or more\" is asked; using `+` and `*` incorrectly (`+` = one or more, `*` = zero or more).\n\n---", "understandGuMd": "Regular expression એટલે એક formula જે કોઈ alphabet ના symbols માંથી union (`|`), concatenation, અને Kleene star (`*`) વાપરીને બનાવવામાં આવે છે, અને એ બરાબર એ strings નો set describe કરે છે જે કોઈ ચોક્કસ language માં આવે છે. Regular definition એટલે named regular expressions ની એક sequence, જ્યાં આગળ define કરેલ નામ પછીના definition માં વાપરી શકાય, જેનાથી complicated patterns ને step by step બનાવવાનું સહેલું પડે છે.\n\nહવે થોડા common languages (Σ = {0,1} ધારીને) ના regular expressions જોઈએ:\n- એક single 0 અથવા single 1 → `0|1`\n- એક કે એથી વધુ 0's → `0+`\n- 0 અને 1 ના બધા જ possible binary strings → `(0|1)*`\n- 0 થી પૂરું થતું binary string → `(0|1)*0`\n- 1 થી શરૂ થતું binary string → `1(0|1)*`\n- 01 થી પૂરું થતું binary string → `(0|1)*01`\n- બરાબર બે 0's વાળી string → `1*01*01*`\n- પહેલા a's, પછી b's, પછી c's વાળી string → `a*b*c*`\n\nહવે Regular Definition જોઈએ. identifier માટે:\n```\nletter  →  A | B | ... | Z | a | b | ... | z\ndigit   →  0 | 1 | ... | 9\nid      →  letter (letter | digit)*\n```\nઆનો મતલબ એ કે identifier ની શરૂઆત letter થી જ થવી જોઈએ, અને પછી letters કે digits ગમે તેટલી વાર આવી શકે.\n\nUnsigned number માટે:\n```\ndigit   →  0 | 1 | ... | 9\ndigits  →  digit digit*\nnumber  →  digits ( . digits )? ( E (+|-)? digits )?\n```\nઆનો મતલબ number માં પહેલા એક કે વધુ digits આવે, પછી optionally decimal point અને વધુ digits આવે, અને પછી optionally `E` થી શરૂ થતો exponent ભાગ આવે જેમાં optional sign અને digits હોય — આ પ્રમાણે `5280`, `39.37`, અને `1.894E-4` જેવા numbers બરાબર match થાય છે.", "finalVersionGuMd": "Regular expression એ union, concatenation, અને Kleene star operators વાપરીને, કોઈ alphabet પર બનાવેલ એક formula છે, જે બરાબર એ strings નો set describe કરે છે જે કોઈ language બનાવે છે. Regular definition એ named regular expressions ની એક sequence છે, જ્યાં પછીનું definition પહેલા define કરેલ નામ વાપરી શકે છે, જેનાથી complex patterns ને step by step describe કરવાનું સહેલું બને છે.\n\nઉદાહરણ તરીકે, Σ={0,1} પર, બધા binary strings માટે regular expression `(0|1)*` છે, 0 થી પૂરું થતી binary string માટે `(0|1)*0` છે, અને બરાબર બે 0's વાળી string માટે `1*01*01*` છે.\n\nIdentifier માટે regular definition:\n```\nletter → A|B|...|Z|a|b|...|z\ndigit  → 0|1|...|9\nid     → letter (letter | digit)*\n```\nUnsigned number માટે regular definition:\n```\ndigit  → 0|1|...|9\ndigits → digit digit*\nnumber → digits (.digits)? (E(+|-)? digits)?\n```\n\n---"}, {"id": "u2-high-2", "globalIndex": 11, "unit": 2, "priority": "High", "question": "Explain Tokens, Lexemes, and Patterns with a suitable example.", "questionShort": "Explain Tokens, Lexemes, and Patterns (with example)", "marks": "4", "marksNote": "", "repeated": "CD_2 Q1(b)-iii, CD_3 Q1(b)-7 — short-answer style, likely in every paper's Q1 section.", "years": "", "inPPT": "Yes.", "type": "Theory.", "typeTags": ["Theory"], "answerMd": "During lexical analysis, three closely related terms are used to describe how the source program's characters are grouped and classified.\n\nA **token** is a category of lexical unit, such as an identifier, a keyword, an operator, or a constant, and represents the smallest meaningful entity of the program that the lexical analyzer produces as output. A **lexeme** is the actual sequence of characters in the source program that matches the pattern for a token; for example, the actual text `total` is a lexeme. A **pattern** is the rule, often written as a regular expression, that describes what set of lexemes can form a particular token; for example, the pattern for the identifier token could be \"a letter followed by letters and digits\".\n\n**Example:** For the statement `Total = Ans + 30`, the lexical analyzer identifies the following:\n\n| Lexeme | Token |\n|---|---|\n| Total | identifier |\n| = | assignment operator |\n| Ans | identifier |\n| + | addition operator |\n| 30 | constant |", "diagramMd": "", "mustWrite": ["Correct one-line definition of Token, Lexeme, and Pattern.", "A worked example showing at least 3–4 lexeme-to-token mappings from one statement."], "keywords": ["Token", "Lexeme", "Pattern", "identifier", "constant"], "finalVersionMd": "A token is a category of lexical unit, such as an identifier, keyword, operator, or constant, and is the smallest meaningful unit produced by the lexical analyzer. A lexeme is the actual sequence of characters in the source program that matches a token's pattern. A pattern is the rule, usually a regular expression, describing which lexemes belong to a given token.\n\nFor the statement `Total = Ans + 30`, the lexical analyzer produces: `Total` as an identifier, `=` as an assignment operator, `Ans` as an identifier, `+` as an addition operator, and `30` as a constant.\n\n---", "quickRefMd": "**⭐ One-line definitions:**\n- **Token:** a category of lexical unit (e.g. identifier, keyword, operator).\n- **Lexeme:** the actual sequence of characters matched (e.g. `total`).\n- **Pattern:** the rule (often a regex) describing what lexemes belong to a token.\n\n**Worked example:** For `Total = Ans + 30`: tokens are id(Total), =, id(Ans), +, num(30).\n\n**✍️ MINIMUM FULL-MARK ANSWER:** the 3 definitions + the worked example table (Lexeme | Token | Pattern).\n\n**🔑 Keywords:** category, matched string, rule.\n\n---", "understandGuMd": "Lexical analysis દરમિયાન source program ના characters ને કેવી રીતે group અને classify કરવામાં આવે છે એ સમજાવવા માટે ત્રણ related terms વપરાય છે.\n\nToken એ lexical unit ની એક category છે, જેમ કે identifier, keyword, operator, અથવા constant, અને lexical analyzer જે output આપે છે એમાં એ સૌથી નાનું meaningful unit ગણાય. Lexeme એ source program માં આવેલ characters ની actual sequence છે જે કોઈ token ના pattern સાથે match થાય; દાખલા તરીકે, actual text `total` એક lexeme છે. Pattern એ rule છે, જે મોટે ભાગે regular expression તરીકે લખાય છે, જે describe કરે છે કે કયા lexemes કોઈ particular token બનાવી શકે; દાખલા તરીકે, identifier token નું pattern હોઈ શકે \"એક letter પછી letters અને digits\".\n\n**Example:** statement `Total = Ans + 30` માટે, lexical analyzer આ પ્રમાણે ઓળખે છે:\n\n| Lexeme | Token |\n|---|---|\n| Total | identifier |\n| = | assignment operator |\n| Ans | identifier |\n| + | addition operator |\n| 30 | constant |", "finalVersionGuMd": "Token એ lexical unit ની category છે, જેમ કે identifier, keyword, operator, અથવા constant, અને lexical analyzer દ્વારા produce થતું સૌથી નાનું meaningful unit છે. Lexeme એ source program માં આવેલ characters ની actual sequence છે જે કોઈ token ના pattern સાથે match થાય છે. Pattern એ rule છે, સામાન્ય રીતે regular expression, જે describe કરે છે કે કયા lexemes કોઈ ચોક્કસ token ના છે.\n\nStatement `Total = Ans + 30` માટે, lexical analyzer આ પ્રમાણે produce કરે છે: `Total` ને identifier તરીકે, `=` ને assignment operator તરીકે, `Ans` ને identifier તરીકે, `+` ને addition operator તરીકે, અને `30` ને constant તરીકે.\n\n---"}, {"id": "u2-high-3", "globalIndex": 12, "unit": 2, "priority": "High", "question": "Draw the Transition Diagram for relational operators, and for unsigned numbers.", "questionShort": "Draw Transition Diagram for Relational Operators / Unsigned Numbers", "marks": "6", "marksNote": "", "repeated": "MU Question (explicit), CD.pdf Q5(B) — 2 sources.", "years": "", "inPPT": "Yes, both are full worked diagrams.", "type": "Diagram.", "typeTags": ["Diagram"], "answerMd": "A transition diagram is a flowchart-like picture that shows how a lexical analyzer recognizes a token, using states drawn as circles connected by edges labelled with input characters; the start state has an incoming arrow, and the accepting (final) state is drawn as a double circle.\n\n**Relational operators** (`<`, `<=`, `<>`, `=`, `>`, `>=`): starting from state 0, reading `<` moves to state 1; from state 1, reading `=` moves to a final state that returns the token `relop, LE`; from state 1, reading `>` moves to a final state returning `relop, NE`; from state 1, reading any other character moves to a final state returning `relop, LT` (after putting the extra character back). Similarly, from state 0, reading `=` directly moves to a final state returning `relop, EQ`; and reading `>` moves to a state which, on `=`, gives `relop, GE`, and on any other character, gives `relop, GT`.\n\n**Unsigned numbers** (like `5280`, `39.37`, `1.894E-4`): starting from state 1, reading a digit moves to state 2, which loops back on itself for more digits; from state 2, reading a `.` moves to state 3, then a digit moves to state 4, which also loops on more digits; from state 2 or state 4, reading `E` moves toward a state for the optional `+` or `-` sign, followed by digits that loop, ending in an accepting state.", "diagramMd": "```\nRelational operator diagram:\nstate0 --<--> state1 --=--> [relop, LE]\n                     \\--->--> [relop, NE]\n                     \\--other--> [relop, LT]  (retract character)\nstate0 --=--> [relop, EQ]\nstate0 --->--> state6 --=--> [relop, GE]\n                     \\--other--> [relop, GT]  (retract character)\n\nUnsigned number diagram:\nstart --digit--> (loop) --.--> digit --(loop)--> --E--> (+/-)? --digit--(loop)--> accept\n```", "mustWrite": ["Correct number and placement of states for both diagrams.", "Correctly show self-loops for repeated digits.", "Correctly mark accepting states with a double circle and label what token/attribute is returned."], "keywords": ["Transition diagram", "state", "accepting state", "relop", "retract"], "finalVersionMd": "A transition diagram represents how a lexical analyzer recognizes a token, using circles for states and labelled edges for input characters, with the accepting state shown as a double circle.\n\nFor relational operators, from the start state, reading `<` leads to a state where reading `=` gives the token `relop,LE`, reading `>` gives `relop,NE`, and reading anything else gives `relop,LT` after putting back the extra character. From the start state, reading `=` directly gives `relop,EQ`, and reading `>` leads to a state where `=` gives `relop,GE` and anything else gives `relop,GT`.\n\nFor unsigned numbers, from the start state, reading a digit moves to a state that loops on further digits; reading a `.` then moves to a state expecting more digits, which also loops; from either point, reading `E` leads to an optional `+` or `-` sign followed by more digits that loop into the final accepting state, correctly recognizing numbers such as `5280`, `39.37`, and `1.894E-4`.\n\n---", "quickRefMd": "**📊 DIAGRAM: MUST DRAW (Relational operators `<, <=, <>, =, >, >=`)**\n```\nstate0 --<--> state1 --=--> state2 [return LE]\n                    \\--→--> state3 [return NE]\n                    \\--other--> state4 [return LT] (retract input)\nstate0 --=--> state5 [return EQ]\nstate0 --->--> state6 --=--> state7 [return GE]\n                    \\--other--> state8 [return GT] (retract input)\n```\n**📊 DIAGRAM: MUST DRAW (Unsigned numbers, e.g. 5280, 39.37, 1.894E-4)**\n```\nstart --digit--> (loop on digit) --.--> digit(loop) --E--> (+/-)? --digit--> (loop) --> accept\n                                 \\---------------------E-----------------------------/\n```\n*Why draw this:* transition diagrams are pure diagram-recall marks — quick and safe marks if practiced.\n\n**✍️ MINIMUM FULL-MARK ANSWER:** Draw the diagram with states as circles, accepting state as double circle, and label each edge with the input symbol.\n\n---", "understandGuMd": "Transition diagram એ એક flowchart જેવું ચિત્ર છે જે બતાવે છે કે lexical analyzer કોઈ token ને કેવી રીતે ઓળખે છે. આમાં states circles તરીકે દોરાય છે અને એમની વચ્ચેની edges પર input characters લખેલા હોય છે; start state પર એક incoming arrow હોય છે, અને accepting (final) state ને double circle થી બતાવવામાં આવે છે.\n\nRelational operators (`<`, `<=`, `<>`, `=`, `>`, `>=`) માટે: state 0 થી શરૂ કરીને, `<` વાંચતા state 1 માં જવાય; state 1 થી `=` વાંચતા એક final state માં જવાય જે token `relop, LE` return કરે; state 1 થી `>` વાંચતા final state `relop, NE` return કરે; state 1 થી બીજું કોઈપણ character વાંચતા final state `relop, LT` return કરે (પણ એ extra character ને પાછું retract કરવું પડે). એ જ રીતે, state 0 થી સીધું `=` વાંચતા final state `relop, EQ` મળે; અને `>` વાંચતા એક state માં જવાય જ્યાંથી `=` વાંચતા `relop, GE` મળે, અને બીજું કંઈ પણ વાંચતા `relop, GT` મળે.\n\nUnsigned numbers (જેમ કે `5280`, `39.37`, `1.894E-4`) માટે: state 1 થી શરૂ કરીને, digit વાંચતા state 2 માં જવાય, જે વધુ digits માટે પોતાના પર loop કરે; state 2 થી `.` વાંચતા state 3 માં જવાય, પછી digit વાંચતા state 4 માં જવાય, જે પણ વધુ digits પર loop કરે; state 2 અથવા state 4 થી `E` વાંચતા, optional `+` અથવા `-` sign વાળા state તરફ જવાય, અને પછી digits આવે જે loop કરીને accepting state માં પૂરું થાય.", "finalVersionGuMd": "Transition diagram lexical analyzer કોઈ token ને કેવી રીતે ઓળખે છે એ represent કરે છે, જેમાં states માટે circles અને input characters માટે labelled edges વપરાય છે, અને accepting state ને double circle થી બતાવવામાં આવે છે.\n\nRelational operators માટે, start state થી `<` વાંચતા એક state મળે છે જ્યાંથી `=` વાંચતા token `relop,LE` મળે, `>` વાંચતા `relop,NE` મળે, અને બીજું કંઈપણ વાંચતા extra character પાછું મૂક્યા પછી `relop,LT` મળે. Start state થી સીધું `=` વાંચતા `relop,EQ` મળે છે, અને `>` વાંચતા એક state મળે છે જ્યાં `=` વાંચતા `relop,GE` અને બીજું કંઈપણ વાંચતા `relop,GT` મળે છે.\n\nUnsigned numbers માટે, start state થી digit વાંચતા એક state મળે છે જે વધુ digits પર loop કરે છે; `.` વાંચતા વધુ digits ની અપેક્ષા રાખતા state માં જવાય છે, જે પણ loop કરે છે; આમાંથી કોઈ પણ point પરથી `E` વાંચતા optional `+` અથવા `-` sign પછી વધુ digits આવે છે જે loop કરીને final accepting state માં પૂરું થાય છે, અને આ રીતે `5280`, `39.37`, અને `1.894E-4` જેવા numbers બરાબર ઓળખાય છે.\n\n---"}, {"id": "u2-high-4", "globalIndex": 13, "unit": 2, "priority": "High", "question": "What technique is used to speed up the Lexical Analyzer? Discuss it in detail with a neat diagram and algorithm.", "questionShort": "Explain Input Buffering (Buffer Pairs and Sentinels) with algorithm", "marks": "6–8", "marksNote": "", "repeated": "CD_3 Q1(b)-5 (name 2 buffering schemes) — short-answer, but PPT gives it 8 full slides with 2 algorithms, so treat as a possible long question too (\"Which technique speeds up lexical analysis? Discuss with diagram and algorithm\" — Assignment-1 Q9).", "years": "", "inPPT": "Yes, heavy detail.", "type": "Theory + Algorithm + Diagram.", "typeTags": ["Theory", "Diagram", "Algorithm"], "answerMd": "Reading the source program one character at a time directly from the disk is very slow, because every single character would require a separate, expensive input/output operation. To avoid this, lexical analyzers use a technique called **input buffering**, which reads a large block of characters into memory at once and lets the lexical analyzer work on this in-memory buffer instead of the disk directly. This is the technique that is mainly used to speed up lexical analysis.\n\n**Buffer Pairs.** The buffer is divided into two halves, each of size N characters, where N is usually the size of one disk block. Each half is filled by a single system read operation. Two pointers are used: `lexemeBegin`, which marks the start of the current lexeme, and `forward`, which scans ahead character by character until a pattern match for a token is found. When a lexeme is identified, `lexemeBegin` moves to the position right after it, and the current lexeme is the text between the two pointers.\n\n**Algorithm to advance the forward pointer (Buffer Pairs):**\n```\nif forward is at the end of the first half then\n     reload the second half\n     forward := forward + 1\nelse if forward is at the end of the second half then\n     reload the first half\n     move forward to the beginning of the first half\nelse\n     forward := forward + 1\n```\nThis requires two checks every time the pointer moves: one to check whether we are at the end of a buffer half, and one to read the actual character.\n\n**Sentinels.** To reduce this to a single check, a special character called a sentinel, usually `eof`, is placed at the end of each buffer half. Now the forward pointer only needs to check whether the character it just read is the sentinel; only if it is, does it then check which half of the buffer it has reached.\n\n**Algorithm to advance the forward pointer (with Sentinels):**\n```\nforward := forward + 1\nif forward = eof then\n     if forward is at the end of the first half then\n          reload the second half\n          forward := forward + 1\n     else if forward is at the end of the second half then\n          reload the first half\n          move forward to the beginning of the first half\n     else\n          terminate lexical analysis (real end of input reached)\n```\nThis is faster because, in the common case where the character read is not the sentinel, only a single comparison is needed.", "diagramMd": "```\n[ ... E : = : M : *   C : *  : * : 2 : eof ]  ← first half     [ ...     eof ]  ← second half (also ends with eof)\n                    ↑                    ↑\n             lexeme_beginning         forward\n```", "mustWrite": ["Reason input buffering exists: reading from disk one character at a time is too slow.", "Two pointers: lexemeBegin and forward.", "Buffer Pairs explained, with its 2-check-per-move drawback.", "Sentinel scheme explained, with its 1-check-per-move improvement — this is the actual \"speed up\" answer.", "Diagram of the buffer with both pointers shown."], "keywords": ["Input buffering", "Buffer Pairs", "lexemeBegin", "forward pointer", "Sentinel", "eof"], "finalVersionMd": "Reading the source program one character at a time from disk is slow, so lexical analyzers use input buffering to speed up scanning. In the Buffer Pairs scheme, the buffer is split into two halves of N characters each, filled by one read operation each. Two pointers are used: lexemeBegin, marking the start of the current lexeme, and forward, which scans ahead until a token pattern is matched; the lexeme is the text between the two pointers. Moving the forward pointer normally requires two checks each time: whether the end of a buffer half has been reached, and what character was read.\n\nTo speed this up further, a Sentinel character, usually eof, is placed at the end of each buffer half. Now the forward pointer only needs one check per move: whether the character just read is the sentinel. Only when it is the sentinel does the algorithm then check which half of the buffer has ended, reload the other half, and continue; if the sentinel appears at the true end of input, lexical analysis terminates. This Sentinel-based buffering is the technique used to speed up the lexical analyzer, since it reduces the two checks needed per character down to one.\n\n---", "quickRefMd": "**Simple explanation:** Reading the source program 1 character at a time from disk is slow. So the lexer reads a big block (buffer) at once, and uses \"lookahead\" to peek ahead before deciding a token is complete.\n\n**Must-write points:**\n- **Buffer Pairs:** buffer split into 2 halves of N characters each; two pointers — `lexemeBegin` (start of current lexeme) and `forward` (scans ahead). Needs 2 checks per pointer move (end-of-buffer check + character check).\n- **Sentinels:** put a special `eof` character at the end of each buffer half. Now only 1 check is needed per move (just check if you hit `eof`) — this makes it faster.\n\n**📊 DIAGRAM: MUST DRAW**\n```\n[ : : :E: :=: :M:*: C:*:*:2:eof ]   ← first half             [ : : :eof]  ← second half also ends with eof\n              ↑                  ↑\n      lexeme_beginning        forward\n```\n\n**✍️ MINIMUM FULL-MARK ANSWER:** Definition of the problem (I/O is slow) + Buffer Pairs explanation + Sentinel explanation (this IS the \"technique used to speed up lexical analyzer\") + one diagram.\n\n**➕ ADD THESE IF YOU HAVE TIME:** the exact pseudocode for advancing the `forward` pointer with sentinels:\n```\nforward := forward + 1\nif forward = eof then\n    if forward at end of first half: reload second half; forward := forward+1\n    else if forward at end of second half: reload first half; move forward to start\n    else: terminate (real end of file)\n```\n\n**Common mistakes:** Saying Sentinel is a totally different buffer (it is the SAME buffer-pair idea, just with an eof marker added at each end).", "understandGuMd": "Source program ને disk માંથી એક-એક character વાંચવું ખૂબ slow છે, કારણ કે દરેક character માટે એક અલગ, expensive I/O operation કરવી પડે. આ ટાળવા માટે lexical analyzers input buffering નામની technique વાપરે છે, જેમાં એકસાથે memory માં characters નો મોટો block વાંચી લેવાય છે અને lexical analyzer disk ને બદલે આ in-memory buffer પર જ કામ કરે છે. Lexical analysis ને speed up કરવા માટે મુખ્યત્વે આ જ technique વપરાય છે.\n\n**Buffer Pairs:** Buffer ને બે ભાગમાં વહેંચવામાં આવે છે, દરેક ભાગનું size N characters (સામાન્ય રીતે N એ એક disk block જેટલું હોય). દરેક half એક જ system read operation થી ભરાય છે. બે pointers વપરાય છે: lexemeBegin, જે current lexeme ની શરૂઆત બતાવે છે, અને forward, જે character by character આગળ scan કરે છે જ્યાં સુધી કોઈ token નું pattern match ના મળે. જ્યારે lexeme ઓળખાઈ જાય, ત્યારે lexemeBegin એની બરાબર પછીની position પર move થાય છે, અને current lexeme એટલે બંને pointers વચ્ચેનું text.\n\nForward pointer ને આગળ વધારવાનું algorithm (Buffer Pairs):\n```\nif forward is at the end of the first half then\n     reload the second half\n     forward := forward + 1\nelse if forward is at the end of the second half then\n     reload the first half\n     move forward to the beginning of the first half\nelse\n     forward := forward + 1\n```\nઆમાં દર વખતે pointer move કરતી વખતે બે checks કરવા પડે છે: એક એ check કરવા કે આપણે buffer half ના છેડે છીએ કે નહિ, અને બીજું actual character વાંચવા માટે.\n\n**Sentinels:** આ બે checks ને એક જ check માં ઘટાડવા માટે, દરેક buffer half ના છેડે એક ખાસ character મૂકવામાં આવે છે જેને sentinel કહેવાય (સામાન્ય રીતે `eof`). હવે forward pointer ને ફક્ત એ જ check કરવાનું રહે છે કે એણે હમણાં જ જે character વાંચ્યું એ sentinel છે કે નહિ; ફક્ત જ્યારે એ sentinel હોય, ત્યારે જ એ check કરે કે buffer નો કયો half પૂરો થયો છે.\n\nForward pointer ને આગળ વધારવાનું algorithm (Sentinels સાથે):\n```\nforward := forward + 1\nif forward = eof then\n     if forward is at the end of the first half then\n          reload the second half\n          forward := forward + 1\n     else if forward is at the end of the second half then\n          reload the first half\n          move forward to the beginning of the first half\n     else\n          terminate lexical analysis (real end of input reached)\n```\nઆ વધારે ઝડપી છે કારણ કે, common case માં જ્યારે વાંચેલું character sentinel ના હોય, ત્યારે ફક્ત એક જ comparison કરવું પડે છે.", "finalVersionGuMd": "Source program ને disk માંથી એક-એક character વાંચવું slow છે, એટલે lexical analyzers scanning speed up કરવા માટે input buffering વાપરે છે. Buffer Pairs scheme માં, buffer ને N characters ના બે halves માં split કરવામાં આવે છે, જે દરેક એક read operation થી ભરાય છે. બે pointers વપરાય છે: lexemeBegin, જે current lexeme ની શરૂઆત બતાવે છે, અને forward, જે token pattern match ના મળે ત્યાં સુધી આગળ scan કરે છે; lexeme એટલે બંને pointers વચ્ચેનું text. Forward pointer ને move કરવા માટે સામાન્ય રીતે દર વખતે બે checks જોઈએ: buffer half નો છેડો આવ્યો છે કે નહિ, અને કયું character વંચાયું.\n\nઆને વધુ speed up કરવા માટે, દરેક buffer half ના છેડે એક Sentinel character મૂકવામાં આવે છે, સામાન્ય રીતે eof. હવે forward pointer ને દર move એ ફક્ત એક જ check કરવો પડે છે: હમણાં વાંચેલું character sentinel છે કે નહિ. ફક્ત જ્યારે એ sentinel હોય ત્યારે જ algorithm check કરે છે કે buffer નો કયો half પૂરો થયો, બીજો half reload કરે છે, અને આગળ ચાલુ રાખે છે; જો sentinel input ના true end પર આવે, તો lexical analysis terminate થાય છે. આ Sentinel-based buffering જ lexical analyzer ને speed up કરવા વપરાતી technique છે, કારણ કે એ per-character જરૂરી બે checks ને ઘટાડીને એક કરી દે છે."}], "mediumMd": "(short prep points only)\n\n- **Finite Automata — DFA vs NFA:** DFA = exactly one transition per state per symbol (fast, deterministic). NFA = can have multiple transitions on the same symbol, and ε-transitions allowed (more flexible, needs fewer states sometimes but slower to run directly).\n- **Operations on Strings:** prefix, suffix, substring, proper prefix/suffix/substring, subsequence — know 1-line meaning + tiny example using a word like \"banana\".\n- **Operations on Languages:** Union (L∪S), Concatenation (LS), Kleene closure (L*, zero or more), Positive closure (L+, one or more).\n- **Role of Lexical Analyzer (diagram):** Source program → Lexical Analyzer ⇄ Parser (parser calls \"get next token\"), both connected to Symbol Table.", "lowMd": "(question only)\n\n- Dealing with lexical errors (panic mode recovery: insert/delete/replace/transpose a character).\n- Attributes for tokens (e.g. `<id, pointer to symbol table>`).\n- Precedence and associativity rules for regex operators (`*` highest, then concatenation, then `|`).", "guRevisionBullets": ["Token એટલે category, Lexeme એટલે actual text, અને Pattern એટલે rule (regex) જે એ text ને ઓળખે છે.", "RE ના rules યાદ રાખો: `*` = zero or more વાર, `+` = એક અથવા વધુ વાર, `|` = or (બેમાંથી ગમે તે એક).", "Thompson's Construction માં base cases (ε, single symbol) અને 3 rules હોય છે: union, concatenation અને star.", "Subset Construction: પહેલા ε-closure(start) = A લો, પછી દરેક symbol માટે Move + ε-closure repeat કરો, અને છેલ્લે Dtran table બનાવો.", "firstpos/lastpos/followpos: numbered leaves વાળું syntax tree બનાવો → nullable કાઢો → firstpos/lastpos કાઢો → followpos ના 2 rules (CAT અને STAR) વાપરીને DFA બનાવો.", "DFA Minimization: states ને final/non-final groups માં split કરો → groups stable ના થાય ત્યાં સુધી split કરતા રહો → same-behaviour states ને merge કરો."], "enRevisionBullets": ["Token = category; Lexeme = actual text; Pattern = rule (regex).", "RE rules: `*`=zero or more, `+`=one or more, `|`=or.", "Thompson's Construction: base cases (ε, single symbol) + 3 rules (union, concat, star).", "Subset Construction: `ε-closure(start)=A` → repeat Move+ε-closure for each symbol → build Dtran table.", "firstpos/lastpos/followpos: build syntax tree with numbered leaves → nullable → firstpos/lastpos → followpos (2 rules: CAT and STAR) → build DFA from firstpos(root) and followpos.", "DFA Minimization: split into final/non-final groups → keep splitting until stable → merge same-behaviour states."]}, {"number": 3, "title": "UNIT 3 — Parsing", "intro": "**What this unit is about (simple words):** How the compiler checks that tokens follow grammar rules, using two approaches: Top-Down (LL) and Bottom-Up (LR family).\n\n**Note:** This is your heaviest unit — in CD.pdf it carried **36.36%** of the whole paper. Do not skip it.", "veryHigh": [{"id": "u3-vh-1", "globalIndex": 14, "unit": 3, "priority": "Very High", "question": "Check whether the given grammar is LL(1). Construct the LL(1) parsing table and parse the given input string. (`E→E+T|T, T→T*F|F, F→(E)|id`, string `id+id*id`)", "questionShort": "Construct the LL(1) Parsing Table and Parse a given string (full 4-step method)", "marks": "8", "marksNote": "", "repeated": "Assignment-2 Q1, PAC Q3, CD.pdf Q3(B)-OR, CD_2 Q2(a) — **4 sources**, and this is the single most fully-worked example in the PPT (6 slides, one complete pipeline).", "years": "", "inPPT": "", "type": "Algorithm (Numerical).", "typeTags": ["Numerical", "Diagram", "Algorithm"], "answerMd": "An **LL(1)** parser is a top-down parser that scans the input from Left to right, builds a Leftmost derivation, and decides which production to use by looking at only 1 lookahead symbol. It is table-driven: a parsing table tells the parser exactly which production to apply for a given non-terminal and current input symbol. There are four steps used to check whether a grammar is LL(1) and then to parse a string using it.\n\n**Given:** grammar `E→E+T|T, T→T*F|F, F→(E)|id`, string to parse: `id+id*id`.\n\n**Step 1: Remove left recursion.** The grammar `E→E+T|T` and `T→T*F|F` are both left-recursive, so we transform them using the standard formula, giving:\n```\nE  → T E'\nE' → + T E' | ε\nT  → F T'\nT' → * F T' | ε\nF  → ( E ) | id\n```\n\n**Step 2: Compute FIRST and FOLLOW for every non-terminal.**\n\n| Non-terminal | FIRST | FOLLOW |\n|---|---|---|\n| E | { (, id } | { $, ) } |\n| E' | { +, ε } | { $, ) } |\n| T | { (, id } | { +, $, ) } |\n| T' | { *, ε } | { +, $, ) } |\n| F | { (, id } | { *, +, $, ) } |\n\n**Step 3: Construct the predictive parsing table M[non-terminal, terminal].** For each production A→α, if a terminal `a` is in FIRST(α), put A→α in M[A,a]; if α is nullable (can derive ε), also put A→α in M[A,b] for every terminal b in FOLLOW(A).\n\n| | id | + | * | ( | ) | $ |\n|---|---|---|---|---|---|---|\n| E | E→TE' | | | E→TE' | | |\n| E' | | E'→+TE' | | | E'→ε | E'→ε |\n| T | T→FT' | | | T→FT' | | |\n| T' | | T'→ε | T'→*FT' | | T'→ε | T'→ε |\n| F | F→id | | | F→(E) | | |\n\nSince every cell of this table has at most one entry, the grammar **is LL(1)**.\n\n**Step 4: Parse the input string `id+id*id$` using a stack, starting with `$E` on the stack.** At each step, if the stack top is a terminal matching the current input symbol, pop the stack and move the input pointer forward; if the stack top is a non-terminal, look up the table and replace it with the right-hand side of the chosen production (pushed in reverse order, so the leftmost symbol ends up on top). Continue until the stack contains only `$` and the input pointer is also at `$`, at which point the parse is **accepted**.\n\n**Final Answer:** The grammar is LL(1); a full parsing table has been constructed above, and the string `id+id*id` is successfully accepted using this table.\n\n**Common mistakes:** Trying to build the LL(1) table before removing left recursion (this will never work correctly); pushing the production's right-hand side onto the stack in the wrong order.\n\n**Exam shortcut:** A grammar fails to be LL(1) only if some table cell ends up with two or more entries; if you find this while filling the table, state clearly \"grammar is NOT LL(1) because of a conflict in cell [X, y]\".", "diagramMd": "| Stack | Input | Action |\n|---|---|---|\n| $E | id+id*id$ | E→TE' |\n| $E'T | id+id*id$ | T→FT' |\n| $E'T'F | id+id*id$ | F→id |\n| $E'T'id | id+id*id$ | match id |\n| $E'T' | +id*id$ | T'→ε |\n
