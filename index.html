`)", "questionShort": "Generate Three Address Code (TAC), Quadruple, Triple, and Indirect Triple for a given expression", "marks": "4–8", "marksNote": "", "repeated": "Assignment-2 Q4, PAC Q5, CD_1 Q2(B), CD_2 Q6(a), CD_3 Q6(b) & Q6-OR(b) — **6 occurrences, one of the most repeated question types overall.**", "years": "", "inPPT": "", "type": "Algorithm (Numerical).", "typeTags": ["Numerical", "Algorithm"], "answerMd": "An intermediate representation is a form of code that sits between the source program and the final machine code, and is designed to be both easy for the compiler to produce and easy for it to translate further. **Three Address Code (TAC)** is the most common intermediate representation, in which every statement has the general form `x := y op z`, with at most one operator per statement. In an actual compiler, TAC statements are usually stored as records, and there are three common ways of doing this: Quadruples, Triples, and Indirect Triples.\n\n**Given:** the expression `a := b * -c + b * -c`.\n\n**Step 1: Write the Three Address Code.** Since the expression has two identical repeated computations, `-c` and `b*(-c)`, a simple (non-optimizing) translation computes each one separately, using a new temporary variable for every operation:\n```\nt1 := uminus c\nt2 := b * t1\nt3 := uminus c\nt4 := b * t3\nt5 := t2 + t4\na  := t5\n```\n\n**Step 2: Represent this as Quadruples.** A **Quadruple** is a record with four fields: Op, Arg1, Arg2, and Result.\n\n| # | Op | Arg1 | Arg2 | Result |\n|---|---|---|---|---|\n| 0 | uminus | c | | t1 |\n| 1 | * | b | t1 | t2 |\n| 2 | uminus | c | | t3 |\n| 3 | * | b | t3 | t4 |\n| 4 | + | t2 | t4 | t5 |\n| 5 | := | t5 | | a |\n\n**Step 3: Represent this as Triples.** A **Triple** has only three fields: Op, Arg1, and Arg2. Instead of naming a temporary result (like t1), a Triple refers to the value computed by an earlier statement using that statement's own position number, so no temporary names need to be stored in the symbol table.\n\n| # | Op | Arg1 | Arg2 |\n|---|---|---|---|\n| (0) | uminus | c | |\n| (1) | * | b | (0) |\n| (2) | uminus | c | |\n| (3) | * | b | (2) |\n| (4) | + | (1) | (3) |\n| (5) | := | a | (4) |\n\n**Step 4: Represent this as Indirect Triples.** An **Indirect Triple** stores the same Triple table as above, but adds a separate list of pointers giving the actual execution order of the statements; this extra layer of indirection makes it easier to reorder statements later during optimization, without having to renumber the triples themselves.\n\nStatement list: `(0)→(14), (1)→(15), (2)→(16), (3)→(17), (4)→(18), (5)→(19)`\n\nTriple table (now stored at positions 14–19):\n| # | Op | Arg1 | Arg2 |\n|---|---|---|---|\n| (14) | uminus | c | |\n| (15) | * | b | (14) |\n| (16) | uminus | c | |\n| (17) | * | b | (16) |\n| (18) | + | (15) | (17) |\n| (19) | := | a | (18) |\n\n**Final Answer:** the TAC, Quadruple table, Triple table, and Indirect Triple table for the expression are exactly as shown in Steps 1 to 4 above.\n\n**Why each step is done:** TAC gives the simplest, \"logical\" version of the code; Quadruple, Triple, and Indirect Triple are just three different ways of physically storing that same TAC inside the compiler, each with a different trade-off between simplicity (Quadruple) and memory saved by not storing temporary names (Triple and Indirect Triple).\n\n**Common mistakes:** Writing a temporary name such as t1 inside a Triple's Arg2 field instead of the statement's position number — this defeats the entire purpose of using a Triple.", "diagramMd": "", "mustWrite": ["Correct TAC with a separate temporary for every single operation.", "Quadruple table with all four fields correctly filled.", "Triple table that correctly uses position numbers instead of temporary names.", "Indirect Triple table with a separate statement-pointer list."], "keywords": ["Three Address Code", "Quadruple", "Triple", "Indirect Triple", "temporary variable", "position number"], "finalVersionMd": "Three Address Code (TAC) is an intermediate representation where every statement has the form `x := y op z`, with at most one operator per statement. For `a := b * -c + b * -c`, the TAC is:\n```\nt1 := uminus c\nt2 := b * t1\nt3 := uminus c\nt4 := b * t3\nt5 := t2 + t4\na  := t5\n```\n\nA Quadruple stores each TAC statement as a record with four fields — Op, Arg1, Arg2, Result:\n\n| # | Op | Arg1 | Arg2 | Result |\n|---|---|---|---|---|\n| 0 | uminus | c | | t1 |\n| 1 | * | b | t1 | t2 |\n| 2 | uminus | c | | t3 |\n| 3 | * | b | t3 | t4 |\n| 4 | + | t2 | t4 | t5 |\n| 5 | := | t5 | | a |\n\nA Triple uses only three fields — Op, Arg1, Arg2 — and refers to earlier results by their statement's position number instead of a temporary name:\n\n| # | Op | Arg1 | Arg2 |\n|---|---|---|---|\n| (0) | uminus | c | |\n| (1) | * | b | (0) |\n| (2) | uminus | c | |\n| (3) | * | b | (2) |\n| (4) | + | (1) | (3) |\n| (5) | := | a | (4) |\n\nAn Indirect Triple keeps the same Triple table but adds a separate list of pointers giving the execution order, which makes it easier to reorder statements during optimization without renumbering the triples themselves.\n\n---", "quickRefMd": "**What is given:** An expression, e.g. `a := b * -c + b * -c` (this exact expression is reused across the whole PPT — VERY likely to reappear).\n**What to find:** Its TAC, Quadruple table, Triple table, Indirect Triple table.\n\n**⭐ Definitions:**\n- **TAC (Three Address Code):** a sequence of statements of the form `x := y op z`, with at most one operator per statement.\n- **Quadruple:** a record with 4 fields — `Op, Arg1, Arg2, Result`.\n- **Triple:** a record with 3 fields — `Op, Arg1, Arg2` (no Result field; other triples refer to this one BY ITS POSITION NUMBER instead of a temp name).\n- **Indirect Triple:** like a Triple, but you also keep a separate list of POINTERS to the triples (helps in reordering code for optimization).\n\n**Worked example — `a := b * -c + b * -c`:**\n\nTAC:\n```\nt1 := uminus c\nt2 := b * t1\nt3 := uminus c\nt4 := b * t3\nt5 := t2 + t4\na  := t5\n```\n\nQuadruple:\n| # | Op | Arg1 | Arg2 | Result |\n|---|---|---|---|---|\n| 0 | uminus | c | | t1 |\n| 1 | * | b | t1 | t2 |\n| 2 | uminus | c | | t3 |\n| 3 | * | b | t3 | t4 |\n| 4 | + | t2 | t4 | t5 |\n| 5 | := | t5 | | a |\n\nTriple (uses statement NUMBERS instead of t1,t2...):\n| # | Op | Arg1 | Arg2 |\n|---|---|---|---|\n| 0 | uminus | c | |\n| 1 | * | b | (0) |\n| 2 | uminus | c | |\n| 3 | * | b | (2) |\n| 4 | + | (1) | (3) |\n| 5 | := | a | (4) |\n\nIndirect Triple: same triple table as above, PLUS a separate statement-pointer list `(0)→(14), (1)→(15), ...` pointing to where each triple actually sits.\n\n**Why each step is done:** TAC is the \"plain\" version; Quadruple/Triple/Indirect-Triple are just 3 different ways to actually STORE that TAC in the compiler's memory.\n\n**Exam shortcut:** Always do TAC first (easiest), then just re-format the SAME steps into Quadruple/Triple/Indirect-Triple — don't recompute from scratch each time.\n\n**Common mistakes:** In Triple, writing a temp name like t1 instead of the statement number (0),(1)... — this defeats the whole purpose of Triples; forgetting the assignment statement itself needs its own row (op=`:=` or `assign`).\n\n**✍️ MINIMUM FULL-MARK ANSWER:** TAC → Quadruple table → Triple table (Indirect Triple only if marks are high, e.g. 8).\n\n---"}, {"id": "u4-vh-2", "globalIndex": 23, "unit": 4, "priority": "Very High", "question": "What do you mean by an Activation Record? Explain all its fields with a neat diagram.", "questionShort": "Explain Activation Record with a neat diagram (all fields)", "marks": "6–8", "marksNote": "", "repeated": "Assignment-2 Q5, PAC Q6, CD_1 Q1(B)/Q5(B)-OR, CD_2 Q3-OR(c)/Q5(c), CD_3 Q5-OR(a), CD.pdf Q2(A)-OR — **7 occurrences, the single MOST REPEATED theory question in your entire syllabus.**", "years": "", "inPPT": "", "type": "Theory + Diagram.", "typeTags": ["Theory", "Diagram"], "answerMd": "An **Activation Record** is a block of memory used to manage all the information required for a single execution, called an activation, of a procedure. Every time a procedure is called, a new activation record is created for that particular call, and it is destroyed once the procedure finishes executing. In languages like Pascal and C, activation records are placed on a stack, since procedure calls and returns naturally follow a last-in-first-out order; in older languages like Fortran, they are placed in static memory instead.\n\nAn activation record typically has the following seven fields:\n\n**1. Return value.** This field is used to store the result of the function call, so that the calling procedure can use it after the call finishes.\n\n**2. Actual parameters.** This field holds the values (or addresses) of the parameters that were passed to the called procedure.\n\n**3. Control link.** Also called the **dynamic link**, this field points to the activation record of the procedure that called this one, so that control can return correctly after this call finishes.\n\n**4. Access link.** Also called the **static link**, this field points to the activation record that holds any non-local data needed by this procedure, which is useful in languages that allow nested procedure definitions.\n\n**5. Saved machine status.** This field stores the values of the machine registers and the program counter exactly as they were just before this call began, so the calling procedure's state can be correctly restored after the call finishes.\n\n**6. Local variables.** This field holds the data that is local to the current execution of the procedure.\n\n**7. Temporaries.** This field holds temporary values that are needed during the evaluation of expressions inside the procedure.", "diagramMd": "```\n ┌───────────────────────────┐\n │        Return Value          │\n ├───────────────────────────┤\n │      Actual Parameters       │\n ├───────────────────────────┤\n │   Control Link (dynamic link)  │\n ├───────────────────────────┤\n │   Access Link (static link)    │\n ├───────────────────────────┤\n │   Saved Machine Status        │\n ├───────────────────────────┤\n │      Local Variables          │\n ├───────────────────────────┤\n │        Temporaries            │\n └───────────────────────────┘\n```\nThis diagram must be drawn and each of the seven fields must be labelled clearly, since this is explicitly a \"diagram\" question in almost every one of your previous papers.", "mustWrite": ["Correct definition of Activation Record as a block of memory for one procedure execution.", "All seven fields named and each explained in one full sentence, not just a single word.", "Control Link correctly explained as pointing to the CALLING procedure.", "Access Link correctly explained as pointing to NON-LOCAL DATA.", "The diagram, clearly labelled."], "keywords": ["Activation Record", "Return value", "Actual parameters", "Control link", "dynamic link", "Access link", "static link", "Saved machine status", "Local variables", "Temporaries"], "finalVersionMd": "An Activation Record is a block of memory that holds all the information needed for a single execution (activation) of a procedure; a new activation record is created every time the procedure is called, and it is destroyed once that call finishes. In languages such as C and Pascal, activation records are placed on a stack.\n\nAn activation record has seven fields. The Return Value field stores the result of the function call for use by the caller. The Actual Parameters field holds the values passed into the procedure. The Control Link, or dynamic link, points to the activation record of the calling procedure, so control can correctly return to it. The Access Link, or static link, points to the activation record holding any non-local data the procedure needs. The Saved Machine Status field stores the register values and program counter as they were just before the call, so they can be restored afterward. The Local Variables field holds data local to this call, and the Temporaries field holds temporary values needed while evaluating expressions.\n\n```\nReturn Value\nActual Parameters\nControl Link (dynamic link)\nAccess Link (static link)\nSaved Machine Status\nLocal Variables\nTemporaries\n```\n\n---", "quickRefMd": "**⭐ Definition:** A block of memory that holds all the information needed for ONE execution (activation) of a procedure.\n\n**📊 DIAGRAM: MUST DRAW** (top to bottom, like a stack frame)\n```\n ┌─────────────────────┐\n │   Return Value        │\n ├─────────────────────┤\n │   Actual Parameters    │\n ├─────────────────────┤\n │   Control Link (dynamic link) │\n ├─────────────────────┤\n │   Access Link (static link)   │\n ├─────────────────────┤\n │   Saved Machine Status  │\n ├─────────────────────┤\n │   Local Variables      │\n ├─────────────────────┤\n │   Temporaries          │\n └─────────────────────┘\n```\n\n**Must-write points (all 7 fields, 1 line each):**\n1. **Temporaries** — needed during expression evaluation.\n2. **Local variables** — data local to this call.\n3. **Saved machine status** — register values & program counter before the call.\n4. **Control link (dynamic link)** — points to the activation record of the CALLING procedure.\n5. **Access link (static link)** — points to the activation record holding non-local data.\n6. **Actual parameters** — parameters passed to the called procedure.\n7. **Return value** — stores the function's result.\n\n**➕ ADD THESE IF YOU HAVE TIME:** Fortran uses static memory for activation records; Pascal and C use a stack.\n\n**Common mistakes:** Mixing up Control Link and Access Link (Control link = who CALLED me; Access link = where is my non-local DATA); drawing the diagram upside down (Return value usually goes at the top/bottom depending on the convention used in your class notes — just be consistent, and label each part clearly).\n\n**✍️ MINIMUM FULL-MARK ANSWER:** the diagram + the 7 one-line field descriptions.\n\n---"}, {"id": "u4-vh-3", "globalIndex": 24, "unit": 4, "priority": "Very High", "question": "Discuss Parameter Passing Methods in detail, using the Swap Variable example.", "questionShort": "Explain Parameter Passing Methods using the Swap(a,b) example (Call by Value, Reference, Copy-Restore, Name)", "marks": "6–8", "marksNote": "", "repeated": "Assignment-2 Q6, PAC Q7, CD_2 Q6-OR(a), CD_3 Q6(c) & Q6-OR(c), CD.pdf Q2(A) — **5 occurrences.**", "years": "", "inPPT": "", "type": "Theory (with a numeric trace).", "typeTags": ["Theory"], "answerMd": "When a procedure is called with some parameters, there are several different ways in which the actual parameters used at the call site can be connected to the formal parameters used inside the procedure's own body. The four common methods are Call by Value, Call by Reference, Call by Copy-Restore, and Call by Name. These methods are best understood using the classic example of a `swap` function, called as `swap(a,b)` with `a=10` and `b=20`, and defined with formal parameters c and d that exchange their values.\n\n**1. Call by Value.** In this method, the value of each actual parameter is copied into the corresponding formal parameter's own separate storage location. Since c and d are completely independent copies, any change made to c and d inside the function has no effect at all on a and b. This method is sometimes described as making a \"xerox copy\" of the original values. For `swap(a,b)` with `a=10, b=20`, the values of a and b remain **unchanged (10, 20)** after the call, since only the copies c and d were swapped.\n\n**2. Call by Reference.** In this method, also called call-by-address, the address of each actual parameter is passed, and the formal parameter is used as a pointer to that address. Any change made to the formal parameter is therefore actually made to the original variable itself. For `swap(a,b)`, since c and d hold the addresses of a and b, swapping the values through c and d also swaps a and b, so the final result is **a=20, b=10 — genuinely swapped.**\n\n**3. Call by Copy-Restore.** This method is a hybrid of the previous two, and is also called copy-in-copy-out or value-result. During the call, the values of a and b are copied into c and d, just like Call by Value; but when the procedure returns, the final values of c and d are copied back into a and b. For `swap(a,b)`, this also gives the final result **a=20, b=10**, but the mechanism used to reach this result is different — the actual memory location of a and b was never touched during execution, only at the very end.\n\n**4. Call by Name.** This is the least commonly used method, in which the procedure is treated much like a macro: the procedure's body is textually substituted at the point of call, with every occurrence of the formal parameter replaced directly by the actual parameter's name. For `swap(a,b)`, the body of swap is expanded with c replaced by a and d replaced by b everywhere, which also produces the swapped result **a=20, b=10**, but achieved purely through text substitution rather than through addresses or copying.\n\n**Summary Table:**\n\n| Method | Mechanism | Result for swap(a=10,b=20) |\n|---|---|---|\n| Call by Value | Copies values in; changes to copy do not affect original | a=10, b=20 (unchanged) |\n| Call by Reference | Passes address; changes affect the original directly | a=20, b=10 (swapped) |\n| Call by Copy-Restore | Copies value in, then copies final value back out at return | a=20, b=10 (swapped) |\n| Call by Name | Substitutes the procedure body textually, like a macro | a=20, b=10 (swapped) |\n\n**Common mistakes:** Assuming Call by Reference and Call by Copy-Restore always give different final results — in most simple cases they give the SAME final result, and the actual exam point is to explain the DIFFERENCE IN MECHANISM, not the difference in outcome.", "diagramMd": "", "mustWrite": ["Correct definition of all four methods.", "Clearly explain why Call by Value leaves the original unchanged, and why Call by Reference changes it.", "The `swap(a,b)` trace and final output for each method.", "Note that Copy-Restore and Call by Reference are mechanically different even when the output looks the same."], "keywords": ["Call by Value", "Call by Reference", "Call by Copy-Restore", "value-result", "Call by Name", "actual parameter", "formal parameter"], "finalVersionMd": "There are four common methods of passing parameters to a procedure. In Call by Value, the value of each actual parameter is copied into the formal parameter's own storage, so changes made inside the procedure never affect the original variable; for `swap(a,b)` with a=10, b=20, the values remain unchanged after the call. In Call by Reference, the address of each actual parameter is passed instead, so the formal parameter acts as a pointer to the original variable, and changes made inside the procedure directly change the original; here, swap(a,b) genuinely exchanges the values, giving a=20, b=10.\n\nCall by Copy-Restore is a hybrid method, also called value-result: the actual parameter's value is copied in at the start of the call, like Call by Value, but the final value of the formal parameter is copied back into the actual parameter when the procedure returns; this also gives a=20, b=10, but through a different mechanism than Call by Reference, since the original variable is untouched during execution and only updated at the end. Call by Name treats the procedure like a macro, textually substituting the procedure's body at the call site with the formal parameters replaced by the actual parameter names; this too gives a=20, b=10, achieved purely through text substitution.\n\n---", "quickRefMd": "**Simple explanation:** When you call a function like `swap(a,b)`, there are 4 different ways the actual values a,b can be connected to the function's own variables c,d.\n\n**Memorise this table using `a=10, b=20` and `swap(a,b)` (this exact example is what the PPT and papers use):**\n\n| Method | What happens | Output after swap(a,b) |\n|---|---|---|\n| **Call by Value** | A COPY of a,b's values is given to c,d. Changing c,d does NOT change a,b. | a=10, b=20 (unchanged) |\n| **Call by Reference** | The ADDRESS of a,b is given to c,d. Changing c,d (via the address) DOES change a,b. | a=20, b=10 (swapped) |\n| **Call by Copy-Restore** | Like Call by Value during the call, but the final values of c,d are COPIED BACK into a,b when the function returns. | a=20, b=10 (swapped — same result as reference, different method) |\n| **Call by Name** | The function body is treated like a macro — textually substituted at the call site, with c replaced by a, d replaced by b, everywhere. | a=20, b=10 (swapped, but by text substitution not memory) |\n\n**⭐ One-line definitions:**\n- Call by Value = \"xerox copy\" — original never changes.\n- Call by Reference = pass the address, changes DO affect the original.\n- Copy-Restore = value going in, copy coming back out (also called \"value-result\").\n- Call by Name = replace the call with the function's actual code, like a macro.\n\n**✍️ MINIMUM FULL-MARK ANSWER:** the 4 one-line definitions + the swap(a,b) output table.\n\n**Common mistakes:** Saying Call by Reference and Copy-Restore always give different final results — they usually give the SAME final answer, but by a DIFFERENT mechanism (this difference in mechanism, not outcome, is the actual exam point).\n\n---"}, {"id": "u4-vh-4", "globalIndex": 25, "unit": 4, "priority": "Very High", "question": "Construct a DAG (Directed Acyclic Graph) for the given expression. (`(a+b) * (a+b+c)`)", "questionShort": "Construct a DAG (Directed Acyclic Graph) for a given expression", "marks": "6–8", "marksNote": "", "repeated": "Assignment-2 Q4, CD_1 Q2(A)/Q3(A)-OR, CD_3 Q1(b)-4 — **3 sources.**", "years": "", "inPPT": "Yes, heavy detail in both Unit 4 and Unit 5.", "type": "Algorithm + Diagram.", "typeTags": ["Diagram", "Algorithm"], "answerMd": "A **DAG (Directed Acyclic Graph)** is used to represent the structure of an expression or a basic block, in a way that is more compact than a plain syntax tree, because it identifies and merges any sub-expression that is computed more than once, instead of drawing it twice.\n\n**Algorithm to construct a DAG** (assuming statements of the form `x:=y op z`, `x:=op y`, or `x:=y`):\n1. If y (or z) does not already have a node, create a leaf node for it.\n2. For a statement `x := y op z`, check whether a node labelled `op` already exists with left child node(y) and right child node(z); if such a node already exists, reuse it instead of creating a new one — this is exactly what identifies a common subexpression. If no such node exists, create a new one.\n3. Attach the label x to the node found or created in step 2, and remove x from the label list of any node it was previously attached to; for a plain copy statement `x:=y`, do not create a new node at all — just attach x to node(y).\n\n**Given:** the expression `(a + b) * (a + b + c)`.\n\n**Step 1:** create leaf nodes for `a`, `b`, and `c`.\n\n**Step 2:** for the sub-expression `a + b`, create one `+` node with children `a` and `b`.\n\n**Step 3:** for `a + b + c`, this is `(a+b) + c`; since the `+` node for `a+b` already exists from Step 2, we reuse it directly as the left child of a NEW `+` node, whose right child is `c`.\n\n**Step 4:** for the final `*`, the left operand is `(a+b)`, which is exactly the same node built in Step 2, so it is reused again; the right operand is the `+` node built in Step 3 for `(a+b+c)`. The final `*` node has these two nodes as its children.\n\n**Final Answer:** the DAG has one shared `+` node for `a+b`, which is used TWICE — once directly as an input to the top-level `*`, and once as the left child of the second `+` node computing `a+b+c`. This clearly shows that `a+b` is computed only **once**, not twice, which is the entire benefit of using a DAG instead of a plain syntax tree.\n\n**Common mistakes:** Drawing two separate `+` nodes for `a+b` (once for each place it is used) — this turns the DAG back into an ordinary tree and defeats the purpose of the question.", "diagramMd": "```\n              *\n            /   \\\n          +       +\n         / \\     / \\\n        a   b   (same + node as above)   c\n```\nDraw only ONE `+` node for `a+b`, and draw two arrows going INTO it — one from the top `*` node, and one from the second `+` node (the one computing `a+b+c`) — to show clearly that this single node is shared/reused.", "mustWrite": ["Correct 3-step DAG-construction algorithm stated first.", "Correctly identify that `a+b` is a common sub-expression appearing in both parts of the formula.", "The diagram must show ONE shared node for `a+b`, not two separate ones.", "A concluding sentence stating that the DAG shows `a+b` is computed only once."], "keywords": ["DAG", "common sub-expression", "shared node", "leaf node"], "finalVersionMd": "A DAG represents an expression compactly by merging any sub-expression that is computed more than once into a single shared node, instead of duplicating it as a plain syntax tree would. It is built by creating leaf nodes for undefined operands, and for each operation, reusing an existing node with the same operator and the same children if one already exists, or creating a new node otherwise.\n\nFor `(a+b) * (a+b+c)`, we first create a `+` node with children a and b for the sub-expression `a+b`. Since `a+b` also appears inside `a+b+c`, we reuse this same `+` node as the left child of a new `+` node whose right child is c, representing `a+b+c`. Finally, the top-level `*` node takes the original `a+b` node as its left child and the `a+b+c` node as its right child. This DAG has only one node for `a+b`, shared between the top multiplication and the second addition, correctly showing that `a+b` is computed only once instead of twice.", "quickRefMd": "**⭐ Definition:** A DAG shows the structure of a basic block, but reuses (merges) any subexpression that is computed more than once — this is different from a syntax tree, which draws the SAME subexpression twice.\n\n**Algorithm to build a DAG (for statements `x:=y op z`, `x:=op y`, `x:=y`):**\n1. If y (or z) has no node yet, create node(y) (leaf).\n2. For `x:=y op z`: check if a node labelled `op` with children node(y), node(z) already exists — if yes, REUSE it (this is the common-subexpression check); if no, create a new node.\n3. Attach x as a new label to the node found in step 2 (don't create a separate node for a plain copy `x:=y`).\n\n**Worked example:** `(a+b) * (a+b+c)` → build one shared `+` node for `a+b`; reuse it for BOTH the top `*` and the second `+` (which computes `a+b+c`) — this proves `a+b` is only computed ONCE.\n\n**✍️ MINIMUM FULL-MARK ANSWER:** the algorithm (3 steps) + the DAG diagram showing which node(s) got reused/shared, clearly labelled.\n\n**Common mistakes:** Drawing a DAG that looks exactly like a tree (i.e., forgetting to actually merge the repeated subexpression) — that defeats the purpose of the question.\n\n---"}], "high": [{"id": "u4-high-1", "globalIndex": 26, "unit": 4, "priority": "High", "question": "Explain Synthesized and Inherited Attributes with a Syntax Directed Definition (SDD) example, and show the annotated parse tree.", "questionShort": "Synthesized and Inherited Attributes — SDD with annotated parse tree (e.g. desk calculator `3*5+4`)", "marks": "8", "marksNote": "", "repeated": "Assignment-2 Q10, CD_2 Q6(b) — 2 sources, but the PPT gives this a full 6-slide worked example.", "years": "", "inPPT": "", "type": "Algorithm + Diagram (Numerical).", "typeTags": ["Numerical", "Diagram", "Algorithm"], "answerMd": "A Syntax Directed Definition (SDD) is a context-free grammar in which every grammar symbol is associated with a set of attributes, and every production is associated with semantic rules that describe how to compute those attributes. The two kinds of attributes are Synthesized and Inherited.\n\nA **synthesized attribute** at a node is computed using the attribute values of that node's own children, so information flows upward from the leaves toward the root of the parse tree. An SDD that uses only synthesized attributes is called an **S-attributed definition**.\n\nAn **inherited attribute** at a node is computed using the attribute values of that node's parent and/or its siblings, so information flows downward from the root, or sideways between siblings.\n\n**Comparison Table:**\n\n| Basis | Synthesized Attribute | Inherited Attribute |\n|---|---|---|\n| Direction of flow | Computed from the children, flowing bottom to top. | Computed from the parent or siblings, flowing top to bottom or left to right. |\n| Where used | Used in both S-attributed and L-attributed definitions. | Used only in L-attributed definitions. |\n\n**Worked example — a simple desk calculator, computing the value of `3*5+4`:**\n\n| Production | Semantic Rule |\n|---|---|\n| L → E n | print(E.val) |\n| E → E1 + T | E.val = E1.val + T.val |\n| E → T | E.val = T.val |\n| T → T1 * F | T.val = T1.val * F.val |\n| T → F | T.val = F.val |\n| F → digit | F.val = digit.lexval |\n\nAll the attributes here (`val`) are synthesized, since each rule computes a node's value purely from its children's values.\n\n**Building the annotated parse tree for `3*5+4`:** at the leaves, digit.lexval gives 3, 5, and 4 respectively. Moving up: F.val=3, then T.val=3 (from T→F); F.val=5, and combining with the previous T using T→T1*F gives T.val = 3*5 = 15. Separately, F.val=4 gives T.val=4. Then E.val = T.val = 15 (from E→T), and finally combining with the last T using E→E1+T gives E.val = 15+4 = **19**. This final value is printed at the root L.\n\n**Final Answer:** the value of the expression `3*5+4` is **19**, and the annotated parse tree shows this value being built up correctly at each node from its children.\n\n**Common mistakes:** Forgetting that multiplication must be combined before addition, according to how the grammar itself is structured (T handles `*`, E handles `+`), rather than simply computing left to right.", "diagramMd": "Draw the parse tree for `3*5+4n` and write the computed `.val` value next to every node, ending with `E.val=19` just below the root L.", "mustWrite": ["Correct definitions of Synthesized and Inherited attributes, with the direction of information flow clearly stated.", "The comparison table.", "The full semantic-rule table for the desk-calculator grammar.", "The annotated parse tree showing the value computed at every single node, ending with the correct final answer."], "keywords": ["Synthesized attribute", "Inherited attribute", "S-attributed", "L-attributed", "annotated parse tree", "semantic rule"], "finalVersionMd": "A synthesized attribute is computed from the attribute values of a node's children, so information flows bottom to top in the parse tree; an SDD using only synthesized attributes is called S-attributed. An inherited attribute is computed from the attribute values of a node's parent or siblings, so information flows top to bottom or sideways; this is used only in L-attributed definitions.\n\nFor the desk-calculator grammar `L→En, E→E1+T, E→T, T→T1*F, T→F, F→digit`, with semantic rules E.val=E1.val+T.val, T.val=T1.val*F.val, T.val=F.val, and F.val=digit.lexval, all attributes are synthesized. For the input `3*5+4`, the leaves give digit.lexval values 3, 5, 4; going upward, F.val=3 and T.val=3, then combining with F.val=5 through T→T1*F gives T.val=3*5=15; separately F.val=4 gives T.val=4; then E.val=15 through E→T, and combining with the last T through E→E1+T gives the final E.val = 15+4 = **19**, which is printed at the root.\n\n---", "quickRefMd": "**⭐ Definitions:**\n- **Synthesized attribute:** value computed from the CHILDREN's attributes (flows bottom → top).\n- **Inherited attribute:** value computed from the PARENT's or SIBLING's attributes (flows top → bottom, or left sibling → right sibling).\n\n**Comparison table:**\n| Synthesized | Inherited |\n|---|---|\n| From children, bottom to top | From parent/siblings, top to bottom |\n| Used in both S-attributed and L-attributed SDT | Used only in L-attributed SDT |\n\n**Worked example — Desk Calculator grammar:**\n| Production | Semantic Rule |\n|---|---|\n| L → E n | print(E.val) |\n| E → E1 + T | E.val = E1.val + T.val |\n| E → T | E.val = T.val |\n| T → T1 * F | T.val = T1.val * F.val |\n| T → F | T.val = F.val |\n| F → digit | F.val = digit.lexval |\n\nFor input `3*5+4`: F.val=3→T.val=3; F.val=5→T.val=3*5=15; F.val=4→T.val=4; E.val=15+4=**19** → printed.\n\n**✍️ MINIMUM FULL-MARK ANSWER:** the semantic-rule table + the annotated parse tree with values written at every node, ending in the final printed value.\n\n---"}, {"id": "u4-high-2", "globalIndex": 27, "unit": 4, "priority": "High", "question": "Differentiate between Static and Dynamic Memory Allocation.", "questionShort": "Static vs Dynamic Memory Allocation", "marks": "4–6", "marksNote": "", "repeated": "CD_1 Q1(A), CD_2 Q4-OR(b), CD_3 Q6-OR(c) — 3 sources.", "years": "", "inPPT": "", "type": "Theory (Comparison table).", "typeTags": ["Theory"], "answerMd": "Memory for variables and data structures used by a program can be allocated in two different ways, depending on when the memory is actually assigned.\n\n**Static memory allocation** means that the memory required by a variable is decided and reserved before the program starts running, at compile time itself, and this memory stays reserved for the entire lifetime of the program.\n\n**Dynamic memory allocation** means that memory is reserved only while the program is actually running, at the exact moment it is needed, and it can be released again once it is no longer required.\n\n**Comparison Table:**\n\n| Basis | Static Allocation | Dynamic Allocation |\n|---|---|---|\n| Time of allocation | Memory is allocated before the program starts executing. | Memory is allocated while the program is executing. |\n| Speed | Execution is generally faster, since no allocation decisions are needed at run time. | Execution is generally slower, due to allocation/deallocation happening during the run. |\n| Access | Variables can often be accessed directly, without needing a pointer. | Variables usually need to be accessed through a pointer. |\n| Duration | The allocated memory remains reserved for the entire run of the program. | Memory is reserved only while that particular part of the program is active. |\n| Memory usage | Can use more memory overall, since space is reserved upfront whether or not it is needed. | Generally uses memory more efficiently, since space is reserved only when actually needed. |", "diagramMd": "", "mustWrite": ["Correct one-line definition of both static and dynamic allocation.", "At least 4 rows of the comparison table, in complete sentences."], "keywords": ["Static allocation", "dynamic allocation", "compile time", "run time", "pointer"], "finalVersionMd": "Static memory allocation reserves memory for a variable before the program starts running, at compile time, and this memory remains reserved for the program's entire execution. Dynamic memory allocation reserves memory only while the program is running, exactly when it is needed, and this memory can be released once it is no longer required.\n\n| Basis | Static Allocation | Dynamic Allocation |\n|---|---|---|\n| Time of allocation | Before execution begins | During execution |\n| Speed | Faster execution | Slower execution |\n| Access | Direct, no pointer needed | Usually needs a pointer |\n| Duration | Reserved for the whole program run | Reserved only while active |\n| Memory usage | More memory used upfront | More efficient use of memory |\n\n---", "quickRefMd": "| Static | Dynamic |\n|---|---|\n| Memory allocated BEFORE execution starts | Memory allocated DURING execution |\n| Faster execution | Slower execution |\n| No pointer needed to access variable | Needs a pointer to access |\n| Variable stays allocated permanently | Allocated only while the unit is active |\n| More memory used upfront | Less memory (only what's needed, when needed) |\n\n**✍️ MINIMUM FULL-MARK ANSWER:** just this table, 4–5 rows depending on marks.\n\n---"}, {"id": "u4-high-3", "globalIndex": 28, "unit": 4, "priority": "High", "question": "Explain Postfix Notation with a suitable example.", "questionShort": "Postfix Notation and Syntax Tree/DAG representation", "marks": "4", "marksNote": "", "repeated": "", "years": "", "inPPT": "Yes, always taught alongside TAC.", "type": "Theory + short example.", "typeTags": ["Theory"], "answerMd": "Postfix notation is a way of writing an expression in which every operator appears immediately after all of its operands, instead of between them as in normal (infix) notation. Postfix notation is very useful as an intermediate representation because it does not need any parentheses to show the order of operations, and it can be evaluated easily using a simple stack.\n\n**Example:** the infix expression `a + b * c` is written in postfix notation by first converting the higher-precedence part: `b*c` becomes `bc*`, and then combining with the addition: `a+(bc*)` becomes **`abc*+`**.\n\nFor a more complex expression, `a := b * -c + b * -c` becomes, in postfix notation: **`a b c uminus * b c uminus * + =`**.", "diagramMd": "", "mustWrite": ["Correct definition: operator comes right after its operands.", "Correct conversion example, shown step by step (not just the final answer)."], "keywords": ["Postfix notation", "infix notation", "operator", "operand"], "finalVersionMd": "Postfix notation writes an expression so that every operator appears immediately after its operands, rather than between them, which removes the need for parentheses and allows easy evaluation using a stack. For example, the infix expression `a+b*c` is converted by first writing the higher-precedence multiplication as `bc*`, and then placing the addition after both its operands to get the postfix form `abc*+`.\n\n---", "quickRefMd": "**⭐ Definition:** Postfix is a \"flattened\" form where an operator comes right after its operands (no parentheses needed).\n\n**Worked example:** `a + b * c` → postfix: `a b c * +`. `a := b * -c + b * -c` → postfix: `a b c uminus * b c uminus * + =`.\n\n**✍️ MINIMUM FULL-MARK ANSWER:** the definition + converting one given expression to postfix, step by step."}], "mediumMd": "(short prep points only)\n\n- **Activation Tree:** shows how procedure calls nest during execution — root = main program; a node is a child of another if control flowed from parent to child during execution.\n- **Control Stack:** tracks currently LIVE (active) procedure calls — push when a call starts, pop when it ends; if you are at node n, the stack holds the path from n up to the root.\n- **Scope and Binding of Names:** Scope = the part of the program where a declaration applies. Binding = connecting a name to a storage location (\"environment\" maps name→storage, \"state\" maps storage→value).\n- **Role of Intermediate Code Generator (diagram):** Parser → Static Checker → Intermediate Code Generator → Code Generator. Benefits: easy retargeting (new machine = new back end only), machine-independent optimization possible.", "lowMd": "(question only)\n\n- What is the role of the Dependency Graph in SDT?\n- Explain the two intermediate forms: Abstract Syntax Tree vs Postfix Notation.\n- Explain \"Symbol Table\" fields/organisation briefly (name, type, scope, address)."}, {"number": 5, "title": "UNIT 5 — Code Optimization & Code Generation", "intro": "**What this unit is about (simple words):** Making the intermediate code faster/smaller (optimization), then turning it into real machine code (code generation).", "veryHigh": [{"id": "u5-vh-1", "globalIndex": 29, "unit": 5, "priority": "Very High", "question": "Explain Peephole Optimization with its types, giving an example for each.", "questionShort": "Explain Peephole Optimization with its types and examples", "marks": "6–8", "marksNote": "", "repeated": "PAC Q9, CD_1 Q4(B)-OR, CD_2 Q3(c), CD_3 Q5(a), CD.pdf Q5(A) & Q5(A)-OR — **6 occurrences, one of the most repeated theory questions overall.**", "years": "", "inPPT": "Yes, heaviest topic in the unit (7 slides, 6 mini-examples).", "type": "Theory (with examples).", "typeTags": ["Theory"], "answerMd": "Peephole optimization is a simple and effective optimization technique that is applied directly to the target code, by examining only a small moving \"window\", or peephole, of a few instructions at a time, and replacing that short sequence with a shorter or faster equivalent sequence whenever possible. Because it works on the final target code, it is a machine-dependent optimization technique, and its main goals are to improve execution performance and to reduce the size of the generated code.\n\n**1. Redundant Instruction Elimination.** If an instruction stores a value and the very next instruction loads that same value back from the same place, the second instruction is unnecessary and can be removed. For example, `MOV R0,x` followed by `MOV x,R0` — the second line simply undoes nothing new and can be deleted.\n\n**2. Flow-of-Control Optimization.** Unnecessary jumps to other jumps can be shortened by making the first jump point directly to the final target. For example, `goto L1 ... L1: goto L2` can be rewritten directly as `goto L2`, skipping the redundant intermediate jump, provided there is no other jump into L1.\n\n**3. Removing Unreachable Code.** Any code that can never actually be executed, for example because it lies inside a condition that is always false, can be safely deleted. For example, if `debug` is defined as `0`, the code inside `if(debug) { print debugging information }` can never run and can be removed entirely.\n\n**4. Algebraic Simplification.** Statements that perform an operation with no real effect can be simplified or removed, such as `x = x + 0` or `x = x * 1`, both of which can simply be deleted since they do not change the value of x.\n\n**5. Reduction in Strength.** An expensive machine operation can sometimes be replaced by a cheaper one that produces the same result; for example, computing `x*x` is usually cheaper than calling a general exponentiation function to compute `x²`.\n\n**6. Use of Machine Idioms.** Many target machines provide special, efficient instructions for common operations, such as auto-increment or auto-decrement addressing modes; a statement like `i = i + 1` can be directly replaced by a single such machine instruction instead of a general add-and-store sequence.\n\n**Final summary:** peephole optimization improves code quality with very little compilation cost, by looking for these small, local, easily-detectable patterns in the target code.", "diagramMd": "", "mustWrite": ["Correct definition: examines a small window of instructions and replaces it with a shorter/faster equivalent.", "All 6 types named, each with its own one-line explanation and a small example.", "Mention it is a machine-dependent, local optimization technique."], "keywords": ["Peephole optimization", "redundant instruction", "flow-of-control", "unreachable code", "algebraic simplification", "strength reduction", "machine idioms"], "finalVersionMd": "Peephole optimization is a machine-dependent optimization technique that examines a small window of target-code instructions at a time and replaces them with a shorter or faster equivalent, aiming to improve execution speed and reduce code size. Its main types are: Redundant Instruction Elimination, which removes an instruction that undoes the effect of the one before it, such as `MOV R0,x` followed by `MOV x,R0`; Flow-of-Control Optimization, which shortens a jump to another jump, such as replacing `goto L1 ... L1: goto L2` directly with `goto L2`; Removing Unreachable Code, which deletes code that can never execute, such as a debug block guarded by a condition that is always false; Algebraic Simplification, which removes statements like `x=x+0` or `x=x*1` that have no real effect; Reduction in Strength, which replaces an expensive operation with a cheaper equivalent, such as computing `x*x` instead of using a power function; and Use of Machine Idioms, which replaces a general instruction sequence with a single efficient machine instruction, such as using an auto-increment instruction for `i=i+1`.\n\n---", "quickRefMd": "**⭐ Definition:** A machine-dependent, local optimization technique that looks at a small \"peephole\" (a few instructions at a time) in the target code and replaces them with a shorter/faster equivalent.\n\n**Must-write points (types, each with a 1-line example):**\n1. **Redundant instruction elimination** — `MOV R0,x` then `MOV x,R0` → the 2nd line is useless, delete it.\n2. **Flow-of-control optimization** — `goto L1 ... L1: goto L2` → change directly to `goto L2` (skip the middle jump).\n3. **Removing unreachable code** — code after `#define debug 0 ... if(debug){...}` can never run → delete it.\n4. **Algebraic simplification** — `x = x + 0` or `x = x * 1` → delete these statements.\n5. **Reduction in strength** — replace an expensive operation with a cheaper one, e.g. `x*x` instead of using `x²`(power function).\n6. **Use of machine idioms** — replace `i = i + 1` with a single auto-increment machine instruction, if the target machine has one.\n\n**✍️ MINIMUM FULL-MARK ANSWER:** the definition + list all 6 types, each with its 1-line example (as above).\n\n**Common mistakes:** Giving only the definition without any of the 6 types — the types WITH examples are where most marks are.\n\n---"}, {"id": "u5-vh-2", "globalIndex": 30, "unit": 5, "priority": "Very High", "question": "Discuss Code Optimization Techniques with proper examples.", "questionShort": "Explain Code Optimization Techniques with examples (constant folding, CSE, copy propagation, dead code elimination, code motion, strength reduction)", "marks": "6–8", "marksNote": "", "repeated": "Assignment-2 Q7, CD_1 Q3(B) (constant folding/propagation), CD_2 Q5(b), CD_3 Q6(a), CD.pdf Q5(A)-OR — **5 occurrences.**", "years": "", "inPPT": "", "type": "Theory (with examples).", "typeTags": ["Theory", "Diagram"], "answerMd": "Code optimization is the process of transforming the intermediate or target code of a program so that it becomes faster to execute or requires less memory, without changing the actual output the program produces. Optimization techniques are broadly classified as **Machine Dependent**, which rely on the details of the target machine, and **Machine Independent**, which can be applied regardless of the target machine. Machine independent techniques are further divided into **Function Preserving** transformations, which keep the exact meaning of the code, and **Loop Optimization**, which specifically targets code inside loops, since loops are usually executed many times and therefore give the biggest performance benefit when optimized.\n\n**1. Compile Time Evaluation.** This includes two related methods. **Constant Folding** computes a constant expression once, during compilation, instead of recomputing it every time the program runs; for example, `length = (22/7) * d` has its constant part `22/7` calculated once at compile time. **Constant Propagation** replaces a variable with a constant value that is already known to the compiler, and then evaluates the resulting expression; for example, if `pi=3.14` and `r=2`, then `Area = pi*r*r` becomes `Area = 3.14*2*2`, which can then be evaluated immediately.\n\n**2. Common Sub-expression Elimination.** If the exact same expression is computed more than once, and none of its operands have changed in between, the second computation is unnecessary and its earlier result can be reused instead. For example, in `t1=4*i; t2=a[t1]; t3=4*j; t4=4*i; t5=b[t4]+1`, the computation `t4=4*i` is identical to `t1=4*i`, so `t4` can simply be replaced by `t1`, removing one multiplication.\n\n**3. Copy Propagation.** If a variable is simply assigned the value of another variable, later uses of the first variable can be replaced directly by the second, allowing the copy statement itself to eventually be removed. For example, `A = PI; Area = A * r * r` becomes `Area = PI * r * r`.\n\n**4. Dead Code Elimination.** Any statement whose result is never actually used anywhere in the program can be deleted, since removing it does not change the program's output. For example, if `i` is always `0` and never changed, the block `if(i==1){x=x+i;}` can never execute and can be removed entirely.\n\n**5. Code Motion (Loop-Invariant Code Motion).** If a computation inside a loop always produces the same result on every iteration, it can be moved outside the loop and computed only once. For example, `while(i<=limit-2){...}` can be rewritten as `n=limit-2; while(i<=n){...}`, so that `limit-2` is computed only once instead of on every iteration.\n\n**6. Strength Reduction.** An expensive operation inside a loop, such as multiplication, can sometimes be replaced by a cheaper operation, such as repeated addition, that produces the same result. For example, `for(i=1;i<=50;i++){count=i*7;}` can be rewritten using a running total: `temp=7; for(i=1;i<=50;i++){count=temp; temp=temp+7;}`.", "diagramMd": "```\n                Code Optimization\n                 /              \\\n      Machine Dependent      Machine Independent\n                                /            \\\n                    Function Preserving   Loop Optimization\n              (CSE, Constant Folding,      (Code Motion,\n               Constant Propagation,        Strength\n               Dead Code Elimination)        Reduction)\n```", "mustWrite": ["Correct classification diagram: Machine Dependent vs Machine Independent, and Function Preserving vs Loop Optimization.", "At least 4 techniques explained (as required by the marks), each with a full sentence definition and a before/after example.", "Correctly distinguish Constant Folding (computing a fixed expression) from Copy Propagation (replacing a variable with another variable/value it was copied from)."], "keywords": ["Constant Folding", "Constant Propagation", "Common Sub-expression Elimination", "Copy Propagation", "Dead Code Elimination", "Code Motion", "Strength Reduction"], "finalVersionMd": "Code optimization improves the intermediate or target code to make it faster or smaller, without changing what the program computes. It is classified as Machine Dependent or Machine Independent, and machine-independent techniques are further divided into Function Preserving transformations and Loop Optimization.\n\nConstant Folding computes a constant expression once at compile time instead of at run time, such as pre-computing `22/7` in `length=(22/7)*d`. Constant Propagation replaces a variable with its already-known constant value before evaluating an expression, such as replacing `pi` with `3.14` in `Area=pi*r*r`. Common Sub-expression Elimination reuses the result of an expression that has already been computed, instead of computing it again, such as reusing `t1=4*i` instead of recomputing `t4=4*i`. Copy Propagation replaces a variable with the value it was directly copied from, such as replacing `A` with `PI` in `Area=A*r*r` after `A=PI`. Dead Code Elimination removes statements whose results are never used, such as a condition block that can never become true. Code Motion moves a loop-invariant computation, one that never changes across iterations, outside the loop so it is computed only once. Strength Reduction replaces an expensive operation inside a loop, such as multiplication, with a cheaper one, such as repeated addition, that produces the same final result.\n\n---", "quickRefMd": "**📊 DIAGRAM: MUST DRAW (classification)**\n```\n                Code Optimization\n                 /              \\\n      Machine Dependent      Machine Independent\n                                /            \\\n                    Function Preserving   Loop Optimization\n                    (CSE, Compile-time      (Code Motion,\n                     eval, Copy Prop.,       Strength\n                     Dead Code Elim.)         Reduction)\n```\n\n**Must-write points (each technique, 1-line + tiny example):**\n1. **Compile Time Evaluation** — **Folding**: compute a constant expression at compile time, e.g. `length = (22/7)*d` → computed once, not every run. **Constant Propagation**: replace a variable with its known constant value before computing, e.g. `pi=3.14; Area=pi*r*r` → `Area=3.14*r*r`.\n2. **Common Sub-expression Elimination (CSE)** — if the same expression is computed twice with no change in between, reuse the first result. E.g. `t1=4*i; t4=4*i` → reuse t1 instead of recomputing t4.\n3. **Copy Propagation** — `A=PI; Area=A*r*r` → replace A directly with PI: `Area=PI*r*r`.\n4. **Dead Code Elimination** — remove code whose result is NEVER used, e.g. `if(i==1){x=x+i;}` when i is always 0.\n5. **Code Motion (loop-invariant)** — move a computation that doesn't change inside a loop to OUTSIDE the loop. E.g. `while(i<=limit-2){...}` → compute `n=limit-2` once before the loop.\n6. **Strength Reduction** — replace an expensive operator with a cheaper one inside a loop, e.g. replacing `count=i*7` (multiplication) with repeated addition `temp=temp+7`.\n\n**✍️ MINIMUM FULL-MARK ANSWER:** the classification diagram + pick 4 techniques (as marks require) with a 1-line definition + tiny before/after example each.\n\n**Common mistakes:** Confusing Copy Propagation (replacing a variable by another variable/constant it was copied from) with Constant Folding (computing a fixed numeric expression at compile time) — these are different techniques.\n\n---"}, {"id": "u5-vh-3", "globalIndex": 31, "unit": 5, "priority": "Very High", "question": "How do you identify Basic Blocks in a program? Explain with an example and draw the Flow Graph.", "questionShort": "Basic Blocks — identify leaders and partition code; draw the Flow Graph", "marks": "6", "marksNote": "", "repeated": "CD_2 Q5-OR(a), CD_3 Q5-OR(c) — 2 sources, but the PPT gives a complete, self-contained worked example (very safe question to prepare).", "years": "", "inPPT": "", "type": "Algorithm (Numerical) + Diagram.", "typeTags": ["Numerical", "Diagram", "Algorithm"], "answerMd": "A **basic block** is a sequence of three-address statements in which control can only enter at the first statement and can only leave after the last statement, with no possibility of a jump into the middle of the block or a jump out of the block except at its very end. Dividing a program's intermediate code into basic blocks is the first step toward building a flow graph and toward doing many kinds of code optimization.\n\n**Algorithm to find the Leaders of a program (a leader marks the start of a new basic block):**\n1. The first statement of the program is always a leader.\n2. Any statement that is the target of a conditional or unconditional goto statement is a leader.\n3. Any statement that comes immediately after a conditional or unconditional goto statement is also a leader.\n\nOnce every leader has been identified, each basic block consists of a leader together with all the statements up to, but not including, the next leader.\n\n**Given:** the three-address code for a factorial function:\n```\n1) f = 1\n2) i = 2\n3) if (i > x) goto 9\n4) t1 = f * i\n5) f = t1\n6) t2 = i + 1\n7) i = t2\n8) goto (3)\n9) goto calling program\n```\n\n**Step 1:** statement 1 is a leader (rule 1, the first statement).\n\n**Step 2:** statement 3 is the target of the goto at statement 8, so it is a leader (rule 2); statement 9 is the target of the goto at statement 3, so it is also a leader (rule 2).\n\n**Step 3:** statement 4 comes immediately after the conditional goto at statement 3, so it is a leader (rule 3).\n\n**Step 4: forming the basic blocks** using these four leaders (1, 3, 4, 9):\n- **B1** = {1, 2} (statement 1 up to, but not including, the next leader 3)\n- **B2** = {3}\n- **B3** = {4, 5, 6, 7, 8}\n- **B4** = {9}\n\n**Final Answer:** the program divides into four basic blocks, B1, B2, B3, and B4, as listed above.\n\n**Step 5: draw the flow graph**, with each basic block as a node, and an edge from Bi to Bj whenever control can pass directly from Bi to Bj: B1 leads into B2; B2 leads into either B3 (if the condition is false) or B4 (if the condition is true); and B3 leads back into B2 because of the `goto(3)` at the end of the block.", "diagramMd": "```\n   B1 (statements 1-2)\n        ↓\n   B2 (statement 3)  ←────────┐\n     ↓         ↓               │\n   B3 (4-8)   B4 (9)          │\n     └─────────────────────────┘\n```", "mustWrite": ["All 3 leader-identification rules stated correctly.", "Correctly apply all 3 rules to the given code and identify every leader.", "Correct grouping of statements into basic blocks.", "The flow graph, with correctly directed edges, including the loop-back edge."], "keywords": ["Basic block", "leader", "flow graph", "control flow", "target of goto"], "finalVersionMd": "A basic block is a sequence of statements where control can only enter at the first statement and leave only after the last statement. To divide code into basic blocks, we first identify leaders using three rules: the first statement is always a leader; any statement that is the target of a goto is a leader; and any statement immediately following a goto is a leader.\n\nFor the factorial code with statements 1 to 9, statement 1 is a leader as the first statement; statement 3 is a leader as the target of the goto at statement 8; statement 9 is a leader as the target of the goto at statement 3; and statement 4 is a leader because it follows the conditional goto at statement 3. This gives four basic blocks: B1={1,2}, B2={3}, B3={4,5,6,7,8}, and B4={9}.\n\nThe flow graph has B1 leading into B2; B2 leading into B3 when the condition is false, or into B4 when the condition is true; and B3 leading back into B2 because of the goto at the end of the block, forming the loop.\n\n---", "quickRefMd": "**⭐ Definition (Basic Block):** A maximal sequence of statements where control enters only at the start and leaves only at the end (no jumps in/out except at the boundary).\n\n**Algorithm to find Leaders (write these 3 rules):**\n1. The first statement is always a leader.\n2. Any statement that is the TARGET of a goto (conditional or unconditional) is a leader.\n3. Any statement immediately AFTER a goto is a leader.\n\n**Worked example (factorial function):**\n```\n1) f = 1\n2) i = 2\n3) if (i > x) goto 9\n4) t1 = f * i\n5) f = t1\n6) t2 = i + 1\n7) i = t2\n8) goto (3)\n9) goto calling program\n```\nLeaders: 1 (first statement), 3 (target of goto 8), 4 (follows the conditional goto at 3), 9 (target of goto 3's jump).\nBasic Blocks: **B1**={1,2}, **B2**={3}, **B3**={4,5,6,7,8}, **B4**={9}.\n\n**Flow Graph:** draw each basic block as a box; draw an arrow from Bi to Bj if control can go directly from Bi to Bj (here: B1→B2, B2→B3, B2→B4, B3→B2 [loop back]).\n\n**✍️ MINIMUM FULL-MARK ANSWER:** state the 3 leader rules → number the given code → mark the leaders → list the basic blocks → draw the flow graph with arrows.\n\n**Common mistakes:** Forgetting rule 3 (statement right after a goto is ALSO a leader) — this is the rule students miss most.\n\n---"}, {"id": "u5-vh-4", "globalIndex": 32, "unit": 5, "priority": "Very High", "question": "Construct a DAG (Directed Acyclic Graph) for the given Basic Block, and explain its uses.", "questionShort": "Construct a DAG for a Basic Block, and list its uses", "marks": "6–8", "marksNote": "", "repeated": "", "years": "", "inPPT": "Yes — the richest, most detailed diagram example in the whole unit (4 slides).", "type": "Algorithm + Diagram.", "typeTags": ["Diagram", "Algorithm"], "answerMd": "Just as a DAG can represent a single expression compactly, it can also be used to represent an entire **basic block** of three-address statements, which helps the compiler apply several optimizations to the block at once.\n\n**Algorithm to construct a DAG for a basic block:**\n1. If an operand used in a statement does not already have a node, create a leaf node for it.\n2. For a statement `x := y op z`, check whether a node labelled `op` already exists with node(y) and node(z) as its children; if so, reuse that node, since this identifies a common sub-expression; otherwise, create a new node.\n3. Attach the label x to the node found or created in step 2, and remove x from the label list of whatever node it was attached to previously.\n\n**Given:** the following basic block (a classic array-copy loop body):\n```\nt1 := 4 * i\nt2 := a[t1]\nt3 := 4 * i\nt4 := b[t3]\nt5 := t2 * t4\nt6 := prod + t5\nprod := t6\n```\n\n**Step 1:** create leaf nodes for `a`, `b`, `4`, and `i`.\n\n**Step 2:** for `t1 := 4*i`, create a `*` node with children `4` and `i`, and label it `t1`.\n\n**Step 3:** for `t3 := 4*i`, notice that a `*` node with children `4` and `i` already exists (from Step 2); this is exactly the same computation, so we reuse the SAME node instead of creating a new one, and simply attach the additional label `t3` to it. This single node now carries both labels `t1` and `t3`.\n\n**Step 4:** for `t2 := a[t1]`, create an array-access node with children `a` and the shared `4*i` node, labelled `t2`; similarly for `t4 := b[t3]`, create another array-access node with children `b` and the same shared `4*i` node, labelled `t4`.\n\n**Step 5:** for `t5 := t2*t4`, create a `*` node with children `t2` and `t4`.\n\n**Step 6:** for `t6 := prod+t5`, create a `+` node with children `prod` (the value of prod before this block) and `t5`; since `prod := t6` is a plain copy statement, no new node is created for it — the label `prod` is simply attached to this same `+` node, alongside `t6`.\n\n**Final Answer:** the DAG shows one shared multiplication node for `4*i`, used by both the `t1` and `t3` computations, proving this repeated computation is done only once.\n\n**Uses of a DAG for a basic block:**\n1. It automatically identifies common sub-expressions, since they are represented by shared nodes.\n2. It shows which names are used inside the block before being defined elsewhere, since these appear as leaf nodes.\n3. It shows which computed values might still be needed outside the block, which helps determine what must be kept (\"live on exit\").\n4. It helps simplify the final list of quadruples or triples, by removing common sub-expressions and unnecessary copy statements.", "diagramMd": "Draw the `4*i` node once, with two arrows pointing into it labelled `t1` and `t3`; show it feeding into two separate array-access nodes for `a[...]` (labelled t2) and `b[...]` (labelled t4); these feed into a `*` node (t5), which feeds into a `+` node along with `prod`, labelled with both `t6` and `prod`.", "mustWrite": ["The 3-step DAG-construction algorithm.", "Correct identification that `4*i` is computed twice and must be merged into one shared node.", "Correct handling of the copy statement `prod:=t6` (no new node, just an extra label).", "All 4 uses of a DAG listed clearly."], "keywords": ["DAG", "basic block", "common sub-expression", "shared node", "live on exit", "copy statement"], "finalVersionMd": "A DAG can represent a whole basic block by merging repeated computations into shared nodes. It is built by creating leaf nodes for undefined operands, reusing an existing node with the same operator and children whenever a computation repeats, and attaching new labels to existing nodes for plain copy statements instead of creating new nodes.\n\nFor the basic block `t1:=4*i; t2:=a[t1]; t3:=4*i; t4:=b[t3]; t5:=t2*t4; t6:=prod+t5; prod:=t6`, since `t1:=4*i` and `t3:=4*i` are identical computations, they share a single `*` node labelled with both t1 and t3. This shared node feeds into two array-access nodes for `a[...]` and `b[...]`, labelled t2 and t4, which feed into a `*` node for t5, which feeds into a `+` node along with `prod`, labelled with both t6 and prod, since `prod:=t6` is just a copy statement.\n\nA DAG for a basic block is useful for automatically identifying common sub-expressions, for finding names used in the block that were defined outside it, for finding values computed in the block that may be needed after it (live on exit), and for simplifying the final quadruple or triple list by removing unnecessary computations and copy statements.\n\n---", "quickRefMd": "**Algorithm (same idea as Unit 4's DAG, applied to a full basic block of statements):**\n1. If an operand is undefined, create a leaf node for it.\n2. For `x:=y op z`: reuse an existing `op` node with the same children if one exists (this catches common subexpressions); otherwise make a new node.\n3. Attach x to that node's label list; remove x from any OLD node's label list.\n\n**Worked example (classic array-copy loop body):**\n```\nt1 := 4*i\nt2 := a[t1]\nt3 := 4*i\nt4 := b[t3]\nt5 := t2*t4\nt6 := prod+t5\nprod := t6\n```\nResult: the `4*i` computation (t1 and t3) merges into ONE shared multiply node (since it's computed identically twice) — this single node gets BOTH labels t1 and t3.\n\n**Uses of a DAG (must-write list):**\n1. Finding common sub-expressions automatically.\n2. Finding which names are used inside the block but defined outside it.\n3. Finding which computed values are needed OUTSIDE the block (live-on-exit).\n4. Simplifying the list of quadruples/triples by removing unneeded copy statements.\n\n**✍️ MINIMUM FULL-MARK ANSWER:** the 3-step algorithm + the worked DAG diagram (clearly showing which node is shared) + the 4 uses.\n\n---"}, {"id": "u5-vh-5", "globalIndex": 33, "unit": 5, "priority": "Very High", "question": "Explain the Issues in the Design of a Code Generator.", "questionShort": "Explain the Issues in Design of a Code Generator", "marks": "6–8", "marksNote": "", "repeated": "Assignment-2 Q8, PAC Q8, CD_3 Q6-OR(a) — 3 sources.", "years": "", "inPPT": "", "type": "Theory.", "typeTags": ["Theory"], "answerMd": "A code generator is the final phase of a compiler, and it converts the intermediate representation of a program into the actual target machine code. Designing a good code generator is difficult because it must handle several important issues at the same time.\n\n**1. Input to the code generator.** The code generator usually receives its input in one of a few standard forms, such as Quadruples, Syntax Trees or DAGs, or Postfix notation, and it is assumed that all semantic errors have already been detected and removed by earlier phases before the code generator runs.\n\n**2. Target program.** The output produced by the code generator can take different forms: it may be absolute machine language, which can be placed directly into a fixed memory location and executed immediately; relocatable machine language, which allows separate parts of a program to be compiled independently and then linked together afterward; or assembly language, which is easier for the code generator to produce and can take advantage of the assembler's own macro facilities.\n\n**3. Memory management.** Every name used in the intermediate code must be mapped to an actual run-time memory address. This mapping is done cooperatively by the front end, which assigns a relative address within a data area, and the code generator, which converts this into the final actual address.\n\n**4. Instruction selection.** The code generator must choose which target-machine instructions will be used to implement each intermediate statement. This choice directly affects both the speed and the size of the generated code; a naive translation may generate extra, unnecessary instructions, which is why instruction selection is closely tied to optimization.\n\n**5. Register allocation.** Since instructions that use registers are usually shorter and faster than instructions that use memory directly, the code generator must decide which values should be kept in registers at each point in the program, and which specific register each value should use.\n\n**6. Choice of evaluation order.** The order in which computations are carried out can affect how many registers are needed to hold intermediate results; choosing the truly optimal order is a very hard (NP-complete) problem in general, so compilers typically use good heuristics instead of finding the perfect order.", "diagramMd": "", "mustWrite": ["All 6 issues named, each explained in a complete sentence, not just as a single keyword.", "Correctly explain the 3 possible forms of target program output.", "Distinguish Register Allocation (which values go in registers) from Instruction Selection (which instructions are used)."], "keywords": ["Input form", "target program", "memory management", "instruction selection", "register allocation", "evaluation order"], "finalVersionMd": "Designing a code generator involves several important issues. The input to the code generator is usually in the form of Quadruples, Syntax Trees or DAGs, or Postfix notation, with semantic errors already removed. The target program produced can be absolute machine code, relocatable machine code, or assembly language, each with different trade-offs for ease of generation and execution. Memory management requires mapping every name in the intermediate code to an actual run-time address, done jointly by the front end and the code generator. Instruction selection means choosing which target-machine instructions implement each statement, which affects the speed and size of the generated code. Register allocation means deciding which values should be kept in registers, since register-based instructions are faster and shorter than memory-based ones. Finally, the choice of evaluation order affects how many registers are needed for a computation, and finding the truly optimal order is an NP-complete problem, so practical compilers rely on good heuristics instead.", "quickRefMd": "**Must-write points (the main issues, 1 line each):**\n1. **Input to the code generator** — usually Quadruples, Syntax Trees/DAGs, or Postfix notation (semantic errors must already be removed).\n2. **Target program** — output can be Absolute machine code, Relocatable machine code, or Assembly language.\n3. **Memory management** — mapping source-program names to run-time addresses (done together by front end + code generator).\n4. **Instruction selection** — choosing which target instructions implement each statement (affects code speed/size).\n5. **Register allocation** — deciding which values sit in registers (registers are faster than memory).\n6. **Choice of evaluation order** — order affects how many registers you need (this can even be an NP-complete problem to solve perfectly).\n\n**✍️ MINIMUM FULL-MARK ANSWER:** list all 6 issues in 1 line each (as above); add an example for \"instruction selection\" (`a:=b+c` → `MOV b,R0` `ADD c,R0` `MOV R0,a`) if more marks are needed."}], "high": [{"id": "u5-high-1", "globalIndex": 34, "unit": 5, "priority": "High", "question": "Explain Register Allocation and Register Assignment strategies.", "questionShort": "Register Allocation and Register Assignment — Strategies", "marks": "4–8", "marksNote": "", "repeated": "CD_1 Q3(B)-OR, CD_2 Q4(b), CD_3 Q5(c) — 3 sources.", "years": "", "inPPT": "", "type": "Theory.", "typeTags": ["Theory"], "answerMd": "Using registers instead of memory for storing values makes instructions shorter and faster to execute, so a code generator must decide carefully how to use the limited number of registers available on the target machine. This involves two related but different decisions: **Register Allocation**, which decides which values will actually reside in a register at a given point in the program, and **Register Assignment**, which decides the exact, specific register that a chosen value will use. Finding the truly optimal register assignment is known to be an NP-complete problem, even when trying to assign just a single register optimally.\n\n**1. Global Register Allocation.** The compiler can keep the most frequently used variables inside fixed registers throughout an entire loop, since loop variables are accessed repeatedly. Many languages, such as C, also allow the programmer to directly request this using a declaration like `register int x;`.\n\n**2. Usage Count.** To decide which variable benefits most from being kept in a register, compilers can estimate the benefit using a formula: for a variable x in block B of loop L, the benefit is `use(x,B) + 2 × live(x,B)`, summed over every block in the loop, where `use(x,B)` counts how many times x is used in B before being redefined, and `live(x,B)` is 1 if x is still live when control leaves B, and 0 otherwise. Variables with a higher total benefit are given priority for register allocation.\n\n**3. Register Assignment for Nested Loops.** When a loop L2 is nested inside an outer loop L1, specific rules decide how a variable should be handled: if a variable is allocated a register inside L2, it should not also be separately allocated a register in the part of L1 outside L2; and if a variable is allocated in L1 but not in L2, its value must be stored before entering L2 and reloaded after leaving L2, since the inner loop might use that same register for something else.\n\n**4. Register Allocation by Graph Colouring.** This method works in two passes. First, a specific target-machine instruction is chosen for each operation, and every variable used is temporarily given its own \"symbolic\" register. Second, the compiler builds a \"register interference graph\", where each node represents a symbolic register, and an edge connects two nodes if their variables are both live at some point where one of them is being defined (meaning they cannot safely share the same physical register). The graph is then coloured using k colours, where k equals the number of real physical registers available, such that no two connected (interfering) nodes receive the same colour; each colour then corresponds to one actual physical register.", "diagramMd": "", "mustWrite": ["Clear distinction between Register Allocation (which values) and Register Assignment (which specific register).", "Mention that optimal register assignment is NP-complete.", "At least the Usage Count formula and the Graph Colouring idea explained in full sentences."], "keywords": ["Register Allocation", "Register Assignment", "Usage Count", "Graph Colouring", "interference graph", "NP-complete"], "finalVersionMd": "Register Allocation decides which values should reside in a register at a given point in the program, while Register Assignment decides the specific physical register a chosen value will use; finding the optimal assignment is an NP-complete problem. Global Register Allocation keeps the most frequently used loop variables in fixed registers throughout a loop, which languages like C allow programmers to request directly using a `register` declaration. The Usage Count method estimates the benefit of allocating a variable x to a register in loop L using the formula `use(x,B) + 2×live(x,B)` summed over the blocks of the loop, where use counts how many times x is used before being redefined, and live indicates whether x is still needed when the block ends. For nested loops, a variable allocated inside the inner loop should not also be separately allocated outside it in the outer loop, and a variable allocated only in the outer loop must be stored before entering the inner loop and reloaded after leaving it. Register Allocation by Graph Colouring builds an interference graph where each node is a symbolic register and an edge connects two registers that cannot share a physical register because they are both live at the same time; this graph is then coloured using as many colours as there are available physical registers, ensuring no two connected nodes share a colour.\n\n---", "quickRefMd": "**⭐ Definitions:**\n- **Register Allocation:** deciding WHICH values will reside in a register at a given point.\n- **Register Assignment:** deciding WHICH SPECIFIC register a value will use.\n- (Note: finding the perfect assignment is NP-complete, even for a single register.)\n\n**Must-write strategies (1 line each):**\n1. **Global Register Allocation** — keep the most-used loop variables in fixed registers for the whole loop (in C, `register int x;` requests this).\n2. **Usage Count formula** — estimates benefit of keeping x in a register: `Σ [use(x,B) + 2 × live(x,B)]` over blocks B in the loop.\n3. **Register assignment for nested loops (L1 outer, L2 inner)** — if a variable is allocated in L2, don't also allocate it outside L2 in L1.\n4. **Graph Colouring** — build an \"interference graph\" (nodes = variables, edge = they can't share a register); colour it with k colours (k = number of real registers) so no two connected nodes share a colour.\n\n**✍️ MINIMUM FULL-MARK ANSWER:** the 2 definitions + the graph-colouring idea (most commonly asked) in 2–3 lines.\n\n---"}, {"id": "u5-high-2", "globalIndex": 35, "unit": 5, "priority": "High", "question": "Explain Global Data Flow Analysis (Reaching Definitions and Live Variables) with an example.", "questionShort": "Global Data Flow Analysis (Reaching Definitions, Live Variables)", "marks": "6–8", "marksNote": "", "repeated": "", "years": "", "inPPT": "Yes, 6 conceptual slides — a classic short-answer/viva topic even without direct PYQ evidence in your files.", "type": "Theory.", "typeTags": ["Theory"], "answerMd": "To perform optimization across an entire program rather than within just one basic block, a compiler needs to collect information about how data flows between different basic blocks. This process is called **Global Data Flow Analysis**, and it works by solving data flow equations over the program's flow graph.\n\n**General data flow equation:** `Out[S] = gen[S] ∪ (in[S] – kill[S])`, which means that the information available at the end of a statement S is either generated fresh within S itself, or it was already available at the start of S and was not destroyed (\"killed\") as control passed through S.\n\n**Reaching Definitions.** A definition of a variable is said to \"reach\" a particular point in the program if there is some path in the flow graph from that definition to that point, along which the variable is not redefined again. If the variable IS redefined somewhere along the path before reaching that point, the earlier definition is said to be \"killed.\"\n\n**Example:**\n```\nB1: D1: y = 2\nB2: D2: y = y + 2\nB3: D3: x = y + 2\n```\nHere, definition D1 (in block B1) does reach block B2, since nothing redefines y between B1 and B2. However, D1 does **not** reach block B3, because D2 (in block B2) redefines y first, which kills D1's value before it can reach B3; instead, it is D2 that reaches B3.\n\n**Live Variables.** A variable is said to be **live** at a particular point in the program if there is some path from that point to the end of the program along which the variable's current value is used before it is redefined; if no such path exists, the variable is said to be **dead** at that point. This information is useful for register allocation, since a dead variable's register can safely be reused for something else.\n\n**Related definitions:**\n- A **definition point** is a point in the program where a variable is assigned a value.\n- A **reference point** is a point where a variable's value is read.\n- An expression is called an **available expression** at a given point if it has already been computed earlier on every path reaching that point, and none of its operands have changed since.", "diagramMd": "", "mustWrite": ["The general data flow equation `Out[S]=gen[S]∪(in[S]-kill[S])`.", "Correct definitions of Reaching Definition and Live Variable, including the idea of a definition being \"killed.\"", "A worked example clearly showing one definition reaching one block but not another, with the reason why."], "keywords": ["Data flow analysis
