rstpos(n), and lastpos(n) are computed bottom-up: a node is nullable only if it is a star node or the leaf ε; for an OR node, firstpos and lastpos are the union of the children's values; for a concatenation node, firstpos includes the right child's firstpos only if the left child is nullable, and similarly for lastpos with the left child; for a star node, firstpos and lastpos equal those of its single child.\n\nNext, followpos(i) is computed using two rules: for a concatenation node, every position in lastpos of the left child gets firstpos of the right child added to its followpos; for a star node, every position in its own lastpos gets its own firstpos added to its followpos.\n\nFinally, the DFA is built starting from firstpos(root) as the start state; for each state and each input symbol, the next state is the union of followpos of every position in the current state that carries that symbol; a state is accepting if it contains the position of the end-marker `#`.\n\nFor `(a|b)*abb#`, this produces the 4-state DFA:\n\n| State | on a | on b |\n|---|---|---|\n| → A | B | A |\n| B | B | C |\n| C | B | D |\n| *D | B | A |\n\n---", "quickRefMd": "**What is given:** A regular expression (add an end-marker `#` to it first), e.g. `(a|b)*abb#`.\n**What to find:** The minimal DFA directly, without building an NFA first.\n\n**Step-by-step solution:**\n1. Draw the **syntax tree** for the regex; number every LEAF (symbol) with a unique position (1,2,3,...).\n2. Compute **nullable(n)** for every node: true only for `*` nodes and the `ε` leaf.\n3. Compute **firstpos(n)** and **lastpos(n)** bottom-up using this table:\n\n| Node type | nullable | firstpos | lastpos |\n|---|---|---|---|\n| leaf ε | true | ∅ | ∅ |\n| leaf, position i | false | {i} | {i} |\n| OR node (c1\\|c2) | nullable(c1) or nullable(c2) | firstpos(c1) ∪ firstpos(c2) | lastpos(c1) ∪ lastpos(c2) |\n| CAT node (c1.c2) | nullable(c1) and nullable(c2) | if nullable(c1): firstpos(c1)∪firstpos(c2) else firstpos(c1) | if nullable(c2): lastpos(c1)∪lastpos(c2) else lastpos(c2) |\n| STAR node (c1*) | true | firstpos(c1) | lastpos(c1) |\n\n4. Compute **followpos(i)** with 2 rules:\n   - If n is a CAT node with children c1, c2: for every position i in lastpos(c1), add all of firstpos(c2) to followpos(i).\n   - If n is a STAR node: for every position i in lastpos(n), add firstpos(n) to followpos(i).\n5. Build the DFA: start state = firstpos(root). For each DFA state S and symbol `a`, new state = union of followpos(i) for every position i in S that is labelled `a`. A state is accepting if it contains the position of `#`.\n\n**Worked example for `(a|b)*abb#`** (positions: a=1, b=2, a=3, b=4, b=5, #=6):\n\nfollowpos table: followpos(1)={1,2,3}, followpos(2)={1,2,3}, followpos(3)={4}, followpos(4)={5}, followpos(5)={6}.\n\nResulting DFA:\n| State | positions | a | b |\n|---|---|---|---|\n| → A | {1,2,3} | B | A |\n| B | {1,2,3,4} | B | C |\n| C | {1,2,3,5} | B | D |\n| *D (final) | {1,2,3,6} | B | A |\n\n**Final answer:** 4-state minimal DFA (A start, D accepting) — notice this has FEWER states than the subset-construction DFA in Q1 for the same language, because this method gives the minimal DFA directly.\n\n**Common mistakes:** Forgetting to add `#` to the end of the regex before starting; mixing up firstpos and lastpos; forgetting the STAR-node followpos rule (this is the one students most often skip).\n\n**Exam shortcut:** Do nullable/firstpos/lastpos in ONE pass bottom-up (write all 3 values next to each tree node as you go up); then do followpos as a separate, second pass.\n\n**✍️ MINIMUM FULL-MARK ANSWER:** Syntax tree with position numbers → nullable/firstpos/lastpos table → followpos table → final DFA table + diagram.\n\n---"}, {"id": "u2-vh-3", "globalIndex": 9, "unit": 2, "priority": "Very High", "question": "Explain DFA Minimization (Optimization of DFA) using the Partitioning Algorithm, with an example.", "questionShort": "DFA Minimization (Optimization) using the Partitioning Algorithm", "marks": "8", "marksNote": "", "repeated": "MU Question (explicit, combined with Q1), CD_2 Q4-OR(a) (\"Minimize following DFA\") — 2 direct sources, but it is very often the 2nd half of Q1.", "years": "", "inPPT": "Yes, full algorithm + 1 worked example.", "type": "Algorithm (Numerical).", "typeTags": ["Numerical", "Diagram", "Algorithm"], "answerMd": "A DFA obtained from subset construction may contain more states than necessary. **Minimizing a DFA** means finding the smallest possible DFA that accepts exactly the same language. States can be removed if they are unreachable from the start state, if they are dead states that can never lead to acceptance, or if two states are indistinguishable, meaning they behave in exactly the same way for every possible input.\n\n**Algorithm (Partitioning Algorithm):**\n1. Remove all states that cannot be reached from the start state through any sequence of transitions.\n2. Divide the remaining states into two groups: T1 containing all the final (accepting) states, and T2 containing all the non-final states.\n3. Within each group, check whether every state goes to a state in the same group for every input symbol. If some states in a group behave differently from others, split that group further into smaller sub-groups.\n4. Repeat step 3 for every group until no group can be split any further.\n5. Choose one representative state from each final group, and rewrite the transition table using only these representative states — this gives the minimized DFA.\n\n**Given:** the 5-state DFA obtained earlier for `(a|b)*abb`:\n\n| State | a | b |\n|---|---|---|\n| A | B | C |\n| B | B | D |\n| C | B | C |\n| D | B | E |\n| E (final) | B | C |\n\n**Step 1:** All 5 states are reachable from A, so none are removed.\n\n**Step 2:** Split into T1 = {E} (final) and T2 = {A,B,C,D} (non-final).\n\n**Step 3:** Inside T2, check each state's behaviour: A goes to (B,C); B goes to (B,D); C goes to (B,C); D goes to (B,E). A and C behave the same (both go to B on `a` and stay in the group on `b`), so {A,C} can stay together, while B and D each go to a different group (D leads to the final group E) and so must be separated out. This gives three sub-groups: {A,C}, {B}, {D}.\n\n**Step 4:** No group can be split further, so the final groups are {A,C}, {B}, {D}, {E}.\n\n**Step 5:** Choosing A as the representative of {A,C}, the minimized transition table becomes:\n\n| State | a | b |\n|---|---|---|\n| A | B | A |\n| B | B | D |\n| D | B | E |\n| E (final) | B | A |\n\n**Final Answer:** The minimized DFA has 4 states instead of 5, because state C was found to be equivalent to state A and merged into it.\n\n**Common mistakes:** Merging two states just because they \"look similar\" without actually checking both input columns; forgetting to remove unreachable states before starting the partitioning.", "diagramMd": "Draw a partition tree showing the splits: {A,B,C,D,E} splits into {A,B,C,D} and {E}; {A,B,C,D} splits into {A,B,C} and {D}; {A,B,C} splits into {A,C} and {B}. Then draw the final 4-state minimized DFA diagram.", "mustWrite": ["All 5 steps of the partitioning algorithm, in the correct order.", "Correctly split states into final and non-final groups first.", "Show the actual checking of each state's transitions before merging (not just claiming two states are equal).", "Correct final minimized table with fewer states than the original."], "keywords": ["Minimization", "unreachable states", "dead states", "indistinguishable states", "partitioning algorithm"], "finalVersionMd": "DFA minimization finds the smallest DFA equivalent to a given DFA by removing unreachable states, dead states, and states that behave identically to one another. The partitioning algorithm does this in five steps: first remove unreachable states; then split all remaining states into a group of final states and a group of non-final states; then, within each group, check whether every state transitions to the same group on every input symbol, splitting the group further wherever a state behaves differently; repeat this splitting until no group can be split any further; finally, pick one representative state from each resulting group and rewrite the transition table using only these representatives.\n\nApplying this to the DFA with states A, B, C, D, E (E final), we first separate {A,B,C,D} from {E}. Checking transitions within {A,B,C,D} shows that A and C behave identically, so they merge, while B and D must remain separate because D leads into the final state group. This gives the minimized 4-state DFA:\n\n| State | a | b |\n|---|---|---|\n| A | B | A |\n| B | B | D |\n| D | B | E |\n| E (final) | B | A |", "quickRefMd": "**What is given:** A DFA (possibly with extra/repeated states).\n**What to find:** The smallest equivalent DFA.\n\n**Algorithm (write these steps in the exam):**\n1. Remove all states that are unreachable from the start state.\n2. Split all states into two groups: **T1 = final (accepting) states**, **T2 = non-final states**.\n3. Within each group, check: do two states go to the SAME group on every input symbol? If yes, they can be merged. If a state in the group behaves differently, split it into a new sub-group.\n4. Repeat step 3 until no group can be split further.\n5. Pick one representative state per final group; redraw the transition table using only these representatives — this is your minimized DFA.\n\n**Worked example (minimizing the 5-state DFA A,B,C,D,E from Q1):**\n\nStart: {A,B,C,D} (non-final) and {E} (final) → split {A,B,C,D} further → {A,C} behave the same, {B} and {D} are each different → final groups: {A,C}, {B}, {D}, {E}.\n\n**Minimized table (4 states instead of 5, C merged into A):**\n| State | a | b |\n|---|---|---|\n| A | B | A |\n| B | B | D |\n| D | B | E |\n| E | B | A |\n\n**Common mistakes:** Merging two states just because they look similar without checking BOTH input columns; forgetting to remove unreachable states first.\n\n**✍️ MINIMUM FULL-MARK ANSWER:** Starting transition table → partition into final/non-final → show the split steps (a small tree diagram of splits is a bonus) → final minimized table.\n\n---"}], "high": [{"id": "u2-high-1", "globalIndex": 10, "unit": 2, "priority": "High", "question": "Write Regular Expressions for given languages, and write Regular Definitions for an identifier and for an unsigned number.", "questionShort": "Write Regular Expressions for given languages / Regular Definitions for identifiers and numbers", "marks": "4–6", "marksNote": "", "repeated": "Assignment-1 Q5 (5 languages), CD_3 Q1(b)-2, CD.pdf Q1(B) — **3 sources**.", "years": "", "inPPT": "Yes, ~15 worked micro-examples — the single most example-dense topic in the unit.", "type": "Theory/Derivation.", "typeTags": ["Theory"], "answerMd": "A **regular expression** is a formula built from symbols of an alphabet, using union (`|`), concatenation, and the Kleene star (`*`), that describes exactly the set of strings belonging to a language. A **regular definition** is a sequence of named regular expressions, where each name can be used inside the definition of the next one, which makes it easier to build up complicated patterns step by step.\n\n**Regular expressions for common languages (Σ = {0,1} unless stated otherwise):**\n\n| Language | Regular Expression |\n|---|---|\n| A single 0 or a single 1 | `0\\|1` |\n| One or more 0's | `0+` |\n| All binary strings of 0's and 1's | `(0\\|1)*` |\n| A binary string that ends with 0 | `(0\\|1)*0` |\n| A binary string that starts with 1 | `1(0\\|1)*` |\n| A binary string that ends with 01 | `(0\\|1)*01` |\n| A string with exactly two 0's | `1*01*01*` |\n| A string of a's, then b's, then c's | `a*b*c*` |\n\n**Regular Definition for an identifier:**\n```\nletter  →  A | B | ... | Z | a | b | ... | z\ndigit   →  0 | 1 | ... | 9\nid      →  letter (letter | digit)*\n```\nThis says an identifier must start with a letter, and can be followed by any number of letters or digits.\n\n**Regular Definition for an unsigned number:**\n```\ndigit   →  0 | 1 | ... | 9\ndigits  →  digit digit*\nnumber  →  digits ( . digits )? ( E (+|-)? digits )?\n```\nThis says a number is made of one or more digits, optionally followed by a decimal point and more digits, and optionally followed by an exponent part starting with `E`, an optional sign, and more digits — this correctly matches numbers like `5280`, `39.37`, and `1.894E-4`.", "diagramMd": "", "mustWrite": ["Correct definitions of regular expression and regular definition.", "Correctly formed regular expression for whichever language is asked, tested mentally against 2–3 sample strings.", "The identifier and unsigned-number regular definitions built step by step using named rules, not written as one giant expression."], "keywords": ["Regular expression", "regular definition", "alphabet", "Kleene star", "union", "concatenation"], "finalVersionMd": "A regular expression is a formula, built using union, concatenation, and the Kleene star operators over an alphabet, that describes exactly the set of strings forming a language. A regular definition is a sequence of named regular expressions, where a later definition may use the names defined earlier, making it easier to describe complex patterns step by step.\n\nFor example, over Σ={0,1}, the regular expression for all binary strings is `(0|1)*`, for a binary string ending in 0 is `(0|1)*0`, and for a string with exactly two 0's is `1*01*01*`.\n\nThe regular definition for an identifier is:\n```\nletter → A|B|...|Z|a|b|...|z\ndigit  → 0|1|...|9\nid     → letter (letter | digit)*\n```\nThe regular definition for an unsigned number is:\n```\ndigit  → 0|1|...|9\ndigits → digit digit*\nnumber → digits (.digits)? (E(+|-)? digits)?\n```\n\n---", "quickRefMd": "**Must-know ready-made REs (memorise this table, Σ={0,1} unless stated):**\n\n| Language | Regular Expression |\n|---|---|\n| 0 or 1 | `0\\|1` |\n| One or more 0's | `0+` |\n| All binary strings | `(0\\|1)*` |\n| Binary string ending in 0 | `(0\\|1)*0` |\n| Binary string starting with 1 | `1(0\\|1)*` |\n| String ending with 01 | `(0\\|1)*01` |\n| Exactly two 0's | `1*01*01*` |\n| a*'s then b*'s then c*'s | `a*b*c*` |\n\n**Regular Definition — Identifier:**\n```\nletter → A|B|...|Z|a|b|...|z\ndigit  → 0|1|...|9\nid     → letter (letter | digit)*\n```\n\n**Regular Definition — Even number:**\n```\nSign      → + | - | ε\nDigit     → 0|1|...|9\nEvenDigit → 0|2|4|6|8\nEvenNumber → Sign Digit* EvenDigit\n```\n\n**Regular Definition — Unsigned number:**\n```\ndigit  → [0-9]\ndigits → digit+\nnumber → digits (.digits)? (E[+-]? digits)?\n```\n\n**✍️ MINIMUM FULL-MARK ANSWER:** For \"write RE\" questions — give the RE directly using the table style above, and test it mentally on 2–3 sample strings. For \"regular definition\" questions — write named rules building up step by step (as shown).\n\n**Common mistakes:** Forgetting `ε` (empty string) as an option when \"zero or more\" is asked; using `+` and `*` incorrectly (`+` = one or more, `*` = zero or more).\n\n---"}, {"id": "u2-high-2", "globalIndex": 11, "unit": 2, "priority": "High", "question": "Explain Tokens, Lexemes, and Patterns with a suitable example.", "questionShort": "Explain Tokens, Lexemes, and Patterns (with example)", "marks": "4", "marksNote": "", "repeated": "CD_2 Q1(b)-iii, CD_3 Q1(b)-7 — short-answer style, likely in every paper's Q1 section.", "years": "", "inPPT": "Yes.", "type": "Theory.", "typeTags": ["Theory"], "answerMd": "During lexical analysis, three closely related terms are used to describe how the source program's characters are grouped and classified.\n\nA **token** is a category of lexical unit, such as an identifier, a keyword, an operator, or a constant, and represents the smallest meaningful entity of the program that the lexical analyzer produces as output. A **lexeme** is the actual sequence of characters in the source program that matches the pattern for a token; for example, the actual text `total` is a lexeme. A **pattern** is the rule, often written as a regular expression, that describes what set of lexemes can form a particular token; for example, the pattern for the identifier token could be \"a letter followed by letters and digits\".\n\n**Example:** For the statement `Total = Ans + 30`, the lexical analyzer identifies the following:\n\n| Lexeme | Token |\n|---|---|\n| Total | identifier |\n| = | assignment operator |\n| Ans | identifier |\n| + | addition operator |\n| 30 | constant |", "diagramMd": "", "mustWrite": ["Correct one-line definition of Token, Lexeme, and Pattern.", "A worked example showing at least 3–4 lexeme-to-token mappings from one statement."], "keywords": ["Token", "Lexeme", "Pattern", "identifier", "constant"], "finalVersionMd": "A token is a category of lexical unit, such as an identifier, keyword, operator, or constant, and is the smallest meaningful unit produced by the lexical analyzer. A lexeme is the actual sequence of characters in the source program that matches a token's pattern. A pattern is the rule, usually a regular expression, describing which lexemes belong to a given token.\n\nFor the statement `Total = Ans + 30`, the lexical analyzer produces: `Total` as an identifier, `=` as an assignment operator, `Ans` as an identifier, `+` as an addition operator, and `30` as a constant.\n\n---", "quickRefMd": "**⭐ One-line definitions:**\n- **Token:** a category of lexical unit (e.g. identifier, keyword, operator).\n- **Lexeme:** the actual sequence of characters matched (e.g. `total`).\n- **Pattern:** the rule (often a regex) describing what lexemes belong to a token.\n\n**Worked example:** For `Total = Ans + 30`: tokens are id(Total), =, id(Ans), +, num(30).\n\n**✍️ MINIMUM FULL-MARK ANSWER:** the 3 definitions + the worked example table (Lexeme | Token | Pattern).\n\n**🔑 Keywords:** category, matched string, rule.\n\n---"}, {"id": "u2-high-3", "globalIndex": 12, "unit": 2, "priority": "High", "question": "Draw the Transition Diagram for relational operators, and for unsigned numbers.", "questionShort": "Draw Transition Diagram for Relational Operators / Unsigned Numbers", "marks": "6", "marksNote": "", "repeated": "MU Question (explicit), CD.pdf Q5(B) — 2 sources.", "years": "", "inPPT": "Yes, both are full worked diagrams.", "type": "Diagram.", "typeTags": ["Diagram"], "answerMd": "A transition diagram is a flowchart-like picture that shows how a lexical analyzer recognizes a token, using states drawn as circles connected by edges labelled with input characters; the start state has an incoming arrow, and the accepting (final) state is drawn as a double circle.\n\n**Relational operators** (`<`, `<=`, `<>`, `=`, `>`, `>=`): starting from state 0, reading `<` moves to state 1; from state 1, reading `=` moves to a final state that returns the token `relop, LE`; from state 1, reading `>` moves to a final state returning `relop, NE`; from state 1, reading any other character moves to a final state returning `relop, LT` (after putting the extra character back). Similarly, from state 0, reading `=` directly moves to a final state returning `relop, EQ`; and reading `>` moves to a state which, on `=`, gives `relop, GE`, and on any other character, gives `relop, GT`.\n\n**Unsigned numbers** (like `5280`, `39.37`, `1.894E-4`): starting from state 1, reading a digit moves to state 2, which loops back on itself for more digits; from state 2, reading a `.` moves to state 3, then a digit moves to state 4, which also loops on more digits; from state 2 or state 4, reading `E` moves toward a state for the optional `+` or `-` sign, followed by digits that loop, ending in an accepting state.", "diagramMd": "```\nRelational operator diagram:\nstate0 --<--> state1 --=--> [relop, LE]\n                     \\--->--> [relop, NE]\n                     \\--other--> [relop, LT]  (retract character)\nstate0 --=--> [relop, EQ]\nstate0 --->--> state6 --=--> [relop, GE]\n                     \\--other--> [relop, GT]  (retract character)\n\nUnsigned number diagram:\nstart --digit--> (loop) --.--> digit --(loop)--> --E--> (+/-)? --digit--(loop)--> accept\n```", "mustWrite": ["Correct number and placement of states for both diagrams.", "Correctly show self-loops for repeated digits.", "Correctly mark accepting states with a double circle and label what token/attribute is returned."], "keywords": ["Transition diagram", "state", "accepting state", "relop", "retract"], "finalVersionMd": "A transition diagram represents how a lexical analyzer recognizes a token, using circles for states and labelled edges for input characters, with the accepting state shown as a double circle.\n\nFor relational operators, from the start state, reading `<` leads to a state where reading `=` gives the token `relop,LE`, reading `>` gives `relop,NE`, and reading anything else gives `relop,LT` after putting back the extra character. From the start state, reading `=` directly gives `relop,EQ`, and reading `>` leads to a state where `=` gives `relop,GE` and anything else gives `relop,GT`.\n\nFor unsigned numbers, from the start state, reading a digit moves to a state that loops on further digits; reading a `.` then moves to a state expecting more digits, which also loops; from either point, reading `E` leads to an optional `+` or `-` sign followed by more digits that loop into the final accepting state, correctly recognizing numbers such as `5280`, `39.37`, and `1.894E-4`.\n\n---", "quickRefMd": "**📊 DIAGRAM: MUST DRAW (Relational operators `<, <=, <>, =, >, >=`)**\n```\nstate0 --<--> state1 --=--> state2 [return LE]\n                    \\--→--> state3 [return NE]\n                    \\--other--> state4 [return LT] (retract input)\nstate0 --=--> state5 [return EQ]\nstate0 --->--> state6 --=--> state7 [return GE]\n                    \\--other--> state8 [return GT] (retract input)\n```\n**📊 DIAGRAM: MUST DRAW (Unsigned numbers, e.g. 5280, 39.37, 1.894E-4)**\n```\nstart --digit--> (loop on digit) --.--> digit(loop) --E--> (+/-)? --digit--> (loop) --> accept\n                                 \\---------------------E-----------------------------/\n```\n*Why draw this:* transition diagrams are pure diagram-recall marks — quick and safe marks if practiced.\n\n**✍️ MINIMUM FULL-MARK ANSWER:** Draw the diagram with states as circles, accepting state as double circle, and label each edge with the input symbol.\n\n---"}, {"id": "u2-high-4", "globalIndex": 13, "unit": 2, "priority": "High", "question": "What technique is used to speed up the Lexical Analyzer? Discuss it in detail with a neat diagram and algorithm.", "questionShort": "Explain Input Buffering (Buffer Pairs and Sentinels) with algorithm", "marks": "6–8", "marksNote": "", "repeated": "CD_3 Q1(b)-5 (name 2 buffering schemes) — short-answer, but PPT gives it 8 full slides with 2 algorithms, so treat as a possible long question too (\"Which technique speeds up lexical analysis? Discuss with diagram and algorithm\" — Assignment-1 Q9).", "years": "", "inPPT": "Yes, heavy detail.", "type": "Theory + Algorithm + Diagram.", "typeTags": ["Theory", "Diagram", "Algorithm"], "answerMd": "Reading the source program one character at a time directly from the disk is very slow, because every single character would require a separate, expensive input/output operation. To avoid this, lexical analyzers use a technique called **input buffering**, which reads a large block of characters into memory at once and lets the lexical analyzer work on this in-memory buffer instead of the disk directly. This is the technique that is mainly used to speed up lexical analysis.\n\n**Buffer Pairs.** The buffer is divided into two halves, each of size N characters, where N is usually the size of one disk block. Each half is filled by a single system read operation. Two pointers are used: `lexemeBegin`, which marks the start of the current lexeme, and `forward`, which scans ahead character by character until a pattern match for a token is found. When a lexeme is identified, `lexemeBegin` moves to the position right after it, and the current lexeme is the text between the two pointers.\n\n**Algorithm to advance the forward pointer (Buffer Pairs):**\n```\nif forward is at the end of the first half then\n     reload the second half\n     forward := forward + 1\nelse if forward is at the end of the second half then\n     reload the first half\n     move forward to the beginning of the first half\nelse\n     forward := forward + 1\n```\nThis requires two checks every time the pointer moves: one to check whether we are at the end of a buffer half, and one to read the actual character.\n\n**Sentinels.** To reduce this to a single check, a special character called a sentinel, usually `eof`, is placed at the end of each buffer half. Now the forward pointer only needs to check whether the character it just read is the sentinel; only if it is, does it then check which half of the buffer it has reached.\n\n**Algorithm to advance the forward pointer (with Sentinels):**\n```\nforward := forward + 1\nif forward = eof then\n     if forward is at the end of the first half then\n          reload the second half\n          forward := forward + 1\n     else if forward is at the end of the second half then\n          reload the first half\n          move forward to the beginning of the first half\n     else\n          terminate lexical analysis (real end of input reached)\n```\nThis is faster because, in the common case where the character read is not the sentinel, only a single comparison is needed.", "diagramMd": "```\n[ ... E : = : M : *   C : *  : * : 2 : eof ]  ← first half     [ ...     eof ]  ← second half (also ends with eof)\n                    ↑                    ↑\n             lexeme_beginning         forward\n```", "mustWrite": ["Reason input buffering exists: reading from disk one character at a time is too slow.", "Two pointers: lexemeBegin and forward.", "Buffer Pairs explained, with its 2-check-per-move drawback.", "Sentinel scheme explained, with its 1-check-per-move improvement — this is the actual \"speed up\" answer.", "Diagram of the buffer with both pointers shown."], "keywords": ["Input buffering", "Buffer Pairs", "lexemeBegin", "forward pointer", "Sentinel", "eof"], "finalVersionMd": "Reading the source program one character at a time from disk is slow, so lexical analyzers use input buffering to speed up scanning. In the Buffer Pairs scheme, the buffer is split into two halves of N characters each, filled by one read operation each. Two pointers are used: lexemeBegin, marking the start of the current lexeme, and forward, which scans ahead until a token pattern is matched; the lexeme is the text between the two pointers. Moving the forward pointer normally requires two checks each time: whether the end of a buffer half has been reached, and what character was read.\n\nTo speed this up further, a Sentinel character, usually eof, is placed at the end of each buffer half. Now the forward pointer only needs one check per move: whether the character just read is the sentinel. Only when it is the sentinel does the algorithm then check which half of the buffer has ended, reload the other half, and continue; if the sentinel appears at the true end of input, lexical analysis terminates. This Sentinel-based buffering is the technique used to speed up the lexical analyzer, since it reduces the two checks needed per character down to one.\n\n---", "quickRefMd": "**Simple explanation:** Reading the source program 1 character at a time from disk is slow. So the lexer reads a big block (buffer) at once, and uses \"lookahead\" to peek ahead before deciding a token is complete.\n\n**Must-write points:**\n- **Buffer Pairs:** buffer split into 2 halves of N characters each; two pointers — `lexemeBegin` (start of current lexeme) and `forward` (scans ahead). Needs 2 checks per pointer move (end-of-buffer check + character check).\n- **Sentinels:** put a special `eof` character at the end of each buffer half. Now only 1 check is needed per move (just check if you hit `eof`) — this makes it faster.\n\n**📊 DIAGRAM: MUST DRAW**\n```\n[ : : :E: :=: :M:*: C:*:*:2:eof ]   ← first half             [ : : :eof]  ← second half also ends with eof\n              ↑                  ↑\n      lexeme_beginning        forward\n```\n\n**✍️ MINIMUM FULL-MARK ANSWER:** Definition of the problem (I/O is slow) + Buffer Pairs explanation + Sentinel explanation (this IS the \"technique used to speed up lexical analyzer\") + one diagram.\n\n**➕ ADD THESE IF YOU HAVE TIME:** the exact pseudocode for advancing the `forward` pointer with sentinels:\n```\nforward := forward + 1\nif forward = eof then\n    if forward at end of first half: reload second half; forward := forward+1\n    else if forward at end of second half: reload first half; move forward to start\n    else: terminate (real end of file)\n```\n\n**Common mistakes:** Saying Sentinel is a totally different buffer (it is the SAME buffer-pair idea, just with an eof marker added at each end)."}], "mediumMd": "(short prep points only)\n\n- **Finite Automata — DFA vs NFA:** DFA = exactly one transition per state per symbol (fast, deterministic). NFA = can have multiple transitions on the same symbol, and ε-transitions allowed (more flexible, needs fewer states sometimes but slower to run directly).\n- **Operations on Strings:** prefix, suffix, substring, proper prefix/suffix/substring, subsequence — know 1-line meaning + tiny example using a word like \"banana\".\n- **Operations on Languages:** Union (L∪S), Concatenation (LS), Kleene closure (L*, zero or more), Positive closure (L+, one or more).\n- **Role of Lexical Analyzer (diagram):** Source program → Lexical Analyzer ⇄ Parser (parser calls \"get next token\"), both connected to Symbol Table.", "lowMd": "(question only)\n\n- Dealing with lexical errors (panic mode recovery: insert/delete/replace/transpose a character).\n- Attributes for tokens (e.g. `<id, pointer to symbol table>`).\n- Precedence and associativity rules for regex operators (`*` highest, then concatenation, then `|`)."}, {"number": 3, "title": "UNIT 3 — Parsing", "intro": "**What this unit is about (simple words):** How the compiler checks that tokens follow grammar rules, using two approaches: Top-Down (LL) and Bottom-Up (LR family).\n\n**Note:** This is your heaviest unit — in CD.pdf it carried **36.36%** of the whole paper. Do not skip it.", "veryHigh": [{"id": "u3-vh-1", "globalIndex": 14, "unit": 3, "priority": "Very High", "question": "Check whether the given grammar is LL(1). Construct the LL(1) parsing table and parse the given input string. (`E→E+T|T, T→T*F|F, F→(E)|id`, string `id+id*id`)", "questionShort": "Construct the LL(1) Parsing Table and Parse a given string (full 4-step method)", "marks": "8", "marksNote": "", "repeated": "Assignment-2 Q1, PAC Q3, CD.pdf Q3(B)-OR, CD_2 Q2(a) — **4 sources**, and this is the single most fully-worked example in the PPT (6 slides, one complete pipeline).", "years": "", "inPPT": "", "type": "Algorithm (Numerical).", "typeTags": ["Numerical", "Diagram", "Algorithm"], "answerMd": "An **LL(1)** parser is a top-down parser that scans the input from Left to right, builds a Leftmost derivation, and decides which production to use by looking at only 1 lookahead symbol. It is table-driven: a parsing table tells the parser exactly which production to apply for a given non-terminal and current input symbol. There are four steps used to check whether a grammar is LL(1) and then to parse a string using it.\n\n**Given:** grammar `E→E+T|T, T→T*F|F, F→(E)|id`, string to parse: `id+id*id`.\n\n**Step 1: Remove left recursion.** The grammar `E→E+T|T` and `T→T*F|F` are both left-recursive, so we transform them using the standard formula, giving:\n```\nE  → T E'\nE' → + T E' | ε\nT  → F T'\nT' → * F T' | ε\nF  → ( E ) | id\n```\n\n**Step 2: Compute FIRST and FOLLOW for every non-terminal.**\n\n| Non-terminal | FIRST | FOLLOW |\n|---|---|---|\n| E | { (, id } | { $, ) } |\n| E' | { +, ε } | { $, ) } |\n| T | { (, id } | { +, $, ) } |\n| T' | { *, ε } | { +, $, ) } |\n| F | { (, id } | { *, +, $, ) } |\n\n**Step 3: Construct the predictive parsing table M[non-terminal, terminal].** For each production A→α, if a terminal `a` is in FIRST(α), put A→α in M[A,a]; if α is nullable (can derive ε), also put A→α in M[A,b] for every terminal b in FOLLOW(A).\n\n| | id | + | * | ( | ) | $ |\n|---|---|---|---|---|---|---|\n| E | E→TE' | | | E→TE' | | |\n| E' | | E'→+TE' | | | E'→ε | E'→ε |\n| T | T→FT' | | | T→FT' | | |\n| T' | | T'→ε | T'→*FT' | | T'→ε | T'→ε |\n| F | F→id | | | F→(E) | | |\n\nSince every cell of this table has at most one entry, the grammar **is LL(1)**.\n\n**Step 4: Parse the input string `id+id*id$` using a stack, starting with `$E` on the stack.** At each step, if the stack top is a terminal matching the current input symbol, pop the stack and move the input pointer forward; if the stack top is a non-terminal, look up the table and replace it with the right-hand side of the chosen production (pushed in reverse order, so the leftmost symbol ends up on top). Continue until the stack contains only `$` and the input pointer is also at `$`, at which point the parse is **accepted**.\n\n**Final Answer:** The grammar is LL(1); a full parsing table has been constructed above, and the string `id+id*id` is successfully accepted using this table.\n\n**Common mistakes:** Trying to build the LL(1) table before removing left recursion (this will never work correctly); pushing the production's right-hand side onto the stack in the wrong order.\n\n**Exam shortcut:** A grammar fails to be LL(1) only if some table cell ends up with two or more entries; if you find this while filling the table, state clearly \"grammar is NOT LL(1) because of a conflict in cell [X, y]\".", "diagramMd": "| Stack | Input | Action |\n|---|---|---|\n| $E | id+id*id$ | E→TE' |\n| $E'T | id+id*id$ | T→FT' |\n| $E'T'F | id+id*id$ | F→id |\n| $E'T'id | id+id*id$ | match id |\n| $E'T' | +id*id$ | T'→ε |\n| $E' | +id*id$ | E'→+TE' |\n| $E'T+ | +id*id$ | match + |\n| $E'T | id*id$ | T→FT' |\n| ... | ... | (continue similarly) |\n| $ | $ | **Accept** |", "mustWrite": ["Name the 4 steps of the LL(1) method before starting.", "Correctly remove left recursion first.", "Correct FIRST/FOLLOW table.", "Correct predictive parsing table, with every cell having only one entry (or explicitly state a conflict if one exists).", "A complete stack/input/action trace ending in Accept."], "keywords": ["LL(1)", "left recursion", "FIRST", "FOLLOW", "predictive parsing table", "stack", "Accept"], "finalVersionMd": "An LL(1) parser is a top-down, table-driven parser that scans input from left to right, produces a leftmost derivation, and decides the next production using only one lookahead symbol. It is constructed in four steps: remove left recursion, compute FIRST and FOLLOW sets, construct the predictive parsing table, and parse the input using a stack.\n\nFor the grammar `E→E+T|T, T→T*F|F, F→(E)|id`, removing left recursion gives `E→TE', E'→+TE'|ε, T→FT', T'→*FT'|ε, F→(E)|id`. The FIRST and FOLLOW sets are: FIRST(E)=FIRST(T)=FIRST(F)={(,id}, FIRST(E')={+,ε}, FIRST(T')={*,ε}; FOLLOW(E)=FOLLOW(E')={$,)}, FOLLOW(T)=FOLLOW(T')={+,$,)}, FOLLOW(F)={*,+,$,)}.\n\nUsing these, the predictive parsing table is built by placing production A→α in M[A,a] for every terminal a in FIRST(α), and additionally in M[A,b] for every b in FOLLOW(A) if α is nullable. Since every cell of the resulting table contains at most one production, the grammar is LL(1).\n\nTo parse `id+id*id`, we push `$E` on the stack and repeatedly consult the table: whenever the stack top is a non-terminal, we replace it using the table entry for the current input symbol; whenever it is a terminal matching the input, we pop it and advance the input. Following this process for `id+id*id$` empties the stack down to `$` exactly when the input is also exhausted, so the string is **accepted**.\n\n---", "quickRefMd": "**What is given:** A grammar, e.g. `E→E+T|T, T→T*F|F, F→(E)|id`, and a string, e.g. `id+id*id`.\n**What to find:** Whether it is LL(1); if yes, parse the string using the table.\n\n**Steps to construct LL(1) (write these 4 steps first, examiner loves seeing the method named):**\n1. Remove left recursion (see Q3 below).\n2. Compute FIRST and FOLLOW of every non-terminal (see Q5 below).\n3. Construct the predictive parsing table M[Non-terminal, terminal].\n4. Parse the input string using a stack + the table.\n\n**Worked example (`E→E+T|T, T→T*F|F, F→(E)|id`):**\n\nStep 1 (remove left recursion): `E→TE', E'→+TE'|ε, T→FT', T'→*FT'|ε, F→(E)|id`\n\nStep 2 (FIRST/FOLLOW):\n| Symbol | FIRST | FOLLOW |\n|---|---|---|\n| E | { ( , id } | { $, ) } |\n| E' | { +, ε } | { $, ) } |\n| T | { (, id } | { +, $, ) } |\n| T' | { *, ε } | { +, $, ) } |\n| F | { (, id } | { *, +, $, ) } |\n\nStep 3 (Parsing table M) — only the filled cells:\n| | id | + | * | ( | ) | $ |\n|---|---|---|---|---|---|---|\n| E | E→TE' | | | E→TE' | | |\n| E' | | E'→+TE' | | | E'→ε | E'→ε |\n| T | T→FT' | | | T→FT' | | |\n| T' | | T'→ε | T'→*FT' | | T'→ε | T'→ε |\n| F | F→id | | | F→(E) | | |\n\nStep 4 (parse `id+id*id$` using a stack): push `$E`; repeatedly compare stack-top with current input symbol, use the table to expand non-terminals, pop terminals that match, until stack = `$` and input = `$` → **Accept**.\n\n**Rule for the parsing algorithm (write this):**\n1. If top of stack = current input = `$`: Accept.\n2. If top of stack = current input (a terminal, not $): pop stack, move input pointer forward.\n3. If top of stack is a non-terminal X: look up M[X, current input symbol]. If it is a production, replace X on the stack by the production's RHS (reversed, so leftmost symbol is on top). If it is blank: Error.\n\n**Exam shortcut:** A grammar is LL(1) if for every non-terminal, no two productions share a FIRST symbol, AND if one production can derive ε, its FIRST and the other production's FOLLOW don't overlap.\n\n**Common mistakes:** Forgetting to remove left recursion FIRST (an LL(1) table cannot be correctly built on a left-recursive grammar); pushing the RHS onto the stack in the wrong order (must push right-to-left so the leftmost symbol ends up on top).\n\n**✍️ MINIMUM FULL-MARK ANSWER:** State the 4 steps → show FIRST/FOLLOW table → show parsing table → show the stack/input/action trace ending in Accept.\n\n---"}, {"id": "u3-vh-2", "globalIndex": 15, "unit": 3, "priority": "Very High", "question": "Construct the SLR(1) / CLR(1) / LALR(1) / LR(0) parsing table for the given grammar, and parse the given string. (`S→AA, A→aA|b`, string `aabb`)", "questionShort": "Construct SLR(1) / CLR(1) / LALR(1) / LR(0) Parsing Table and parse a string", "marks": "8", "marksNote": "", "repeated": "Assignment-2 Q2 (SLR), Q3 (CLR), PAC Q4 (CLR), CD_2 Q3(a) (LALR) & Q3-OR(a) (CLR), CD_3 Q3(a) (LR(0)) & Q3-OR(a) (CLR) — **7 occurrences across sources — the single MOST REPEATED question type in your entire syllabus.**", "years": "", "inPPT": "", "type": "Algorithm (Numerical), heaviest weight question type overall.", "typeTags": ["Numerical", "Diagram", "Algorithm"], "answerMd": "LR parsers are bottom-up parsers that build a rightmost derivation in reverse, scanning input from left to right. There are four common variants — LR(0), SLR(1), CLR(1), and LALR(1) — which differ only in how they decide when to \"reduce,\" based on how much lookahead information each item carries.\n\n| Parser | How it decides to reduce | Table size | Power |\n|---|---|---|---|\n| LR(0) | Reduces regardless of the next input symbol | Smallest | Weakest, many conflicts |\n| SLR(1) | Reduces only if the next symbol is in FOLLOW of the LHS | Small | Better, but still some conflicts possible |\n| CLR(1) | Each item carries its own exact lookahead symbol | Largest | Most powerful |\n| LALR(1) | Same as CLR(1), but states with the same core are merged | Same size as SLR | Almost as powerful as CLR, much smaller |\n\n**Given:** grammar `S→AA, A→aA|b`, string to parse: `aabb`.\n\n**Step 1: Augment the grammar.** Add a new start production: `S'→S`.\n\n**Step 2: Build the canonical collection of item sets, using closure and goto.**\n`closure(I)`: if an item `A→α.Bβ` is in I, add every production `B→.γ` to I.\n`goto(I, X)`: move the dot past symbol X in every applicable item of I, then take the closure of the result.\n\nStarting from `I0 = closure(S'→.S)`, which also contains `S→.AA, A→.aA, A→.b`, we compute:\n- `goto(I0, S) = I1 = {S'→S.}` (this becomes the Accept state)\n- `goto(I0, A) = I2 = {S→A.A, A→.aA, A→.b}`\n- `goto(I0, a) = I3 = {A→a.A, A→.aA, A→.b}`\n- `goto(I0, b) = I4 = {A→b.}`\n- `goto(I2, A) = I5 = {S→AA.}`\n- `goto(I2, a) = I3` (same as before), `goto(I2, b) = I4` (same as before)\n- `goto(I3, A) = I6 = {A→aA.}`\n- `goto(I3, a) = I3`, `goto(I3, b) = I4`\n\n**Step 3: Compute FOLLOW sets (needed for SLR).** FOLLOW(S')={$}, FOLLOW(S)={$}, FOLLOW(A)={a,b,$}.\n\n**Step 4: Build the Action/Goto table.** For SLR(1): if `A→α.` is complete in state I, place \"reduce by A→α\" under every symbol in FOLLOW(A). If `A→α.aβ` is in state I and goto(I,a)=J, place \"shift to J\" under column a.\n\n| State | a | b | $ | S | A |\n|---|---|---|---|---|---|\n| 0 | s3 | s4 | | 1 | 2 |\n| 1 | | | Accept | | |\n| 2 | s3 | s4 | | | 5 |\n| 3 | s3 | s4 | | | 6 |\n| 4 | r(A→b) | r(A→b) | r(A→b) | | |\n| 5 | r(S→AA) | r(S→AA) | r(S→AA) | | |\n| 6 | r(A→aA) | r(A→aA) | r(A→aA) | | |\n\n**Step 5: Parse `aabb$` using the stack of states.**\n\n| Stack | Input | Action |\n|---|---|---|\n| 0 | aabb$ | shift, go to 3 |\n| 0 3 | abb$ | shift, go to 3 |\n| 0 3 3 | bb$ | shift, go to 4 |\n| 0 3 3 4 | b$ | reduce A→b, goto(3,A)=6 |\n| 0 3 3 6 | b$ | reduce A→aA, goto(3,A)=6 |\n| 0 3 6 | b$ | reduce A→aA, goto(0,A)=2 |\n| 0 2 | b$ | shift, go to 4 |\n| 0 2 4 | $ | reduce A→b, goto(2,A)=5 |\n| 0 2 5 | $ | reduce S→AA, goto(0,S)=1 |\n| 0 1 | $ | **Accept** |\n\n**Final Answer:** The string `aabb` is successfully parsed and accepted using the SLR(1) table constructed above.\n\n**Common mistakes:** Forgetting to augment the grammar with `S'→S` before starting; forgetting that LR(0) would put a reduce action under EVERY column instead of just FOLLOW(A), which is what causes LR(0) to have more conflicts than SLR(1); mixing up shift and goto columns (shift columns are for terminals, goto columns are for non-terminals).\n\n**Exam shortcut:** If two different actions appear in the same table cell (a shift-reduce or reduce-reduce conflict), the grammar is not usable with that parsing method — clearly state \"conflict found in state X on symbol y, hence not SLR(1)/LALR(1)\" as this is sometimes exactly what the question is testing.", "diagramMd": "Draw the canonical collection as a state diagram: I0 with edges to I1 (on S), I2 (on A), I3 (on a), I4 (on b); I2 with edges to I5 (on A), I3 (on a), I4 (on b); I3 with edges to I6 (on A), I3 (self-loop on a), I4 (on b).", "mustWrite": ["Augmented grammar `S'→S` written first.", "Correct closure and goto computation for every state, shown as working, not just the final sets.", "Correct Action/Goto table using the right rule for whichever variant (SLR uses FOLLOW; CLR/LALR use exact lookahead per item).", "Full stack-trace parse ending in Accept.", "If a conflict exists, state it clearly instead of hiding it."], "keywords": ["Augmented grammar", "closure", "goto", "canonical collection", "Action table", "Goto table", "shift", "reduce", "Accept", "conflict"], "finalVersionMd": "LR parsers are bottom-up parsers that build a rightmost derivation in reverse. LR(0), SLR(1), CLR(1), and LALR(1) differ in how they decide to reduce: LR(0) reduces regardless of lookahead; SLR(1) reduces only when the next symbol is in FOLLOW of the left-hand side; CLR(1) carries an exact lookahead with every item; and LALR(1) merges CLR(1) states that share the same core, giving a table as small as SLR(1) but almost as powerful as CLR(1).\n\nTo build the table for `S→AA, A→aA|b`, we first augment the grammar to `S'→S`, then build the canonical collection of item sets using closure and goto starting from I0 = closure(S'→.S). This produces states I0 through I6, with I1 = {S'→S.} being the accept state, I4 = {A→b.} and I5 = {S→AA.} and I6 = {A→aA.} being reduce states.\n\nUsing FOLLOW(S)={$} and FOLLOW(A)={a,b,$}, the SLR(1) table places shift actions for `a` and `b` from states 0, 2, and 3, and reduce actions in states 4, 5, and 6 under every symbol in FOLLOW(A) or FOLLOW(S).\n\nParsing `aabb$`: shift a (state 3), shift a (state 3), shift b (state 4), reduce A→b, reduce A→aA, reduce A→aA to get to state 2, shift b (state 4), reduce A→b, reduce S→AA, and finally reach state 1 with the input exhausted, giving **Accept**.\n\n---", "quickRefMd": "**What is given:** A grammar (e.g. `S→L=R|R, L→*R|id, R→L` or `S→AA, A→aA|b`).\n**What to find:** Canonical item sets → parsing table → parse a string.\n\n**The 4 variants — know the difference (High-Probability short-answer too):**\n\n| Parser | How it decides \"reduce\" | Table size | Power |\n|---|---|---|---|\n| LR(0) | No lookahead — reduce for EVERY input symbol in that state | Smallest | Weakest (many conflicts) |\n| SLR(1) | Uses FOLLOW(A) of the LHS to decide reduce | Small | Medium (some conflicts still possible) |\n| CLR(1) | Each item carries its own exact lookahead | Largest | Most powerful (fewest conflicts) |\n| LALR(1) | Same as CLR(1) but merges states with the same core (LR(0) part) | Same size as SLR | Almost as powerful as CLR, much smaller table |\n\n**Step-by-step solution (same skeleton for all 4 — only the table-filling rule changes):**\n1. **Augment the grammar:** add `S'→S`.\n2. **Write closure() and goto() functions:**\n   - `closure(I)`: if `A→α.Bβ` is in I, add every production `B→.γ` to I (for CLR/LALR, also compute the lookahead using FIRST(βa)).\n   - `goto(I, X)`: move the dot over symbol X in every item of I, then take closure.\n3. **Build the canonical collection** of item sets I0, I1, I2, ... starting from `closure(S'→.S)`.\n4. **Build the Action/Goto table:**\n   - LR(0)/SLR(1): if `A→α.` is in state i, put \"reduce by A→α\" under every column in FOLLOW(A) (SLR) or under every column (LR(0)).\n   - CLR(1)/LALR(1): if `A→α., a` is in state i, put \"reduce by A→α\" only under column `a`.\n   - If `A→α.aβ` is in state i and goto(i,a)=j, put \"shift to j\" under column a.\n   - `S'→S.` gives \"Accept\".\n5. **Parse the string** using a stack of states: at each step, look up Action[top-state, current-symbol] → shift, reduce, accept, or error.\n\n**Worked example — `S→AA, A→aA|b` (a classic exam grammar):**\n- Augmented: `S'→S`. Canonical sets I0…I6 built using closure/goto.\n- FOLLOW(S')={$}, FOLLOW(S)={$}, FOLLOW(A)={a,b,$}.\n- LR(0) table has conflicts here because reduces cover the whole row. Using SLR fixes this using FOLLOW(A)={a,b,$}.\n- Parse string `aabb$` — 9-step trace ending in Accept (shift a, shift a, shift b → reduce A→b, shift b → reduce A→b, reduce A→aA, reduce A→aA, reduce S→AA, Accept).\n\n**Common mistakes:** Forgetting to augment the grammar with `S'→S` first; putting a reduce action under FOLLOW when you should be using exact lookahead (mixing up SLR and CLR rules); not checking for shift-reduce or reduce-reduce conflicts (if two actions are possible in the same cell, the grammar is NOT SLR/LALR/etc. for that method — say so explicitly, it's often part of the question).\n\n**Exam shortcut:** If asked \"check whether SLR\" and you find a conflict (two entries in one table cell), don't panic — write \"Conflict found in state X under symbol Y, hence NOT SLR(1)\" — this is often exactly the expected answer (the PPT itself has a worked example proving a grammar is NOT SLR).\n\n**✍️ MINIMUM FULL-MARK ANSWER:** Augmented grammar → canonical item sets (I0 onwards, via closure/goto) → filled Action/Goto table → stack trace for the given string ending in Accept (or state the conflict if one exists).\n\n---"}, {"id": "u3-vh-3", "globalIndex": 16, "unit": 3, "priority": "Very High", "question": "Eliminate Left Recursion from the given grammar, and perform Left Factoring on the given grammar.", "questionShort": "Eliminate Left Recursion / Perform Left Factoring on a grammar", "marks": "4–8", "marksNote": "", "repeated": "Assignment-1 Q6, CD_3 Q4-OR(a) (both together), CD.pdf Q2(B) & Q2(B)-OR — **3 sources, 4 occurrences.**", "years": "", "inPPT": "Yes — very heavily drilled (6+6 slides, 7 worked examples total).", "type": "Algorithm (Numerical).", "typeTags": ["Numerical", "Algorithm"], "answerMd": "Top-down parsers cannot work correctly on a grammar that is left-recursive or that has productions sharing a common prefix, so both problems must be fixed before building a predictive parser.\n\n**Left Recursion.** A grammar is left-recursive if it has a production of the form `A→Aα`, because a top-down parser trying to expand A would call itself again immediately, without consuming any input, leading to an infinite loop.\n\n**Formula to remove direct left recursion:**\n```\nGiven:      A → Aα1 | Aα2 | ... | Aαm | β1 | β2 | ... | βn\nRewrite as: A  → β1 A' | β2 A' | ... | βn A'\n            A' → α1 A' | α2 A' | ... | αm A' | ε\n```\n\n**Given:** `E→E+T|T, T→T*F|F, F→(E)|id`.\n\n**Step 1:** Here, in `E→E+T|T`, α1=\"+T\" and β1=\"T\"; in `T→T*F|F`, α1=\"*F\" and β1=\"F\". Applying the formula:\n```\nE  → T E'\nE' → + T E' | ε\nT  → F T'\nT' → * F T' | ε\nF  → (E) | id\n```\n**Final Answer (left recursion removed):** as shown above.\n\nFor **indirect left recursion** (where A leads back to itself through another non-terminal, such as `A→Bx, B→Ay`), the general algorithm is:\n```\nOrder the non-terminals as A1, A2, ..., An.\nFor i = 1 to n:\n    For j = 1 to i-1:\n        Replace every production Ai → Aj γ with Ai → δ1γ | δ2γ | ... (where Aj → δ1|δ2|... are Aj's current productions)\n    Eliminate any direct left recursion now present among Ai's own productions, using the formula above.\n```\n\n**Left Factoring.** When two or more productions of the same non-terminal start with the same prefix, a top-down parser cannot decide which one to use just by looking at the first symbol. For example, in `S → if E then S else S | if E then S`, seeing the token \"if\" does not tell the parser which alternative applies.\n\n**Formula for left factoring:**\n```\nGiven:      A → αβ1 | αβ2 | ... | αβn | γ    (α is the longest common prefix)\nRewrite as: A  → αA' | γ\n            A' → β1 | β2 | ... | βn\n```\n\n**Given:** `S→cdLk|cdk|cd, L→mn|ε`.\n\n**Step 1:** the common prefix among the first three alternatives is `cd`. Applying the formula:\n```\nS  → cd S'\nS' → Lk | k | ε\nL  → mn | ε\n```\n**Final Answer (left factored):** as shown above.\n\n**Common mistakes:** Confusing left recursion removal with left factoring — recursion removal fixes a non-terminal appearing at the START of its OWN production, while left factoring fixes MULTIPLE alternatives sharing a common prefix; these look similar but need different formulas. Also, forgetting to include the `ε` option in the new non-terminal A' in both formulas.", "diagramMd": "", "mustWrite": ["State the problem clearly (why top-down parsing fails without this fix) before applying the formula.", "Correctly identify which formula applies (recursion vs factoring).", "Apply the exact general formula, not just an ad-hoc rewrite.", "Show the final rewritten grammar clearly."], "keywords": ["Left recursion", "left factoring", "common prefix", "direct recursion", "indirect recursion"], "finalVersionMd": "A grammar is left-recursive if it has a production of the form `A→Aα`, which causes a top-down parser to loop infinitely without consuming input. Direct left recursion is removed using the formula: given `A→Aα1|...|Aαm|β1|...|βn`, rewrite as `A→β1A'|...|βnA'` and `A'→α1A'|...|αmA'|ε`. Applying this to `E→E+T|T, T→T*F|F, F→(E)|id` gives `E→TE', E'→+TE'|ε, T→FT', T'→*FT'|ε, F→(E)|id`.\n\nLeft factoring is needed when two or more productions of a non-terminal share a common prefix, so the parser cannot decide which one to expand using only the next input symbol. Given `A→αβ1|αβ2|...|αβn|γ`, we rewrite as `A→αA'|γ` and `A'→β1|β2|...|βn`. Applying this to `S→cdLk|cdk|cd, L→mn|ε` gives `S→cdS', S'→Lk|k|ε, L→mn|ε`.\n\n---", "quickRefMd": "**Left Recursion — the problem:** A grammar like `A→Aα|β` causes infinite loops in top-down parsing.\n\n**Formula to remove DIRECT left recursion:**\n```\nGiven:  A → Aα1 | Aα2 | ... | Aαm | β1 | β2 | ... | βn\nChange to:\n        A  → β1 A' | β2 A' | ... | βn A'\n        A' → α1 A' | α2 A' | ... | αm A' | ε\n```\n\n**Worked example:** `E→E+T|T, T→T*F|F, F→(E)|id`\n→ `E→TE', E'→+TE'|ε, T→FT', T'→*FT'|ε, F→(E)|id`\n\n**Indirect left recursion — general algorithm:**\n```\nOrder the non-terminals A1...An.\nFor i = 1 to n:\n   For j = 1 to i-1:\n       replace Ai → Aj γ with Ai → δ1γ | δ2γ | ... (where Aj→δ1|δ2|... are Aj's productions)\n   Eliminate direct left recursion among Ai's own productions.\n```\n\n**Left Factoring — the problem:** `S → if E then S else S | if E then S` — parser can't decide which rule to use just by seeing \"if\".\n\n**Formula:**\n```\nGiven:  A → αβ1 | αβ2 | ... | αβn | γ   (α is the common prefix)\nChange to:\n        A  → αA' | γ\n        A' → β1 | β2 | ... | βn\n```\n\n**Worked example:** `S→cdLk|cdk|cd, L→mn|ε` → `S→cdS', S'→Lk|k|ε, L→mn|ε`\n\n**Common mistakes:** Doing left factoring when the question actually asks for left recursion removal (they look similar but solve different problems — recursion = A on the LEFT of its own rule; factoring = common prefix shared by MULTIPLE rules); forgetting the `ε` option in A'.\n\n**✍️ MINIMUM FULL-MARK ANSWER:** State which transformation applies → write the general formula → apply it directly to the given grammar, showing the new grammar clearly.\n\n---"}, {"id": "u3-vh-4", "globalIndex": 17, "unit": 3, "priority": "Very High", "question": "Check whether the given grammar is ambiguous. (`E→a|Ea|bEE|EEb|EbE`, string `baaab`)", "questionShort": "Check whether a given grammar is Ambiguous (prove it / disprove it)", "marks": "4–6", "marksNote": "", "repeated": "CD_3 Q5-OR(b), CD.pdf Q4(B) & Q4(A)-OR — **3 sources**; also 2 unsolved practice questions sit inside the PPT itself (a strong \"this WILL be asked\" signal).", "years": "", "inPPT": "", "type": "Algorithm (proof-style).", "typeTags": ["Algorithm"], "answerMd": "A grammar is said to be **ambiguous** if it is possible to construct more than one parse tree, or more than one leftmost derivation, for the same string. This is undesirable in a programming language grammar because it means the same piece of code could be interpreted in more than one way.\n\n**Given:** grammar `E→a|Ea|bEE|EEb|EbE`, string `baaab`.\n\n**Step 1:** To prove the grammar is ambiguous, it is enough to find just one string and show two different leftmost derivations that both produce it.\n\n**Step 2 — Derivation 1** (using the rule E→bEE first):\n```\nE → bEE → baE → baEEb → baaEb → baaab\n```\n\n**Step 3 — Derivation 2** (using the rule E→EEb first):\n```\nE → EEb → bEEEb → baEEb → baaEb → baaab\n```\n\n**Step 4:** Both derivations are valid leftmost derivations, and both produce the exact same string `baaab`, but they apply different productions at the first step and follow different paths afterward. Since two different leftmost derivations exist for the same string, they also correspond to two different parse trees.\n\n**Final Answer:** Since the string `baaab` has two different leftmost derivations (and hence two different parse trees), the given grammar **is ambiguous**.\n\n**Common mistakes:** Showing only one derivation, which does not prove anything by itself; picking an unnecessarily long or complicated test string when a short one would do just as well.\n\n**Exam shortcut:** If asked to disprove ambiguity instead (show a grammar is NOT ambiguous), you cannot do this by checking only a few strings — you need to argue from the grammar's structure (for example, that it always derives left recursively in only one possible way). Usually, exams only ask you to prove ambiguity where it exists, using the two-derivation method above.", "diagramMd": "", "mustWrite": ["Correct definition: more than one parse tree / leftmost derivation for the same string.", "A specific test string.", "Two different, fully written-out derivations reaching the same string.", "A clear concluding statement that the grammar is ambiguous."], "keywords": ["Ambiguous grammar", "parse tree", "leftmost derivation", "same string"], "finalVersionMd": "A grammar is ambiguous if more than one parse tree, or more than one leftmost derivation, can be constructed for the same string. To prove the grammar `E→a|Ea|bEE|EEb|EbE` is ambiguous, consider the string `baaab`.\n\nUsing the production E→bEE first: `E → bEE → baE → baEEb → baaEb → baaab`.\n\nUsing the production E→EEb first: `E → EEb → bEEEb → baEEb → baaEb → baaab`.\n\nBoth derivations are valid leftmost derivations of the grammar, and both produce the same string `baaab`, but through different sequences of productions. Since two different leftmost derivations exist for the same string, the grammar produces two different parse trees for it, and is therefore **ambiguous**.\n\n---", "quickRefMd": "**⭐ Definition:** A grammar is ambiguous if it can produce **more than one parse tree** (or more than one leftmost derivation) for the **same** string.\n\n**How to prove ambiguous (method):** Find ONE string, and show TWO different leftmost derivations (or two different parse trees) that both produce it.\n\n**Worked example:** Grammar `E→a|Ea|bEE|EEb|EbE`, string `baaab`.\n- Derivation 1 (using E→bEE): E→bEE→baE→baEEb→baaEb→baaab\n- Derivation 2 (using E→EEb): E→EEb→bEEEb→baEEb→baaEb→baaab\n- Since 2 different leftmost derivations give the same string → **grammar is ambiguous.**\n\n**✍️ MINIMUM FULL-MARK ANSWER:** Definition (1 line) + pick a small test string + show 2 different derivations or 2 different parse trees reaching that same string + conclude \"hence ambiguous.\"\n\n**Common mistakes:** Showing only ONE derivation (that proves nothing); using a string too long/complicated — pick the shortest string that shows the problem.\n\n---"}, {"id": "u3-vh-5", "globalIndex": 18, "unit": 3, "priority": "Very High", "question": "Compute the FIRST and FOLLOW sets for the given grammar. (`A→BCD|Cx, B→b|ε, C→c|ε, D→d|ε`)", "questionShort": "Compute FIRST and FOLLOW sets for a given grammar", "marks": "4–8", "marksNote": "", "repeated": "Assignment-1 Q10, CD_3 Q4(a), CD.pdf Q4(B)-OR — **3 sources.**", "years": "", "inPPT": "", "type": "Algorithm (Numerical).", "typeTags": ["Numerical", "Algorithm"], "answerMd": "**FIRST(X)** is the set of terminal symbols that can appear as the first symbol of some string derived from X (and includes ε if X can derive the empty string). **FOLLOW(X)** is the set of terminal symbols that can appear immediately after X in some sentential form derived from the start symbol.\n\n**Rules for computing FIRST(X):**\n1. If X is a terminal, FIRST(X) = {X}.\n2. If X→ε is a production, add ε to FIRST(X).\n3. If X→Y1Y2...Yk, add every non-ε symbol of FIRST(Y1) to FIRST(X); if Y1 can derive ε, also add FIRST(Y2), and continue this way; if every Yi can derive ε, add ε to FIRST(X) as well.\n\n**Rules for computing FOLLOW(X):**\n1. Add `$` to FOLLOW(the start symbol).\n2. If there is a production A→αXβ, add every non-ε symbol of FIRST(β) to FOLLOW(X).\n3. If there is a production A→αXβ where β is empty, or β can derive ε, add every symbol of FOLLOW(A) to FOLLOW(X).\n\n**Given:** `A→BCD|Cx, B→b|ε, C→c|ε, D→d|ε` (assume A is the start symbol).\n\n**Step 1: FIRST sets.**\n- FIRST(B) = {b, ε} (B can be `b`, or can derive ε).\n- FIRST(C) = {c, ε}.\n- FIRST(D) = {d, ε}.\n- FIRST(A): from A→BCD, since B can derive ε, we also look at C; since C can derive ε, we also look at D; since D can derive ε too, ε is included. From A→Cx, we get `c` from C, and since C can derive ε, we also get `x`. So **FIRST(A) = {b, c, d, x, ε}**.\n\n**Step 2: FOLLOW sets.**\n- FOLLOW(A) = {$} (A is the start symbol).\n- From A→BCD: FOLLOW(B) gets FIRST(CD); since C can derive ε, this includes FIRST(C)={c} and then FIRST(D)={d}, and since D can also derive ε, FOLLOW(A) is added too. So **FOLLOW(B) = {c, d, $}**.\n- FOLLOW(C) gets FIRST(D) = {d} (from A→BCD), and since D can derive ε, FOLLOW(A)={$} is added; also, from A→Cx, FOLLOW(C) gets the literal terminal `x`. So **FOLLOW(C) = {d, x, $}**.\n- FOLLOW(D) gets FOLLOW(A) = {$}, since D is the last symbol in `BCD`. So **FOLLOW(D) = {$}**.\n\n**Final Answer:**\n\n| Non-terminal | FIRST | FOLLOW |\n|---|---|---|\n| A | {b, c, d, x, ε} | {$} |\n| B | {b, ε} | {c, d, $} |\n| C | {c, ε} | {d, x, $} |\n| D | {d, ε} | {$} |\n\n**Common mistakes:** Forgetting to check whether a symbol can derive ε before moving on to the next symbol in a production while computing FIRST; forgetting to add `$` to FOLLOW of the start symbol; forgetting that FOLLOW of the LHS must be added when the remaining symbols after X in a production can all derive ε.", "diagramMd": "", "mustWrite": ["State the rules for FIRST and FOLLOW before applying them.", "Show the working for each non-terminal, not just the final answer.", "Correctly handle every nullable (ε-deriving) non-terminal.", "`$` correctly included in FOLLOW(start symbol)."], "keywords": ["FIRST", "FOLLOW", "nullable", "derive ε", "start symbol"], "finalVersionMd": "FIRST(X) is the set of terminals that can begin a string derived from X, including ε if X can derive the empty string. FOLLOW(X) is the set of terminals that can appear immediately after X in some derivation from the start symbol, and always includes `$` for the start symbol itself.\n\nFor the grammar `A→BCD|Cx, B→b|ε, C→c|ε, D→d|ε`, since B, C, and D can each derive either their terminal or ε, we get FIRST(B)={b,ε}, FIRST(C)={c,ε}, FIRST(D)={d,ε}, and FIRST(A)={b,c,d,x,ε}, because if B derives ε we look at C, and if C derives ε we look at D, and if D also derives ε we add ε itself; from A→Cx we also get x.\n\nFor FOLLOW, since A is the start symbol, FOLLOW(A)={$}. From A→BCD, FOLLOW(B) picks up FIRST(C) and, since C can derive ε, also FIRST(D) and, since D can derive ε too, FOLLOW(A); this gives FOLLOW(B)={c,d,$}. FOLLOW(C) picks up FIRST(D)={d} and FOLLOW(A)={$} similarly, plus the literal terminal x from A→Cx, giving FOLLOW(C)={d,x,$}. FOLLOW(D) simply picks up FOLLOW(A)={$}, since D is the last symbol in BCD.", "quickRefMd": "**Rules for FIRST(X):**\n- If X is a terminal, FIRST(X) = {X}.\n- If X→ε, add ε to FIRST(X).\n- If X→Y1Y2...Yk, add FIRST(Y1)−{ε}; if Y1 is nullable, also add FIRST(Y2), and so on; if ALL Yi are nullable, add ε too.\n\n**Rules for FOLLOW(X):**\n- Add `$` to FOLLOW(start symbol).\n- If A→αXβ, add FIRST(β)−{ε} to FOLLOW(X).\n- If A→αXβ and β is nullable (or β is empty), add FOLLOW(A) to FOLLOW(X).\n\n**Worked example:** `A→bcg|gh` → FIRST(A)={b,g}. `A→Bcd|gh, B→m|ε` → FIRST(A)={m,c,g}, FIRST(B)={m,ε}.\n\n**✍️ MINIMUM FULL-MARK ANSWER:** State the rules briefly, then a clean FIRST/FOLLOW table for every non-terminal in the given grammar.\n\n**Common mistakes:** Forgetting to check if a non-terminal is nullable (can derive ε) before moving to the next symbol in a production; forgetting `$` in FOLLOW(start symbol).\n\n---"}], "high": [{"id": "u3-high-1", "globalIndex": 19, "unit": 3, "priority": "High", "question": "Explain Operator Precedence Parsing. Construct the precedence table and parse the given string using it. (`E→E+E|E*E|id`, string `id+id*id`)", "questionShort": "Operator Precedence Parsing — construct the table and parse a string", "marks": "6–8", "marksNote": "", "repeated": "Assignment-2 Q9, CD_2 Q3(b)/Q5(a), CD_3 Q4-OR(b), CD.pdf Q3(B) — **4 sources.**", "years": "", "inPPT": "", "type": "Algorithm (Numerical).", "typeTags": ["Numerical", "Diagram", "Algorithm"], "answerMd": "Operator Precedence Parsing is a simplified type of shift-reduce (bottom-up) parsing that can be used only on a restricted class of grammars called operator grammars, in which no production has two adjacent non-terminals and no production is empty. Instead of maintaining a full parsing table of states, this method compares the precedence of pairs of terminal symbols directly, using three relations: `a <· b` meaning \"a yields precedence to b\" (so we should shift), `a =· b` meaning \"a has the same precedence as b\", and `a ·> b` meaning \"a takes precedence over b\" (so we should reduce).\n\n**Given:** grammar `E→E+E|E*E|id`, string `id+id*id`.\n\n**Step 1: Build the precedence relation table** for the terminals `{id, +, *, $}`, based on the usual rules of arithmetic precedence, where `*` has higher precedence than `+`, and both are left-associative, and `id` always has the highest precedence over any operator that follows or precedes it.\n\n| | id | + | * | $ |\n|---|---|---|---|---|\n| id | | ·> | ·> | ·> |\n| + | <· | ·> | <· | ·> |\n| * | <· | ·> | ·> | ·> |\n| $ | <· | <· | <· | |\n\n**Step 2: Parse the string `id+id*id$` using this table**, comparing the stack-top terminal with the current input symbol at every step, shifting on `<·` or `=·`, and reducing (popping the handle) on `·>`.\n\n| Stack | Input | Action |\n|---|---|---|\n| $ | id+id*id$ | id·<·? Actually $<·id, so shift |\n| $id | +id*id$ | id·>+, reduce id to E, treat E as id for table lookup |\n| $E | +id*id$ | $<·+, shift |\n| $E+ | id*id$ | +<·id, shift |\n| $E+id | *id$ | id·>*, reduce id to E |\n| $E+E | *id$ | +<·*, shift |\n| $E+E* | id$ | *<·id, shift |\n| $E+E*id | $ | id·>$, reduce id to E |\n| $E+E*E | $ | *·>$, reduce E*E to E |\n| $E+E | $ | +·>$, reduce E+E to E |\n| $E | $ | **Accept** |\n\n**Final Answer:** the string `id+id*id` is accepted, and the precedence table above is the required answer.\n\n**How the handle is found (write this if asked separately):** scan left to right until the first `·>` relation is found; then scan backward over any `=·` relations until a `<·` is found; everything between these two points is the handle to be reduced.\n\n**Common mistakes:** Mixing up the direction of `<·` and `·>` (remember: `<·` means \"shift\", `·>` means \"reduce\"); forgetting that `id` is treated as a single terminal-like symbol for precedence comparisons even though it becomes a non-terminal E after reduction.", "diagramMd": "The precedence relation table shown above must be drawn and filled in completely.", "mustWrite": ["Definition of Operator Precedence Parsing and the three relations `<·`, `=·`, `·>`.", "Complete, correctly filled precedence table.", "Full stack/input/action trace ending in Accept.", "The 3-step handle-finding method, if extra marks are available for it."], "keywords": ["Operator grammar", "precedence relations", "yields precedence", "takes precedence", "handle"], "finalVersionMd": "Operator Precedence Parsing is a form of bottom-up parsing usable on operator grammars, where no production has two adjacent non-terminals. It uses three precedence relations between terminal symbols: `a<·b` (a yields precedence to b, so shift), `a=·b` (equal precedence), and `a·>b` (a takes precedence over b, so reduce).\n\nFor the grammar `E→E+E|E*E|id`, the precedence table over {id,+,*,$} is built using the usual rule that `*` has higher precedence than `+`, both are left-associative, and `id` has the highest precedence of all. Using this table, parsing `id+id*id$` proceeds by shifting `id`, reducing it to E on seeing `id·>+`, shifting `+`, shifting the next `id`, reducing it to E, shifting `*`, shifting the last `id`, reducing it to E, then reducing `E*E` to E on seeing `*·>$`, and finally reducing `E+E` to E, leaving just E on the stack with the input exhausted, giving **Accept**.\n\n---", "quickRefMd": "**Simple explanation:** Instead of a full parsing table, we just compare precedence between pairs of terminals using 3 relations: `<·` (yields precedence), `=·` (equal precedence), `·>` (takes precedence).\n\n**Algorithm:**\n1. Point i at the first symbol of input (ending in `$`).\n2. If top of stack = `$` and current input = `$`: Accept.\n3. If top-of-stack terminal `a` and next input `b`: if `a <· b` or `a =· b`: push b, advance i. If `a ·> b`: pop the stack (reduce) repeatedly until the relation flips.\n\n**Handle-finding shortcut (3 steps):** (1) Scan left to right until the first `·>`. (2) Scan back left over `=·` relations until you hit `<·`. (3) Everything between is the handle.\n\n**Worked example:** `E→E+E|E*E|id`, string `id+id*id`. Precedence table built for {id,+,*,$}; full stack trace ends in Accept (10 steps).\n\n**✍️ MINIMUM FULL-MARK ANSWER:** Precedence relation table for the operators → stack/input/action trace → Accept.\n\n**Common mistakes:** Confusing `<·` and `·>` direction (⋖ means \"the stack symbol has LOWER precedence, so shift\"; ⋗ means \"the stack symbol has HIGHER precedence, so reduce\").\n\n---"}, {"id": "u3-high-2", "globalIndex": 20, "unit": 3, "priority": "High", "question": "Explain Shift-Reduce Parsing with Handle and Handle Pruning, and show a parsing trace.", "questionShort": "Shift-Reduce Parsing — explain with Handle and Handle Pruning", "marks": "6–8", "marksNote": "", "repeated": "CD_3 Q4(b), CD.pdf Q4(A) — 2 sources.", "years": "", "inPPT": "", "type": "Algorithm.", "typeTags": ["Algorithm"], "answerMd": "Shift-Reduce Parsing is a form of bottom-up parsing that builds the parse tree from the leaves up to the root. It uses a stack to hold grammar symbols and an input buffer holding the remaining input, and it repeats a cycle of shifting input symbols onto the stack and reducing the symbols on top of the stack back to a non-terminal, until the entire input has been reduced to the start symbol.\n\nA **handle** is a substring on top of the stack that exactly matches the right-hand side of some production, such that reducing it to the corresponding left-hand side non-terminal is a valid step in reversing a rightmost derivation. The process of repeatedly finding a handle and reducing it is called **handle pruning**, and this is exactly how a bottom-up parser works its way back to the start symbol.\n\nThere are four possible actions in shift-reduce parsing:\n1. **Shift** — move the next symbol from the input buffer onto the top of the stack.\n2. **Reduce** — if the symbols on top of the stack form a handle, pop them off and push the non-terminal from the left-hand side of the matching production.\n3. **Accept** — announce successful completion when the stack holds only the start symbol and the input buffer is empty.\n4. **Error** — occurs when none of shift, reduce, or accept can be applied, meaning a syntax error exists in the input.\n\n**Given:** grammar `E→E+T|T, T→T*F|F, F→id`, string `id+id*id`.\n\n**Step-by-step trace:**\n\n| Stack | Input | Action |\n|---|---|---|\n| $ | id+id*id$ | shift |\n| $id | +id*id$ | reduce F→id |\n| $F | +id*id$ | reduce T→F |\n| $T | +id*id$ | reduce E→T |\n| $E | +id*id$ | shift |\n| $E+ | id*id$ | shift |\n| $E+id | *id$ | reduce F→id |\n| $E+F | *id$ | reduce T→F |\n| $E+T | *id$ | shift |\n| $E+T* | id$ | shift |\n| $E+T*id | $ | reduce F→id |\n| $E+T*F | $ | reduce T→T*F |\n| $E+T | $ | reduce E→E+T |\n| $E | $ | **Accept** |\n\n**Final Answer:** the string `id+id*id` is accepted through the above sequence of shifts and reduces.\n\n**Common mistakes:** Reducing too early, before the full handle has actually been shifted onto the stack; forgetting that \"E+id\" has the handle \"id\" alone at that point, not the whole string \"E+id\", since E has not yet combined with what follows.", "diagramMd": "", "mustWrite": ["Correct definition of Handle and Handle Pruning.", "All 4 actions (Shift, Reduce, Accept, Error) clearly explained.", "A complete stack/input/action trace ending in Accept."], "keywords": ["Handle", "handle pruning", "shift", "reduce", "accept", "error", "bottom-up parsing"], "finalVersionMd": "Shift-Reduce Parsing is a bottom-up parsing method that builds the parse tree from the leaves toward the root, using a stack and an input buffer. A handle is a substring on top of the stack matching the right-hand side of a production, which can be validly reduced to its left-hand side non-terminal as part of reversing a rightmost derivation; repeatedly finding and reducing handles is called handle pruning.\n\nThe parser has four possible actions: Shift, which moves the next input symbol onto the stack; Reduce, which replaces a handle on top of the stack with its corresponding non-terminal; Accept, which is announced when the stack holds only the start symbol and the input is empty; and Error, when none of the other actions apply.\n\nFor the grammar `E→E+T|T, T→T*F|F, F→id` and string `id+id*id`, the parser shifts `id`, reduces it through F→id, T→F, E→T; shifts `+`; shifts the next `id` and reduces it similarly through F→id, T→F; shifts `*`; shifts the last `id` and reduces it through F→id, then reduces `T*F` to T using T→T*F; finally reduces `E+T` to E using E→E+T, leaving only E on the stack with empty input, giving **Accept**.\n\n---", "quickRefMd": "**⭐ Definition (Handle):** A substring of a sentential form that matches the RHS of a production AND can be reduced to the LHS to continue a valid rightmost derivation in reverse.\n\n**4 actions in Shift-Reduce parsing:**\n1. **Shift** — move next input symbol onto the stack.\n2. **Reduce** — if the top of the stack is a handle, pop it and push the matching non-terminal.\n3. **Accept** — stack has only the start symbol and input is empty.\n4. **Error** — none of the above is possible.\n\n**Worked example:** `E→E+T|T, T→T*F|F, F→id`, string `id+id*id` → 13-step trace ending in Accept.\n\n**✍️ MINIMUM FULL-MARK ANSWER:** Definitions of Handle + the 4 actions + one worked stack trace table (columns: Stack | Input | Action).\n\n---"}, {"id": "u3-high-3", "globalIndex": 21, "unit": 3, "priority": "High", "question": "Explain Leftmost and Rightmost Derivation with an example, and differentiate Parse Tree from Syntax Tree.", "questionShort": "Derivation (Leftmost/Rightmost) with Parse Tree, and Parse Tree vs Syntax Tree", "marks": "4–6", "marksNote": "", "repeated": "CD.pdf Q4(A)-OR, Assignment-1 Q2(2) — 2 sources.", "years": "", "inPPT": "", "type": "Theory + Diagram.", "typeTags": ["Theory", "Diagram"], "answerMd": "A derivation is the process of applying grammar productions, one after another, starting from the start symbol, until a string of terminals is obtained. At each step of a derivation, we must choose which non-terminal to replace next; this choice gives rise to two standard strategies.\n\nA **leftmost derivation** always replaces the leftmost non-terminal in the current sentential form at every step. A **rightmost derivation** always replaces the rightmost non-terminal in the current sentential form at every step.\n\n**Example:** For the grammar `S→S+S|S*S|id` and the string `id+id*id`:\n\nLeftmost derivation: `S → S*S → S+S*S → id+S*S → id+id*S → id+id*id`\n\nRightmost derivation: `S → S+S → S+S*S → S+S*id → S+id*id → id+id*id`\n\nEven though both derivations produce the same final string, the order in which the productions are applied is different, and this can also lead to different parse trees when the grammar is ambiguous.\n\n**Parse Tree vs Syntax Tree:**\n\n| Basis | Syntax Tree | Parse Tree |\n|---|---|---|\n| Node meaning | Interior nodes represent operators and leaves represent operands. | Interior nodes represent non-terminals and leaves represent terminals. |\n| What it represents | It represents the abstract syntax of the program, showing only the essential structure. | It represents the concrete syntax of the program, showing every grammar symbol used. |\n| Practical use | It is usually built as an actual data structure inside a real compiler. | It is rarely built as a real data structure; it is mainly a conceptual tool for understanding derivations. |", "diagramMd": "", "mustWrite": ["Correct definitions of leftmost and rightmost derivation.", "A complete worked example showing both derivations step by step for the same string.", "The comparison table between Parse Tree and Syntax Tree."], "keywords": ["Leftmost derivation", "rightmost derivation", "sentential form", "abstract syntax", "concrete syntax"], "finalVersionMd": "A leftmost derivation replaces the leftmost non-terminal at every step of a derivation, while a rightmost derivation replaces the rightmost non-terminal at every step. For the grammar `S→S+S|S*S|id` and the string `id+id*id`, the leftmost derivation is `S→S*S→S+S*S→id+S*S→id+id*S→id+id*id`, and the rightmost derivation is `S→S+S→S+S*S→S+S*id→S+id*id→id+id*id`.\n\nA syntax tree represents the abstract syntax of a program, with operators as interior nodes and operands as leaves, and is usually built as an actual data structure inside a compiler. A parse tree represents the concrete syntax of a program, with non-terminals as interior nodes and terminals as leaves, and is mainly used as a conceptual tool to understand how a string is derived, rather than being built as an actual data structure.\n\n---", "quickRefMd": "**⭐ Definitions:** Leftmost derivation = at every step, replace the LEFTMOST non-terminal. Rightmost derivation = at every step, replace the RIGHTMOST non-terminal.\n\n**Worked example:** `S→S+S|S*S|id`, string `id+id*id`:\n- Leftmost: S→S*S→S+S*S→id+S*S→id+id*S→id+id*id\n- Rightmost: S→S+S→S+S*S→S+S*id→S+id*id→id+id*id\n\n**Parse Tree vs Syntax Tree table:**\n\n| Syntax Tree | Parse Tree |\n|---|---|\n| Interior nodes = operators, leaves = operands | Interior nodes = non-terminals, leaves = terminals |\n| Represents abstract syntax | Represents concrete syntax |\n| Usually built as a real data structure in compilers | Rarely built as an actual data structure |\n\n**✍️ MINIMUM FULL-MARK ANSWER:** Both derivations side by side (as above) + the tree diagrams + the comparison table if asked."}], "mediumMd": "(short prep points only)\n\n- **Chomsky Grammar Classification:** Type-0 (unrestricted/phrase structure), Type-1 (context-sensitive, αAβ→αγβ), Type-2 (context-free, A→γ — used for programming languages), Type-3 (regular, A→a or A→aB).\n- **Reduction:** the reverse of derivation — replacing a substring matching a production's RHS by its LHS, moving toward the start symbol (this is what bottom-up parsing does).\n- **Recursive Descent Parser:** a set of recursive procedures, one per non-terminal, that may need backtracking. **Advantages:** simple to build. **Disadvantages:** slow, poor error messages, can't handle grammars needing long lookahead.\n- **Non-recursive (table-driven) Predictive Parser:** uses an explicit stack + input buffer + parsing table M[X,a] instead of recursive calls — diagram: Input buffer + Stack both feed a \"Predictive Parsing Program\" box, which consults table M and produces output.", "lowMd": "(question only)\n\n- Draw the Parser classification diagram (Top-down: with/without backtracking → Recursive Descent/Predictive/LL(1); Bottom-up: Operator Precedence/LR family).\n- Explain Syntax Error Handling — 4 error types (Lexical, Syntactic, Semantic, Logical) and 3 goals of an error handler.\n- Draw transition diagrams for a predictive parser, built directly from the grammar.\n- Precedence Functions (f and g tables) built from a precedence relation graph."}, {"number": 4, "title": "UNIT 4 — Intermediate Code Generation & Runtime Environment", "intro": "**What this unit is about (simple words):** How the compiler represents code in a simple middle form (between source code and machine code), and how memory is managed when a program runs.", "veryHigh": [{"id": "u4-vh-1", "globalIndex": 22, "unit": 4, "priority": "Very High", "question": "Generate the Three Address Code, Quadruple, Triple, and Indirect Triple representation for the given expression. (`a := b * -c + b * -c
