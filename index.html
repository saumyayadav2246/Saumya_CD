| $E' | +id*id$ | E'→+TE' |\n| $E'T+ | +id*id$ | match + |\n| $E'T | id*id$ | T→FT' |\n| ... | ... | (continue similarly) |\n| $ | $ | **Accept** |", "mustWrite": ["Name the 4 steps of the LL(1) method before starting.", "Correctly remove left recursion first.", "Correct FIRST/FOLLOW table.", "Correct predictive parsing table, with every cell having only one entry (or explicitly state a conflict if one exists).", "A complete stack/input/action trace ending in Accept."], "keywords": ["LL(1)", "left recursion", "FIRST", "FOLLOW", "predictive parsing table", "stack", "Accept"], "finalVersionMd": "An LL(1) parser is a top-down, table-driven parser that scans input from left to right, produces a leftmost derivation, and decides the next production using only one lookahead symbol. It is constructed in four steps: remove left recursion, compute FIRST and FOLLOW sets, construct the predictive parsing table, and parse the input using a stack.\n\nFor the grammar `E→E+T|T, T→T*F|F, F→(E)|id`, removing left recursion gives `E→TE', E'→+TE'|ε, T→FT', T'→*FT'|ε, F→(E)|id`. The FIRST and FOLLOW sets are: FIRST(E)=FIRST(T)=FIRST(F)={(,id}, FIRST(E')={+,ε}, FIRST(T')={*,ε}; FOLLOW(E)=FOLLOW(E')={$,)}, FOLLOW(T)=FOLLOW(T')={+,$,)}, FOLLOW(F)={*,+,$,)}.\n\nUsing these, the predictive parsing table is built by placing production A→α in M[A,a] for every terminal a in FIRST(α), and additionally in M[A,b] for every b in FOLLOW(A) if α is nullable. Since every cell of the resulting table contains at most one production, the grammar is LL(1).\n\nTo parse `id+id*id`, we push `$E` on the stack and repeatedly consult the table: whenever the stack top is a non-terminal, we replace it using the table entry for the current input symbol; whenever it is a terminal matching the input, we pop it and advance the input. Following this process for `id+id*id$` empties the stack down to `$` exactly when the input is also exhausted, so the string is **accepted**.\n\n---", "quickRefMd": "**What is given:** A grammar, e.g. `E→E+T|T, T→T*F|F, F→(E)|id`, and a string, e.g. `id+id*id`.\n**What to find:** Whether it is LL(1); if yes, parse the string using the table.\n\n**Steps to construct LL(1) (write these 4 steps first, examiner loves seeing the method named):**\n1. Remove left recursion (see Q3 below).\n2. Compute FIRST and FOLLOW of every non-terminal (see Q5 below).\n3. Construct the predictive parsing table M[Non-terminal, terminal].\n4. Parse the input string using a stack + the table.\n\n**Worked example (`E→E+T|T, T→T*F|F, F→(E)|id`):**\n\nStep 1 (remove left recursion): `E→TE', E'→+TE'|ε, T→FT', T'→*FT'|ε, F→(E)|id`\n\nStep 2 (FIRST/FOLLOW):\n| Symbol | FIRST | FOLLOW |\n|---|---|---|\n| E | { ( , id } | { $, ) } |\n| E' | { +, ε } | { $, ) } |\n| T | { (, id } | { +, $, ) } |\n| T' | { *, ε } | { +, $, ) } |\n| F | { (, id } | { *, +, $, ) } |\n\nStep 3 (Parsing table M) — only the filled cells:\n| | id | + | * | ( | ) | $ |\n|---|---|---|---|---|---|---|\n| E | E→TE' | | | E→TE' | | |\n| E' | | E'→+TE' | | | E'→ε | E'→ε |\n| T | T→FT' | | | T→FT' | | |\n| T' | | T'→ε | T'→*FT' | | T'→ε | T'→ε |\n| F | F→id | | | F→(E) | | |\n\nStep 4 (parse `id+id*id$` using a stack): push `$E`; repeatedly compare stack-top with current input symbol, use the table to expand non-terminals, pop terminals that match, until stack = `$` and input = `$` → **Accept**.\n\n**Rule for the parsing algorithm (write this):**\n1. If top of stack = current input = `$`: Accept.\n2. If top of stack = current input (a terminal, not $): pop stack, move input pointer forward.\n3. If top of stack is a non-terminal X: look up M[X, current input symbol]. If it is a production, replace X on the stack by the production's RHS (reversed, so leftmost symbol is on top). If it is blank: Error.\n\n**Exam shortcut:** A grammar is LL(1) if for every non-terminal, no two productions share a FIRST symbol, AND if one production can derive ε, its FIRST and the other production's FOLLOW don't overlap.\n\n**Common mistakes:** Forgetting to remove left recursion FIRST (an LL(1) table cannot be correctly built on a left-recursive grammar); pushing the RHS onto the stack in the wrong order (must push right-to-left so the leftmost symbol ends up on top).\n\n**✍️ MINIMUM FULL-MARK ANSWER:** State the 4 steps → show FIRST/FOLLOW table → show parsing table → show the stack/input/action trace ending in Accept.\n\n---", "understandGuMd": "જુઓ ભાઈ, LL(1) parser એટલે શું? એ top-down parser છે, મતલબ input ને Left બાજુથી right બાજુ વાંચે છે, અને leftmost derivation બનાવે છે. \"1\" નો મતલબ એ છે કે parser ફક્ત 1 જ input symbol આગળ જોઈને (lookahead) નક્કી કરે છે કે કઈ production વાપરવી. આ આખું kaam ek parsing table ના આધારે થાય છે - table માં non-terminal અને current input symbol નું combination match કરીને directly ખબર પડી જાય કે કઈ rule apply કરવી.\n\nહવે LL(1) check કરવા અને string parse કરવા માટે 4 steps follow કરવાના છે. આપણી પાસે grammar છે `E→E+T|T, T→T*F|F, F→(E)|id` અને string છે `id+id*id`.\n\n**Step 1: Left recursion remove કરવી.** જુઓ, `E→E+T|T` અને `T→T*F|F` બંને left-recursive છે (કેમ કે E પોતે જ પોતાની production ની શરૂઆતમાં આવે છે). Top-down parser આવી grammar પર infinite loop માં ફસાઈ જાય, એટલે પહેલા standard formula વાપરીને recursion કાઢી નાખવી પડે. Result મળે છે: `E → T E'`, `E' → + T E' | ε`, `T → F T'`, `T' → * F T' | ε`, `F → ( E ) | id`.\n\n**Step 2: દરેક non-terminal ના FIRST અને FOLLOW કાઢવા.** આ table બનાવવા માટે જરૂરી છે - FIRST એટલે એ non-terminal માંથી કયો terminal પહેલો આવી શકે, અને FOLLOW એટલે એ non-terminal પછી તરત કયો terminal આવી શકે. Calculation કરીએ તો E અને T અને F ના FIRST માં `(` અને `id` આવે, E' ના FIRST માં `+` અને `ε`, T' ના FIRST માં `*` અને `ε`. FOLLOW ની વાત કરીએ તો E અને E' નું FOLLOW `{$, )}` છે, T અને T' નું `{+, $, )}` છે, અને F નું `{*, +, $, )}` છે.\n\n**Step 3: Predictive parsing table M[non-terminal, terminal] બનાવવી.** Rule સીધો છે - કોઈ પણ production A→α લો, જો terminal a, FIRST(α) માં હોય તો A→α ને M[A,a] માં મૂકો; અને જો α ε તરફ જઈ શકતું હોય (nullable હોય) તો A→α ને FOLLOW(A) ના દરેક terminal b માટે પણ M[A,b] માં મૂકો. આ પ્રમાણે આખું table ભરીએ તો ખબર પડે કે દરેક cell માં ફક્ત એક જ entry આવે છે - એટલે conflict નથી, અને એટલે જ આ grammar LL(1) છે.\n\n**Step 4: Stack વાપરીને string parse કરવી.** Start માં stack પર `$E` મૂકો અને input તરીકે `id+id*id$` લો. જ્યારે stack ના top પર non-terminal હોય ત્યારે table જોઈને right-hand side ને reverse order માં stack પર push કરો (જેથી leftમોસ્ટ symbol top પર આવે); અને જ્યારે top પર terminal હોય અને એ current input symbol સાથે match થાય તો pop કરીને input pointer આગળ વધારો. આ પ્રમાણે ચાલુ રાખતાં stack માં ફક્ત `$` રહી જાય અને input પણ `$` પર પહોંચે ત્યારે parse Accept થાય.\n\nતો ટૂંકમાં - પહેલા recursion કાઢો, પછી FIRST/FOLLOW, પછી table, પછી stack થી trace - આ 4 steps જ આખા LL(1) ના પ્રશ્નનો જવાબ છે, ભલે grammar ગમે તે હોય.", "finalVersionGuMd": "LL(1) parser એ એક top-down, table-driven parser છે જે input ને left થી right વાંચે છે, leftmost derivation બનાવે છે, અને આગળની production નક્કી કરવા માટે ફક્ત એક જ lookahead symbol વાપરે છે. એને 4 steps માં બનાવવામાં આવે છે: left recursion દૂર કરવી, FIRST અને FOLLOW sets કાઢવા, predictive parsing table બનાવવી, અને stack ની મદદથી input parse કરવું.\n\nGrammar `E→E+T|T, T→T*F|F, F→(E)|id` માટે, left recursion દૂર કરતાં મળે છે `E→TE', E'→+TE'|ε, T→FT', T'→*FT'|ε, F→(E)|id`. FIRST અને FOLLOW sets આ પ્રમાણે છે: FIRST(E)=FIRST(T)=FIRST(F)={(,id}, FIRST(E')={+,ε}, FIRST(T')={*,ε}; FOLLOW(E)=FOLLOW(E')={$,)}, FOLLOW(T)=FOLLOW(T')={+,$,)}, FOLLOW(F)={*,+,$,)}.\n\nઆના આધારે, predictive parsing table બનાવવા માટે દરેક production A→α ને FIRST(α) ના દરેક terminal a માટે M[A,a] માં મૂકવામાં આવે છે, અને જો α nullable હોય તો FOLLOW(A) ના દરેક terminal b માટે પણ M[A,b] માં મૂકવામાં આવે છે. બનેલા table ના દરેક cell માં વધુમાં વધુ એક જ production આવે છે, એટલે આ grammar LL(1) છે.\n\n`id+id*id` parse કરવા માટે, stack પર `$E` push કરીને વારંવાર table જોવામાં આવે છે: જ્યારે stack ના top પર non-terminal હોય ત્યારે current input symbol માટેની table entry વાપરીને એને replace કરવામાં આવે છે; અને જ્યારે top પર terminal હોય અને એ input સાથે match થાય ત્યારે એને pop કરીને input આગળ વધારવામાં આવે છે. આ process `id+id*id$` માટે ચલાવતાં stack ખાલી થઈને ફક્ત `$` રહી જાય છે, બરાબર એ જ સમયે જ્યારે input પણ પૂરું થાય છે, એટલે string **Accept** થાય છે."}, {"id": "u3-vh-2", "globalIndex": 15, "unit": 3, "priority": "Very High", "question": "Construct the SLR(1) / CLR(1) / LALR(1) / LR(0) parsing table for the given grammar, and parse the given string. (`S→AA, A→aA|b`, string `aabb`)", "questionShort": "Construct SLR(1) / CLR(1) / LALR(1) / LR(0) Parsing Table and parse a string", "marks": "8", "marksNote": "", "repeated": "Assignment-2 Q2 (SLR), Q3 (CLR), PAC Q4 (CLR), CD_2 Q3(a) (LALR) & Q3-OR(a) (CLR), CD_3 Q3(a) (LR(0)) & Q3-OR(a) (CLR) — **7 occurrences across sources — the single MOST REPEATED question type in your entire syllabus.**", "years": "", "inPPT": "", "type": "Algorithm (Numerical), heaviest weight question type overall.", "typeTags": ["Numerical", "Diagram", "Algorithm"], "answerMd": "LR parsers are bottom-up parsers that build a rightmost derivation in reverse, scanning input from left to right. There are four common variants — LR(0), SLR(1), CLR(1), and LALR(1) — which differ only in how they decide when to \"reduce,\" based on how much lookahead information each item carries.\n\n| Parser | How it decides to reduce | Table size | Power |\n|---|---|---|---|\n| LR(0) | Reduces regardless of the next input symbol | Smallest | Weakest, many conflicts |\n| SLR(1) | Reduces only if the next symbol is in FOLLOW of the LHS | Small | Better, but still some conflicts possible |\n| CLR(1) | Each item carries its own exact lookahead symbol | Largest | Most powerful |\n| LALR(1) | Same as CLR(1), but states with the same core are merged | Same size as SLR | Almost as powerful as CLR, much smaller |\n\n**Given:** grammar `S→AA, A→aA|b`, string to parse: `aabb`.\n\n**Step 1: Augment the grammar.** Add a new start production: `S'→S`.\n\n**Step 2: Build the canonical collection of item sets, using closure and goto.**\n`closure(I)`: if an item `A→α.Bβ` is in I, add every production `B→.γ` to I.\n`goto(I, X)`: move the dot past symbol X in every applicable item of I, then take the closure of the result.\n\nStarting from `I0 = closure(S'→.S)`, which also contains `S→.AA, A→.aA, A→.b`, we compute:\n- `goto(I0, S) = I1 = {S'→S.}` (this becomes the Accept state)\n- `goto(I0, A) = I2 = {S→A.A, A→.aA, A→.b}`\n- `goto(I0, a) = I3 = {A→a.A, A→.aA, A→.b}`\n- `goto(I0, b) = I4 = {A→b.}`\n- `goto(I2, A) = I5 = {S→AA.}`\n- `goto(I2, a) = I3` (same as before), `goto(I2, b) = I4` (same as before)\n- `goto(I3, A) = I6 = {A→aA.}`\n- `goto(I3, a) = I3`, `goto(I3, b) = I4`\n\n**Step 3: Compute FOLLOW sets (needed for SLR).** FOLLOW(S')={$}, FOLLOW(S)={$}, FOLLOW(A)={a,b,$}.\n\n**Step 4: Build the Action/Goto table.** For SLR(1): if `A→α.` is complete in state I, place \"reduce by A→α\" under every symbol in FOLLOW(A). If `A→α.aβ` is in state I and goto(I,a)=J, place \"shift to J\" under column a.\n\n| State | a | b | $ | S | A |\n|---|---|---|---|---|---|\n| 0 | s3 | s4 | | 1 | 2 |\n| 1 | | | Accept | | |\n| 2 | s3 | s4 | | | 5 |\n| 3 | s3 | s4 | | | 6 |\n| 4 | r(A→b) | r(A→b) | r(A→b) | | |\n| 5 | r(S→AA) | r(S→AA) | r(S→AA) | | |\n| 6 | r(A→aA) | r(A→aA) | r(A→aA) | | |\n\n**Step 5: Parse `aabb$` using the stack of states.**\n\n| Stack | Input | Action |\n|---|---|---|\n| 0 | aabb$ | shift, go to 3 |\n| 0 3 | abb$ | shift, go to 3 |\n| 0 3 3 | bb$ | shift, go to 4 |\n| 0 3 3 4 | b$ | reduce A→b, goto(3,A)=6 |\n| 0 3 3 6 | b$ | reduce A→aA, goto(3,A)=6 |\n| 0 3 6 | b$ | reduce A→aA, goto(0,A)=2 |\n| 0 2 | b$ | shift, go to 4 |\n| 0 2 4 | $ | reduce A→b, goto(2,A)=5 |\n| 0 2 5 | $ | reduce S→AA, goto(0,S)=1 |\n| 0 1 | $ | **Accept** |\n\n**Final Answer:** The string `aabb` is successfully parsed and accepted using the SLR(1) table constructed above.\n\n**Common mistakes:** Forgetting to augment the grammar with `S'→S` before starting; forgetting that LR(0) would put a reduce action under EVERY column instead of just FOLLOW(A), which is what causes LR(0) to have more conflicts than SLR(1); mixing up shift and goto columns (shift columns are for terminals, goto columns are for non-terminals).\n\n**Exam shortcut:** If two different actions appear in the same table cell (a shift-reduce or reduce-reduce conflict), the grammar is not usable with that parsing method — clearly state \"conflict found in state X on symbol y, hence not SLR(1)/LALR(1)\" as this is sometimes exactly what the question is testing.", "diagramMd": "Draw the canonical collection as a state diagram: I0 with edges to I1 (on S), I2 (on A), I3 (on a), I4 (on b); I2 with edges to I5 (on A), I3 (on a), I4 (on b); I3 with edges to I6 (on A), I3 (self-loop on a), I4 (on b).", "mustWrite": ["Augmented grammar `S'→S` written first.", "Correct closure and goto computation for every state, shown as working, not just the final sets.", "Correct Action/Goto table using the right rule for whichever variant (SLR uses FOLLOW; CLR/LALR use exact lookahead per item).", "Full stack-trace parse ending in Accept.", "If a conflict exists, state it clearly instead of hiding it."], "keywords": ["Augmented grammar", "closure", "goto", "canonical collection", "Action table", "Goto table", "shift", "reduce", "Accept", "conflict"], "finalVersionMd": "LR parsers are bottom-up parsers that build a rightmost derivation in reverse. LR(0), SLR(1), CLR(1), and LALR(1) differ in how they decide to reduce: LR(0) reduces regardless of lookahead; SLR(1) reduces only when the next symbol is in FOLLOW of the left-hand side; CLR(1) carries an exact lookahead with every item; and LALR(1) merges CLR(1) states that share the same core, giving a table as small as SLR(1) but almost as powerful as CLR(1).\n\nTo build the table for `S→AA, A→aA|b`, we first augment the grammar to `S'→S`, then build the canonical collection of item sets using closure and goto starting from I0 = closure(S'→.S). This produces states I0 through I6, with I1 = {S'→S.} being the accept state, I4 = {A→b.} and I5 = {S→AA.} and I6 = {A→aA.} being reduce states.\n\nUsing FOLLOW(S)={$} and FOLLOW(A)={a,b,$}, the SLR(1) table places shift actions for `a` and `b` from states 0, 2, and 3, and reduce actions in states 4, 5, and 6 under every symbol in FOLLOW(A) or FOLLOW(S).\n\nParsing `aabb$`: shift a (state 3), shift a (state 3), shift b (state 4), reduce A→b, reduce A→aA, reduce A→aA to get to state 2, shift b (state 4), reduce A→b, reduce S→AA, and finally reach state 1 with the input exhausted, giving **Accept**.\n\n---", "quickRefMd": "**What is given:** A grammar (e.g. `S→L=R|R, L→*R|id, R→L` or `S→AA, A→aA|b`).\n**What to find:** Canonical item sets → parsing table → parse a string.\n\n**The 4 variants — know the difference (High-Probability short-answer too):**\n\n| Parser | How it decides \"reduce\" | Table size | Power |\n|---|---|---|---|\n| LR(0) | No lookahead — reduce for EVERY input symbol in that state | Smallest | Weakest (many conflicts) |\n| SLR(1) | Uses FOLLOW(A) of the LHS to decide reduce | Small | Medium (some conflicts still possible) |\n| CLR(1) | Each item carries its own exact lookahead | Largest | Most powerful (fewest conflicts) |\n| LALR(1) | Same as CLR(1) but merges states with the same core (LR(0) part) | Same size as SLR | Almost as powerful as CLR, much smaller table |\n\n**Step-by-step solution (same skeleton for all 4 — only the table-filling rule changes):**\n1. **Augment the grammar:** add `S'→S`.\n2. **Write closure() and goto() functions:**\n   - `closure(I)`: if `A→α.Bβ` is in I, add every production `B→.γ` to I (for CLR/LALR, also compute the lookahead using FIRST(βa)).\n   - `goto(I, X)`: move the dot over symbol X in every item of I, then take closure.\n3. **Build the canonical collection** of item sets I0, I1, I2, ... starting from `closure(S'→.S)`.\n4. **Build the Action/Goto table:**\n   - LR(0)/SLR(1): if `A→α.` is in state i, put \"reduce by A→α\" under every column in FOLLOW(A) (SLR) or under every column (LR(0)).\n   - CLR(1)/LALR(1): if `A→α., a` is in state i, put \"reduce by A→α\" only under column `a`.\n   - If `A→α.aβ` is in state i and goto(i,a)=j, put \"shift to j\" under column a.\n   - `S'→S.` gives \"Accept\".\n5. **Parse the string** using a stack of states: at each step, look up Action[top-state, current-symbol] → shift, reduce, accept, or error.\n\n**Worked example — `S→AA, A→aA|b` (a classic exam grammar):**\n- Augmented: `S'→S`. Canonical sets I0…I6 built using closure/goto.\n- FOLLOW(S')={$}, FOLLOW(S)={$}, FOLLOW(A)={a,b,$}.\n- LR(0) table has conflicts here because reduces cover the whole row. Using SLR fixes this using FOLLOW(A)={a,b,$}.\n- Parse string `aabb$` — 9-step trace ending in Accept (shift a, shift a, shift b → reduce A→b, shift b → reduce A→b, reduce A→aA, reduce A→aA, reduce S→AA, Accept).\n\n**Common mistakes:** Forgetting to augment the grammar with `S'→S` first; putting a reduce action under FOLLOW when you should be using exact lookahead (mixing up SLR and CLR rules); not checking for shift-reduce or reduce-reduce conflicts (if two actions are possible in the same cell, the grammar is NOT SLR/LALR/etc. for that method — say so explicitly, it's often part of the question).\n\n**Exam shortcut:** If asked \"check whether SLR\" and you find a conflict (two entries in one table cell), don't panic — write \"Conflict found in state X under symbol Y, hence NOT SLR(1)\" — this is often exactly the expected answer (the PPT itself has a worked example proving a grammar is NOT SLR).\n\n**✍️ MINIMUM FULL-MARK ANSWER:** Augmented grammar → canonical item sets (I0 onwards, via closure/goto) → filled Action/Goto table → stack trace for the given string ending in Accept (or state the conflict if one exists).\n\n---", "understandGuMd": "LR parsers એ bottom-up parsers છે - એ rightmost derivation ને reverse order માં build કરે છે, પણ input ને left થી right જ વાંચે છે. આમાં ચાર variants છે - LR(0), SLR(1), CLR(1), અને LALR(1) - અને આ ચારેય વચ્ચેનો ફરક ફક્ત એટલો જ છે કે \"reduce ક્યારે કરવું\" એ નક્કી કરવા માટે કેટલી lookahead information વાપરે છે.\n\nLR(0) સૌથી weak છે - એ next symbol શું છે એ જોયા વગર જ reduce કરી નાખે છે, એટલે conflicts વધારે આવે. SLR(1) થોડું સારું છે - એ reduce ત્યારે જ કરે જ્યારે next symbol, LHS ના FOLLOW માં હોય. CLR(1) સૌથી powerful છે - દરેક item પોતાનું exact lookahead symbol carry કરે છે, પણ એટલે table બહુ મોટું બની જાય. LALR(1) એ CLR(1) જેવું જ છે, ફક્ત same core વાળા states ને merge કરી દે છે, જેથી table SLR જેટલું નાનું રહે પણ power લગભગ CLR જેટલી જ મળે.\n\nહવે આપણું ઉદાહરણ: grammar `S→AA, A→aA|b`, string `aabb`.\n\n**Step 1: Grammar ને augment કરો.** નવી start production ઉમેરો: `S'→S`. આ એટલા માટે જરૂરી છે કે parser ને ખબર પડે કે ક્યારે \"Accept\" કરવું.\n\n**Step 2: closure અને goto વાપરીને canonical collection of item sets બનાવો.** closure(I) નો મતલબ - જો કોઈ item `A→α.Bβ`, I માં હોય તો દરેક production `B→.γ` ને પણ I માં ઉમેરો. goto(I, X) નો મતલબ - I ના દરેક applicable item માં dot ને symbol X પછી ખસેડો, પછી result ની closure લો.\n\nI0 = closure(S'→.S) થી શરૂ કરીએ, જેમાં `S→.AA, A→.aA, A→.b` પણ આવી જાય. પછી ધીરે ધીરે goto કરતાં જઈએ - goto(I0,S)=I1={S'→S.} (આ જ Accept state બને), goto(I0,A)=I2={S→A.A, A→.aA, A→.b}, goto(I0,a)=I3={A→a.A, A→.aA, A→.b}, goto(I0,b)=I4={A→b.}, goto(I2,A)=I5={S→AA.}, goto(I2,a)=I3 ફરી same, goto(I2,b)=I4 ફરી same, goto(I3,A)=I6={A→aA.}, અને goto(I3,a)=I3 (પોતાના પર જ loop), goto(I3,b)=I4.\n\n**Step 3: FOLLOW sets કાઢો** (SLR માટે જરૂરી છે): FOLLOW(S')={$}, FOLLOW(S)={$}, FOLLOW(A)={a,b,$}.\n\n**Step 4: Action/Goto table બનાવો.** SLR(1) ના rule મુજબ - જો state I માં `A→α.` complete item હોય તો FOLLOW(A) ના દરેક symbol નીચે \"reduce by A→α\" મૂકો. અને જો `A→α.aβ` item હોય અને goto(I,a)=J હોય તો column a નીચે \"shift to J\" મૂકો. આ પ્રમાણે table ભરાય: state 0 અને 2 અને 3 માં a, b પર shift છે, અને state 4, 5, 6 reduce states છે.\n\n**Step 5: `aabb$` ને states ના stack થી parse કરો.** Shift a (state 3 પર જાવ), ફરી shift a (state 3 પર), પછી shift b (state 4 પર), પછી reduce A→b કરીને goto(3,A)=6 પર જાવ, પછી reduce A→aA કરીને ફરી goto(3,A)=6, પછી reduce A→aA કરીને goto(0,A)=2, પછી shift b (state 4), પછી reduce A→b કરીને goto(2,A)=5, પછી reduce S→AA કરીને goto(0,S)=1 પર પહોંચો - અને state 1 એટલે Accept.\n\nઆ જ logic CLR(1) અને LALR(1) માટે પણ વાપરવાનો હોય છે, ફર્ક ફક્ત એટલો કે reduce ક્યાં મૂકવું એ FOLLOW ને બદલે item ના પોતાના exact lookahead પરથી નક્કી થાય છે.", "finalVersionGuMd": "LR parsers એ bottom-up parsers છે જે rightmost derivation ને reverse order માં build કરે છે. LR(0), SLR(1), CLR(1), અને LALR(1) reduce ક્યારે કરવું એ નક્કી કરવાની રીતમાં અલગ પડે છે: LR(0) lookahead જોયા વગર જ reduce કરે છે; SLR(1) reduce ત્યારે જ કરે છે જ્યારે next symbol, left-hand side ના FOLLOW માં હોય; CLR(1) દરેક item સાથે એનું exact lookahead carry કરે છે; અને LALR(1), same core ધરાવતા CLR(1) states ને merge કરી દે છે, જેથી table SLR(1) જેટલું જ નાનું રહે પણ power લગભગ CLR(1) જેટલી જ મળે.\n\n`S→AA, A→aA|b` માટે table બનાવવા, પહેલા grammar ને `S'→S` તરીકે augment કરવામાં આવે છે, પછી I0 = closure(S'→.S) થી શરૂ કરીને closure અને goto વાપરીને canonical collection of item sets બનાવવામાં આવે છે. આનાથી I0 થી I6 સુધીના states મળે છે, જેમાં I1 = {S'→S.} accept state છે, અને I4 = {A→b.}, I5 = {S→AA.}, I6 = {A→aA.} reduce states છે.\n\nFOLLOW(S)={$} અને FOLLOW(A)={a,b,$} વાપરીને, SLR(1) table માં states 0, 2, અને 3 માંથી `a` અને `b` પર shift actions મૂકવામાં આવે છે, અને states 4, 5, અને 6 માં FOLLOW(A) અથવા FOLLOW(S) ના દરેક symbol નીચે reduce actions મૂકવામાં આવે છે.\n\n`aabb$` parse કરતાં: shift a (state 3), shift a (state 3), shift b (state 4), reduce A→b, reduce A→aA, reduce A→aA કરીને state 2 પર પહોંચો, shift b (state 4), reduce A→b, reduce S→AA, અને છેલ્લે state 1 પર પહોંચીને input પણ પૂરું થઈ જાય છે, એટલે **Accept** મળે છે."}, {"id": "u3-vh-3", "globalIndex": 16, "unit": 3, "priority": "Very High", "question": "Eliminate Left Recursion from the given grammar, and perform Left Factoring on the given grammar.", "questionShort": "Eliminate Left Recursion / Perform Left Factoring on a grammar", "marks": "4–8", "marksNote": "", "repeated": "Assignment-1 Q6, CD_3 Q4-OR(a) (both together), CD.pdf Q2(B) & Q2(B)-OR — **3 sources, 4 occurrences.**", "years": "", "inPPT": "Yes — very heavily drilled (6+6 slides, 7 worked examples total).", "type": "Algorithm (Numerical).", "typeTags": ["Numerical", "Algorithm"], "answerMd": "Top-down parsers cannot work correctly on a grammar that is left-recursive or that has productions sharing a common prefix, so both problems must be fixed before building a predictive parser.\n\n**Left Recursion.** A grammar is left-recursive if it has a production of the form `A→Aα`, because a top-down parser trying to expand A would call itself again immediately, without consuming any input, leading to an infinite loop.\n\n**Formula to remove direct left recursion:**\n```\nGiven:      A → Aα1 | Aα2 | ... | Aαm | β1 | β2 | ... | βn\nRewrite as: A  → β1 A' | β2 A' | ... | βn A'\n            A' → α1 A' | α2 A' | ... | αm A' | ε\n```\n\n**Given:** `E→E+T|T, T→T*F|F, F→(E)|id`.\n\n**Step 1:** Here, in `E→E+T|T`, α1=\"+T\" and β1=\"T\"; in `T→T*F|F`, α1=\"*F\" and β1=\"F\". Applying the formula:\n```\nE  → T E'\nE' → + T E' | ε\nT  → F T'\nT' → * F T' | ε\nF  → (E) | id\n```\n**Final Answer (left recursion removed):** as shown above.\n\nFor **indirect left recursion** (where A leads back to itself through another non-terminal, such as `A→Bx, B→Ay`), the general algorithm is:\n```\nOrder the non-terminals as A1, A2, ..., An.\nFor i = 1 to n:\n    For j = 1 to i-1:\n        Replace every production Ai → Aj γ with Ai → δ1γ | δ2γ | ... (where Aj → δ1|δ2|... are Aj's current productions)\n    Eliminate any direct left recursion now present among Ai's own productions, using the formula above.\n```\n\n**Left Factoring.** When two or more productions of the same non-terminal start with the same prefix, a top-down parser cannot decide which one to use just by looking at the first symbol. For example, in `S → if E then S else S | if E then S`, seeing the token \"if\" does not tell the parser which alternative applies.\n\n**Formula for left factoring:**\n```\nGiven:      A → αβ1 | αβ2 | ... | αβn | γ    (α is the longest common prefix)\nRewrite as: A  → αA' | γ\n            A' → β1 | β2 | ... | βn\n```\n\n**Given:** `S→cdLk|cdk|cd, L→mn|ε`.\n\n**Step 1:** the common prefix among the first three alternatives is `cd`. Applying the formula:\n```\nS  → cd S'\nS' → Lk | k | ε\nL  → mn | ε\n```\n**Final Answer (left factored):** as shown above.\n\n**Common mistakes:** Confusing left recursion removal with left factoring — recursion removal fixes a non-terminal appearing at the START of its OWN production, while left factoring fixes MULTIPLE alternatives sharing a common prefix; these look similar but need different formulas. Also, forgetting to include the `ε` option in the new non-terminal A' in both formulas.", "diagramMd": "", "mustWrite": ["State the problem clearly (why top-down parsing fails without this fix) before applying the formula.", "Correctly identify which formula applies (recursion vs factoring).", "Apply the exact general formula, not just an ad-hoc rewrite.", "Show the final rewritten grammar clearly."], "keywords": ["Left recursion", "left factoring", "common prefix", "direct recursion", "indirect recursion"], "finalVersionMd": "A grammar is left-recursive if it has a production of the form `A→Aα`, which causes a top-down parser to loop infinitely without consuming input. Direct left recursion is removed using the formula: given `A→Aα1|...|Aαm|β1|...|βn`, rewrite as `A→β1A'|...|βnA'` and `A'→α1A'|...|αmA'|ε`. Applying this to `E→E+T|T, T→T*F|F, F→(E)|id` gives `E→TE', E'→+TE'|ε, T→FT', T'→*FT'|ε, F→(E)|id`.\n\nLeft factoring is needed when two or more productions of a non-terminal share a common prefix, so the parser cannot decide which one to expand using only the next input symbol. Given `A→αβ1|αβ2|...|αβn|γ`, we rewrite as `A→αA'|γ` and `A'→β1|β2|...|βn`. Applying this to `S→cdLk|cdk|cd, L→mn|ε` gives `S→cdS', S'→Lk|k|ε, L→mn|ε`.\n\n---", "quickRefMd": "**Left Recursion — the problem:** A grammar like `A→Aα|β` causes infinite loops in top-down parsing.\n\n**Formula to remove DIRECT left recursion:**\n```\nGiven:  A → Aα1 | Aα2 | ... | Aαm | β1 | β2 | ... | βn\nChange to:\n        A  → β1 A' | β2 A' | ... | βn A'\n        A' → α1 A' | α2 A' | ... | αm A' | ε\n```\n\n**Worked example:** `E→E+T|T, T→T*F|F, F→(E)|id`\n→ `E→TE', E'→+TE'|ε, T→FT', T'→*FT'|ε, F→(E)|id`\n\n**Indirect left recursion — general algorithm:**\n```\nOrder the non-terminals A1...An.\nFor i = 1 to n:\n   For j = 1 to i-1:\n       replace Ai → Aj γ with Ai → δ1γ | δ2γ | ... (where Aj→δ1|δ2|... are Aj's productions)\n   Eliminate direct left recursion among Ai's own productions.\n```\n\n**Left Factoring — the problem:** `S → if E then S else S | if E then S` — parser can't decide which rule to use just by seeing \"if\".\n\n**Formula:**\n```\nGiven:  A → αβ1 | αβ2 | ... | αβn | γ   (α is the common prefix)\nChange to:\n        A  → αA' | γ\n        A' → β1 | β2 | ... | βn\n```\n\n**Worked example:** `S→cdLk|cdk|cd, L→mn|ε` → `S→cdS', S'→Lk|k|ε, L→mn|ε`\n\n**Common mistakes:** Doing left factoring when the question actually asks for left recursion removal (they look similar but solve different problems — recursion = A on the LEFT of its own rule; factoring = common prefix shared by MULTIPLE rules); forgetting the `ε` option in A'.\n\n**✍️ MINIMUM FULL-MARK ANSWER:** State which transformation applies → write the general formula → apply it directly to the given grammar, showing the new grammar clearly.\n\n---", "understandGuMd": "Top-down parser બે પ્રકારની grammar પર correctly કામ નથી કરી શકતું - એક જેમાં left recursion હોય, અને બીજું જેમાં multiple productions નો common prefix હોય. એટલે predictive parser બનાવતા પહેલા આ બંને problems ને ઠીક કરવા પડે.\n\n**Left Recursion વિષે વાત કરીએ.** કોઈ grammar left-recursive કહેવાય જો એમાં `A→Aα` જેવી production હોય - મતલબ non-terminal A પોતાની જ production ની શરૂઆતમાં ફરી આવે છે. Top-down parser જ્યારે A ને expand કરવા જાય ત્યારે એ ફરી પાછું A ને જ call કરવા જાય, અને એ પણ કોઈ input consume કર્યા વગર - એટલે parser infinite loop માં ફસાઈ જાય.\n\nઆને દૂર કરવાનું formula આ પ્રમાણે છે: ધારો કે `A → Aα1 | Aα2 | ... | Aαm | β1 | β2 | ... | βn` આપેલું છે (જ્યાં β કોઈ A થી શરૂ ન થાય). તો એને rewrite કરો `A → β1A' | β2A' | ... | βnA'` અને `A' → α1A' | α2A' | ... | αmA' | ε`.\n\nઆપણું ઉદાહરણ `E→E+T|T, T→T*F|F, F→(E)|id` લઈએ. `E→E+T|T` માં α1=\"+T\" અને β1=\"T\" છે; `T→T*F|F` માં α1=\"*F\" અને β1=\"F\" છે. Formula apply કરતાં મળે છે: `E → T E'`, `E' → + T E' | ε`, `T → F T'`, `T' → * F T' | ε`, `F → (E) | id`.\n\nIndirect left recursion પણ હોઈ શકે - જ્યાં A, બીજા non-terminal B દ્વારા ફરી પોતાની પાસે પાછું આવે, જેમ કે `A→Bx, B→Ay`. આના માટે general algorithm છે: non-terminals ને A1,A2,...,An ક્રમમાં ગોઠવો, અને i=1 થી n સુધી, દરેક j<i માટે, `Ai→Ajγ` ને Aj ની current productions થી replace કરો, અને છેલ્લે Ai ની પોતાની direct recursion ને ઉપરના formula થી દૂર કરો.\n\n**હવે Left Factoring વિષે.** જ્યારે એક જ non-terminal ની બે કે વધુ productions એક જ common prefix થી શરૂ થાય ત્યારે top-down parser ફક્ત પહેલો symbol જોઈને નક્કી નથી કરી શકતું કે કઈ alternative વાપરવી. જેમ કે `S → if E then S else S | if E then S` માં \"if\" token જોઈને ખબર જ ના પડે કે કઈ rule વાપરવી.\n\nFormula: `A → αβ1 | αβ2 | ... | αβn | γ` (જ્યાં α longest common prefix છે) ને rewrite કરો `A → αA' | γ` અને `A' → β1 | β2 | ... | βn`.\n\nઆપણું ઉદાહરણ `S→cdLk|cdk|cd, L→mn|ε` લઈએ. પહેલા ત્રણ alternatives નો common prefix છે \"cd\". Formula apply કરતાં: `S → cd S'`, `S' → Lk | k | ε`, `L → mn | ε`.\n\nધ્યાન રાખવા જેવી વાત - left recursion removal અને left factoring ને ભેગું ના કરવું; recursion removal, non-terminal પોતાની production ની START માં આવે એ ઠીક કરે, જ્યારે factoring multiple alternatives ના common prefix ને ઠીક કરે. બંને formula માં નવા non-terminal A' માં ε option ઉમેરવાનું ના ભૂલવું.", "finalVersionGuMd": "કોઈ grammar left-recursive કહેવાય જો એમાં `A→Aα` જેવી production હોય, જેના કારણે top-down parser કોઈ input consume કર્યા વગર infinite loop માં ફસાઈ જાય છે. Direct left recursion દૂર કરવા આ formula વપરાય છે: `A→Aα1|...|Aαm|β1|...|βn` આપેલું હોય તો rewrite કરો `A→β1A'|...|βnA'` અને `A'→α1A'|...|αmA'|ε`. આ `E→E+T|T, T→T*F|F, F→(E)|id` પર apply કરતાં મળે છે `E→TE', E'→+TE'|ε, T→FT', T'→*FT'|ε, F→(E)|id`.\n\nLeft factoring ત્યારે જરૂરી પડે છે જ્યારે કોઈ non-terminal ની બે કે વધુ productions એક common prefix share કરે, જેના કારણે parser ફક્ત next input symbol જોઈને નક્કી નથી કરી શકતું કે કઈ alternative expand કરવી. `A→αβ1|αβ2|...|αβn|γ` આપેલું હોય તો rewrite કરો `A→αA'|γ` અને `A'→β1|β2|...|βn`. આ `S→cdLk|cdk|cd, L→mn|ε` પર apply કરતાં મળે છે `S→cdS', S'→Lk|k|ε, L→mn|ε`."}, {"id": "u3-vh-4", "globalIndex": 17, "unit": 3, "priority": "Very High", "question": "Check whether the given grammar is ambiguous. (`E→a|Ea|bEE|EEb|EbE`, string `baaab`)", "questionShort": "Check whether a given grammar is Ambiguous (prove it / disprove it)", "marks": "4–6", "marksNote": "", "repeated": "CD_3 Q5-OR(b), CD.pdf Q4(B) & Q4(A)-OR — **3 sources**; also 2 unsolved practice questions sit inside the PPT itself (a strong \"this WILL be asked\" signal).", "years": "", "inPPT": "", "type": "Algorithm (proof-style).", "typeTags": ["Algorithm"], "answerMd": "A grammar is said to be **ambiguous** if it is possible to construct more than one parse tree, or more than one leftmost derivation, for the same string. This is undesirable in a programming language grammar because it means the same piece of code could be interpreted in more than one way.\n\n**Given:** grammar `E→a|Ea|bEE|EEb|EbE`, string `baaab`.\n\n**Step 1:** To prove the grammar is ambiguous, it is enough to find just one string and show two different leftmost derivations that both produce it.\n\n**Step 2 — Derivation 1** (using the rule E→bEE first):\n```\nE → bEE → baE → baEEb → baaEb → baaab\n```\n\n**Step 3 — Derivation 2** (using the rule E→EEb first):\n```\nE → EEb → bEEEb → baEEb → baaEb → baaab\n```\n\n**Step 4:** Both derivations are valid leftmost derivations, and both produce the exact same string `baaab`, but they apply different productions at the first step and follow different paths afterward. Since two different leftmost derivations exist for the same string, they also correspond to two different parse trees.\n\n**Final Answer:** Since the string `baaab` has two different leftmost derivations (and hence two different parse trees), the given grammar **is ambiguous**.\n\n**Common mistakes:** Showing only one derivation, which does not prove anything by itself; picking an unnecessarily long or complicated test string when a short one would do just as well.\n\n**Exam shortcut:** If asked to disprove ambiguity instead (show a grammar is NOT ambiguous), you cannot do this by checking only a few strings — you need to argue from the grammar's structure (for example, that it always derives left recursively in only one possible way). Usually, exams only ask you to prove ambiguity where it exists, using the two-derivation method above.", "diagramMd": "", "mustWrite": ["Correct definition: more than one parse tree / leftmost derivation for the same string.", "A specific test string.", "Two different, fully written-out derivations reaching the same string.", "A clear concluding statement that the grammar is ambiguous."], "keywords": ["Ambiguous grammar", "parse tree", "leftmost derivation", "same string"], "finalVersionMd": "A grammar is ambiguous if more than one parse tree, or more than one leftmost derivation, can be constructed for the same string. To prove the grammar `E→a|Ea|bEE|EEb|EbE` is ambiguous, consider the string `baaab`.\n\nUsing the production E→bEE first: `E → bEE → baE → baEEb → baaEb → baaab`.\n\nUsing the production E→EEb first: `E → EEb → bEEEb → baEEb → baaEb → baaab`.\n\nBoth derivations are valid leftmost derivations of the grammar, and both produce the same string `baaab`, but through different sequences of productions. Since two different leftmost derivations exist for the same string, the grammar produces two different parse trees for it, and is therefore **ambiguous**.\n\n---", "quickRefMd": "**⭐ Definition:** A grammar is ambiguous if it can produce **more than one parse tree** (or more than one leftmost derivation) for the **same** string.\n\n**How to prove ambiguous (method):** Find ONE string, and show TWO different leftmost derivations (or two different parse trees) that both produce it.\n\n**Worked example:** Grammar `E→a|Ea|bEE|EEb|EbE`, string `baaab`.\n- Derivation 1 (using E→bEE): E→bEE→baE→baEEb→baaEb→baaab\n- Derivation 2 (using E→EEb): E→EEb→bEEEb→baEEb→baaEb→baaab\n- Since 2 different leftmost derivations give the same string → **grammar is ambiguous.**\n\n**✍️ MINIMUM FULL-MARK ANSWER:** Definition (1 line) + pick a small test string + show 2 different derivations or 2 different parse trees reaching that same string + conclude \"hence ambiguous.\"\n\n**Common mistakes:** Showing only ONE derivation (that proves nothing); using a string too long/complicated — pick the shortest string that shows the problem.\n\n---", "understandGuMd": "કોઈ grammar ambiguous કહેવાય જો એક જ string માટે એક કરતાં વધારે parse tree, અથવા એક કરતાં વધારે leftmost derivation બની શકતું હોય. Programming language ની grammar માટે આ સારી વાત નથી, કેમ કે એનો મતલબ એ થાય કે એક જ code ને compiler એક કરતાં વધારે રીતે interpret કરી શકે - અને એ ના ચાલે.\n\nGrammar ambiguous છે એ prove કરવા માટે આખી grammar ને analyze કરવાની જરૂર નથી - ફક્ત એક જ string શોધીને, એના માટે બે અલગ leftmost derivations બતાવી દેવાની હોય, બસ એટલું જ પૂરતું છે.\n\nઆપણું ઉદાહરણ: grammar `E→a|Ea|bEE|EEb|EbE`, string `baaab`.\n\nપહેલા derivation માટે E→bEE rule ને પહેલા વાપરીએ: `E → bEE → baE → baEEb → baaEb → baaab`.\n\nહવે બીજા derivation માટે E→EEb rule ને પહેલા વાપરીએ: `E → EEb → bEEEb → baEEb → baaEb → baaab`.\n\nજુઓ, બંને derivation valid leftmost derivations છે, અને બંનેનું final result એક જ string `baaab` આવે છે - પણ પહેલા step માં જ અલગ-અલગ production વાપરી છે અને પછી પણ path અલગ ગયો છે. જ્યારે એક જ string માટે બે અલગ leftmost derivations મળી જાય, ત્યારે એનો મતલબ એ થાય કે એ બે અલગ parse trees ને પણ represent કરે છે.\n\nએટલે conclusion એ છે કે આ grammar ambiguous છે, કેમ કે string `baaab` ને બે અલગ રીતે derive કરી શકાય છે.\n\nExam માં ધ્યાન રાખજો - ફક્ત એક જ derivation બતાવીને કંઈ સાબિત નથી થતું, બંને derivation પૂરેપૂરી step-by-step લખવી પડે. અને string પણ બહુ મોટું ના પસંદ કરો, નાનું જ string પૂરતું છે.", "finalVersionGuMd": "કોઈ grammar ambiguous કહેવાય જો એક જ string માટે એક કરતાં વધારે parse tree, અથવા એક કરતાં વધારે leftmost derivation બની શકતું હોય. Grammar `E→a|Ea|bEE|EEb|EbE` ambiguous છે એ prove કરવા માટે string `baaab` ને consider કરીએ.\n\nProduction E→bEE ને પહેલા વાપરતાં: `E → bEE → baE → baEEb → baaEb → baaab`.\n\nProduction E→EEb ને પહેલા વાપરતાં: `E → EEb → bEEEb → baEEb → baaEb → baaab`.\n\nબંને derivation, grammar ની valid leftmost derivations છે, અને બંને એક જ string `baaab` બનાવે છે, પણ productions ના જુદા-જુદા sequence થી. જ્યારે એક જ string માટે બે અલગ leftmost derivations મળી આવે, ત્યારે grammar એ string માટે બે અલગ parse trees પણ generate કરે છે, અને એટલે આ grammar **ambiguous** છે."}, {"id": "u3-vh-5", "globalIndex": 18, "unit": 3, "priority": "Very High", "question": "Compute the FIRST and FOLLOW sets for the given grammar. (`A→BCD|Cx, B→b|ε, C→c|ε, D→d|ε`)", "questionShort": "Compute FIRST and FOLLOW sets for a given grammar", "marks": "4–8", "marksNote": "", "repeated": "Assignment-1 Q10, CD_3 Q4(a), CD.pdf Q4(B)-OR — **3 sources.**", "years": "", "inPPT": "", "type": "Algorithm (Numerical).", "typeTags": ["Numerical", "Algorithm"], "answerMd": "**FIRST(X)** is the set of terminal symbols that can appear as the first symbol of some string derived from X (and includes ε if X can derive the empty string). **FOLLOW(X)** is the set of terminal symbols that can appear immediately after X in some sentential form derived from the start symbol.\n\n**Rules for computing FIRST(X):**\n1. If X is a terminal, FIRST(X) = {X}.\n2. If X→ε is a production, add ε to FIRST(X).\n3. If X→Y1Y2...Yk, add every non-ε symbol of FIRST(Y1) to FIRST(X); if Y1 can derive ε, also add FIRST(Y2), and continue this way; if every Yi can derive ε, add ε to FIRST(X) as well.\n\n**Rules for computing FOLLOW(X):**\n1. Add `$` to FOLLOW(the start symbol).\n2. If there is a production A→αXβ, add every non-ε symbol of FIRST(β) to FOLLOW(X).\n3. If there is a production A→αXβ where β is empty, or β can derive ε, add every symbol of FOLLOW(A) to FOLLOW(X).\n\n**Given:** `A→BCD|Cx, B→b|ε, C→c|ε, D→d|ε` (assume A is the start symbol).\n\n**Step 1: FIRST sets.**\n- FIRST(B) = {b, ε} (B can be `b`, or can derive ε).\n- FIRST(C) = {c, ε}.\n- FIRST(D) = {d, ε}.\n- FIRST(A): from A→BCD, since B can derive ε, we also look at C; since C can derive ε, we also look at D; since D can derive ε too, ε is included. From A→Cx, we get `c` from C, and since C can derive ε, we also get `x`. So **FIRST(A) = {b, c, d, x, ε}**.\n\n**Step 2: FOLLOW sets.**\n- FOLLOW(A) = {$} (A is the start symbol).\n- From A→BCD: FOLLOW(B) gets FIRST(CD); since C can derive ε, this includes FIRST(C)={c} and then FIRST(D)={d}, and since D can also derive ε, FOLLOW(A) is added too. So **FOLLOW(B) = {c, d, $}**.\n- FOLLOW(C) gets FIRST(D) = {d} (from A→BCD), and since D can derive ε, FOLLOW(A)={$} is added; also, from A→Cx, FOLLOW(C) gets the literal terminal `x`. So **FOLLOW(C) = {d, x, $}**.\n- FOLLOW(D) gets FOLLOW(A) = {$}, since D is the last symbol in `BCD`. So **FOLLOW(D) = {$}**.\n\n**Final Answer:**\n\n| Non-terminal | FIRST | FOLLOW |\n|---|---|---|\n| A | {b, c, d, x, ε} | {$} |\n| B | {b, ε} | {c, d, $} |\n| C | {c, ε} | {d, x, $} |\n| D | {d, ε} | {$} |\n\n**Common mistakes:** Forgetting to check whether a symbol can derive ε before moving on to the next symbol in a production while computing FIRST; forgetting to add `$` to FOLLOW of the start symbol; forgetting that FOLLOW of the LHS must be added when the remaining symbols after X in a production can all derive ε.", "diagramMd": "", "mustWrite": ["State the rules for FIRST and FOLLOW before applying them.", "Show the working for each non-terminal, not just the final answer.", "Correctly handle every nullable (ε-deriving) non-terminal.", "`$` correctly included in FOLLOW(start symbol)."], "keywords": ["FIRST", "FOLLOW", "nullable", "derive ε", "start symbol"], "finalVersionMd": "FIRST(X) is the set of terminals that can begin a string derived from X, including ε if X can derive the empty string. FOLLOW(X) is the set of terminals that can appear immediately after X in some derivation from the start symbol, and always includes `$` for the start symbol itself.\n\nFor the grammar `A→BCD|Cx, B→b|ε, C→c|ε, D→d|ε`, since B, C, and D can each derive either their terminal or ε, we get FIRST(B)={b,ε}, FIRST(C)={c,ε}, FIRST(D)={d,ε}, and FIRST(A)={b,c,d,x,ε}, because if B derives ε we look at C, and if C derives ε we look at D, and if D also derives ε we add ε itself; from A→Cx we also get x.\n\nFor FOLLOW, since A is the start symbol, FOLLOW(A)={$}. From A→BCD, FOLLOW(B) picks up FIRST(C) and, since C can derive ε, also FIRST(D) and, since D can derive ε too, FOLLOW(A); this gives FOLLOW(B)={c,d,$}. FOLLOW(C) picks up FIRST(D)={d} and FOLLOW(A)={$} similarly, plus the literal terminal x from A→Cx, giving FOLLOW(C)={d,x,$}. FOLLOW(D) simply picks up FOLLOW(A)={$}, since D is the last symbol in BCD.", "quickRefMd": "**Rules for FIRST(X):**\n- If X is a terminal, FIRST(X) = {X}.\n- If X→ε, add ε to FIRST(X).\n- If X→Y1Y2...Yk, add FIRST(Y1)−{ε}; if Y1 is nullable, also add FIRST(Y2), and so on; if ALL Yi are nullable, add ε too.\n\n**Rules for FOLLOW(X):**\n- Add `$` to FOLLOW(start symbol).\n- If A→αXβ, add FIRST(β)−{ε} to FOLLOW(X).\n- If A→αXβ and β is nullable (or β is empty), add FOLLOW(A) to FOLLOW(X).\n\n**Worked example:** `A→bcg|gh` → FIRST(A)={b,g}. `A→Bcd|gh, B→m|ε` → FIRST(A)={m,c,g}, FIRST(B)={m,ε}.\n\n**✍️ MINIMUM FULL-MARK ANSWER:** State the rules briefly, then a clean FIRST/FOLLOW table for every non-terminal in the given grammar.\n\n**Common mistakes:** Forgetting to check if a non-terminal is nullable (can derive ε) before moving to the next symbol in a production; forgetting `$` in FOLLOW(start symbol).\n\n---", "understandGuMd": "FIRST(X) એટલે એ બધા terminal symbols નો set જે X માંથી derive થતી કોઈ પણ string ના પહેલા symbol તરીકે આવી શકે - અને જો X, ε derive કરી શકતું હોય તો ε પણ FIRST(X) માં આવે. FOLLOW(X) એટલે એ બધા terminal symbols નો set જે start symbol થી શરૂ થતી કોઈ પણ derivation માં X ની તરત પછી આવી શકે.\n\n**FIRST(X) કાઢવાના rules:**\n1. જો X terminal હોય, તો FIRST(X) = {X}.\n2. જો X→ε production હોય, તો FIRST(X) માં ε ઉમેરો.\n3. જો X→Y1Y2...Yk હોય, તો FIRST(Y1) ના બધા non-ε symbols ને FIRST(X) માં ઉમેરો; જો Y1, ε derive કરી શકતું હોય તો FIRST(Y2) પણ ઉમેરો, અને આ પ્રમાણે આગળ વધો; જો બધા જ Yi, ε derive કરી શકતા હોય તો ε ને પણ FIRST(X) માં ઉમેરો.\n\n**FOLLOW(X) કાઢવાના rules:**\n1. Start symbol ના FOLLOW માં `$` ઉમેરો.\n2. જો કોઈ production A→αXβ હોય, તો FIRST(β) ના બધા non-ε symbols ને FOLLOW(X) માં ઉમેરો.\n3. જો A→αXβ હોય જ્યાં β ખાલી હોય, અથવા β, ε derive કરી શકતું હોય, તો FOLLOW(A) ના બધા symbols ને FOLLOW(X) માં ઉમેરો.\n\nહવે આપણું ઉદાહરણ લઈએ: `A→BCD|Cx, B→b|ε, C→c|ε, D→d|ε` (A ને start symbol ધારીએ).\n\n**Step 1: FIRST sets કાઢીએ.** B ક્યાં તો \"b\" બની શકે અથવા ε derive કરી શકે, એટલે FIRST(B)={b,ε}. એ જ રીતે FIRST(C)={c,ε} અને FIRST(D)={d,ε}. હવે FIRST(A) કાઢવા - A→BCD માં, B ε derive કરી શકે છે એટલે આગળ C ને પણ જોવું પડે; C પણ ε derive કરી શકે છે એટલે D ને પણ જોવું પડે; અને D પણ ε derive કરી શકે છે એટલે ε ને પણ ઉમેરવું પડે. બીજી બાજુ A→Cx માંથી, C માંથી \"c\" મળે છે, અને C ε derive કરી શકે એટલે \"x\" પણ મળે છે. તો બધું ભેગું કરતાં FIRST(A) = {b, c, d, x, ε} મળે.\n\n**Step 2: FOLLOW sets કાઢીએ.** A start symbol છે એટલે FOLLOW(A)={$}. હવે A→BCD પરથી - FOLLOW(B) ને FIRST(CD) મળે છે; C ε derive કરી શકે એટલે FIRST(C)={c} અને પછી FIRST(D)={d} બંને મળે, અને D પણ ε derive કરી શકે એટલે FOLLOW(A) પણ FOLLOW(B) માં ઉમેરાય. તો FOLLOW(B) = {c, d, $}.\n\nFOLLOW(C) ને A→BCD પરથી FIRST(D)={d} મળે, અને D ε derive કરી શકે એટલે FOLLOW(A)={$} પણ મળે; વધારામાં, A→Cx પરથી literal terminal \"x\" પણ FOLLOW(C) માં ઉમેરાય. તો FOLLOW(C) = {d, x, $}.\n\nFOLLOW(D) ને, D એ BCD નો છેલ્લો symbol હોવાથી, ફક્ત FOLLOW(A)={$} મળે છે. તો FOLLOW(D) = {$}.\n\nઆ આખું calculation કરતી વખતે ધ્યાન રાખવાનું - દરેક symbol ε derive કરી શકે છે કે નહીં એ ચેક કરવાનું ક્યારેય ના ભૂલવું, નહિતર FIRST/FOLLOW ખોટા આવી જશે.", "finalVersionGuMd": "FIRST(X) એ terminals નો set છે જે X માંથી derive થતી string ને શરૂ કરી શકે, અને જો X, ε derive કરી શકે તો એમાં ε પણ સામેલ છે. FOLLOW(X) એ terminals નો set છે જે start symbol થી શરૂ થતી કોઈ derivation માં X ની તરત પછી આવી શકે, અને start symbol ના FOLLOW માં હંમેશા `$` સામેલ હોય છે.\n\nGrammar `A→BCD|Cx, B→b|ε, C→c|ε, D→d|ε` માટે, B, C, અને D દરેક પોતાનો terminal અથવા ε derive કરી શકે છે, એટલે FIRST(B)={b,ε}, FIRST(C)={c,ε}, FIRST(D)={d,ε}, અને FIRST(A)={b,c,d,x,ε} મળે છે - કારણ કે જો B, ε derive કરે તો C ને જોઈએ, અને જો C, ε derive કરે તો D ને જોઈએ, અને જો D પણ ε derive કરે તો ε ને પણ ઉમેરવું પડે; A→Cx પરથી x પણ મળે છે.\n\nFOLLOW ની વાત કરીએ તો, A start symbol હોવાથી FOLLOW(A)={$}. A→BCD પરથી, FOLLOW(B) ને FIRST(C) મળે છે, અને C, ε derive કરી શકે એટલે FIRST(D) પણ મળે છે, અને D પણ ε derive કરી શકે એટલે FOLLOW(A) પણ મળે છે; આમ FOLLOW(B)={c,d,$}. FOLLOW(C) ને એ જ રીતે FIRST(D)={d} અને FOLLOW(A)={$} મળે છે, ઉપરાંત A→Cx પરથી literal terminal x પણ મળે છે, એટલે FOLLOW(C)={d,x,$}. FOLLOW(D) ને ફક્ત FOLLOW(A)={$} મળે છે, કારણ કે D, BCD નો છેલ્લો symbol છે."}], "high": [{"id": "u3-high-1", "globalIndex": 19, "unit": 3, "priority": "High", "question": "Explain Operator Precedence Parsing. Construct the precedence table and parse the given string using it. (`E→E+E|E*E|id`, string `id+id*id`)", "questionShort": "Operator Precedence Parsing — construct the table and parse a string", "marks": "6–8", "marksNote": "", "repeated": "Assignment-2 Q9, CD_2 Q3(b)/Q5(a), CD_3 Q4-OR(b), CD.pdf Q3(B) — **4 sources.**", "years": "", "inPPT": "", "type": "Algorithm (Numerical).", "typeTags": ["Numerical", "Diagram", "Algorithm"], "answerMd": "Operator Precedence Parsing is a simplified type of shift-reduce (bottom-up) parsing that can be used only on a restricted class of grammars called operator grammars, in which no production has two adjacent non-terminals and no production is empty. Instead of maintaining a full parsing table of states, this method compares the precedence of pairs of terminal symbols directly, using three relations: `a <· b` meaning \"a yields precedence to b\" (so we should shift), `a =· b` meaning \"a has the same precedence as b\", and `a ·> b` meaning \"a takes precedence over b\" (so we should reduce).\n\n**Given:** grammar `E→E+E|E*E|id`, string `id+id*id`.\n\n**Step 1: Build the precedence relation table** for the terminals `{id, +, *, $}`, based on the usual rules of arithmetic precedence, where `*` has higher precedence than `+`, and both are left-associative, and `id` always has the highest precedence over any operator that follows or precedes it.\n\n| | id | + | * | $ |\n|---|---|---|---|---|\n| id | | ·> | ·> | ·> |\n| + | <· | ·> | <· | ·> |\n| * | <· | ·> | ·> | ·> |\n| $ | <· | <· | <· | |\n\n**Step 2: Parse the string `id+id*id$` using this table**, comparing the stack-top terminal with the current input symbol at every step, shifting on `<·` or `=·`, and reducing (popping the handle) on `·>`.\n\n| Stack | Input | Action |\n|---|---|---|\n| $ | id+id*id$ | id·<·? Actually $<·id, so shift |\n| $id | +id*id$ | id·>+, reduce id to E, treat E as id for table lookup |\n| $E | +id*id$ | $<·+, shift |\n| $E+ | id*id$ | +<·id, shift |\n| $E+id | *id$ | id·>*, reduce id to E |\n| $E+E | *id$ | +<·*, shift |\n| $E+E* | id$ | *<·id, shift |\n| $E+E*id | $ | id·>$, reduce id to E |\n| $E+E*E | $ | *·>$, reduce E*E to E |\n| $E+E | $ | +·>$, reduce E+E to E |\n| $E | $ | **Accept** |\n\n**Final Answer:** the string `id+id*id` is accepted, and the precedence table above is the required answer.\n\n**How the handle is found (write this if asked separately):** scan left to right until the first `·>` relation is found; then scan backward over any `=·` relations until a `<·` is found; everything between these two points is the handle to be reduced.\n\n**Common mistakes:** Mixing up the direction of `<·` and `·>` (remember: `<·` means \"shift\", `·>` means \"reduce\"); forgetting that `id` is treated as a single terminal-like symbol for precedence comparisons even though it becomes a non-terminal E after reduction.", "diagramMd": "The precedence relation table shown above must be drawn and filled in completely.", "mustWrite": ["Definition of Operator Precedence Parsing and the three relations `<·`, `=·`, `·>`.", "Complete, correctly filled precedence table.", "Full stack/input/action trace ending in Accept.", "The 3-step handle-finding method, if extra marks are available for it."], "keywords": ["Operator grammar", "precedence relations", "yields precedence", "takes precedence", "handle"], "finalVersionMd": "Operator Precedence Parsing is a form of bottom-up parsing usable on operator grammars, where no production has two adjacent non-terminals. It uses three precedence relations between terminal symbols: `a<·b` (a yields precedence to b, so shift), `a=·b` (equal precedence), and `a·>b` (a takes precedence over b, so reduce).\n\nFor the grammar `E→E+E|E*E|id`, the precedence table over {id,+,*,$} is built using the usual rule that `*` has higher precedence than `+`, both are left-associative, and `id` has the highest precedence of all. Using this table, parsing `id+id*id$` proceeds by shifting `id`, reducing it to E on seeing `id·>+`, shifting `+`, shifting the next `id`, reducing it to E, shifting `*`, shifting the last `id`, reducing it to E, then reducing `E*E` to E on seeing `*·>$`, and finally reducing `E+E` to E, leaving just E on the stack with the input exhausted, giving **Accept**.\n\n---", "quickRefMd": "**Simple explanation:** Instead of a full parsing table, we just compare precedence between pairs of terminals using 3 relations: `<·` (yields precedence), `=·` (equal precedence), `·>` (takes precedence).\n\n**Algorithm:**\n1. Point i at the first symbol of input (ending in `$`).\n2. If top of stack = `$` and current input = `$`: Accept.\n3. If top-of-stack terminal `a` and next input `b`: if `a <· b` or `a =· b`: push b, advance i. If `a ·> b`: pop the stack (reduce) repeatedly until the relation flips.\n\n**Handle-finding shortcut (3 steps):** (1) Scan left to right until the first `·>`. (2) Scan back left over `=·` relations until you hit `<·`. (3) Everything between is the handle.\n\n**Worked example:** `E→E+E|E*E|id`, string `id+id*id`. Precedence table built for {id,+,*,$}; full stack trace ends in Accept (10 steps).\n\n**✍️ MINIMUM FULL-MARK ANSWER:** Precedence relation table for the operators → stack/input/action trace → Accept.\n\n**Common mistakes:** Confusing `<·` and `·>` direction (⋖ means \"the stack symbol has LOWER precedence, so shift\"; ⋗ means \"the stack symbol has HIGHER precedence, so reduce\").\n\n---", "understandGuMd": "Operator Precedence Parsing એ shift-reduce (bottom-up) parsing નો એક simplified પ્રકાર છે, જે ફક્ત operator grammars પર જ વાપરી શકાય - એટલે એવી grammar જેમાં કોઈ પણ production માં બે non-terminals એકબીજાની બાજુમાં ના હોય અને કોઈ production ખાલી (empty) ના હોય. આમાં states નું આખું parsing table નથી બનાવવાનું, બલ્કે terminal symbols ની જોડીઓ વચ્ચે directly precedence compare કરવાની હોય છે, ત્રણ relations વાપરીને: `a <· b` નો મતલબ \"a, b ને precedence આપે છે\" (એટલે shift કરવું), `a =· b` નો મતલબ \"a અને b ની precedence સરખી છે\", અને `a ·> b` નો મતલબ \"a, b કરતાં precedence માં આગળ છે\" (એટલે reduce કરવું).\n\nઆપણું ઉદાહરણ: grammar `E→E+E|E*E|id`, string `id+id*id`.\n\n**Step 1: Precedence relation table બનાવો** terminals `{id, +, *, $}` માટે, arithmetic ના સામાન્ય rules પ્રમાણે - \"*\" ની precedence \"+\" કરતાં વધારે છે, બંને left-associative છે, અને \"id\" ની precedence બધા operators કરતાં સૌથી વધારે છે (પછી ભલે id પહેલા આવે કે પછી).\n\n**Step 2: `id+id*id$` ને આ table વાપરીને parse કરો**, દરેક step પર stack-top terminal ને current input symbol સાથે compare કરીને - `<·` અથવા `=·` હોય તો shift કરો, અને `·>` હોય તો handle pop કરીને reduce કરો. Trace ચલાવતાં - id ને shift કરો, પછી id·>+ મળે એટલે id ને E માં reduce કરો (id ને table lookup માટે E ની જેમ જ treat કરવાનું), $<·+ એટલે + ને shift કરો, +<·id એટલે id ને shift કરો, id·>* મળે એટલે reduce, +<·* એટલે * ને shift કરો, *<·id એટલે છેલ્લા id ને shift કરો, id·>$ મળે એટલે reduce, પછી *·>$ મળે એટલે E*E ને E માં reduce કરો, અને છેલ્લે +·>$ મળે એટલે E+E ને E માં reduce કરો - stack પર ફક્ત E રહી જાય અને input પણ ખતમ થાય, એટલે Accept.\n\nHandle કેવી રીતે શોધવો એ પણ યાદ રાખવા જેવું છે - left થી right scan કરો જ્યાં સુધી પહેલો `·>` ના મળે; પછી backward માં `=·` relations ને skip કરતાં જાવ જ્યાં સુધી `<·` ના મળે; આ બંને point ની વચ્ચેનો ભાગ જ handle છે જેને reduce કરવાનો હોય.", "finalVersionGuMd": "Operator Precedence Parsing એ bottom-up parsing નો એક પ્રકાર છે જે operator grammars પર વાપરી શકાય છે, જ્યાં કોઈ પણ production માં બે non-terminals બાજુ-બાજુમાં ના હોય. આમાં terminal symbols વચ્ચે ત્રણ precedence relations વપરાય છે: `a<·b` (a, b ને precedence આપે છે, એટલે shift), `a=·b` (સરખી precedence), અને `a·>b` (a, b કરતાં વધારે precedence ધરાવે છે, એટલે reduce).\n\nGrammar `E→E+E|E*E|id` માટે, {id,+,*,$} પરનું precedence table સામાન્ય rule વાપરીને બનાવવામાં આવે છે કે `*` ની precedence `+` કરતાં વધારે છે, બંને left-associative છે, અને `id` ની precedence બધા કરતાં સૌથી વધારે છે. આ table વાપરીને `id+id*id$` parse કરતાં - પહેલા `id` ને shift કરવામાં આવે છે, `id·>+` જોઈને એને E માં reduce કરવામાં આવે છે, પછી `+` ને shift, પછીના `id` ને shift કરીને E માં reduce, પછી `*` ને shift, છેલ્લા `id` ને shift કરીને E માં reduce, પછી `*·>$` જોઈને `E*E` ને E માં reduce, અને છેલ્લે `E+E` ને E માં reduce કરવામાં આવે છે, જેનાથી stack પર ફક્ત E રહી જાય છે અને input પણ પૂરું થઈ જાય છે, એટલે **Accept** મળે છે."}, {"id": "u3-high-2", "globalIndex": 20, "unit": 3, "priority": "High", "question": "Explain Shift-Reduce Parsing with Handle and Handle Pruning, and show a parsing trace.", "questionShort": "Shift-Reduce Parsing — explain with Handle and Handle Pruning", "marks": "6–8", "marksNote": "", "repeated": "CD_3 Q4(b), CD.pdf Q4(A) — 2 sources.", "years": "", "inPPT": "", "type": "Algorithm.", "typeTags": ["Algorithm"], "answerMd": "Shift-Reduce Parsing is a form of bottom-up parsing that builds the parse tree from the leaves up to the root. It uses a stack to hold grammar symbols and an input buffer holding the remaining input, and it repeats a cycle of shifting input symbols onto the stack and reducing the symbols on top of the stack back to a non-terminal, until the entire input has been reduced to the start symbol.\n\nA **handle** is a substring on top of the stack that exactly matches the right-hand side of some production, such that reducing it to the corresponding left-hand side non-terminal is a valid step in reversing a rightmost derivation. The process of repeatedly finding a handle and reducing it is called **handle pruning**, and this is exactly how a bottom-up parser works its way back to the start symbol.\n\nThere are four possible actions in shift-reduce parsing:\n1. **Shift** — move the next symbol from the input buffer onto the top of the stack.\n2. **Reduce** — if the symbols on top of the stack form a handle, pop them off and push the non-terminal from the left-hand side of the matching production.\n3. **Accept** — announce successful completion when the stack holds only the start symbol and the input buffer is empty.\n4. **Error** — occurs when none of shift, reduce, or accept can be applied, meaning a syntax error exists in the input.\n\n**Given:** grammar `E→E+T|T, T→T*F|F, F→id`, string `id+id*id`.\n\n**Step-by-step trace:**\n\n| Stack | Input | Action |\n|---|---|---|\n| $ | id+id*id$ | shift |\n| $id | +id*id$ | reduce F→id |\n| $F | +id*id$ | reduce T→F |\n| $T | +id*id$ | reduce E→T |\n| $E | +id*id$ | shift |\n| $E+ | id*id$ | shift |\n| $E+id | *id$ | reduce F→id |\n| $E+F | *id$ | reduce T→F |\n| $E+T | *id$ | shift |\n| $E+T* | id$ | shift |\n| $E+T*id | $ | reduce F→id |\n| $E+T*F | $ | reduce T→T*F |\n| $E+T | $ | reduce E→E+T |\n| $E | $ | **Accept** |\n\n**Final Answer:** the string `id+id*id` is accepted through the above sequence of shifts and reduces.\n\n**Common mistakes:** Reducing too early, before the full handle has actually been shifted onto the stack; forgetting that \"E+id\" has the handle \"id\" alone at that point, not the whole string \"E+id\", since E has not yet combined with what follows.", "diagramMd": "", "mustWrite": ["Correct definition of Handle and Handle Pruning.", "All 4 actions (Shift, Reduce, Accept, Error) clearly explained.", "A complete stack/input/action trace ending in Accept."], "keywords": ["Handle", "handle pruning", "shift", "reduce", "accept", "error", "bottom-up parsing"], "finalVersionMd": "Shift-Reduce Parsing is a bottom-up parsing method that builds the parse tree from the leaves toward the root, using a stack and an input buffer. A handle is a substring on top of the stack matching the right-hand side of a production, which can be validly reduced to its left-hand side non-terminal as part of reversing a rightmost derivation; repeatedly finding and reducing handles is called handle pruning.\n\nThe parser has four possible actions: Shift, which moves the next input symbol onto the stack; Reduce, which replaces a handle on top of the stack with its corresponding non-terminal; Accept, which is announced when the stack holds only the start symbol and the input is empty; and Error, when none of the other actions apply.\n\nFor the grammar `E→E+T|T, T→T*F|F, F→id` and string `id+id*id`, the parser shifts `id`, reduces it through F→id, T→F, E→T; shifts `+`; shifts the next `id` and reduces it similarly through F→id, T→F; shifts `*`; shifts the last `id` and reduces it through F→id, then reduces `T*F` to T using T→T*F; finally reduces `E+T` to E using E→E+T, leaving only E on the stack with empty input, giving **Accept**.\n\n---", "quickRefMd": "**⭐ Definition (Handle):** A substring of a sentential form that matches the RHS of a production AND can be reduced to the LHS to continue a valid rightmost derivation in reverse.\n\n**4 actions in Shift-Reduce parsing:**\n1. **Shift** — move next input symbol onto the stack.\n2. **Reduce** — if the top of the stack is a handle, pop it and push the matching non-terminal.\n3. **Accept** — stack has only the start symbol and input is empty.\n4. **Error** — none of the above is possible.\n\n**Worked example:** `E→E+T|T, T→T*F|F, F→id`, string `id+id*id` → 13-step trace ending in Accept.\n\n**✍️ MINIMUM FULL-MARK ANSWER:** Definitions of Handle + the 4 actions + one worked stack trace table (columns: Stack | Input | Action).\n\n---", "understandGuMd": "Shift-Reduce Parsing એ bottom-up parsing નો એક પ્રકાર છે જે parse tree ને leaves (નીચેથી) શરૂ કરીને root (ઉપર) સુધી build કરે છે. આમાં એક stack હોય છે જેમાં grammar symbols રાખવામાં આવે છે, અને એક input buffer હોય છે જેમાં બાકીનું input હોય છે. Parser વારંવાર બે kaam repeat કરે છે - input symbols ને stack પર shift કરવા, અને stack ના top ના symbols ને પાછા કોઈ non-terminal માં reduce કરવા - જ્યાં સુધી આખું input, start symbol માં reduce ના થઈ જાય.\n\n**Handle** એટલે stack ના top પર આવેલો એવો substring જે બરાબર કોઈ production ની right-hand side સાથે match થાય, અને એને corresponding left-hand side non-terminal માં reduce કરવું એ rightmost derivation ને reverse કરવાનું valid step હોય. વારંવાર handle શોધીને એને reduce કરવાની process ને **handle pruning** કહેવાય છે - અને bottom-up parser બરાબર આ જ રીતે start symbol સુધી પહોંચે છે.\n\nShift-reduce parsing માં ચાર actions શક્ય છે:\n1. **Shift** — input buffer માંથી આગળનો symbol લઈને stack ના top પર મૂકવો.\n2. **Reduce** — જો stack ના top ના symbols handle બનાવતા હોય, તો એમને pop કરીને, matching production ની left-hand side નો non-terminal push કરવો.\n3. **Accept** — જ્યારે stack માં ફક્ત start symbol જ હોય અને input buffer ખાલી હોય ત્યારે successful completion જાહેર કરવું.\n4. **Error** — જ્યારે shift, reduce, કે accept માંથી કંઈ પણ apply ના થઈ શકે, ત્યારે એનો મતલબ input માં syntax error છે.\n\nઆપણું ઉદાહરણ: grammar `E→E+T|T, T→T*F|F, F→id`, string `id+id*id`.\n\nTrace ચલાવીએ - id ને shift કરો, પછી reduce F→id, reduce T→F, reduce E→T; પછી + ને shift કરો; પછીના id ને shift કરીને એ જ રીતે F→id, T→F reduce કરો; પછી * ને shift કરો; છેલ્લા id ને shift કરીને F→id reduce કરો, પછી T*F ને T→T*F rule વાપરીને T માં reduce કરો; અને છેલ્લે E+T ને E→E+T rule વાપરીને E માં reduce કરો - stack પર ફક્ત E રહી જાય અને input ખાલી થાય, એટલે Accept.\n\nધ્યાન રાખવા જેવી વાત - E+id સ્ટેજ પર handle ફક્ત \"id\" જ છે, આખું \"E+id\" નહીં - કેમ કે E હજુ સુધી પોતાની પછીના ભાગ સાથે combine નથી થયું. બહુ જલદી reduce કરવાની ભૂલ ના કરવી.", "finalVersionGuMd": "Shift-Reduce Parsing એ bottom-up parsing ની એક પદ્ધતિ છે જે parse tree ને leaves તરફથી root તરફ build કરે છે, અને એ માટે એક stack તથા એક input buffer વાપરે છે. Handle એટલે stack ના top પર આવેલો એવો substring જે કોઈ production ની right-hand side સાથે match થાય, અને જેને rightmost derivation ને reverse કરવાના ભાગ રૂપે એની left-hand side ના non-terminal માં valid રીતે reduce કરી શકાય; વારંવાર handle શોધીને reduce કરવાની process ને handle pruning કહેવાય છે.\n\nParser પાસે ચાર possible actions છે: Shift, જે આગળનો input symbol stack પર મૂકે છે; Reduce, જે stack ના top ના handle ને એના corresponding non-terminal થી replace કરે છે; Accept, જે stack માં ફક્ત start symbol જ હોય અને input ખાલી હોય ત્યારે જાહેર થાય છે; અને Error, જ્યારે બીજી કોઈ action apply ના થાય ત્યારે.\n\nGrammar `E→E+T|T, T→T*F|F, F→id` અને string `id+id*id` માટે, parser પહેલા `id` ને shift કરે છે અને એને F→id, T→F, E→T દ્વારા reduce કરે છે; પછી `+` ને shift કરે છે; પછીના `id` ને shift કરીને એ જ રીતે F→id, T→F દ્વારા reduce કરે છે; પછી `*` ને shift કરે છે; છેલ્લા `id` ને shift કરીને F→id દ્વારા reduce કરે છે, ત્યારબાદ `T*F` ને T→T*F વાપરીને T માં reduce કરે છે; છેલ્લે `E+T` ને E→E+T વાપરીને E માં reduce કરે છે, જેનાથી stack પર ફક્ત E રહી જાય છે અને input ખાલી થાય છે, એટલે **Accept** મળે છે."}, {"id": "u3-high-3", "globalIndex": 21, "unit": 3, "priority": "High", "question": "Explain Leftmost and Rightmost Derivation with an example, and differentiate Parse Tree from Syntax Tree.", "questionShort": "Derivation (Leftmost/Rightmost) with Parse Tree, and Parse Tree vs Syntax Tree", "marks": "4–6", "marksNote": "", "repeated": "CD.pdf Q4(A)-OR, Assignment-1 Q2(2) — 2 sources.", "years": "", "inPPT": "", "type": "Theory + Diagram.", "typeTags": ["Theory", "Diagram"], "answerMd": "A derivation is the process of applying grammar productions, one after another, starting from the start symbol, until a string of terminals is obtained. At each step of a derivation, we must choose which non-terminal to replace next; this choice gives rise to two standard strategies.\n\nA **leftmost derivation** always replaces the leftmost non-terminal in the current sentential form at every step. A **rightmost derivation** always replaces the rightmost non-terminal in the current sentential form at every step.\n\n**Example:** For the grammar `S→S+S|S*S|id` and the string `id+id*id`:\n\nLeftmost derivation: `S → S*S → S+S*S → id+S*S → id+id*S → id+id*id`\n\nRightmost derivation: `S → S+S → S+S*S → S+S*id → S+id*id → id+id*id`\n\nEven though both derivations produce the same final string, the order in which the productions are applied is different, and this can also lead to different parse trees when the grammar is ambiguous.\n\n**Parse Tree vs Syntax Tree:**\n\n| Basis | Syntax Tree | Parse Tree |\n|---|---|---|\n| Node meaning | Interior nodes represent operators and leaves represent operands. | Interior nodes represent non-terminals and leaves represent terminals. |\n| What it represents | It represents the abstract syntax of the program, showing only the essential structure. | It represents the concrete syntax of the program, showing every grammar symbol used. |\n| Practical use | It is usually built as an actual data structure inside a real compiler. | It is rarely built as a real data structure; it is mainly a conceptual tool for understanding derivations. |", "diagramMd": "", "mustWrite": ["Correct definitions of leftmost and rightmost derivation.", "A complete worked example showing both derivations step by step for the same string.", "The comparison table between Parse Tree and Syntax Tree."], "keywords": ["Leftmost derivation", "rightmost derivation", "sentential form", "abstract syntax", "concrete syntax"], "finalVersionMd": "A leftmost derivation replaces the leftmost non-terminal at every step of a derivation, while a rightmost derivation replaces the rightmost non-terminal at every step. For the grammar `S→S+S|S*S|id` and the string `id+id*id`, the leftmost derivation is `S→S*S→S+S*S→id+S*S→id+id*S→id+id*id`, and the rightmost derivation is `S→S+S→S+S*S→S+S*id→S+id*id→id+id*id`.\n\nA syntax tree represents the abstract syntax of a program, with operators as interior nodes and operands as leaves, and is usually built as an actual data structure inside a compiler. A parse tree represents the concrete syntax of a program, with non-terminals as interior nodes and terminals as leaves, and is mainly used as a conceptual tool to understand how a string is derived, rather than being built as an actual data structure.\n\n---", "quickRefMd": "**⭐ Definitions:** Leftmost derivation = at every step, replace the LEFTMOST non-terminal. Rightmost derivation = at every step, replace the RIGHTMOST non-terminal.\n\n**Worked example:** `S→S+S|S*S|id`, string `id+id*id`:\n- Leftmost: S→S*S→S+S*S→id+S*S→id+id*S→id+id*id\n- Rightmost: S→S+S→S+S*S→S+S*id→S+id*id→id+id*id\n\n**Parse Tree vs Syntax Tree table:**\n\n| Syntax Tree | Parse Tree |\n|---|---|\n| Interior nodes = operators, leaves = operands | Interior nodes = non-terminals, leaves = terminals |\n| Represents abstract syntax | Represents concrete syntax |\n| Usually built as a real data structure in compilers | Rarely built as an actual data structure |\n\n**✍️ MINIMUM FULL-MARK ANSWER:** Both derivations side by side (as above) + the tree diagrams + the comparison table if asked.", "understandGuMd": "Derivation એટલે start symbol થી શરૂ કરીને grammar ની productions એક પછી એક apply કરવાની process, જ્યાં સુધી ફક્ત terminals ની જ string ના મળે. દરેક step પર આપણે નક્કી કરવાનું હોય છે કે કયો non-terminal replace કરવો - અને આ choice ના આધારે બે standard strategies બને છે.\n\n**Leftmost derivation** માં દરેક step પર current sentential form ના સૌથી ડાબા (leftmost) non-terminal ને જ replace કરવામાં આવે છે. **Rightmost derivation** માં દરેક step પર સૌથી જમણા (rightmost) non-terminal ને replace કરવામાં આવે છે.\n\nઉદાહરણ લઈએ: grammar `S→S+S|S*S|id`, string `id+id*id`.\n\nLeftmost derivation: `S → S*S → S+S*S → id+S*S → id+id*S → id+id*id`.\n\nRightmost derivation: `S → S+S → S+S*S → S+S*id → S+id*id → id+id*id`.\n\nજુઓ, બંને derivation નું final result એક જ string આવે છે, પણ productions apply કરવાનો ક્રમ અલગ છે. અને જો grammar ambiguous હોય તો આ leftmost/rightmost નો ફર્ક જુદા-જુદા parse trees સુધી પણ લઈ જઈ શકે.\n\n**હવે Parse Tree અને Syntax Tree વચ્ચેનો ફર્ક સમજીએ.** Syntax Tree માં interior nodes operators represent કરે છે અને leaves operands represent કરે છે - એ program ની abstract syntax બતાવે છે, ફક્ત જરૂરી structure જ, અને compiler ની અંદર actual data structure તરીકે build થાય છે. જ્યારે Parse Tree માં interior nodes non-terminals represent કરે છે અને leaves terminals represent કરે છે - એ program ની concrete syntax બતાવે છે, grammar નો દરેક symbol વપરાયેલો બતાવે છે, અને એ actual data structure તરીકે ભાગ્યે જ build થાય છે - એ મુખ્યત્વે derivation સમજવા માટેનું conceptual tool છે.", "finalVersionGuMd": "Leftmost derivation માં derivation ના દરેક step પર સૌથી ડાબા non-terminal ને replace કરવામાં આવે છે, જ્યારે rightmost derivation માં દરેક step પર સૌથી જમણા non-terminal ને replace કરવામાં આવે છે. Grammar `S→S+S|S*S|id` અને string `id+id*id` માટે, leftmost derivation છે `S→S*S→S+S*S→id+S*S→id+id*S→id+id*id`, અને rightmost derivation છે `S→S+S→S+S*S→S+S*id→S+id*id→id+id*id`.\n\nSyntax tree, program ની abstract syntax represent કરે છે, જેમાં operators interior nodes હોય છે અને operands leaves હોય છે, અને એ સામાન્ય રીતે compiler ની અંદર actual data structure તરીકે build કરવામાં આવે છે. Parse tree, program ની concrete syntax represent કરે છે, જેમાં non-terminals interior nodes હોય છે અને terminals leaves હોય છે, અને એ મુખ્યત્વે string કેવી રીતે derive થાય છે એ સમજવા માટેનું conceptual tool તરીકે વપરાય છે, actual data structure તરીકે build કરવામાં નથી આવતું."}], "mediumMd": "(short prep points only)\n\n- **Chomsky Grammar Classification:** Type-0 (unrestricted/phrase structure), Type-1 (context-sensitive, αAβ→αγβ), Type-2 (context-free, A→γ — used for programming languages), Type-3 (regular, A→a or A→aB).\n- **Reduction:** the reverse of derivation — replacing a substring matching a production's RHS by its LHS, moving toward the start symbol (this is what bottom-up parsing does).\n- **Recursive Descent Parser:** a set of recursive procedures, one per non-terminal, that may need backtracking. **Advantages:** simple to build. **Disadvantages:** slow, poor error messages, can't handle grammars needing long lookahead.\n- **Non-recursive (table-driven) Predictive Parser:** uses an explicit stack + input buffer + parsing table M[X,a] instead of recursive calls — diagram: Input buffer + Stack both feed a \"Predictive Parsing Program\" box, which consults table M and produces output.", "lowMd": "(question only)\n\n- Draw the Parser classification diagram (Top-down: with/without backtracking → Recursive Descent/Predictive/LL(1); Bottom-up: Operator Precedence/LR family).\n- Explain Syntax Error Handling — 4 error types (Lexical, Syntactic, Semantic, Logical) and 3 goals of an error handler.\n- Draw transition diagrams for a predictive parser, built directly from the grammar.\n- Precedence Functions (f and g tables) built from a precedence relation graph.", "guRevisionBullets": ["Ambiguous grammar એટલે same string માટે 2 અલગ parse tree / leftmost derivation મળે.", "Left Recursion formula: `A→Aα|β` ⟹ `A→βA'`, `A'→αA'|ε`.", "Left Factoring formula: `A→αβ1|αβ2|γ` ⟹ `A→αA'|γ`, `A'→β1|β2`.", "FIRST/FOLLOW ના rules યાદ રાખો (જુઓ Unit 3, Q5).", "LL(1) ના steps: left recursion remove કરો → FIRST/FOLLOW કાઢો → parsing table બનાવો → stack વાપરીને parse કરો.", "LR family: LR(0) (lookahead નહીં) < SLR(1) (FOLLOW વાપરે) < LALR(1) (CLR states merge કરેલા) < CLR(1) (સૌથી powerful, table મોટું). Steps: grammar augment કરો → closure/goto → canonical item sets → Action/Goto table → parse trace.", "Operator precedence: terminals વચ્ચે `<·` `=·` `·>` relations હોય; handle = પહેલા `·>` અને એની પહેલાંના `<·` વચ્ચેનો ભાગ."], "enRevisionBullets": ["Ambiguous grammar = 2 different parse trees / leftmost derivations for the same string.", "Left Recursion formula: `A→Aα|β` ⟹ `A→βA'`, `A'→αA'|ε`.", "Left Factoring formula: `A→αβ1|αβ2|γ` ⟹ `A→αA'|γ`, `A'→β1|β2`.", "FIRST/FOLLOW rules (see Unit 3, Q5).", "LL(1) steps: remove left recursion → FIRST/FOLLOW → parsing table → parse using stack.", "LR family: LR(0) (no lookahead) < SLR(1) (uses FOLLOW) < LALR(1) (merged CLR states) < CLR(1) (most powerful, biggest table). Steps: augment grammar → closure/goto → canonical item sets → Action/Goto table → parse trace.", "Operator precedence: relations `<·` `=·` `·>` between terminals; handle = between first `·>` and preceding `<·`."]}, {"number": 4, "title": "UNIT 4 — Intermediate Code Generation & Runtime Environment", "intro": "**What this unit is about (simple words):** How the compiler represents code in a simple middle form (between source code and machine code), and how memory is managed when a program runs.", "veryHigh": [{"id": "u4-vh-1", "globalIndex": 22, "unit": 4, "priority": "Very High", "question": "Generate the Three Address Code, Quadruple, Triple, and Indirect Triple representation for the given expression. (`a := b * -c + b * -c`)", "questionShort": "Generate Three Address Code (TAC), Quadruple, Triple, and Indirect Triple for a given expression", "marks": "4–8", "marksNote": "", "repeated": "Assignment-2 Q4, PAC Q5, CD_1 Q2(B), CD_2 Q6(a), CD_3 Q6(b) & Q6-OR(b) — **6 occurrences, one of the most repeated question types overall.**", "years": "", "inPPT": "", "type": "Algorithm (Numerical).", "typeTags": ["Numerical", "Algorithm"], "answerMd": "An intermediate representation is a form of code that sits between the source program and the final machine code, and is designed to be both easy for the compiler to produce and easy for it to translate further. **Three Address Code (TAC)** is the most common intermediate representation, in which every statement has the general form `x := y op z`, with at most one operator per statement. In an actual compiler, TAC statements are usually stored as records, and there are three common ways of doing this: Quadruples, Triples, and Indirect Triples.\n\n**Given:** the expression `a := b * -c + b * -c`.\n\n**Step 1: Write the Three Address Code.** Since the expression has two identical repeated computations, `-c` and `b*(-c)`, a simple (non-optimizing) translation computes each one separately, using a new temporary variable for every operation:\n```\nt1 := uminus c\nt2 := b * t1\nt3 := uminus c\nt4 := b * t3\nt5 := t2 + t4\na  := t5\n```\n\n**Step 2: Represent this as Quadruples.** A **Quadruple** is a record with four fields: Op, Arg1, Arg2, and Result.\n\n| # | Op | Arg1 | Arg2 | Result |\n|---|---|---|---|---|\n| 0 | uminus | c | | t1 |\n| 1 | * | b | t1 | t2 |\n| 2 | uminus | c | | t3 |\n| 3 | * | b | t3 | t4 |\n| 4 | + | t2 | t4 | t5 |\n| 5 | := | t5 | | a |\n\n**Step 3: Represent this as Triples.** A **Triple** has only three fields: Op, Arg1, and Arg2. Instead of naming a temporary result (like t1), a Triple refers to the value computed by an earlier statement using that statement's own position number, so no temporary names need to be stored in the symbol table.\n\n| # | Op | Arg1 | Arg2 |\n|---|---|---|---|\n| (0) | uminus | c | |\n| (1) | * | b | (0) |\n| (2) | uminus | c | |\n| (3) | * | b | (2) |\n| (4) | + | (1) | (3) |\n| (5) | := | a | (4) |\n\n**Step 4: Represent this as Indirect Triples.** An **Indirect Triple** stores the same Triple table as above, but adds a separate list of pointers giving the actual execution order of the statements; this extra layer of indirection makes it easier to reorder statements later during optimization, without having to renumber the triples themselves.\n\nStatement list: `(0)→(14), (1)→(15), (2)→(16), (3)→(17), (4)→(18), (5)→(19)`\n\nTriple table (now stored at positions 14–19):\n| # | Op | Arg1 | Arg2 |\n|---|---|---|---|\n| (14) | uminus | c | |\n| (15) | * | b | (14) |\n| (16) | uminus | c | |\n| (17) | * | b | (16) |\n| (18) | + | (15) | (17) |\n| (19) | := | a | (18) |\n\n**Final Answer:** the TAC, Quadruple table, Triple table, and Indirect Triple table for the expression are exactly as shown in Steps 1 to 4 above.\n\n**Why each step is done:** TAC gives the simplest, \"logical\" version of the code; Quadruple, Triple, and Indirect Triple are just three different ways of physically storing that same TAC inside the compiler, each with a different trade-off between simplicity (Quadruple) and memory saved by not storing temporary names (Triple and Indirect Triple).\n\n**Common mistakes:** Writing a temporary name such as t1 inside a Triple's Arg2 field instead of the statement's position number — this defeats the entire purpose of using a Triple.", "diagramMd": "", "mustWrite": ["Correct TAC with a separate temporary for every single operation.", "Quadruple table with all four fields correctly filled.", "Triple table that correctly uses position numbers instead of temporary names.", "Indirect Triple table with a separate statement-pointer list."], "keywords": ["Three Address Code", "Quadruple", "Triple", "Indirect Triple", "temporary variable", "position number"], "finalVersionMd": "Three Address Code (TAC) is an intermediate representation where every statement has the form `x := y op z`, with at most one operator per statement. For `a := b * -c + b * -c`, the TAC is:\n```\nt1 := uminus c\nt2 := b * t1\nt3 := uminus c\nt4 := b * t3\nt5 := t2 + t4\na  := t5\n```\n\nA Quadruple stores each TAC statement as a record with four fields — Op, Arg1, Arg2, Result:\n\n| # | Op | Arg1 | Arg2 | Result |\n|---|---|---|---|---|\n| 0 | uminus | c | | t1 |\n| 1 | * | b | t1 | t2 |\n| 2 | uminus | c | | t3 |\n| 3 | * | b | t3 | t4 |\n| 4 | + | t2 | t4 | t5 |\n| 5 | := | t5 | | a |\n\nA Triple uses only three fields — Op, Arg1, Arg2 — and refers to earlier results by their statement's position number instead of a temporary name:\n\n| # | Op | Arg1 | Arg2 |\n|---|---|---|---|\n| (0) | uminus | c | |\n| (1) | * | b | (0) |\n| (2) | uminus | c | |\n| (3) | * | b | (2) |\n| (4) | + | (1) | (3) |\n| (5) | := | a | (4) |\n\nAn Indirect Triple keeps the same Triple table but adds a separate list of pointers giving the execution order, which makes it easier to reorder statements during optimization without renumbering the triples themselves.\n\n---", "quickRefMd": "**What is given:** An expression, e.g. `a := b * -c + b * -c` (this exact expression is reused across the whole PPT — VERY likely to reappear).\n**What to find:** Its TAC, Quadruple table, Triple table, Indirect Triple table.\n\n**⭐ Definitions:**\n- **TAC (Three Address Code):** a sequence of statements of the form `x := y op z`, with at most one operator per statement.\n- **Quadruple:** a record with 4 fields — `Op, Arg1, Arg2, Result`.\n- **Triple:** a record with 3 fields — `Op, Arg1, Arg2` (no Result field; other triples refer to this one BY ITS POSITION NUMBER instead of a temp name).\n- **Indirect Triple:** like a Triple, but you also keep a separate list of POINTERS to the triples (helps in reordering code for optimization).\n\n**Worked example — `a := b * -c + b * -c`:**\n\nTAC:\n```\nt1 := uminus c\nt2 := b * t1\nt3 := uminus c\nt4 := b * t3\nt5 := t2 + t4\na  := t5\n```\n\nQuadruple:\n| # | Op | Arg1 | Arg2 | Result |\n|---|---|---|---|---|\n| 0 | uminus | c | | t1 |\n| 1 | * | b | t1 | t2 |\n| 2 | uminus | c | | t3 |\n| 3 | * | b | t3 | t4 |\n| 4 | + | t2 | t4 | t5 |\n| 5 | := | t5 | | a |\n\nTriple (uses statement NUMBERS instead of t1,t2...):\n| # | Op | Arg1 | Arg2 |\n|---|---|---|---|\n| 0 | uminus | c | |\n| 1 | * | b | (0) |\n| 2 | uminus | c | |\n| 3 | * | b | (2) |\n| 4 | + | (1) | (3) |\n| 5 | := | a | (4) |\n\nIndirect Triple: same triple table as above, PLUS a separate statement-pointer list `(0)→(14), (1)→(15), ...` pointing to where each triple actually sits.\n\n**Why each step is done:** TAC is the \"plain\" version; Quadruple/Triple/Indirect-Triple are just 3 different ways to actually STORE that TAC in the compiler's memory.\n\n**Exam shortcut:** Always do TAC first (easiest), then just re-format the SAME steps into Quadruple/Triple/Indirect-Triple — don't recompute from scratch each time.\n\n**Common mistakes:** In Triple, writing a temp name like t1 instead of the statement number (0),(1)... — this defeats the whole purpose of Triples; forgetting the assignment statement itself needs its own row (op=`:=` or `assign`).\n\n**✍️ MINIMUM FULL-MARK ANSWER:** TAC → Quadruple table → Triple table (Indirect Triple only if marks are high, e.g. 8).\n\n---", "understandGuMd": "જો ભાઈ, Intermediate representation એટલે શું? Source code ને એકદમ directly machine code માં convert નથી કરવાનું, વચ્ચે એક એવું form બનાવવાનું જે compiler માટે
